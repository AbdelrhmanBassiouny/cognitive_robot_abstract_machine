- id: image-extensions
  title: Depth and segmentation images, camera intrinsics, SemDT's CameraResolution and VideoResolution
    collapsed into Resolution
  track: image-consumers
  status: not_started
  depends_on:
  - krrimage
  - projection-interface
  - planar-point-interface
  branch: claude/krrimage-depth-segmentation
  notes: 'Camera model = Projection[ImagePoint, Ray3] (project, deproject with depth) behind krrimage''s
    optional krrspatial[casadi] extra; it maps its frame''s EuclideanSpace onto an ImagePlane. First user:
    montessori perception (CameraIntrinsics.deproject, RgbdFrame.project, MeasuredSurfaceFinder''s deprojection,
    orthophoto homography), numpy-batched, so it needs an array path. Also an image''s placement on a
    plane (ImagePoint to Point2) and the plane-to-image homography from OrthogonalProjection and the camera.'
- id: orthogonal-projection-in-semdt
  title: '#518: OrthogonalProjection (project, unproject, projection_line) and a planar Pose2D in SemDT'
  branch: ccr-d4b2f7f0-b27rlq
  pull_request_number: 518
  track: spatial
  status: done
  session: https://claude.ai/code/session_01U544NRSi5q2UusrdQQEQba
  notes: 'Upstream as cram2#764 (LucaKro requested changes); d68548d28 answers all three asks, replies
