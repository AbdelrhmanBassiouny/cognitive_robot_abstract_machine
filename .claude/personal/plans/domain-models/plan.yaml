  - krrimage
  notes: '#472 is not merged; crollywood becomes its own repository, renamed krrollywood.'
  branch: claude/krrollywood-on-krrimage
- id: image-extensions
  title: Depth and segmentation images, camera intrinsics, SemDT's CameraResolution and VideoResolution
    collapsed into Resolution
  track: image-consumers
  status: not_started
  depends_on:
  - krrimage
  - projection-interface
  - planar-point-interface
  branch: claude/krrimage-depth-segmentation
  notes: 'Camera model = Projection[ImagePoint, Ray3] (project, deproject with depth) behind
    krrimage''s optional krrspatial[casadi] extra; it maps its frame''s EuclideanSpace onto
    an ImagePlane. First user: montessori perception (CameraIntrinsics.deproject, RgbdFrame.project,
    MeasuredSurfaceFinder''s deprojection, orthophoto homography), numpy-batched, so it needs
    an array path. Also an image''s placement on a plane (ImagePoint to Point2) and the plane-to-image
    homography from OrthogonalProjection and the camera.'
- id: projection-interface
  title: A Projection interface (project, projection_line, unproject) shared by orthogonal
    projection and camera models, with Ray3
  branch: claude/krrspatial-projection-interface
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'Ports #518''s OrthogonalProjection and Line3 onto krrspatial; project() and Pose2D.from_pose
    call frame._world.transform, which krrspatial frames lack. Generic in its image and preimage
    types (Projection[Point2, Line3] for OrthogonalProjection). A projection maps between
    two spaces; a change within one space is a CoordinateChange. unproject(p, t) is the point
    at t on projection_line(p); the inverse laws become one test suite run against every implementation.'
- id: frame-checked-arithmetic
  title: Arithmetic in krrspatial checks frames, and a transformation only applies to values
    in its child frame
  branch: claude/krrspatial-frame-checked-arithmetic
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'Subtracting points in different frames is silently accepted today; raise ReferenceFrameMismatchError.
    HomogeneousTransformationMatrix.dot should raise when child_frame and the operand''s reference_frame
    are both set and differ; written but held out of #526 because SemDT''s TestTransformationMatrix.test_reference_frames
    asserts the opposite. Waits on the user and Simon (Q1 of the questions doc) before changing
    that test.'
- id: spatial-action
  title: Each spatial value says how a coordinate change acts on it, replacing the operand
    lists in dot
  branch: claude/krrspatial-action
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  - planar-coordinate-system
  notes: 'A change acts on values of its own coordinate-system kind and keeps their type:
    a point by R p + t, a vector by R v, an orientation by composition. Each value implements
    the action (double dispatch) instead of HomogeneousTransformationMatrix.dot and RotationMatrix.dot
    listing operands; planar changes act on Point2 and Pose2D. Waits
    on Simon''s answers to Q4 (Point3 in RotationMatrix.dot) and Q5 (AxisAngle).'
- id: planar-coordinate-system
  title: Point2 and Pose2D are given in the x-y plane of their reference frame, with dimension
    on the space and planar rigid changes
  branch: claude/krrspatial-planar-coordinate-system
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'Space gets a dimension; a frame''s x-y plane is a 2D plane space''s coordinate system,
    derived from the frame. A plane refers to the space it lies in; planes are equal when
    they share it and their points (ImagePlane has none). Point2 and Pose2D keep reference_frame;
    only coordinate_system becomes the plane''s, so SpatialType is generic in its coordinate-system
    kind. SE(2) is RigidCoordinateChange of the plane kind, only between frames sharing one
    x-y plane; Point2.transform stays a projection otherwise.'
- id: krrspatial-imports
  title: The workspace imports spatial types from krrspatial instead of SemDT's re-export
    module
  branch: claude/krrspatial-imports
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'About 334 files (SemDT, giskardpy, coraplex, robokudo, cramera, segmind, experiments,
    tests) import semantic_digital_twin.spatial_types.spatial_types. Mechanical; the re-export
    module stays so JSON type names and outside code keep resolving.'
- id: video-on-a-plane
  title: Show a video on a plane of the world (a wall, a table top) in a camera image or through
    a projector
  branch: claude/krrimage-video-on-a-plane
  track: image-consumers
  status: not_started
  depends_on:
  - image-extensions
  notes: 'Per frame: placement, unproject and camera project collapse into one video-to-camera
    homography and one cv2.warpPerspective. Optional occlusion from the depth image (draw
    only where depth matches the plane). A projector is a pinhole camera run backwards, calibrated
    instead of the camera; wall planes come from the twin. Demo ideas: the robot shown a video
    of its own pickup; the robot''s live capture projected onto the apartment walls while
    it works.'
- id: planar-point-interface
  title: 'krrspatial''s casadi-free base: Space (EuclideanSpace, ImagePlane), CoordinateSystem[SpaceT]
    (ReferenceFrame, ImageCoordinateSystem), CoordinateChange (affine, rigid), PlanarPoint'
  branch: claude/krrspatial-interfaces
  pull_request_number: 527
  track: spatial
  status: in_progress
  depends_on: []
  session: https://claude.ai/code/session_01GoHMif2Xa7Mnqzz9mKFpTT
  notes: '#527 on #528. A reference frame is a coordinate system on physical space, not a
    space: Space is the point set, CoordinateSystem what coordinates are given in, CoordinateChange[CoordinateSystemT]
    the change within one space (declares inverse, @); AffineCoordinateChange and RigidCoordinateChange
    name what a change keeps. CoordinateRepresentation[CoordinateSystemT].coordinate_system:
    a value given in a coordinate system; PlanarPoint is one. Pushed 03adbed9fa (user-marked
    ready); CI pending.'
- id: image-coordinate-change
  title: krrimage's ImageCoordinateChange (scale and shift per axis) for crops and resizes,
    with cv2 resampling
  branch: claude/krrimage-coordinate-change
  track: image
  status: not_started
  depends_on:
  - krrimage
  notes: 'Implements AffineCoordinateChange[ImageCoordinateSystem]: a crop or resize is a
    new ImageCoordinateSystem on the same ImagePlane, so an ImagePoint found in a crop maps
    back to the whole image. ColorImage.cropped/resized do the pixel work with cv2 and return
    the change; it also yields the 2x3 matrix cv2.warpAffine takes. Pasting one image into
    another (ColorImage.pasted/fitted) maps between two planes, not within one: same algebra,
    a separate map class.'
- id: world-as-euclidean-space
  title: SemDT's World is the EuclideanSpace its bodies chart; ReferenceFrame.express checks
    the space before changing coordinates
  branch: claude/world-as-euclidean-space
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'World implements EuclideanSpace (one world, one space; copies and merges follow).
    test/living_worlds.py wraps an existing __new__ instead of refusing it (approved). CoordinateSystem.space
    becomes an abstract property returning SpaceT | None; KinematicStructureEntity returns
    _world, never raising. express is a template method: raises for no frame, a frame not
    in a space, or frames of different spaces, then calls an abstract hook. If a world ever
    holds unrelated parts, switch to has-a.'
