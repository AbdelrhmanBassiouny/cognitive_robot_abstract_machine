schema_version: 1
id: domain-models
title: Standalone domain models (krrspatial, krrimage, krrollywood)
description: Shared types move out of SemDT and crollywood into standalone packages under domain_models/.
  krrspatial holds SemDT's casadi spatial types behind a ReferenceFrame interface; krrimage holds images,
  colours and pixels on krrood alone; krrollywood becomes its own repository on krrimage.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 525
waves:
- id: foundations
  name: 'Wave 1: Spatial and image models'
  description: krrspatial (SemDT's spatial types moved) and krrimage (no casadi), independent of each
    other.
- id: adoption
  name: 'Wave 2: Packages moved onto them'
  description: krrollywood and image extensions build on krrimage.
tracks:
- id: spatial
  name: krrspatial
  wave: foundations
- id: image
  name: krrimage
  wave: foundations
- id: image-consumers
  name: Built on krrimage
  wave: adoption
items:
