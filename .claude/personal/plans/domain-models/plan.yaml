    this PR.'
- id: projection-interface
  title: A Projection interface (project, projection_line, unproject) shared by orthogonal projection and camera
    models, with Ray3
  branch: claude/krrspatial-projection-interface
  track: spatial
  status: not_started
  depends_on:
  - orthogonal-projection-in-semdt
  - krrspatial-numeric
  notes: 'Ports #518''s OrthogonalProjection and Line3 onto krrspatial; project() and Pose2D.from_pose
    call frame._world.transform, which krrspatial frames lack. Generic in its image and preimage types
    (Projection[Point2, Line3] for OrthogonalProjection). A projection maps between two spaces; a change
    within one space is a CoordinateChange. unproject(p, t) is the point at t on projection_line(p);
    the inverse laws become one test suite run against every implementation.'
- id: frame-checked-arithmetic
  title: Arithmetic in krrspatial checks frames, and a transformation only applies to values in its child
    frame
  branch: claude/krrspatial-frame-checked-arithmetic
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'Subtracting points in different frames is silently accepted today; raise ReferenceFrameMismatchError.
    HomogeneousTransformationMatrix.dot should raise when child_frame and the operand''s reference_frame
    are both set and differ; written but held out of #526 because SemDT''s TestTransformationMatrix.test_reference_frames
    asserts the opposite. Waits on the user and Simon (Q1 of the questions doc) before changing that test.'
- id: spatial-action
  title: Each spatial value says how a coordinate change acts on it, replacing the operand lists in dot
  branch: claude/krrspatial-action
  track: spatial
  status: not_started
  depends_on:
  - krrspatial-numeric
  notes: 'A change acts on values of its own coordinate-system kind and keeps their type: a point by R p
    + t, a vector by R v, an orientation by composition. Each value implements the action (double dispatch)
    instead of HomogeneousTransformationMatrix.dot and RotationMatrix.dot listing operands. Point2 and
    Pose2D are left out (only planar changes act on them). Waits on Simon''s answers to Q4 (Point3 in
    RotationMatrix.dot) and Q5 (AxisAngle).'
- id: video-on-a-plane
  title: Show a video on a plane of the world (a wall, a table top) in a camera image or through a projector
  branch: claude/krrimage-video-on-a-plane
  track: image-consumers
  status: not_started
  depends_on:
  - image-extensions
  notes: 'Per frame: placement, unproject and camera project collapse into one video-to-camera homography
    and one cv2.warpPerspective. Optional occlusion from the depth image (draw only where depth matches
    the plane). A projector is a pinhole camera run backwards, calibrated instead of the camera; wall
    planes come from the twin. Demo ideas: the robot shown a video of its own pickup; the robot''s live
    capture projected onto the apartment walls while it works.'
- id: planar-point-interface
  title: 'krrspatial''s casadi-free base: Space (EuclideanSpace, ImagePlane), CoordinateSystem[SpaceT]
    (ReferenceFrame, ImageCoordinateSystem), CoordinateChange (affine, rigid), PlanarPoint'
  branch: claude/krrspatial-interfaces
  pull_request_number: 527
  track: spatial
  status: in_progress
  depends_on:
  - subclass-safe-generic-identity
  session: https://claude.ai/code/session_01GoHMif2Xa7Mnqzz9mKFpTT
  notes: '#527 on #528. A reference frame is a coordinate system on physical space, not a space:
    Space is the point set, CoordinateSystem what coordinates are given in, CoordinateChange[CoordinateSystemT]
    the change within one space (declares inverse, @); AffineCoordinateChange and RigidCoordinateChange
    name what a change keeps. CoordinateRepresentation[CoordinateSystemT].coordinate_system: a value given
    in a coordinate system; PlanarPoint is one. Pushed 03adbed9fa (user-marked ready); CI pending.'
- id: subclass-safe-generic-identity
  title: SubClassSafeGeneric generates no equality, so eq=False subclasses keep identity and stay hashable
  branch: claude/subclass-safe-generic-identity
  track: spatial
  status: done
  depends_on: []
  session: https://claude.ai/code/session_01GoHMif2Xa7Mnqzz9mKFpTT
  notes: 'Bug fix off main: @dataclass on SubClassSafeGeneric made every eq=False subclass equal to any
    other instance of its class and unhashable (two NamedFrames compared equal). Fix: @dataclass(eq=False).
    #528 off main (bug label, user-marked ready), merged into #527. Pushed 0d03858949; CI pending.'
  pull_request_number: 528
- id: image-coordinate-change
  title: krrimage's ImageCoordinateChange (scale and shift per axis) for crops and resizes, with cv2 resampling
  branch: claude/krrimage-coordinate-change
  track: image
  status: not_started
  depends_on:
  - krrimage
  notes: 'Implements AffineCoordinateChange[ImageCoordinateSystem]: a crop or resize is a new ImageCoordinateSystem
    on the same ImagePlane, so an ImagePoint found in a crop maps back to the whole image. ColorImage.cropped/resized
    do the pixel work with cv2 and return the change; it also yields the 2x3 matrix cv2.warpAffine takes.
    Pasting one image into another (ColorImage.pasted/fitted) maps between two planes, not within one:
    same algebra, a separate map class.'
- id: world-as-euclidean-space
  title: SemDT's World implements EuclideanSpace; a body's space is its world; World.transform checks
    it
  branch: claude/world-as-euclidean-space
  track: spatial
  status: blocked
  depends_on:
  - krrspatial-numeric
  notes: 'Blocked on a decision: World inheriting the Interface EuclideanSpace inherits Interface.__new__,
    and test/living_worlds.py refuses to watch a world type whose __new__ is not object.__new__. Then
    KinematicStructureEntity.space = _world, and transform raises a clear error for frames of two worlds.'
