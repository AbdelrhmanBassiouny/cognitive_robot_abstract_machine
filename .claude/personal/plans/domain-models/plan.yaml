schema_version: 1
id: domain-models
title: Standalone domain models (krrood_spatial_math, krrood_image, krrollywood)
description: 'Shared types move out of SemDT and crollywood into standalone packages under
  domain_models/. krrood_spatial_math (was krrspatial) holds SemDT''s casadi spatial types
  behind casadi-free frame and change interfaces; krrood_image (was krrimage) holds images,
  colours and pixels on krrood alone. Moving krrollywood onto it is general-video-production''s
  krrollywood-on-krrimage. Design decisions: https://claude.ai/artifact/SCiXWvLcV7mequpATSTrsS'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 525
waves:
- id: foundations
  name: 'Wave 1: Spatial and image models'
  description: krrood_spatial_math (SemDT's spatial types moved) and krrood_image (no casadi),
    independent of each other.
- id: adoption
  name: 'Wave 2: Packages moved onto them'
  description: krrollywood and image extensions build on krrood_image.
- id: perception
  name: 'Wave 3: Perception moved onto them'
  description: SemDT's ray tracer and RoboKudo use krrood_image images and captures, after
    cram2#761 and
tracks:
- id: spatial
  name: krrood_spatial_math
  wave: foundations
- id: image
  name: krrood_image
  wave: foundations
- id: image-consumers
  name: Built on krrood_image
  wave: adoption
- id: perception
  name: SemDT and RoboKudo perception
  wave: perception
items:
- id: krrimage
  title: domain_models/krrood_image (images, colours, pixels) with Color moved out of SemDT
  branch: claude/crollywood-refactor-shared-classes-e8jtm9
  pull_request_number: 524
  track: image
  status: in_progress
  blockers:
  - '#527''s merge (with main) conflicts in geometry.py: main has #761''s HSV Color, krrimage.color
    the old one. Re-move Color as #761 left it, then merge #527.'
  depends_on:
  - planar-point-interface
  session: https://claude.ai/code/session_01J17aVY3vyQM8goACbkHkcp
  notes: '#524 on #527: krrood_image.coordinates owns ImagePlane and ImageCoordinateSystem,
    which becomes an AffineFrame once #527 adds it; ImagePoint implements AffinePoint2D[ImageCoordinateSystem,
    float] (was PlanarPoint); Pixel stays a grid cell. Pushed a4e9bbdb. Rename krrimage to
    krrood_image here once #527''s rename is merged in. cram2#761 rewrites SemDT''s Color:
    #524 lands after it and moves Color as #761 left it; ask before dropping the setters.
    Whichever of #524 and the adopt PR lands second merges the README entries.'
- id: image-extensions
  title: Depth and segmentation images, camera intrinsics, SemDT's CameraResolution and VideoResolution
    collapsed into Resolution
  track: image-consumers
  status: not_started
  depends_on:
  - krrimage
  - projection-interface
  - planar-point-interface
  branch: claude/krrood-image-depth-segmentation
  notes: Waits for cram2#761, then moves its SemDT CameraModel family into krrood_image's
    camera extra as a PerspectiveProjection SpaceMap onto the sensor's ImagePlane. The pixel
    coordinate system is an AffineFrame (undistorted images; a distorted one is a plain CoordinateSystem);
    K is a CameraCalibration, an AffineCoordinateChange from the camera's CartesianFrame2D.
    principal_point an ImagePoint; CameraResolution and VideoResolution become Resolution,
    scaled() an ImageCoordinateChange. Adds the Image base (ColorImage, DepthImage, SegmentationImage)
    and Capture, a Role[Image]; Ray3D. Old imports stay.
- id: projection-interface
  title: A SpaceMap interface for maps between spaces (project, projection_line, unproject),
    held by OrthogonalProjection and the camera, with Ray3
  branch: claude/krrspatial-interfaces
  track: spatial
  status: in progress
  pull_request_number: 527
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  depends_on:
  - planar-point-interface
  notes: 'Folded into #527 (c29899d7): SpaceMap[PreimagePointT, ImagePointT, ProjectionLineT, CoordinateT] in krrood_spatial_math.space_map, implemented by OrthogonalProjection (unproject''s height is now position_along_line); one law suite runs against every implementation. Ray3D is left to krrood_image''s PerspectiveProjection, since no camera projection exists yet.'
- id: frame-checked-arithmetic
  title: Arithmetic in krrood_spatial_math checks frames, and a transformation only applies
    to values in its child frame
  branch: claude/krrspatial-interfaces
  track: spatial
  status: in progress
  pull_request_number: 527
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  depends_on:
  - planar-point-interface
  notes: 'Folded into #527 (c409fd69): a transformation raises ReferenceFrameMismatchError when its child frame and the operand''s reference frame are both set and differ, and so do point and vector addition and subtraction between two frames. Q1 decided yes by the owner without Simon; test_reference_frames changed to expect the error.'
- id: spatial-action
  title: Each spatial value says how a coordinate change acts on it, replacing the operand
    lists in dot
  branch: claude/krrspatial-interfaces
  track: spatial
  status: in progress
  pull_request_number: 527
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  depends_on:
  - planar-point-interface
  - planar-coordinate-system
  notes: 'Folded into #527 (c409fd69): values and changes implement TransformationOperand, RotationOperand or PlanarTransformationOperand, and the dot methods dispatch to them. Q4 and Q5 decided yes by the owner without Simon: a rotation turns a CartesianPoint3D and AxisAngle is an operand.'
- id: planar-coordinate-system
  title: CartesianPoint2D and Pose2D are given in a CartesianFrame2D on a EuclideanSpace2D,
    with planar rigid changes; points of either dimension are typed CartesianPoint
  branch: claude/krrspatial-interfaces
  track: spatial
  status: in progress
  pull_request_number: 527
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  depends_on:
  - planar-point-interface
  notes: 'Folded into #527 (59ab32ef), which merged #549''s branch; #549 is closed. Open: whether CartesianPoint2D/Pose2D.transform refuse frames on other planes.'
- id: spatial-math-imports
  title: The workspace imports spatial types from krrood_spatial_math, with the decided class
    names (Vector3D, Line3D, Pose3D)
  branch: claude/krrspatial-interfaces
  track: spatial
  status: in progress
  pull_request_number: 527
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  depends_on:
  - planar-point-interface
  notes: 'Folded into #527 (3179534f): Vector3D, Line3D, LineSegment3D, Pose3D and SymbolicSpatialType across the workspace, with Vector3DMapping and Pose3DMapping; no old names stay importable.'
- id: video-on-a-plane
  title: Show a video on a plane of the world (a wall, a table top) in a camera image or through
    a projector
  branch: claude/krrood-image-video-on-a-plane
  track: image-consumers
  status: not_started
  depends_on:
  - image-extensions
  notes: 'Per frame: placement, unproject and camera project collapse into one video-to-camera
    homography and one cv2.warpPerspective. Optional occlusion from the depth image (draw
    only where depth matches the plane). A projector is a pinhole camera run backwards, calibrated
    instead of the camera; wall planes come from the twin. Demo ideas: the robot shown a video
    of its own pickup; the robot''s live capture projected onto the apartment walls while
    it works.'
- id: planar-point-interface
  title: 'krrood_spatial_math''s casadi-free base (spaces, coordinate systems and frames, points, coordinate changes, SpaceMap) and SemDT''s spatial types implementing it, with the folded planar, rename, projection, action and frame-check items'
  branch: claude/krrspatial-interfaces
  pull_request_number: 527
  track: spatial
  status: in_progress
  blockers:
  - 'CI on c409fd69 not yet read; giskardpy tests, where now-refused mixed-frame arithmetic would show, only run in CI. Ready but not promoted: the owner decides whether it is finished. #524 stacked on it conflicts with main.'
  depends_on: []
  session: https://claude.ai/code/session_01JxHGiNS35j6Nc3GQ87MdyP
  notes: '#527 holds the casadi-free base per https://claude.ai/artifact/SCiXWvLcV7mequpATSTrsS and SemDT''s spatial types adopting it, and since 2026-11-10 also planar-coordinate-system (#549), spatial-math-imports, projection-interface, spatial-action and frame-checked-arithmetic (see their notes). api-break; migration in the PR description. Next: CI and review, then promote.'
- id: image-coordinate-change
  title: krrood_image's ImageCoordinateChange (scale and shift per axis) for crops and resizes,
    with cv2 resampling
  branch: claude/krrood-image-coordinate-change
  track: image
  status: not_started
  depends_on:
  - krrimage
  notes: 'Implements AffineCoordinateChange[ImageCoordinateSystem], the pixel AffineFrame:
    a crop or resize is a new ImageCoordinateSystem on the same ImagePlane, so an ImagePoint
    found in a crop maps back to the whole image. ColorImage.cropped/resized do the pixel
    work with cv2 and return the change; it also yields the 2x3 matrix cv2.warpAffine takes.
    Pasting one image into another maps between two planes: a SpaceMap, not a change.'
- id: world-as-euclidean-space
  title: SemDT's World is the EuclideanSpace its bodies chart; CartesianFrame3D.express_in_own_frame
    checks the space before changing coordinates
  branch: claude/world-as-euclidean-space
  track: spatial
  status: not_started
  depends_on:
  - planar-point-interface
  notes: 'World implements EuclideanSpace3D (one world, one space). test/living_worlds.py
    wraps an existing __new__ instead of refusing it (approved). CoordinateSystem.space becomes
    an abstract property returning SpaceT | None; KinematicStructureEntity returns _world,
    never raising. express_in_own_frame is a template method: raises for no frame, a frame
    not in a space, or frames of different spaces, then calls an abstract hook. #526 gives
    KinematicStructureEntity a space property returning None; this item makes it return _world.
    If a world ever holds unrelated parts, switch to has-a.'
- id: perception-typed-images
  title: SemDT's ray tracer renders, and RoboKudo's CAS holds, krrood_image images instead
    of bare arrays
  branch: claude/perception-typed-images
  track: perception
  status: not_started
  depends_on:
  - image-extensions
  - image-coordinate-change
  notes: 'After cram2#761 and #795 land. RayTracer.render returns ColorImage, DepthImage and
    SegmentationImage, not RenderedRGBDFrame (BGR and millimetres move into the types), and
    create_camera_rays becomes projection_line. CAS colour and depth views hold those images;
    Point2D, Rect and ImageROI become ImagePoint, ImageBox, PixelBox and a SegmentationImage
    mask; ColorToDepthRatio and crops become ImageCoordinateChanges on one ImagePlane. Old
    views stay readable.'
- id: robokudo-captures
  title: RoboKudo's CameraObservation becomes krrood_image's Capture, and camera placement
    takes it
  branch: claude/robokudo-captures
  track: perception
  status: not_started
  depends_on:
  - perception-typed-images
  - world-as-euclidean-space
  notes: 'CameraObservation (camera, effective model, world_T_camera, timestamp) is a Capture
    of the frame''s images: the effective model comes from each image''s coordinate system,
    not stored; instant holds the world and time, or a sampled camera pose when no state trajectory
    exists (live ROS, replay). The ray tracer and MuJoCo recorder yield captures; #795''s
    CameraPlacement and RecordedCameraWorld take them instead of frame-name strings.'
