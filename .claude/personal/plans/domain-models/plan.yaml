schema_version: 1
id: domain-models
title: Standalone domain models (krrspatial, krrimage, krrollywood)
description: Shared types move out of SemDT and crollywood into standalone packages under
  domain_models/. krrspatial holds SemDT's casadi spatial types behind a ReferenceFrame interface;
  krrimage holds images, colours and pixels on krrood alone; krrollywood becomes its own repository
  on krrimage.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 525
waves:
- id: foundations
  name: 'Wave 1: Spatial and image models'
  description: krrspatial (SemDT's spatial types moved) and krrimage (no casadi), independent
    of each other.
- id: adoption
  name: 'Wave 2: Packages moved onto them'
  description: krrollywood and image extensions build on krrimage.
tracks:
- id: spatial
  name: krrspatial
  wave: foundations
- id: image
  name: krrimage
  wave: foundations
- id: image-consumers
  name: Built on krrimage
  wave: adoption
items:
- id: krrspatial-numeric
  title: domain_models/krrspatial holds SemDT's casadi spatial types behind a ReferenceFrame
    interface
  branch: claude/krrspatial
  track: spatial
  status: in_progress
  depends_on:
  - planar-point-interface
  session: https://claude.ai/code/session_01GoHMif2Xa7Mnqzz9mKFpTT
  notes: '#526 (user-marked ready) on #527: spatial_types.py behind krrspatial[casadi]; every
    SpatialType is a CoordinateRepresentation[ReferenceFrame] (coordinate_system = reference_frame);
    Point2 a PlanarPoint; HomogeneousTransformationMatrix a RigidCoordinateChange[ReferenceFrame],
    must be rigid. Frameless values stay. #518''s OrthogonalProjection ported in; ReferenceFrame.express
    brings a value into a frame (KinematicStructureEntity via its world). Pushed d313e8f49b;
    CI and ORM build pending. Open questions to Simon: https://claude.ai/artifact/UW7BdpNyW1r2sc63ktzA9T'
  pull_request_number: 526
- id: krrimage
  title: domain_models/krrimage (images, colours, pixels) with Color moved out of SemDT
