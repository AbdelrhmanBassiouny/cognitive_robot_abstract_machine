- id: a-look-is-described-by-a-match
  title: Describe a look by an underspecified match over the twin's own entities, not by a case class
  branch: claude/knowledge-directed-perception-vz2hhq
  pull_request_number: 275
  track: method-selection
  depends_on:
  - choose-detection-method
  - surfaces-found-by-looking
  - how-to-look-concluded-from-the-request
  status: in_progress
  session: https://claude.ai/code/session_01SK2tbXUzLSPebeVcKif92s
  notes: 'Added 2026-09-05 at the developer''s direction on #259 (r3940339984 and r3940357436): "why
    not replace this with an EQL match statement of semdt semantic annotation or kinematic structure
    entities?", and "eql based rdrs (pr 77 for example) can take an underspecified match statement
    and get needed information from it to evaluate the rule tree of the rdr."

    Every rule tree on this plan states its conditions over a hand-written case class that flattens
    what the world already states, because the tree needs one variable to bind: TargetOnSurface on
    #231, RequestedLook on #266, and SoughtSurface on #259. The last of the three is what raised
    it, and reading it is what showed how bad the shape is - two of its three fields were a copy
    of WorkspaceSurface.finish and a constant that of set True unconditionally, so the base rule''s
    condition could never be false. AGENTS.md''s own rule against a value spelled in two places condemns
    each of them independently of any redesign.

    What replaces them is one mechanism rather than three separate corrections: the description a
    rule tree is stated over is an underspecified Match over the twin''s own entities - a Body, a
    Region, a HasSupportingSurface - read by an EQL-based ripple-down rule tree that takes what it
    needs from the match. A rule then states a condition in the world''s own vocabulary and nothing
    has to be flattened for it first.

    Stacks on #77, the tip of the RDR stack (#159 -> #210 -> #79 -> #76 -> #80 -> #77), which is
    why it is not folded into any of the three branches carrying a case class: #231 refused merging
    #159 twice over for the same reason, that it adds 9,236 lines over 50 files to a pull request
    whose own change is a few hundred, and #77 adds 22,745. depends_on names the three items whose
    case classes it removes, since none of them can be removed before it exists.

    One measurement to carry into it, taken on #259 while answering the same thread: EQL conditions
    traverse nested attributes and property reads - sought.surface.region.area > 0.0 and sought.frame.carries_depth
    both bind and evaluate. So a case class was never needed for the engine''s sake even without
    the RDR stack, which is why the duplicated half of SoughtSurface could be removed on #259 and
    only the Match itself waits for this item.

    Corrected 2026-09-05 by #266''s own review round: EQLSingleClassRDR.from_underspecified is on
    #159, not on #77, so the Match-reading half of this item does not need the tip of the RDR stack
    and #266 used it - the same shape of correction as the 2026-08-31 "unmerged is not unusable"
    one. What remains for this item is the other half, which is what actually needs the stack: a
    Match over the twin''s own entities rather than over a plain description. RequestedLook no longer
    exists to be removed; TargetOnSurface and SoughtSurface still do. Measured while answering the
    same round: a case class was never needed for the engine''s sake, since EQL traverses nested
    attributes and property reads, so what is left here is the vocabulary the conditions are stated
    in rather than the shape the engine demands.

    Review round of 2026-09-06, resolved as `0098923a1`. Two threads, one change. The developer
    asked that an RDR be able to take a pre-fitted tree rather than have a family invent example
    cases to fit from, and noticed that surface_finding''s fitting machinery was a copy of
    detector_choice''s. EQLSingleClassRDR.state_rules now takes StatedRule (a condition and what
    it concludes), splicing each in as an alternative in the order given - the same tree fitting
    grows, so a case a stated rule gets wrong is still corrected by fit_case. Every invented
    example is gone, the one-pixel picture included. The duplication was three-fold rather than
    two: LookRules was the same class again, and all three now share krrood''s DetectorChoice,
    beside PerceptionDetector, which subsumes state_the_detectors_own_condition; the three files
    lose about 580 lines.

    The developer then asked whether the corner cases could come from fitting on the captures.
    Nothing reads them on these three today (NullModelSaver, no ConditionResolver), and a stated
    rule has none by construction, so what the captures buy is the check rather than the authoring:
    the surface rules are put to all six shipped captures and the detector rules to the two
    surfaces the modelled scene states, each fitted with the detector it should get and each
    leaving the tree the size it was. Authoring the trees from a run''s own data was rejected with
    a reason worth keeping: the pipeline builds its rules before any frame exists, and the surfaces
    it holds differ per setup - recorded_setup states MIRROR on the table and nothing on the lid,
    the rendered-scene fixture states neither, and only of_world carries TABLE_FINISH and
    BOARD_FINISH - so fitting from whatever a run happens to hold would give each setup a different
    tree, and the colour-blob rule would simply not exist on the recorded setup.

    468 passed, 1 skipped, 16 xfailed across test/experiments_test against 461; 1569 passed, 3
    skipped across test_eql and test_eql_rdr against 1563.

    '
- id: camera-pose-fitted-to-the-model
  title: Correct where the camera stands by fitting what is seen to what the twin models
  branch: null
  pull_request_number: null
  track: method-selection
  depends_on:
  - surfaces-found-by-looking
  status: not_started
  blockers:
  - Depends on `knowledge-directed-grounding`'s `holes-fitted-like-pieces` (in_progress) - a cross-plan
    dependency that `split-knowledge-directed-perception` could not preserve (`depends_on` cannot
    cross a plan). Dropped from `depends_on` here; tracked only as this free-text blocker, with no
    automatic readiness or dependency chip.
  notes: 'Added 2026-09-05 at the developer''s direction on #259, folding the two threads he asked
    to keep together (r3940349876 and r3940351882): "since we have a 3d model of the world, we can
    use this information to maybe even calibrate the camera ... and find the best matching transformation
    that would make fit our expectation from the 3d modeled digital twin", and "so basically we can
    combine ModelledSurface with MeasuredSurface as well to get the best estimate and update our
    belief about the camera transformation accordingly and get the best fitting surface?"

    It arrives as a third SurfaceFinder rather than as a change to either of the two #259 ships.
    SurfaceFinder is the interface and SurfaceRules already chooses among whatever declares it can
    answer, so a finder that takes the world''s statement and the depth together, solves for the
    transform that best explains both, and answers the surface plus a corrected camera pose slots
    in with one add_rule and no edit to what is there.

    Three measurements bear on it, and two of them cut against the obvious version.

    The camera transform is already good in z on this setup. #259''s first build fitted the table''s
    height as well as its extent and answered 0.8804 to 0.8811 m against the modelled 0.88 on all
    six captures - about a millimetre - and moving the plane by it moved every detection on every
    capture, up to 3.4 mm and 0.19 agreement, which is why that branch ships measuring the extent
    alone. So there is not much transform error left to recover from the table.

    Where the model and the world really disagree is not the transform. #236 measured the board mesh
    at 0.865 of the real board, a similarity fit with a 2.1-2.6 mm residual, and no rectification
    plane closes it, since doing so puts the holes below the table the board stands on. That is a
    wrong model rather than a wrong pose, and a solve with only a transform to move would absorb
    it into one. #236''s own framing is the right one here too: a law that must hold, and then a
    hypothesis about which of the things it is written over is the one that is wrong.

    What genuinely is there to fit is over-constrained. The table plane holds about 34% of 693k points
    on the bare steel, 69% with a mat, and the board''s own outline is measured every frame with
    its layout known exactly - two independent observations of one rigid transform, in a scene where
    a wrong one has visible consequences. So the fit is well posed; what it needs is to be told which
    side is trusted, per capture, since the recorded layout has already drifted in x and y while
    the height agreed exactly, and an unconstrained solve will happily explain a wrong board pose
    as a camera error.

    Two things it needs that #259 does not have. A camera pose is a value on one RgbdFrame, so a
    correction has nowhere to live between frames - the same gap #232 filled for pieces with BelievedPlace
    and a BeliefSource - and until it does, "update our belief accordingly" is a returned number
    nobody keeps rather than an operation. And the two finders are today layered rather than independent:
    the measurement never grows past what the model allows, only cuts it down, which is deliberate
    and is what keeps a run searching only ground the world described. Combining properly means letting
    the measurement move the model, which is a different contract and is why this is a new finder
    under a new rule rather than a tweak to MeasuredSurfaceFinder.

    '
