  session: https://claude.ai/code/session_01SK2tbXUzLSPebeVcKif92s
  notes: 'Added 2026-09-05 at the developer''s direction on #259 (r3940339984 and r3940357436):
    "why not replace this with an EQL match statement of semdt semantic annotation or kinematic
    structure entities?", and "eql based rdrs (pr 77 for example) can take an underspecified
