- id: surfaces-found-by-looking
  title: Find a surface in the image from what the world says it is like
  branch: claude/plan-item-kickoff-kdp-34snn0
  pull_request_number: 259
  track: method-selection
  depends_on:
  - perception-backend
  - choose-detection-method
  status: in_progress
  session: https://claude.ai/code/session_01DnVSdcxop561xKAGeg61MG
  notes: Finds a surface in the picture from what the twin already says it is like - a large
    horizontal plane, mirror-finished, colourless, of about the modelled size - stated as
    an entity query language expression rather than read off a constant or a body's collision
    shape, since neither is a measurement of where the table really is and the demo has already
    drifted from its own model once. `SurfaceFinder`/`SurfaceRules` is `choose-detection-method`'s
    claim turned on the surface itself.
- id: choose-detection-method
  title: Choose the detector by rule from the target and the surface
  branch: claude/choose-detection-method-gf64yp
  pull_request_number: 231
  track: method-selection
  depends_on:
  - perception-backend
  status: in_progress
  session: https://claude.ai/code/session_01JzpfVmddAPa4ZTJYSEEqAF
  notes: 'The detector interface the backend dispatches to, chosen by a rule tree over properties
    of the surface and the target - this is where perception measurably gets better as the
    robot knows more, and the item the paper''s central claim rests on. Two shapes for the
    same claim were both built and layered at the developer''s direction: each detector declares
    the looks it can answer as an entity query language condition (his own suggestion, r3893463818),
    and a ripple-down tree chooses among the ones that can (the item''s own original design).
    Built 2026-08-31 as PR #231, `69f30348a`.'
- id: detector-parameters-from-knowledge
  title: Take the detectors' numbers from the objects and the surfaces they look at
  branch: claude/knowledge-directed-perception-detector-zrm57t
  pull_request_number: 239
  track: method-selection
  depends_on:
  - choose-detection-method
  status: in_progress
  session: https://claude.ai/code/session_014LgGAmWL8JZM3qW7pwwnbp
  notes: The detectors' numbers - hue windows, size ranges, edge-agreement thresholds, mesh
    classification thresholds, and (widened 2026-08-31) the numbers that say *how to search*
    (seed radius, step, candidate set, required lead) - are knowledge about the pieces, the
    surfaces and the lighting, not properties of the detector reading them. They move onto
    the twin's objects and surfaces, concluded for a run by a ripple-down rule tree the same
    way `choose-detection-method`'s tree concludes which detector runs; the contour accept/reject
    chain (`pipeline.py:619`) becomes rules the same way.
