    justification once `detect-per-supporting-surface` made the edge fit work on the lid too).


    Corrected 2026-08-31: earlier notes recorded this item as blocked on krrood''s ripple-down

    rules becoming usable, which read the D-core-* stack''s *merge* state as its *usability* -

