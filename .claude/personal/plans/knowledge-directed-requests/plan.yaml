schema_version: 1
id: knowledge-directed-requests
title: 'Knowledge-directed perception: query language and method selection'
description: 'The requests wave of knowledge-directed-perception (split out on 2026-09-05
  to get every successor under the plan-size budget): perception as an entity query language
  backend beside the native and SQLAlchemy ones, so asking is evaluating rather than calling
  a pipeline by hand. The backend pushes what it can of a query''s conditions into the search
  and filters the rest over the detections that come back; a rule tree over the target and
  the surface says which detector runs and how its parameters are set.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201
waves:
- id: requests
  name: A query is answered by looking
  description: 'Perception becomes an entity query language backend beside the native and
    SQLAlchemy ones, so asking is evaluating rather than calling a pipeline by hand: the backend
    pushes what it can of a query''s conditions into the search, filters the rest over the
    detections that come back, and a rule tree over the target and the surface says which
    detector runs.'
tracks:
- id: request-language
  name: Perception as a query backend
  wave: requests
  description: 'The backend itself and the compiler behind it, following the shape SQLAlchemyBackend
    already set: take the query, translate it into another engine''s plan, execute it there.'
- id: method-selection
  name: Choosing how to look
  wave: requests
  description: The digital twin extension and the rule tree that reads it. The annotation
    touches only semantic_digital_twin, so it can be written before or alongside the request
    language.
- id: demo-requests
  name: The demo asks by query
  wave: requests
- id: perception-join
  name: Joining the grounding and requests lineages
  wave: requests
items:
- id: perception-backend
  title: Answer a query by looking, as a backend of the entity query language
  branch: perception_eql_backend
  pull_request_number: 222
  track: request-language
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01MotUMLrQxbZKQWs4BADwkj
  notes: 'Answers a query by looking, as a `PerceptionBackend` beside `EntityQueryLanguageBackend`
    and `SQLAlchemyBackend` - `SQLAlchemyBackend` already sets the shape (translate the query
    into another engine''s plan, run it there), and the compiler from a query to a detection
    pipeline is the same move against a camera. It subclasses `SelectiveBackend`: a camera
    reports what is really there and cannot invent an attribute nobody can see (the plan''s
    own open question, answered here).'
- id: perception-predicates-guide-the-search
  title: Guide the search by predicates and annotations, not by attribute names
  branch: claude/plan-item-kickoff-perception-ogf2g9
  pull_request_number: 227
  track: request-language
  depends_on:
  - perception-backend
  status: in_progress
  session: https://claude.ai/code/session_0137umDhuvEG3jkbh6iZUDzQ
  notes: 'Raised by the developer across five review threads on #222, which are one ask: a
    look should be narrowed by what the world means, not by an attribute spelled as a string.
    SUPPORTING_SURFACE_ATTRIBUTE_NAME = "supporting_surface" and the mimic''s PLACE_ATTRIBUTE_NAME
    are the smell; AGENTS.md''s own rule against a literal duplicating a value with its own
    source of truth condemns them independently of the redesign, and #222 leaves them standing
    with a test asserting the name is a real field.'
- id: search-clipped-to-a-predicates-region
  title: Clip the search to the region a spatial predicate allows
  branch: claude/kdp-search-constraints-pfaph7
  pull_request_number: 238
  track: request-language
  depends_on:
  - perception-predicates-guide-the-search
  - knowledge-directed-grounding/pieces-looked-for-where-expected
  status: in_progress
  session: https://claude.ai/code/session_013HJ4gSb7tjesc6vB1GAtwu
  blockers:
  - One of the six review threads of 2026-09-02 is still open, and it is the developer's to
    close rather than work for this item.
  notes: Clips the search to the region a spatial predicate allows - the same economy the
    supporting-surface pushdown already buys, stated in the world's vocabulary instead of
    an attribute's, so narrowing stops being a filter over what a detector returned and becomes
    less picture to search in the first place. Depends on `perception-predicates-guide-the-
    search` (where a statement's predicates are read at all) and `pieces-looked-for-where-
    expected` (which owns the *believed place* type this item's clip is built from) - building
    either half twice is the duplication this plan has already paid for.
- id: imagination-world-rejects-what-a-predicate-refuses
  title: Reject what a predicate refuses, by testing it in a copy of the world
  branch: claude/knowledge-directed-perception-imagination-g9hsnr
  pull_request_number: 255
  track: request-language
  depends_on:
  - perception-predicates-guide-the-search
  - search-clipped-to-a-predicates-region
  status: in_progress
  session: https://claude.ai/code/session_01WDteX4z7jQUBG4FZqMKG5m
  notes: 'The developer''s third mechanism on r3893499716, deferred out of #227 as a second
    pull request''s worth of work: a predicate no search algorithm covers is still answerable,
    by detecting what the other conditions do reach, spawning what was found into a copy of
    the world, evaluating the predicate there against real Body and SemanticAnnotations, and
