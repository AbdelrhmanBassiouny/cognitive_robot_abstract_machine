- id: threshold-connective
  title: 'A threshold connective: at least k of n, with Or and And as its ends'
  branch: null
  pull_request_number: null
  track: disjunction-safety
  depends_on:
  - disjunction-range-restriction
  status: not started
  notes: 'GOAL: an n-ary threshold connective in core_logical_operators.py - "at least k of
    these n operands hold" - with Or (k=1) and And (k=n) as its two ends, its first-order
    reading written down, and its range-restriction rule stated as a function of k. IT GENERALIZES
    And AS WELL AS Or, which the original "superclass of Or with k=1" framing hides. >=k(phi_1..phi_n)
    is the disjunction over every k-subset of that subset''s conjunction, so k=1 is Or, k=n
    is And, k=ceil(n/2) is majority. Giskardpy already has both ends on one dial: Parallel.minimum_success=None
    means all nodes must be True.'
