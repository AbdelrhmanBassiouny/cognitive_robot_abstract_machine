    one. (b) Whether pytest-benchmark is already a dependency anywhere in the workspace, or
    whether a plain timeit-based harness is the lighter fit.'
- id: binding-order-planner
  title: Bind a query's selected variables before evaluating its filter conditions
  branch: null
  pull_request_number: null
  track: binding-order
  depends_on:
  - evaluation-benchmark
  status: blocked
  blockers:
  - 'Cross-plan: PR #99 (rdr-refactor) refactors base_expressions.py, logical_quantifiers.py
    and core_logical_operators.py — the same functions. Start off main once #99 merges.'
  notes: 'GOAL: the outer relation exists before any filter condition runs. Concretely, an(entity(box).where(<filter>))
    binds box first, then evaluates <filter> per binding — rather than letting the condition''s
    own enumeration be the only thing that ever binds box. WHY IT IS THE PREREQUISITE, NOT
    AN OPTIMIZATION: measured in this session, a correct semi-join exists() evaluated *without*
    a bound outer relation returns every row rather than the matching ones — it is evaluated
    once against an empty context, answers "true", and then the selected variable enumerates
    freely.'
- id: argument-position-correlation
  title: A query given as an argument is evaluated uncorrelated, quantifier or not
  branch: null
  pull_request_number: null
  track: binding-order
  depends_on:
  - binding-order-planner
  status: not started
  notes: 'Raised from match-query-ergonomics (#181) on 2026-08-23 and measured on krrood PR
    #192''s branch: over a domain of one Handle and one Container, entity(body).where(HasType(entity(body),
    Handle)) returns *both* rows, while entity(body).where(HasType(body, Handle)) returns
    only the Handle. No quantifier and no match is involved, so this is binding-order-planner''s
    mechanism - the argument is evaluated once against an empty context, answers true, and
    the selected variable then enumerates freely - in an argument position rather than an
    exists() body.'
- id: disjunction-range-restriction
  title: 'Range-restrict disjunction: characterize OR, then reject unsafe branches'
  branch: null
  pull_request_number: null
  track: disjunction-safety
  depends_on: []
  status: not started
  notes: 'GOAL: OR''s behaviour is stated, tested, and safe. Today core_logical_operators.py
    documents OR as an "ElseIf" that evaluates the right operand only when the left is False,
    but measured behaviour is classical disjunction — the union of both branches'' solution
    sets — because selected variables are enumerated independently of the condition. Correct
    today, but incidentally so: nothing states or enforces it, and the docstring says something
    else.'
- id: exists-semijoin
  title: 'Make exists() a semi-join: per outer binding, no escaping locals'
  branch: null
  pull_request_number: null
  track: quantifiers
  depends_on:
  - binding-order-planner
  status: not started
  notes: 'GOAL: exists() is a filter on the outer bindings that emits no new bindings at all.
    For each distinct assignment to the outer-visible variables, yield it once if at least
    one assignment to the remaining variables satisfies the condition; the remaining variables
    never escape. THE TWO DEFECTS THIS REMOVES, both measured this session: (a) The `return`
    after the first witness is global rather than per outer binding, so an(entity(box).where(exists(fruit,
    HasType(fruit, Apple)))) over three boxes returns only the first matching box.'
- id: plain-where-locals-existential
  title: A variable only a plain where uses is existential, not a cross product
  branch: null
  pull_request_number: null
  track: quantifiers
  depends_on:
  - exists-semijoin
  status: not started
  notes: 'GOAL: a variable a query does not select, used in a plain .where(), behaves like
    one inside exists(): it binds nothing per row and never escapes, so the query yields one
    row per binding of its selection, not one per witness. The same "locals never escape"
    rule exists-semijoin defines, applied outside exists(). Raised by the developer on the
    review of #480 (2026-10-01) and proposed on #137.'
- id: negation-antijoin
  title: Make negated exists an antijoin, and fix for_all the same way
  branch: null
  pull_request_number: null
  track: quantifiers
  depends_on:
  - exists-semijoin
  status: not started
  notes: 'GOAL: not_(exists(...)) is an antijoin (R ▷ S) — one row per outer binding with
    no witness — and for_all stops failing for the same reason exists did. EXPLORE FIRST:
    (a) whether Not wrapping a semi-join Exists gives the antijoin for free once the semi-join
    yields per outer binding, or whether an explicit antijoin node is needed. Prefer the explicit
    node if the planner needs to recognize it — "not_(exists(...))" is the shape an optimizer
    must see to avoid materializing the inner side.'
- id: exists-single-argument
  title: Drop exists()'s redundant first argument
  branch: null
  pull_request_number: null
  track: api-surface
  depends_on:
  - exists-semijoin
  status: not started
  notes: 'GOAL: exists(*conditions), joined like where(). Hard break — all five in-repo call
    sites migrate in the same PR, no deprecation shim (user decision, 2026-08-03: a shim that
    silently accepts a now-meaningless variable is exactly the misuse-prone interface being
    removed). WHY THE ARGUMENT IS DEAD: all five call sites already mention the first argument
    inside the condition, so it restates information the condition carries — verified exhaustively
    this session (explanation.py:70, test_queries.py:772, test_queries.py:1052, test_eql.py:1444,
    inference_explanation.md:237).'
- id: exists-consumers
  title: Rederive the verbalization and SQL-translation consumers from the condition
  branch: null
  pull_request_number: null
  track: api-surface
  depends_on:
  - exists-single-argument
  status: not started
  notes: 'GOAL: the two consumers that read Exists.variable keep working without it. THE CONSUMERS:
    (a) ExistsRule.build and QuantifierScope.focus in verbalization — "there exists a Robot
    such that its battery is greater than 0" needs both a noun to introduce and a discourse
    focus referent for the pronoun. (b) _translate_exists in ormatic/eql_interface.py — it
    calls _require_dao_class(existential_variable._type_) to build SELECT 1 FROM <DAO>. Neither
    needs the variable *passed in*; both need it *known*, and it is derivable as free(condition)
    minus outer-visible.'
- id: benchmark-regression-report
  title: Re-measure and report the evaluation-cost delta across the whole plan
  branch: null
  pull_request_number: null
  track: benchmarking
  depends_on:
  - exists-consumers
  - negation-antijoin
  - disjunction-range-restriction
  status: not started
  notes: 'GOAL: close the loop the user asked for — a published before/after on what the binding-order
    and quantifier changes did to EQL''s evaluation cost, using the wave-0 harness unchanged.
    REPORT: per query shape, the baseline and final numbers for wall time, variable enumerations,
    and condition evaluations; the binding-order change isolated from the quantifier change,
