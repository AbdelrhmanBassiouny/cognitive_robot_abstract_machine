schema_version: 1
id: eql-existential-semantics
title: 'EQL existential semantics: binding order, semi-join exists, and range restriction'
description: Rebuild EQL's existential operator on the standard relational/logic-programming
  footing. Today exists() takes a redundant quantified variable, exports bindings from inside
  the quantifier, and short-circuits globally rather than per outer binding — which silently
  drops matching rows, breaks not_(exists(...)) and for_all(...), and turns a correlated existential
  into a cross product. The root cause is that bottom-up evaluation gives the quantifier no
  outer relation to filter, so the operator invented one.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 137
waves:
- id: measurement
  name: Measurement baseline
  description: 'Establish how EQL evaluation cost is measured before changing the evaluation
    model, so the binding-order and quantifier work is judged against numbers rather than
    intuition. PR #99 already set the precedent for this repo with its truth-read-count table.

    '
- id: evaluation-model
  name: 'Evaluation model: binding order and range restriction'
  description: 'The prerequisite wave. A semi-join is only meaningful relative to an outer
    relation, and negation-as-failure is only sound over bound variables; both are properties
    of when things get evaluated, not of the quantifier node.

    '
- id: quantifier-semantics
  name: 'Quantifier semantics: semi-join and antijoin'
  description: 'Re-express the quantifiers as the relational operators the literature names,
    once the evaluation model can supply them with an outer relation.

    '
- id: api-and-consumers
  name: API surface and consumers
  description: 'Remove the first argument that the semi-join semantics makes dead, and rederive
    what the verbalization and SQLAlchemy consumers were reading off it.

    '
tracks:
- id: benchmarking
  name: Evaluation cost measurement
  wave: measurement
  description: 'Spans the whole plan: the harness lands first as a baseline, and the closing
    report re-runs it once the spine is in.

    '
- id: binding-order
  name: Binding order and the outer relation
  wave: evaluation-model
- id: disjunction-safety
  name: Disjunction range restriction
  wave: evaluation-model
  description: 'Parallel to binding-order — same safety family (range restriction), no shared
    code path, so the two can run concurrently.

    '
- id: quantifiers
  name: Existential and universal quantifiers
  wave: quantifier-semantics
- id: api-surface
  name: exists() signature and its consumers
  wave: api-and-consumers
items:
- id: evaluation-benchmark
  title: Benchmark harness and baseline for EQL evaluation cost
  branch: null
  pull_request_number: null
  track: benchmarking
  depends_on: []
  status: not started
  notes: 'GOAL: a repeatable timing harness for EQL query evaluation, plus a recorded baseline
    on main, so every later item in this plan reports a measured delta instead of an assertion
    that it is "probably fine". EXPLORE FIRST: (a) what PR #99 already built — it measured
