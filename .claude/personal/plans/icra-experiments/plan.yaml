  - id: simulated-camera-feeds-perception
    title: "A MuJoCo camera feeds the perception pipeline the same frames the real camera does"
    branch: null
    pull_request_number: null
    track: integration
    depends_on: [integrated-simulation-pipeline]
    status: not_started
    notes: >-
      What makes simulation-first testing honest for perception. MujocoCamera
      renders colour and depth; wrap them as the RgbdFrame the pipeline reads,
      with intrinsics and camera pose taken from the twin, so
      MontessoriPerceptionBackend answers a look in simulation exactly as it
      does off a capture. The six real captures remain the regression set for
