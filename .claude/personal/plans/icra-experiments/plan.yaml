schema_version: 1
id: icra-experiments
title: "ICRA experiments: one simulated pipeline, episodes in SQL, and the four experiments"
description: >
  Everything the ICRA paper (deadline 2026-09-15) needs that no other plan owns:
  one integrated pipeline that every scenario runs on in simulation before the
  robot, a dataclass domain model for scenarios, goals, conditions, perturbations
  and metrics, episodes recorded through ORMatic into an SQL database and queried
  by EQL as long-term memory, the per-predicate backend routing and physics
  verification mechanisms the paper measures, failure typing and prediction, the
  verbalised-memory and VLM baselines, Experiments A, B and C run in
  simulation and then on the UR10, Experiment D questioning the episode history
  in simulation, and the released artifact. Three lanes run
  in parallel; roadmap.md carries the lane order and the day-by-day budget.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252

waves:
  - id: foundation
    name: "One pipeline every scenario runs on"
    description: >-
      The integrated simulation pipeline, the scenario domain model and the
      episode recording. Everything later stacks on these three, and all three
      can start today in parallel.
  - id: mechanism
    name: "What the paper measures"
    description: >-
      The two mechanisms the thesis sentence names (per-predicate backend
      routing, perceive-commit-verify in physics), the snapshot working memory,
      failure typing and prediction, and the baselines the experiments compare
      against.
  - id: evidence
    name: "Experiments in simulation, then on the robot, then released"
    description: >-
      Each experiment runs end to end in simulation first, with its episodes in
      the database and its report generated, and only then on the robot. The
      artifact packages what both produced.

tracks:
  - id: integration
    name: "The integrated pipeline"
    wave: foundation
    description: >-
      Lane 1. One branch carrying the perception stack, the monitor stack, the
      predicates and a simulated camera, on which the simulated demo runs the
      same pipeline the robot will.
  - id: scenario-model
    name: "Scenarios as data"
    wave: foundation
    description: >-
      Lane 2. The dataclass domain model that describes a scenario, its goal,
      the knowledge conditions it runs under, the perturbations applied to it
      and the metrics it reports, plus the runner that executes it with logs
      and a report.
  - id: long-term-memory
    name: "Episodes recorded and queried"
    wave: foundation
    description: >-
      Lane 2. Every trial, event, query, answer and failure recorded through
      ORMatic into SQL, in simulation and on the robot alike, and read back
      through the SQL backend as long-term memory.
  - id: backend-routing
    name: "Routing, verification and working memory"
    wave: mechanism
    description: >-
      Lane 1. Backends declare what they can answer, a statement is routed
      per predicate by capability and knowledge state, derived facts are
      verified in a physics copy of the world, and working memory is a
      snapshot refreshed only when it is worth refreshing.
  - id: failure
    name: "Typed and predicted failures"
    wave: mechanism
    description: >-
      Lane 2. The failure taxonomy, typing from evidence, prediction from the
      query result before execution, and the knowledge ablations and
      perturbations that produce failures on purpose.
  - id: baselines
    name: "Verbalised memory and the VLM baselines"
    wave: mechanism
    description: >-
      Lane 3. The deterministic English rendering of working memory, and the
      harness that asks a vision-language model the same questions with and
      without it.
  - id: experiment-a
    name: "Experiment A: question answering"
    wave: evidence
    description: "Lane 3 in simulation, robot time shared."
  - id: experiment-b
    name: "Experiment B: decomposition and verification"
    wave: evidence
    description: "Lane 1."
  - id: experiment-c
    name: "Experiment C: manipulation under ablations"
    wave: evidence
    description: "Lane 2."
  - id: experiment-d
    name: "Experiment D: long-term memory across episodes"
    wave: evidence
    description: >-
      Lane 2. The questions Experiment A asks about the current scene, asked
      instead of the episode history, against a vision-language model given the
      whole recorded corpus. Simulation only.
  - id: release
    name: "Figures and the artifact"
    wave: evidence
    description: "Lane 3."

items:
  # %% integration
  - id: integrated-simulation-pipeline
    title: "One branch on which the simulated demo runs perception, monitor, predicates and events together"
    branch: claude/icra-experiments-simulation-pipeline-w4ep7n
    pull_request_number: 265
    track: integration
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01G5fPjf58191jHuL1dvrKNv
    blockers:
      - >-
        Cross-plan: this item merges montessori-eql-stack's montessori_monitor_and_recording (#256) rather than montessori_fast_inline_monitor (#169), as of 2026-09-03 - #256 was split out of #169 so this plan need not take the cramera console with the monitor. As of 2026-09-03 it takes only the monitor half of #256: the recording half is being cut off main as its own item, run-results-recorded-into-sql, which this item merges instead. What is left of that debt here is one item: SimulationTimePacer.sleep() waits on the simulation clock with no bound, so a stalled simulation blocks a tick forever. No test reaches it - only the demo scripts set context.simulation_clock - but it is a real hang, and what a stalled simulation should do is the developer's call. The three coraplex failures and the hanging Tracy demo this blocker used to name are fixed: the gripper round (7fa4b1936) cleared them and all 24 checks passed on #169's c8bf6f05.
    notes: >-
      The foot of the plan. Cut off main and merge in, in this order, the library half of
      the monitor stack (#244), the monitor half of #256 (the segmind event
      monitor, the attach and detach of a grasped shape behind
      Context.update_world_model_attachment, and the montessori world and semantics it
      monitors - #256 imports no cramera at all), the recording half of #256 as its own
      branch off main (run-results-recorded-into-sql), the predicate classes (#229), the perception stack tip (#238,
      which carries #221, #222 and #227) and the hole layout fit (#236, which carries #225
      and #232), the detector choice by rule (#231, 13 commits, no rule-engine dependency)
      and only the one knowledge-half commit of #239 (3a493be9, the measured colours and
      finishes on the twin): the rest of #239 is 177 commits of the RDR stack and stays
      out. Resolve the known meetings once and record them in roadmap.md: #223's
      RectifiedFootprint rename, #231's EdgeFitDetector rename, #244 and #229 both editing
      reasoning/predicates.py and geometry.py. Inherits one piece of open debt from that
      stack, which is prerequisite work: SimulationTimePacer.sleep has no bound. The demo
      entry point stays in #169, since franka_montessori_demo.py is bound to cramera
      through SortingRunControl, so the headless demo this item is done by is tracy_icra's
      own montessori_demo.py rather than that one. Done when franka_montessori_demo and
