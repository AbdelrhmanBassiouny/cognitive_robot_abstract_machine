      board and four pieces reports every piece once with the right category.
      Stated colours and finishes on the simulated objects come from the
      values #239 measured off the real ones.

  - id: tracy-demo-takes-the-integrated-branch
    title: "tracy_icra takes the integrated branch and the real robot runs it"
    branch: null
    pull_request_number: null
    track: integration
    depends_on: [integrated-simulation-pipeline, simulated-camera-feeds-perception]
    status: not_started
    notes: >-
      The bridge to the robot, and the one item on this plan that needs the
      robot before any experiment does. Merge the integrated branch into
      tracy_icra, run the demo on the UR10 with the live camera, and keep a
      capture of the run. This is knowledge-directed-perception's
      demo-runs-on-grounded-perception in that plan's words; it is tracked
      here because the branch it runs is this plan's. From then on every
      later merge into tracy_icra is a merge of the integrated branch, never
      of individual stacks. Record the transform tree and joint states with
      the camera in every take from now on; five of the six existing
      recordings hold no robot state and cannot supply a history.

  # %% scenario-model
  - id: scenario-domain-model
    title: "Scenarios, goals, conditions, perturbations and metrics as dataclasses, with a runner that reports"
    branch: claude/icra-experiments-scenario-domain-n7zwpr
    pull_request_number: 261
    track: scenario-model
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01Y2R5PzHHiVS7EvnAZ1J2yc
    notes: >-
      The meta level the developer asked for: a Scenario names how to build
      its world and which robot and execution kind (simulated or real) it
      runs on; a Goal names what counts as success; a Condition names one
      knowledge source switched on or off; a Perturbation names a change
      applied to the world at a step; a Metric names one number read off a
      finished Trial; a Report gathers metrics over trials with confidence
      intervals. A ScenarioRunner executes trials, writes structured logs and
      renders the report. Generalise what exists rather than adding a third
      shape: control_loop_experiments.scenarios already has BenchmarkScenario
      and ScenarioRunner, and experiment_definitions has ExperimentResult,
      ExperimentsTable and TypstRenderer; the new model subsumes both and the
      old ones migrate onto it. Concrete scenarios subclass or instantiate
      these, never re-describe them. Fully unit-tested against a trivial
      scenario that needs no simulator, so the model's tests run everywhere.

  - id: montessori-scenarios
    title: "The memo's scenes and scripted scenarios as Scenario instances that run in simulation"
    branch: null
    pull_request_number: null
    track: scenario-model
    depends_on: [scenario-domain-model, integrated-simulation-pipeline]
    status: not_started
    notes: >-
      Random layouts with all four pieces, partial scenes with two or three,
      near-ambiguous layouts with the cube and cylinder aligned in camera
      depth, a lighting change (a MujocoLight edit in simulation), and the
      four scripted temporal scenarios: static, robot pick-and-place, an
      external body pushing a piece while the robot is idle, and a piece in
      the gripper at query time. Each is a Scenario with a seeded layout so a
      run is reproducible, and each has a test that builds it headless and
      asserts its own precondition (the ambiguous layout really is aligned in
      depth, the in-gripper scenario really holds the piece).

  # %% long-term-memory
  - id: run-results-recorded-into-sql
    title: "Where a run records its results, and the plan-and-events schema it records"
    branch: claude/montessori-results-recording-jnrgfy
    pull_request_number: 262
    track: long-term-memory
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01Hye1f4d5KoNGxtFtWF3XV7
    notes: >-
      Cut the recording half of montessori-eql-stack's montessori_monitor_and_recording (#256) as a pull
      request of its own, off main. Three modules and about 700 lines: results_database.py resolves
      where a run records and reports whether that database can be reached and written to,
      results_recording.py records best effort so a database problem cannot lose a finished run, and
      sorting_results.py is the schema itself - a realized coraplex Plan plus the segmind
      DetectionEvents detected inside it. With them, the three lines that make the recording possible at
      all: the experiments ORM interface declares segmind, generate_orm imports
      segmind.orm.ormatic_interface, and experiments/pyproject declares the dependency. Plus
      experiments/montessori/__init__.py, without which pkgutil skips the directory and the generator is
      never offered SortingIterationResult. Off main rather than off tracy_icra or #256, and this is
      what makes it small: experiments/montessori does not exist on main at all, so the branch creates
      the directory holding only these modules, and nothing it needs is newer than main. The rest of
      #256 stays where it is - the simulated world, semantics, hole geometry, sorting progress and
      insertion diagnosis are another demo's, and its event monitor is one tracy_icra_segmind already
      has its own of. The Footprint collision is deferred, not avoided:
      experiments/montessori/perception/footprint.py and
      semantic_digital_twin...graph_of_convex_sets/plotting.py both declare a Footprint, so the moment
      this branch's __init__.py sits over tracy_icra's perception package the generator emits two
      FootprintDAO classes and SQLAlchemy refuses the mapping. knowledge-directed-perception's
      montessori-classes-in-the-orm (#223) already renames the perception one to RectifiedFootprint;
      whichever branch first puts the two together takes that rename.

  - id: episodes-recorded-through-ormatic
    title: "Every trial, event, query, answer and failure recorded through ORMatic into SQL"
    branch: claude/icra-experiments-ormatic-episodes-ib9lr3
    pull_request_number: 271
    track: long-term-memory
    depends_on: [scenario-domain-model, run-results-recorded-into-sql]
    status: in_progress
    session: https://claude.ai/code/session_012ouWhruGFvn9D5AvPmQNRa
    notes: >-
      One Episode model for simulation and the robot: the scenario and
      condition it ran under, its trials, the segmind events seen per tick,
      every query asked with its per-predicate backend assignment, answer and
      latency, every insertion attempt with its outcome, the failure type
      observed and predicted, and what was done after a failure - retried,
      changed or abandoned. That last is what answers "how did you resolve this
      the last time it happened"; nothing else in the record carries it, and it
      was added on 2026-09-04 when Experiment D was planned. Recorded through ORMatic the way
      ShapeInsertionExperience and SortingIterationResult already are, and
      replacing both with the one model rather than standing beside them;
      ResultsDatabase and results_recording keep deciding where and whether
      a run records. The runner records as it goes, so a run that dies keeps
      its finished trials, following batch_runner's reasoning. Tests record a
      trivial episode into SQLite and read it back through the generated
      interface.

  - id: episodes-queried-by-eql
    title: "Long-term memory answered by EQL through the SQL backend, and reports read from it"
    branch: null
    pull_request_number: null
    track: long-term-memory
    depends_on: [episodes-recorded-through-ormatic]
    status: not_started
    notes: >-
      The SQL backend is one of the paper's four: the same query language
      over recorded episodes returns domain objects, so the temporal bucket
      can be answered from long-term memory ("which pieces did you pick up
      in the last run", "how often did the square hole fail") and the
      Report of every experiment is computed from the database rather than
      from in-process results. Tests assert that a query over a recorded
      episode returns the same objects the runner wrote, and that a report
      regenerated from the database equals the one the runner rendered.

  - id: episode-artifacts-recorded
    title: "An episode keeps its video, its simulation data and its question-and-answer transcript beside the database"
    branch: null
    pull_request_number: null
    track: long-term-memory
    depends_on: [episodes-recorded-through-ormatic, simulated-camera-feeds-perception]
    status: not_started
    notes: >-
      The rows say what happened; these are what a reader - or a
      vision-language model - can look at, and without them Experiment D has
      no baseline to compare against. The video is the frames MujocoCamera
      already renders for MontessoriPerceptionBackend, written per episode
      rather than discarded; the simulation data is the run's own files, the
      world it built and the plan it realized; the transcript is every question
      with its answer, which the episode rows already carry per query, rendered
      as one readable document. Artifacts sit beside the database addressed by
      the episode's identifier, so a row references one rather than holding it -
      the separation ResultsDatabase already draws between where a run records
      and what it records. Its own item rather than folded into
      episodes-recorded-through-ormatic because it needs the simulated camera,
      and folding it would put lane 2's foot item behind lane 1's second. Tests
      record a two-trial episode and read its video, its files and its
      transcript back from the episode.

  # %% backend-routing
  - id: backends-declare-their-capabilities
    title: "Every query backend declares what it can answer, as an EQL condition plus preconditions on the twin"
    branch: null
    pull_request_number: null
    track: backend-routing
    depends_on: [integrated-simulation-pipeline]
    status: not_started
    notes: >-
      The capability table the memo publishes, as code rather than a table
      written by hand: QueryBackend gains capability(), the same shape #231
      gave detectors, stating the predicate and statement forms the backend
      answers and the precondition on the knowledge state under which it
      answers them (the native twin backend for a body already believed in,
      perception for a pose stated as ..., the SQL backend for anything about
      a past episode, physics for a derived physical fact). Rendering the
      declarations of all four backends is what prints the paper's table.
      Tests pin one declaration per backend against a statement it accepts
      and one it refuses.

  - id: query-routed-per-predicate
    title: "A statement is routed per predicate by capability and knowledge state, and the routing is reported"
    branch: null
    pull_request_number: null
    track: backend-routing
    depends_on: [backends-declare-their-capabilities]
    status: not_started
    notes: >-
      The mechanism the thesis sentence names. A planner splits a statement
      into its predicates, assigns each to the backend whose capability
      admits it under the current twin state, orders them twin first, then
      perception for what the twin cannot answer, then physics for derived
      facts, and falls back to the next capable backend when one refuses. It
      returns a QueryPlan beside the answer: per-predicate assignment,
      detector calls, region searched and latency, which is exactly what
      Experiment B tabulates. #238 already does this implicitly for one
      statement (the lid and the hole are answered from the twin before the
      look); this item makes it general and visible. The mixed statement
      "the cyan piece left of the triangle on the table", with the triangle
      believed in versus not, is the test.

  - id: physics-verification-backend
    title: "Perceive, commit, verify: detections spawned into a physics copy of the world and derived facts re-evaluated there"
    branch: null
    pull_request_number: null
    track: backend-routing
    depends_on: [backends-declare-their-capabilities]
    status: not_started
    notes: >-
      A backend that spawns what perception reported into a copy of the
      world, steps MuJoCo, and evaluates the derived predicates there:
      Stable, contact and penetration, InsideOf, the directional relations
      and Reachable, all of which #229 already made predicates. It reports
      agreement or disagreement with the perception backend per fact, never
      re-checking the committed pose itself. This is the narrow form of
      knowledge-directed-perception's imagination-world item, built here
      because the paper measures it; that plan's item is noted as covered by
      this one. Tests inject a floating piece, a penetrating piece and a
      wrongly classified piece and assert each disagreement fires.

  - id: snapshot-working-memory
    title: "Working memory as a snapshot: the twin follows kinematics while acting and re-perceives only when idle and changed"
    branch: null
    pull_request_number: null
    track: backend-routing
    depends_on: [simulated-camera-feeds-perception]
    status: not_started
    notes: >-
      During manipulation the grasped piece moves with the gripper through the
      attachment #169 restored, and perception is not consulted. When idle,
      a look is taken at a low rate and a piece's pose is committed only
      when it differs from the believed pose by more than a threshold
      measured as three standard deviations over a static scene. The
      threshold is measured in simulation first and again on the robot, both
      numbers recorded. Fits the frame budget the continuous node cannot:
      #236's layout fit costs 0.56 s per frame against the node's 0.5 s
      period, which is fine at idle rate.

  # %% failure
  - id: failure-taxonomy-and-typing
    title: "Every failed trial typed as semantic, geometric, perceptual or execution from the evidence"
    branch: null
    pull_request_number: null
    track: failure
    depends_on: [scenario-domain-model]
    status: not_started
    blockers:
      - >-
        Cross-plan: the violated-expectation input comes from knowledge-directed-perception's expectations-from-events (not started there), which that plan owns. Typing from the plan's failure and the segmind events can be built first; the expectation-derived type waits on it.
    notes: >-
      A FailureType enum with the four members, and the rule that assigns
      one to a finished trial from the plan's own failure, the segmind
      events and the violated expectation. Extends
      insertion_diagnosis.InsertionDiagnosis and InsertionFailureReason,
      which already diagnose an attempt from events, rather than a second
      diagnosis; each existing reason maps to one type. Recorded on the
      Trial and so in the episode. Tests cover one trial per type.

  - id: knowledge-ablations
    title: "Each knowledge source switched off through a Condition, never through a code branch"
    branch: null
    pull_request_number: null
    track: failure
    depends_on: [montessori-scenarios]
    status: not_started
    notes: >-
      The memo's conditions as Condition instances: full; no working memory;
      no hole-shape knowledge (the board's holes unknown to the twin, which
      also needs the mesh scale 0.865 #236 measured to be in the twin first,
      so the full condition is honest); no degree-of-freedom limits; no
      pickup detection; no predicate-narrowed perception. Each condition
      removes one thing the action reads from the twin or the backends, so
      the action's code has no ablation flags of its own. A test per
      condition asserts the knowledge really is absent (the query that would
      read it fails or returns nothing).

  - id: perturbations
    title: "Perturbations applied to a running trial: a moved target, a perception offset, a wrong object, a push"
    branch: null
    pull_request_number: null
    track: failure
    depends_on: [montessori-scenarios]
    status: not_started
    notes: >-
      Perturbation instances the runner applies at a named step: the target
      hole moved 10 cm, a fixed offset added to a reported pose, a detection
      relabelled as another piece, an external body pushing a piece while
      the robot is idle. In simulation they act on the MuJoCo world or on the
      perception result; on the robot the same Perturbation renders a
      one-line instruction to the person at the table, so the protocol is
      the same object. Experiment B's ~30 injected events and Experiment C's
      perturbation conditions are drawn from these.

  - id: expectation-checked-under-perturbation-in-simulation
    title: "A robot plan run in simulation under a perturbation, and the violated expectation reported as the failure"
    branch: null
    pull_request_number: null
    track: failure
    depends_on: [perturbations, integrated-simulation-pipeline]
    status: not_started
    notes: >-
      Added 2026-09-05 at the developer's ask on knowledge-directed-perception's
      #257 (r3940274577). The expectation process - an action's declared effect
      armed as relations of the twin's vocabulary, Segmind's events moving the
      belief by what each declares, a look asked for the same relations, and
      the violated ones reported as the failure - is tested there over a
      rendered scene and a hand-built world, never over a plan the robot
      actually executes. This item runs the insertion plan in the integrated
      simulation and applies one perturbation from `perturbations` at a named
      step, asserting that the expectation the release armed is contradicted in
      exactly the relation the perturbation breaks: a piece pushed off the lid
      after the release contradicts Near and InsideRegion, a release that stops
      short so the piece rests on the lid contradicts InsideRegion alone, a
      piece the gripper never let go of is reported as nothing found, and an
      unperturbed run contradicts nothing. It is also the first place the
      success case is checked against a look rather than a stated sighting,
      which is where a piece sunk in its hole has to be told from one standing
      over it. A test of the mechanism end to end rather than an experiment,
      so it sits in the failure track beside the perturbations it draws on;
      experiment-c-in-simulation reads its result rather than re-establishing
      it. Cross-plan: the mechanism is knowledge-directed-perception's
      expectations-from-events (#257) and its general half lives in
      segmind.expectations; this item does not start before that branch is
      merged into the integrated branch.

  - id: failure-predicted-from-the-query
    title: "The failure type predicted from the query result before execution, and scored against what happened"
    branch: null
    pull_request_number: null
    track: failure
    depends_on: [failure-taxonomy-and-typing, query-routed-per-predicate]
    status: not_started
    notes: >-
      H4. Before an insertion executes, the QueryPlan and its answer predict
      the type: several candidate holes answer the target description, so
      semantic; Reachable is false for the grasp or the release pose, so
      geometric; the physics backend disagrees with perception or nothing
      was detected, so perceptual; otherwise none predicted. Precision and
      recall of prediction against the observed type are Metrics on the
      Report. Tests build one query result per predicted type.

  # %% baselines
  - id: working-memory-verbalised
    title: "Working memory rendered as deterministic English: objects, poses, relations, events, gripper contents"
    branch: null
    pull_request_number: null
    track: baselines
    depends_on: [integrated-simulation-pipeline]
    status: not_started
    notes: >-
      A fixed set of EQL queries over the twin whose answers are rendered
      through the verbalization framework on main, concatenated in a fixed
      order with rounded numbers, so the same state always produces the same
      text. The scene wordings #33 carries (support, the directional
      relations, visibility, reachability) are the ones to use; where #33 is
      not yet rebased onto #229, take its reviewed wordings rather than
      inventing new ones. A snapshot test pins the text for one simulated
