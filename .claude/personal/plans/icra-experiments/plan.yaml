  - id: segmind-detectors-on-the-demo-branch
    title: "The demo branch takes its own segmind detectors, grasp events and gripper feedback"
    branch: tracy_icra
    pull_request_number: null
    track: integration
    depends_on: []
    status: done
    session: https://claude.ai/code/session_016LPo74ksuCPpkqgpvpz7eY
    notes: >-
      Merge tracy_icra_segmind into tracy_icra. Not a fast-forward: tracy_icra has moved 20-odd commits
      past their merge base e034fa791, taking the knowledge-directed-perception work with it, so this is
