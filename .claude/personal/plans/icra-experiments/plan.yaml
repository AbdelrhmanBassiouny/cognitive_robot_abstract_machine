      model sits behind an interface so the provider is one class; CI runs
      against a recorded-answer mock, and the live test is skipped without
      credentials. Each question is also run five times on the same scene
      to report answer variance, for the VLM systems and for EQL alike.
      Which provider and model to use is the developer's call and is not
      taken here. What it sends is an assembled context rather than an image
      and a prepended string, so the episode corpus of Experiment D is a third
      system on the same harness rather than a second one.

  - id: episode-corpus-given-whole-to-the-vlm
    title: "The vision-language model is given the whole episode corpus: every episode's video, files and transcript in one context"
    branch: null
    pull_request_number: null
    track: baselines
    depends_on: [episode-artifacts-recorded, vlm-baseline-harness]
    status: not_started
    notes: >-
      What makes Experiment D's comparison fair, and the reason a loss there
      reads as reasoning rather than lookup: every episode a question may reach
      over goes into one context - sampled video frames, the run's files, the
      question-and-answer transcript - so the model is given everything the SQL
      backend can see over the same episodes. That is only possible with a cap,
      and the cap is derived rather than chosen: how many episodes fit once the
      frames are sampled to the model's context budget. It is the baseline's
      stated limit in the paper, and it bounds how far back a question can
      reach. Assembled from what episode-artifacts-recorded wrote. A retrieval
      step over an unbounded corpus was considered and rejected on 2026-09-04;
      roadmap.md carries why.

