    status: not_started
    notes: >-
      First a corpus worth asking about: the scenarios run under varied
      conditions and perturbations so the history holds repeats, failures
      resolved differently, and goals that changed between runs. Then every
      question through both systems, repeated for variance the way Experiment A
      does, reporting accuracy against the recorded ground truth, latency,
      determinism across repetitions, and information availability - whether the
      corpus holds the facts a question declares it requires. Availability is
      measured on the corpus once rather than per system, because both systems
      see the same episodes, so a question nothing could have answered is scored
      apart from one both had the evidence for. Simulation only, decided
      2026-09-04: the questions are about recorded episodes, so the robot
      episodes Experiments A and C record join the same corpus without a robot
      session of their own.

