schema_version: 1
id: icra-foundation
title: 'ICRA experiments: one pipeline every scenario runs on'
description: >-
  The foot of icra-experiments (split 2026-09-05 for the plan size budget -- see plan-size-limits' roadmap.md for why). One representation every subsystem reads and writes: the integrated simulation pipeline every scenario, demo and experiment stacks on, the dataclass scenario/goal/condition/perturbation/metric domain model with its runner, and every trial, robot plan, event, query, answer and failure recorded through ORMatic into SQL and read back as long-term memory. Refocused 2026-09-08 on the shared representation rather than on perception quality (see roadmap.md): the long-term-memory track is the plan's own critical path and no longer waits on the perception lane. icra-mechanism and icra-evidence both depend on items here; those edges could not cross the plan boundary and are recorded as blockers on their side instead (see their roadmap.md).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: foundation
  name: One pipeline every scenario runs on
  description: >-
    The integrated simulation pipeline, the scenario domain model and the episode recording. Everything later stacks on these three, and all three can start today in parallel.
tracks:
- id: integration
  name: The integrated pipeline
  wave: foundation
  description: >-
    Lane 1. One branch carrying the perception stack, the monitor stack, the predicates and a simulated camera, on which the simulated demo runs the same pipeline the robot will.
- id: scenario-model
  name: Scenarios as data
  wave: foundation
  description: >-
    Lane 2. The dataclass domain model that describes a scenario, its goal, the knowledge conditions it runs under, the perturbations applied to it and the metrics it reports, plus the runner that executes it with logs and a report.
- id: long-term-memory
  name: Episodes recorded and queried
  wave: foundation
  description: >-
    Lane 2, and the programme's critical path since 2026-09-08. Every trial, robot plan, event, query, answer, failure and self-model recorded through ORMatic into SQL, in simulation and on the robot alike, generated at corpus scale headless, and read back through the SQL backend as long-term memory. Nothing in this track waits on the perception lane.
items:
- id: integrated-simulation-pipeline
  title: >-
    One branch on which the simulated demo runs perception, monitor, predicates and events together
  branch: claude/icra-experiments-simulation-pipeline-w4ep7n
  pull_request_number: 265
  track: integration
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_019Fq3evDtc4fjPpCaNceNts
  blockers:
    - >-
      Cross-plan: this item merges montessori-eql-stack's montessori_monitor_and_recording (#256)
      rather than montessori_fast_inline_monitor (#169), as of 2026-09-03 - #256 was split out of
      #169 so this plan need not take the cramera console with the monitor. As of 2026-09-03 it
      takes only the monitor half of #256: the recording half is being cut off main as its own item,
      run-results-recorded-into-sql, which this item merges instead. What is left of that debt here
      is one item: SimulationTimePacer.sleep() waits on the simulation clock with no bound, so a
      stalled simulation blocks a tick forever. No test reaches it - only the demo scripts set
      context.simulation_clock - but it is a real hang, and what a stalled simulation should do is
      the developer's call. The three coraplex failures and the hanging Tracy demo this blocker used
      to name are fixed: the gripper round (7fa4b1936) cleared them and all 24 checks passed on
      #169's c8bf6f05.
  notes: >
    The foot of the plan. Cut off main and merge in, in this order, the library half of the monitor
    stack (#244), the monitor half of #256 (the segmind event monitor, the attach and detach of a
    grasped shape behind Context.update_world_model_attachment, and the montessori world and
    semantics it monitors - #256 imports no cramera at all), the recording half of #256 as its own
    branch off main (run-results-recorded-into-sql), the predicate classes (#229), the perception
    stack tip (#238, which carries #221, #222 and #227) and the hole layout fit (#236, which carries
    #225 and #232), the detector choice by rule (#231, 13 commits, no rule-engine dependency) and
    #239 whole. Both standing exclusions this item's notes used to carry are reversed at the
    developer's direction (2026-09-06): the whole ripple-down rules stack is in, taken at its tip
    D-deco (#77), not the one knowledge-half commit of #239; and the whole match-query-ergonomics
    set is in, #192 included. Resolve the known meetings once and record them in roadmap.md: #223's
    RectifiedFootprint rename, #231's EdgeFitDetector rename, #244 and #229 both editing
    reasoning/predicates.py and geometry.py. Inherits one piece of open debt from that stack, which
    is prerequisite work: SimulationTimePacer.sleep has no bound. The demo entry point stays in
    #169, since franka_montessori_demo.py is bound to cramera through SortingRunControl, so the
    headless demo this item is done by is tracy_icra's own montessori_demo.py rather than that one.
    Done when franka_montessori_demo and the Tracy simulated demo both sort the board headless with
    the event monitor ticking and every test module of the merged packages collected and green in
    CI. #192 removes Match.variable, which #159 and therefore #239, #266 and #275 read; the branches
    merge textually clean and the reads are migrated to the underscore-sandwich API in a commit of
    their own, so the migration reads separately from the merge.

    Resolved 2026-09-06: the branch was red on a krrood defect, not on the merge. A class diagram
    resolved a field's annotation with the classes it holds offered as a local scope, so giskardpy's
    Sequence goal replaced the typing alias detector_choice.py imports and the ORM generation
    aborted in every job that builds an interface. get_type_hints_of_object now takes those classes
    as a fallback for names the defining modules leave unbound, which is what they were for; a
    krrood test reproduces the generator's failure over three classes and no ROS. What this changes
    about the item is its evidence, not its scope: every suite number recorded for the convergence
    was measured in a session container with the ORM-dependent modules excluded, so this item is not
    verified until CI collects on this branch at least once.

    CI collected 2026-09-06, and the wall was hiding two more defects, both this branch's own and
    both fixed: the generated experiments interface named collections.abc.Sequence without importing
    it, because a relationship was rendered with the container its field declares and SurfacePass
    declares the abstract Sequence - which SQLAlchemy could not have instrumented anyway, so a
    relationship is now held in a collection it can build and append to, as the tuple case already
    was; every later import of that half-executed module then collided with the association table it
    had already registered, which is where nine failures and six collection errors came from. And
    InsideOf.compute_containment_ratio was kept in its older mesh-and-bounding-box form over
    01e454d7b's numeric one, alone among that commit's numeric readings, against the test asserting
    containment builds nothing symbolic. Thirteen of fifteen jobs were green before those two; what
    is left is the four narrowing tests, which are now a blocker of their own.
    Resolved 2026-09-06 by #292, and this is the item's first fully measured experiments job. The
    RecordedLook collision is cleared by renaming recordings.py's to RecordedImages, with
    RecordedCamera.looks()/look_at() following as images()/image_at() and its three readers with
    them; step_by_step.py keeps RecordedLook. Renamed rather than ignored because generate_orm's
    ignored_classes would have had to grow over watch_bag as well - BagReplay holds a RecordedCamera
    - and over every later holder of one, leaving the duplicate name in place for the next class to
    hit; the rename is also the only one of the two a session container can check, by grep rather
    than by running a generation it cannot run. RecordedFrame, the obvious name, is already
    scene_source.py's, which is part of why the namespace collided. test_montessori_orm.py now
    asserts that no two mapped Montessori classes share a name with each other, beside the upstream
    check it already made. Measured on CI: the parent e6c665cec runs 13 failed, 742 passed, 8 errors
    with 51 mentions of the duplicated table; #292's 76e37a70 runs 4 failed, 758 passed, no errors
    and no collision at all. What is left red is the four narrowing tests of the blocker above,
    which fail identically on the parent and are untouched by this.
    Resolved 2026-09-08: the four narrowing tests state what the corrected layout shows. Measured
    over all six holes, left and right separate the cube from the cylinder from no hole on this
    board, read from the camera or from the world, so three of the four needed a different pair
    rather than a re-measurement and the fourth was not a test change at all. Which way a piece lies
    now pairs Above with Below on the square hole (cube 18.6 mm up the picture, cylinder 45.4 mm
    down); the two sides of a hole pairs InFrontOf with Behind on it (cube 16.2 mm in front,
    cylinder 49.1 mm behind), which is one axis where the old pair crossed two; the reach moves to
    the triangle hole with radii 0.07 and 0.12 (cube 50.0 mm, cylinder 93.8 mm), the square hole
    separating them by 1.3 mm. The demonstration test is untouched: what was wrong was
    watch_narrowing.look_for_the_cube_on_the_lid asking for LeftOf the square hole, now Above it,
    and the step sequence the test asserts holds unchanged. Every replacement was run end to end
    through MontessoriPerceptionBackend, and the sibling assertions over the demonstration
    statement still hold - areas 0.517 > 0.041 > 0.023, five distinct labels of non-decreasing
    length, the camera named exactly twice. Pushed as dae41889c on the item's own branch, since the
    scope check leaves the touched files on no other base. The roadmap's standing hazard that
    nothing on these branches runs in a session container is wrong for the montessori perception
    suite: a python3.12 venv with casadi~=3.7.0 runs the whole pipeline, and only pytest is blocked,
    by the conftest's ORM generation.

    Corrected 2026-09-08 (later), on #292: those directions were measured off the wrong objects.
    board_holes_in never used the fit - it added the board mesh's own unscaled hole offsets to the
    fitted board pose, so since #236's 0.865 scale the hole bodies stood about twelve millimetres
    from the holes the same look reported (square hole 12.1 mm, disk hole 12.7 mm on
    tracy_pickup_demo). Every hole y the entry above quotes is a displaced body; placed where the
    look found them the square hole stands at 0.0299, between the cylinder at 0.0231 and the cube at
    0.0634, so left and right do separate the two pieces about it and the 1.3 mm that ruled the
    square hole out of the reach test becomes 41.2 against 49.4. The four tests were reading the
    capture from a place 12 mm off, not stating what it does not show. Fixed by placing each hole
    where the look put it, with a test asserting board_holes_in's output against board.holes, which
    fails on the parent at those two distances. dae41889c is kept rather than reverted: its four
    choices all still hold once the holes move, and its millimetres are requoted (19 to 21, 45 to
    43, 16 to 19, 49 to 47, 50 and 94 to 51 and 93). Its one claim that does not survive - that left
    and right tell the two apart from no hole on this board - is replaced by the honest reason for
    the same choice: up and down leave 21 and 43 mm where the cylinder stands 7 mm from the square
    hole across the picture. pytest is not blocked in a session container after all -
    CRAM_ORM_BUILD=never skips the conftest's generation, the narrowing suite runs in 75 s, and 506
    of the montessori suite pass.
