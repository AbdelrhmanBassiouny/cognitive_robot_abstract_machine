- id: scenario-domain-model
  title: >-
    Scenarios, goals, conditions, perturbations and metrics as dataclasses, with a runner that reports
  branch: claude/icra-experiments-scenario-domain-n7zwpr
  pull_request_number: 261
  track: scenario-model
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Y2R5PzHHiVS7EvnAZ1J2yc
  notes: >-
    The meta level the developer asked for: a Scenario names how to build its world and which robot and execution kind (simulated or real) it runs on; a Goal names what counts as success; a Condition names one knowledge source switched on or off; a Perturbation names a change applied to the world at a step; a Metric names one number read off a finished Trial; a Report gathers metrics over trials with confidence intervals. A ScenarioRunner executes trials, writes structured logs and renders the report. Generalise what exists rather than adding a third shape: control_loop_experiments.scenarios already has BenchmarkScenario and ScenarioRunner, and experiment_definitions has ExperimentResult, ExperimentsTable and TypstRenderer; the new model subsumes both and the old ones migrate onto it. Concrete scenarios subclass or instantiate these, never re-describe them. Fully unit-tested against a trivial scenario that needs no simulator, so the model's tests run everywhere.
- id: montessori-scenarios
  title: >-
    The memo's scenes and scripted scenarios as Scenario instances that run in simulation
  branch: null
  pull_request_number: null
  track: scenario-model
  depends_on:
  - scenario-domain-model
  - integrated-simulation-pipeline
  status: not_started
  notes: >-
    Random layouts with all four pieces, partial scenes with two or three, near-ambiguous layouts with the cube and cylinder aligned in camera depth, a lighting change (a MujocoLight edit in simulation), and the four scripted temporal scenarios: static, robot pick-and-place, an external body pushing a piece while the robot is idle, and a piece in the gripper at query time. Each is a Scenario with a seeded layout so a run is reproducible, and each has a test that builds it headless and asserts its own precondition (the ambiguous layout really is aligned in depth, the in-gripper scenario really holds the piece).
- id: run-results-recorded-into-sql
  title: >-
    Where a run records its results, and the plan-and-events schema it records
  branch: claude/montessori-results-recording-jnrgfy
  pull_request_number: 262
  track: long-term-memory
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Hye1f4d5KoNGxtFtWF3XV7
  notes: >-
    Cut the recording half of montessori-eql-stack's montessori_monitor_and_recording (#256) as a pull request of its own, off main. Three modules and about 700 lines: results_database.py resolves where a run records and reports whether that database can be reached and written to, results_recording.py records best effort so a database problem cannot lose a finished run, and sorting_results.py is the schema itself - a realized coraplex Plan plus the segmind DetectionEvents detected inside it. With them, the three lines that make the recording possible at all: the experiments ORM interface declares segmind, generate_orm imports segmind.orm.ormatic_interface, and experiments/pyproject declares the dependency. Plus experiments/montessori/__init__.py, without which pkgutil skips the directory and the generator is never offered SortingIterationResult. Off main rather than off tracy_icra or #256, and this is what makes it small: experiments/montessori does not exist on main at all, so the branch
    creates the directory holding only these modules, and nothing it needs is newer than main. The rest of #256 stays where it is - the simulated world, semantics, hole geometry, sorting progress and insertion diagnosis are another demo's, and its event monitor is one tracy_icra_segmind already has its own of. The Footprint collision is deferred, not avoided: experiments/montessori/perception/footprint.py and semantic_digital_twin...graph_of_convex_sets/plotting.py both declare a Footprint, so the moment this branch's __init__.py sits over tracy_icra's perception package the generator emits two FootprintDAO classes and SQLAlchemy refuses the mapping. knowledge-directed-perception's montessori-classes-in-the-orm (#223) already renames the perception one to RectifiedFootprint; whichever branch first puts the two together takes that rename.
- id: episodes-recorded-through-ormatic
  title: >-
    Every trial, event, query, answer and failure recorded through ORMatic into SQL
  branch: claude/icra-experiments-ormatic-episodes-ib9lr3
  pull_request_number: 271
  track: long-term-memory
  depends_on:
  - scenario-domain-model
  - run-results-recorded-into-sql
  status: in_progress
  session: https://claude.ai/code/session_012ouWhruGFvn9D5AvPmQNRa
  notes: >-
    One Episode model for simulation and the robot: the scenario and condition it ran under, its trials, the segmind events seen per tick, every query asked with its per-predicate backend assignment, answer and latency, every insertion attempt with its outcome, the failure type observed and predicted, and what was done after a failure - retried, changed or abandoned. That last is what answers "how did you resolve this the last time it happened"; nothing else in the record carries it, and it was added on 2026-09-04 when Experiment D was planned. Recorded through ORMatic the way ShapeInsertionExperience and SortingIterationResult already are, and replacing both with the one model rather than standing beside them; ResultsDatabase and results_recording keep deciding where and whether a run records. The runner records as it goes, so a run that dies keeps its finished trials, following batch_runner's reasoning. Tests record a trivial episode into SQLite and read it back through the generated interface.
- id: episodes-queried-by-eql
  title: >-
    Long-term memory answered by EQL through the SQL backend, and reports read from it
  branch: claude/plan-item-kickoff-eql-episodes-hjel80
  pull_request_number: 278
  track: long-term-memory
  depends_on:
  - episodes-recorded-through-ormatic
  status: in_progress
  session: https://claude.ai/code/session_01Kh8FEgYc4B7d1x3LXDZRvZ
  notes: >-
    The SQL backend is one of the paper's four: the same query language over recorded episodes returns domain objects, so the temporal bucket can be answered from long-term memory ("which pieces did you pick up in the last run", "how often did the square hole fail") and the Report of every experiment is computed from the database rather than from in-process results. Tests assert that a query over a recorded episode returns the same objects the runner wrote, and that a report regenerated from the database equals the one the runner rendered.
- id: episode-artifacts-recorded
  title: >-
    An episode keeps its video, its simulation data and its question-and-answer transcript beside the database
  branch: null
  pull_request_number: null
  track: long-term-memory
  depends_on:
  - episodes-recorded-through-ormatic
  - simulated-camera-feeds-perception
  status: not_started
  notes: >-
    The rows say what happened; these are what a reader - or a vision-language model - can look at, and without them Experiment D has no baseline to compare against. The video is the frames MujocoCamera already renders for MontessoriPerceptionBackend, written per episode rather than discarded; the simulation data is the run's own files, the world it built and the plan it realized; the transcript is every question with its answer, which the episode rows already carry per query, rendered as one readable document. Artifacts sit beside the database addressed by the episode's identifier, so a row references one rather than holding it - the separation ResultsDatabase already draws between where a run records and what it records. Its own item rather than folded into episodes-recorded-through-ormatic because it needs the simulated camera, and folding it would put lane 2's foot item behind lane 1's second. Tests record a two-trial episode and read its video, its files and its transcript back from
    the episode.
