schema_version: 1
id: icra-foundation
title: 'ICRA experiments: one pipeline every scenario runs on'
description: 'The foot of icra-experiments (split 2026-09-05 for the plan size budget -- see plan-size-limits''
  roadmap.md for why). One representation every subsystem reads and writes: the integrated simulation
  pipeline every scenario, demo and experiment stacks on, the dataclass scenario/goal/condition/perturbation/metric
  domain model with its runner, and every trial, robot plan, event, query, answer and failure recorded
  through ORMatic into SQL and read back as long-term memory.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: foundation
  name: One pipeline every scenario runs on
  description: The integrated simulation pipeline, the scenario domain model and the episode recording.
    Everything later stacks on these three, and all three can start today in parallel.
tracks:
- id: integration
  name: The integrated pipeline
  wave: foundation
  description: Lane 1. One branch carrying the perception stack, the monitor stack, the predicates and
    a simulated camera, on which the simulated demo runs the same pipeline the robot will.
- id: scenario-model
  name: Scenarios as data
  wave: foundation
  description: Lane 2. The dataclass domain model that describes a scenario, its goal, the knowledge conditions
    it runs under, the perturbations applied to it and the metrics it reports, plus the runner that executes
    it with logs and a report.
- id: long-term-memory
  name: Episodes recorded and queried
  wave: foundation
  description: Lane 2, and the programme's critical path since 2026-09-08. Every trial, robot plan, event,
    query, answer, failure and self-model recorded through ORMatic into SQL, in simulation and on the
    robot alike, generated at corpus scale headless, and read back through the SQL backend as long-term
    memory. Nothing in this track waits on the perception lane.
