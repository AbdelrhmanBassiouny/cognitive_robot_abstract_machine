- id: scenario-domain-model
  title: Scenarios, goals, conditions, perturbations and metrics as dataclasses, with a runner that reports
  branch: claude/icra-experiments-scenario-domain-n7zwpr
  pull_request_number: 261
  track: scenario-model
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Y2R5PzHHiVS7EvnAZ1J2yc
  notes: 'The meta level the developer asked for: a Scenario names how to build its world and which robot
    and execution kind (simulated or real) it runs on; a Goal names what counts as success; a Condition
    names one knowledge source switched on or off; a Perturbation names a change applied to the world
    at a step; a Metric names one number read off a finished Trial; a Report gathers metrics over trials
    with confidence intervals. A ScenarioRunner executes trials, writes structured logs and renders the
    report. Generalise what exists rather than adding a third shape: control_loop_experiments.scenarios
    already has BenchmarkScenario and ScenarioRunner, and experiment_definitions has ExperimentResult,
    ExperimentsTable and TypstRenderer; the new model subsumes both and the old ones migrate onto it.
    Concrete scenarios subclass or instantiate these, never re-describe them. Fully unit-tested against
    a trivial scenario that needs no simulator, so the model''s tests run everywhere.'
- id: montessori-scenarios
  title: The memo's scenes and scripted scenarios as Scenario instances that run in simulation
  branch: claude/plan-item-kickoff-icra-montessori-3roc2d
  pull_request_number: 296
  track: scenario-model
  session: https://claude.ai/code/session_018F9bAELX9ep3v2wioNfCNB
  depends_on:
  - scenario-domain-model
  - integrated-simulation-pipeline
  status: in_progress
  notes: 'Random layouts with all four pieces, partial scenes with two or three, near-ambiguous layouts
    with the cube and cylinder aligned in camera depth, a lighting change (a MujocoLight edit in simulation),
    and the four scripted temporal scenarios: static, robot pick-and-place, an external body pushing a
    piece while the robot is idle, and a piece in the gripper at query time. Each is a Scenario with a
    seeded layout so a run is reproducible, and each has a test that builds it headless and asserts its
    own precondition (the ambiguous layout really is aligned in depth, the in-gripper scenario really
    holds the piece).

    Three review rounds as of 2026-09-08, the third at db746a949. The runs are carried in MuJoCo, the
    robot is commanded by coraplex''s PickUpAction and PlaceAction under simulated_robot (giskard ticks
    the statechart, headless, with no ROS), and the goals read InsideOf against each hole''s landing region
    and robot_holds_body. The landing region is no longer stated: MontessoriWorld measures it as the free
    space the hole''s own footprint leaves down to the table, with a graph of convex sets over the board''s
    and drawers'' collision boxes, and ShapeSortingHole carries its own region so no name is spelled twice.
    43 tests in the module; test/experiments_test runs 386 passed.

    Fourth round 2026-09-08 at 429e335d4. A run can now be filmed while it is performed, with the repository''s
    own MujocoVideoRecorder: a SceneRecording films it in takes, since a simulation is compiled against
    one kinematic model and a grasp re-parents the piece, and SimulatedScene lets go of what carries it
    whenever the world''s model changes rather than each robot-commanding step remembering to. The film
    is made from the simulation carrying the run, so a filmed run leaves the piece exactly where an unfilmed
    one does. What no video can show is the carrying: while the robot holds the piece the world cannot
    be exported to MuJoCo at all, because ReAttachNode keeps the piece''s free connection under the gripper.
    PlaceAction gained the optional grasp_description the third round asked about, at the developer''s
    "do (1)". 48 tests in the module; test/experiments_test runs 391 passed.

    Two questions are open on the pull request, both the developer''s: whether InsideOf''s minimum_containment_ratio
    (which exists on #265, not on this base) should be ported here now and meet #265 as a conflict, and
    where the demo''s actuation should live -- everything that makes the tracy_icra demo work is about
    1,200 lines that exist on tracy_icra alone, and that demo deliberately does not use coraplex''s actions,
    so copying it here would duplicate work tracy_icra will merge. The Goal-as-Predicate thread from round
    one is also still open, asking whether that change belonged on #261.

    '
