- id: simulated-camera-feeds-perception
  title: A MuJoCo camera feeds every perception backend the same frames the real camera does
  branch: claude/simulated-camera-feeds-perception-iba2oa
  pull_request_number: 298
  track: integration
  session: https://claude.ai/code/session_01XCRk6JcVY6XenXusBf2ST4
  blockers: []
  depends_on:
  - integrated-simulation-pipeline
  status: in_progress
  notes: 'One frame source every perception backend reads, which is what lets the backends be swapped
    without changing anything above them. MujocoCamera renders colour and depth; wrap them as the RgbdFrame
    the pipeline reads, with intrinsics and camera pose taken from the twin, so the detector stack, a
    vision-language backend and a visual-question-answering backend all answer a look in simulation exactly
    as they do off a capture. The six real captures remain the regression set; this item''s tests assert
    that a simulated scene with the board and four pieces reports every piece once with the right category.
    Stated colours and finishes on the simulated objects come from the values #239 measured off the real
    ones. Refocused 2026-09-08: this item exists to make the frames available to any backend, not to improve
    detection - the paper claims no perception result of its own.

    Review round 2026-09-08: the developer''s answer to this item''s open question was "make them transparent
    regions and make it a toggelable thing", and that is now RegionAppearance on MultiSimBuilder - a region''s
    area drawn at a share of the opacity it states (the default everywhere a world is built or a region
    is spawned), or not drawn at all, with MujocoSim(region_appearance=...) the toggle and SimulatedCamera
    setting it to hidden. Taking the markers out of the picture uncovered more than it fixed: the cube
    that test_every_piece_the_world_places_on_the_table_is_found used to count stood at the board''s own
    square hole rather than at the piece, so that test was passing on an artefact and is now expected-to-fail
    beside the item''s criterion. Two things the twin would have to say for either to pass, both the developer''s
    and neither of them the frame: its pieces are 25 to 32 per cent smaller than the ones pieces.py measured
    off the real board (cube 22.4 mm against 30, cylinder 22.4 against 28, triangular prism 25.2 by 29.4
    against 37 by 32, rectangular prism 15.4 by 29.4 against 20 by 40), and its board''s holes are cut
    through an 80 mm blank whose walls render in the board''s own colour, so a look shows no opening for
    a board to be found by.

    Second review round 2026-09-08: "scale the objects to the known pieces, and remove the marker boarders,
    this should look like the real thing for the camera". The marker half needed nothing - SimulatedCamera
    already hides them, and the comment settles the first round''s open question about that default. The
    size half changed the world: a loose shape was built as a fixed 0.7 of the hole it drops through,
    and pieces.py already says the hole is the wrong source, so the size now comes from KnownPiece and
    only the cross-section from the hole - cube 30.0 mm, both cylinders 28.0, rectangular prism 21.0 by
    40.0, triangular prism 31.7 by 37.0, all 30.0 tall. One scale for both axes, because per-axis scaling
    squashes the triangle (the hole''s points along +x and the measured piece''s along +y) and building
    from KnownPiece.outline would put a piece in its own frame rather than its hole''s, which is what
    lets it be released unrotated. Reported and not settled: clearance goes from 0.70 everywhere to 0.70-0.95,
    tightest on the rectangular prism, and the 0.7 it replaces was tuned against insertion pass rates,
    so a sorting run is what would confirm it and no session container can run one.

    What that uncovered is the item''s third bug for someone else: with the pieces at their measured sizes
    both detectors read all four within a millimetre of where the twin put them, each with its own category,
    and then Occupancy drops both readings of every place they agree on too closely - cube 0.7121 against
    0.7121, rectangular prism 0.6596 against 0.6596, triangular prism 0.7480 against 0.7433, all inside
    CompetingExplanations.required_lead - so only the cylinder is reported. The same two detectors disagree
    enough on tracy_pickup_demo for all four to come back once each, so a noiseless picture is what shows
    it, which is one of the things a simulated frame source is for. It belongs in occupancy.py on its
    own branch. Both marks stay strict and name it.

    CI: the experiments job now exports MUJOCO_GL=egl, which is what the gladLoadGL failures were. MuJoCo
    fixes its backend when Python imports it, so select_offscreen_rendering_backend() cannot reach either
    of its callers - main''s own shape, inherited when the four lines left MujocoVideoRecorder.start -
    and only the environment a run starts from can choose it. The job''s other failures were the base''s
    duplicate RecordedLook, which this branch takes the base''s merge of.

    Third review round 2026-09-08: "you can generate a depth image in mujoco right? ... which gets you
    the holes using depth" and, of the arbitration, "we need to find a solution for this issue". Both
    marks are off and the item''s own criterion passes - all four pieces reported once each with their
    own categories, within a millimetre of where the twin put them, and the board found with its six holes.
    The depth had been rendered since the first commit and nothing read it: RgbdFrame.measured_height,
    Orthophoto.measured_height and Orthophoto.opening_mask are new, and BoardDetector reads its openings
    from darkness or from depth, each sized on its own before the two are put together - Otsu splits a
    surface in two whether or not anything is cut through it, and a plane stated above the surface actually
    lying in it is measured below along the whole of that surface, so either left whole swallows what
    the other found. A hole is ten millimetres deep rather than the eighty the second round''s note claimed:
    the mesh is cut clean through, but the drawers stand directly under the lid, so a look down a hole
    measures a drawer. The seed was already right (-0.401, 0.001 against the twin''s -0.400, 0.000) and
    the fit was not, turning the layout ten degrees off, so the rim of an opening the colours do not carry
    is now an edge as well (EdgeDistances.of(..., together_with=...)); that lands every hole on the hole
    of its own category, worst 5.4 mm and median 1.2 mm. The captures cannot change and it is measured
    rather than argued: their depth contributes zero hole-sized openings on all six, and their suite runs
    57 passed and 4 xfailed as before.

    Occupancy carried two defects, and the second is the larger. keep_one_detection_per_place dropped
    both readings of a place unless one led, so two ways of looking that agree annihilated; only a reading
    that names something else can take a place from its holder now. Underneath it, OccupiedVolume.shared_area
    measured in metres, and OpenCV''s convex intersection answers zero once the step from one outline
    point to the next falls below about four thousandths of a unit - so two readings of one cylinder a
    millimetre apart, whose rectified outline is a 64-gon of 14 mm radius, were measured to share no ground
    at all and both were reported. Squares of 40 mm sides were never affected, which is why every test
    in test_montessori_occupancy.py passed. The outlines are intersected in millimetres now. One existing
    test stated the rule the developer asked to change and is restated rather than deleted: its two readings
    were both cubes and are now a cube and a cylinder, since disagreement is the case it means.

    Reported and not acted on: the shipped captures'' own depth puts the board''s top surface at 0.879
    where recorded_setup states its lid at 0.960, and a piece resting on the lid measures the same height
    as a piece on the table, so either those stated planes or the captures'' depth extrinsics are wrong.
    Moving a stated plane moves every rectification in the package, so it is the developer''s call rather
    than this branch''s.


    Fourth review round resolved 2026-09-09, by a decision rather than a push: the branch is finished
    and

    merges into #265 as it stands. CI is green on 15dfd354cd (23 of 23), mergeable_state is clean, the

    item''s own criterion passes and both expected-to-fail marks came off in the third round, so nothing

    in the two threads that stalled it was a defect in this branch. What they asked for -- BoardDetector''s

    five stated defaults derived from the board the twin holds, holes and perforated surfaces raised to

    predicates, a capability naming fields of classes as EQL Attributes or MappedVariables, a description

    filled out from the model and handed to the backend to choose detectors from -- is icra-mechanism''s,

    and is tracked there as the new item holes-answered-as-predicates plus an amendment to

    backends-declare-their-capabilities. The size of that ask was cut by more than half by checking the

    merged tree first: PerceptionDetector.capability, the EQLSingleClassRDR DetectorChoice and

    SceneRequest already exist here through #275 and #77, so the architecture the round describes is the

    one this stack already chose.'
