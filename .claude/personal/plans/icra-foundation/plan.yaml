- id: episodes-recorded-through-ormatic
  title: Every trial, event, query, answer and failure recorded through ORMatic into SQL
  branch: claude/icra-experiments-ormatic-episodes-ib9lr3
  pull_request_number: 271
  track: long-term-memory
  depends_on:
  - scenario-domain-model
  - run-results-recorded-into-sql
  status: in_progress
  session: https://claude.ai/code/session_012ouWhruGFvn9D5AvPmQNRa
  notes: 'One Episode model for simulation and the robot: the scenario and condition it ran under, its
    trials, the segmind events seen per tick, every query asked with its per-predicate backend assignment,
    answer and latency, every insertion attempt with its outcome, the failure type observed and predicted,
    and what was done after a failure - retried, changed or abandoned. That last is what answers "how
    did you resolve this the last time it happened"; nothing else in the record carries it, and it was
    added on 2026-09-04 when Experiment D was planned. Recorded through ORMatic the way ShapeInsertionExperience
    and SortingIterationResult already are, and replacing both with the one model rather than standing
    beside them; ResultsDatabase and results_recording keep deciding where and whether a run records.
    The runner records as it goes, so a run that dies keeps its finished trials, following batch_runner''s
    reasoning. Tests record a trivial episode into SQLite and read it back through the generated interface.

    Amended 2026-09-08, and it is smaller than it first looked. A separate item was written for recording
    the robot''s kinematic structure and the constraints its motion ran under, and then folded here on
    the same day: the classes are already mapped, and what is missing is two references on this model,
    which is a file no other branch has. ORMatic maps the whole semantic_digital_twin package apart from
    ten ignored classes - none of them World, Body, Connection or DegreeOfFreedom - and the whole giskardpy
    package apart from its solvers, so MotionStatechart, its tasks and monitors and the terminal EndMotion/CancelMotion
    nodes are mapped too. The dependency chain already reaches both: experiments declares coraplex, coraplex
    declares giskardpy, giskardpy declares semantic_digital_twin. So the self-model and control buckets
    need no new mapping at all, and their working-memory spelling needs nothing whatever, since the live
    twin already holds the structure.

    What this model does not do is reference either. Episode carries the scenario name, execution type,
    condition and perturbation names, an identifier and a timestamp; InsertionAttempt carries the realized
    coraplex Plan, which is the robot plan and is already enough. Neither the world an episode ran in
    nor the motion statechart a trial ran is referenced anywhere, so "how many joints did you have", "what
    were you constrained by" and "why did you stop" have no long-term-memory spelling. The addition is
    a world reference on Episode and a statechart reference on the trial or the insertion attempt, plus
    the terminating node, with a test that reads the link and joint counts and the active constraints
    back.

    One sizing decision is the developer''s and is not taken here: whether each episode stores a world
    of its own or references one shared robot model. A full World per episode is honest and answers a
    question about a run whose robot differed; at the corpus scale episode-corpus-generated-at-scale targets
    it may be disproportionate, and a shared reference is the alternative.

    Updated 2026-09-08 from icra-evidence''s `question-set-and-ground-truth` (#295): the fold this item''s
    roadmap recorded on 2026-09-08 has now been made on the branch. `a96531635` adds `Episode.world` and
    `RecordedTrial.motion_statechart`, both optional and defaulting to none, with three round-trip tests.
    Whether a corpus keeps a world per episode or shares one is unchanged as the developer''s open call
    - the field allows both.

    '
- id: episodes-queried-by-eql
  title: Long-term memory answered by EQL through the SQL backend, and reports read from it
  branch: claude/plan-item-kickoff-eql-episodes-hjel80
  pull_request_number: 278
  track: long-term-memory
  depends_on:
  - episodes-recorded-through-ormatic
  status: in_progress
  session: https://claude.ai/code/session_01Kh8FEgYc4B7d1x3LXDZRvZ
  notes: 'The SQL backend is one backend among several answering the one query language, and long-term
    memory is where the paper''s Remembering level is measured. Every bucket of the question set has a
    spelling over recorded episodes, not only the temporal one: what stood where and on which surface
    in an earlier episode, which pieces the robot picked up, how many joints the robot had in that episode''s
    own self-model, what the motion was constrained by when an insertion failed, and how often the square
    hole failed. Domain objects come back, not rows. The Report of every experiment is computed from the
    database rather than from in-process results. Tests assert that a query over a recorded episode returns
    the same objects the runner wrote, and that a report regenerated from the database equals the one
    the runner rendered. Widened from the temporal bucket alone on 2026-09-08 with the question set''s
    own widening.'
- id: episode-artifacts-recorded
  title: An episode keeps its video, its simulation data and its question-and-answer transcript beside
    the database
  branch: claude/icra-foundation-episode-artifacts-nki2is
  pull_request_number: 294
  track: long-term-memory
  depends_on:
  - episodes-recorded-through-ormatic
  status: in_progress
  session: https://claude.ai/code/session_01NxGbkj8mzF2Vu5Bvyiksab
  notes: 'The rows say what happened; these are what a reader - or a vision-language model - can look
    at, and without them Experiment D has no baseline to compare against. The video is written by semantic_digital_twin.adapters.mujoco_video_recording.MujocoVideoRecorder,
    which is already on main and renders from an overview camera it attaches itself; the simulation data
    is the run''s own files, the world it built and the plan it realized; the transcript is every question
    with its answer, which the episode rows already carry per query, rendered as one readable document.
    Artifacts sit beside the database addressed by the episode''s identifier, so a row references one
    rather than holding it - the separation ResultsDatabase already draws between where a run records
    and what it records. Tests record a two-trial episode and read its video, its files and its transcript
    back from the episode.

    Its dependency on simulated-camera-feeds-perception was removed 2026-09-08: the recorder needs a MuJoCo
    world, not the perception pipeline''s frames, so this item and everything downstream of it - the corpus,
    the cross-episode question set, Experiment D - run without the perception lane having landed. That
    is the single edge whose removal lets long-term memory be worked in parallel by one person from the
    day the episode model exists.'
- id: episode-corpus-generated-at-scale
  title: Thousands of episodes generated headless in MuJoCo, each with its video, its plan and its event
    log in SQL
  branch: null
  pull_request_number: null
  track: long-term-memory
  depends_on:
  - episodes-recorded-through-ormatic
  - episode-artifacts-recorded
  status: not_started
  notes: 'What makes long-term memory a corpus rather than a schema, and the item one person can carry
    alone from the day the episode model lands. A headless generator runs the scenarios repeatedly over
    seeded randomised layouts, conditions and perturbations, and records per episode: the realized coraplex
    Plan, the segmind event log tick by tick, the twin''s state, every query with its answer and latency,
    the typed failure and its resolution, and the video MujocoVideoRecorder rendered. Batched the way
    batch_runner already batches so the process''s memory growth cannot lose a finished episode, and resumable,
    so a run that dies is continued rather than restarted. The target is thousands of episodes rather
    than dozens, because Experiment D''s questions are about repeats, and a corpus that holds each situation
    once cannot be asked whether something has happened before. How many is set by what the generator
    sustains overnight and is recorded rather than chosen in advance. Tests generate a small corpus and
    assert every episode holds all six records.'
