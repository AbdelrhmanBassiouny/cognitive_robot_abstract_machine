- id: episode-corpus-generated-at-scale
  title: Thousands of episodes generated headless in MuJoCo, each with its video, its plan
    and its event log in SQL
  branch: null
  pull_request_number: null
  track: long-term-memory
  depends_on: []
  status: not_started
  notes: 'What makes long-term memory a corpus rather than a schema, and the item one person
    can carry alone from the day the episode model lands. A headless generator runs the scenarios
    repeatedly over seeded randomised layouts, conditions and perturbations, and records per
    episode: the realized coraplex Plan, the segmind event log tick by tick, the twin''s state,
