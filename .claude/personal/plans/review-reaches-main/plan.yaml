schema_version: 1
id: review-reaches-main
title: Getting a review back to main
description: 'The pull request queue has 148 open entries whose median distance from main
  is 124 commits, and #265 -- an integration branch that will never merge -- is the base of
  three pull requests and a nineteen-deep chain. The cause is not #265: four plans each stack
  over the same files and none of them owned the join. #265 was that join, made off-review;
  the perception join is now knowledge-directed-requests'' perception-join. This plan owns
  the landing order, the orphaned work stranded with #265, and the rule that stops it recurring.
  It does not re-cut work that is already tracked elsewhere.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 426
waves:
- id: front-line
  name: Land what is already reviewable
  description: 'Thirty-six pull requests are based directly on main, several within ten commits
    of it. Every one that lands shortens every chain above it, so this is the only work with
    compounding returns and it comes first.

    '
- id: joins
  name: The joins nobody owns
  description: 'Where two unlanded lineages have to meet, or where a branch has diverged from
    main rather than from another branch. Each collision gets one pull request whose single
    job is to settle it.

    '
- id: orphans
  name: Work stranded with the integration branch
  description: 'The closed sub-pull-requests, the commits that reached no pull request, and
    the queue hygiene that makes the remainder readable.

    '
tracks:
- id: landing
  name: Driving the front line to main
  wave: front-line
- id: collisions
  name: Branches that diverged from main
  wave: joins
- id: perception-join
  name: Joining the perception lineages
  wave: joins
- id: orphan-recovery
  name: Recovering the stranded work
  wave: orphans
- id: prevention
  name: Stopping it recurring
  wave: orphans
items:
- id: front-line-landed
  title: Drive the thirty-six pull requests based on main to landing, shallowest first
  branch: null
  pull_request_number: null
  track: landing
  depends_on: []
  status: not_started
  notes: 'Measured 2026-09-19: of 148 open pull requests, 119 already bottom out on main and
    36 are based on it directly -- #408 at +1 commit, #409 and #405 at +2, #365 at +6, #367/#371/#372/#362
    at +10, #357 at +11. This item is not one pull request: it is the decision to spend review
    capacity here before anywhere else, and to re-measure chain depth after each landing.
    Most of these belong to other plans, so this item tracks the ordering, not the work.'
- id: orphan-subprs-triaged
  title: Triage the thirty-one closed sub-pull-requests nothing tracks
  branch: null
  pull_request_number: null
  track: orphan-recovery
  depends_on: []
  status: not_started
  notes: 'Thirty-six pull requests were merged into #265 and closed; only five are tracked
    plan items (#298, #301, #303, #304, #311). A merged pull request cannot be reopened, so
    the assets are the branches, which still exist, and the descriptions, which are good --
    #344''s is a full problem/fix/tests writeup with the production stack trace. Per orphan:
    harvest the description, decide re-cut or drop, record the branch SHA.'
- id: dead-weight-closed
  title: Close what the recovery supersedes, naming the replacement
  branch: null
  pull_request_number: null
  track: orphan-recovery
  depends_on:
  - knowledge-directed-requests/perception-join
  status: not_started
  notes: 'Twenty-seven open pull requests bottom out on a #265-family branch and cannot be
    reviewed as they stand. Closing each with the replacement named and the branch SHA recorded
    is the cheapest item here and the one that makes the queue readable, which is the precondition
    for review being fast at all. The Tracy demo''s replacement is icra-upstream''s tracy-lab-and-demos.'
- id: base-rule
  title: Write down that a pull request is based on main or on an approved pull request
  branch: null
  pull_request_number: null
  track: prevention
  depends_on: []
  status: not_started
  notes: 'The rule whose absence produced #265: a pull request may only be based on main or
    on a pull request that has been approved; to build on unapproved work you merge the dependency
    into your branch and say so in the description. That forces every convergence decision
    to happen at write time, in one pull request, in front of a reviewer, instead of silently
    at integration time on a branch that then cannot merge. Belongs in AGENTS.md, so it is
    a reviewed change rather than a personal note.'
