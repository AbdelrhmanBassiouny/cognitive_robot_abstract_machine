schema_version: 1
id: general-video-production
title: General video production for experiments
description: Pull the reusable video-making machinery out of the ICRA 2027 supplementary video
  (#429) into a general package on main that any experiment can use to render narrated, subtitled
  videos from its own scenes, then rebuild the ICRA video on top of it.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 471
waves:
- id: wave-1
  name: 'Wave 1: General package on main'
  description: A usable video package on main, proven by rendering a minimal video in its
    tests.
- id: wave-2
  name: 'Wave 2: Built on the package'
  description: The ICRA video keeps only its own scenes and imports the rest; animated explainer
    scenes (Naren's Manim reference) join the package as a second kind of scene.
- id: wave-3
  name: 'Wave 3: Figure close-ups for everyone'
  description: The typst-figure scenes made general.
tracks:
- id: video-package
  name: Video package
  wave: wave-1
- id: icra-video
  name: ICRA video
  wave: wave-2
- id: figure-scenes
  name: Figure scenes
  wave: wave-3
- id: explainer-animation
  name: Explainer animation
  wave: wave-2
items:
- id: video-core
  title: A general video package on main that renders a minimal narrated video end to end
  branch: claude/pensive-albattani-2j50zr
  pull_request_number: 472
  track: video-package
  status: in_progress
  session: https://claude.ai/code/session_01HQ4cooKAuKSVwcZpKfsCUc
  blockers:
    - >-
      Upstream cram2#742: changes requested by tomsch420 (2026-10-13), answered in ee1e7bdad;
      re-review pending. Still open there: how a timeline scene is modelled ("a part or a view of
      the Timeline").
  depends_on: []
  notes: >
    #472, promoted upstream as cram2#742 and labelled in-review: the workspace package crollywood
    (renamed from cramcorder at the upstream reviewer's request), narrated, subtitled videos of
    anything. TimelineScene is the Role[Video] a video plays in a VideoTimeline; units live in
    krrood.units (Quantity[T]).

    Upstream round 1 answered in ee1e7bdad (renames, SoundChannel, crollywood.submission, StrEnums,
    NDArray). Waiting on tomsch420 to re-review upstream, and on the user for the fork's 12 open
    threads.
- id: icra-video-on-core
  title: '#429 rebuilt on the general package, keeping only the ICRA scenes'
  branch: claude/the-icra-video-shows-the-plan-being-answered
  pull_request_number: 429
  track: icra-video
  status: not started
  depends_on:
  - video-core
  notes: >
    #429 imports crollywood (renamed from cramcorder) and must follow its API changes listed on #471
    (the latest: the renames of ee1e7bdad, SubmissionLimits in crollywood.submission with
    video.check_within, and a ResultsTable subclass of TabularDataSlide in an experiments video
    module). #429 is based on real-experiments-tracy-icra-2026, so the package must reach that
    branch first (merge main into it once video-core lands). The ICRA branch keeps sources,
    perception, twin, grasp, rules, attribution, perturbations, long_term, script, icra_video, the
    framework.typ changes, backend inks, TABLE_FRAMING and the icra_2027 limits.
- id: figure-stages-general
  title: Typst-figure close-ups (magnify, pointer, answering) made general
  branch: claude/general-figure-scenes
  track: figure-scenes
  status: not started
  depends_on:
  - icra-video-on-core
  notes: stages.py and figure.py behind a figure abstraction, so other experiments grow close-ups
    from their own figures.
- id: manim-scenes
  title: Animated explainer scenes drawn with Manim, narrated and timed by the package
  branch: claude/video-manim-scenes
  track: explainer-animation
  status: not started
  depends_on:
  - video-core
  notes: >
    Stacked on #472. An AnimatedScene in crollywood.animation (its own optional extra, since Manim
    needs cairo and pango) turns a Manim scene into a TimelineScene's video: the storyboard hands it
    each NarratedLine's spoken length (replacing timing.json), one beat per line (the beats-used
    check becomes an exception), no sound or captions of its own, rendered to PNG frames or a
    lossless clip and read back so the picture is compressed once.
