schema_version: 1
id: general-video-production
title: General video production for experiments
description: Pull the reusable video-making machinery out of the ICRA 2027 supplementary video
  (#429) into a general package on main that any experiment can use to render narrated, subtitled
  videos from its own scenes, then rebuild the ICRA video on top of it.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 471
waves:
- id: wave-1
  name: 'Wave 1: General package on main'
  description: A usable video package on main, proven by rendering a minimal video in its
    tests.
- id: wave-2
  name: 'Wave 2: Built on the package'
  description: The ICRA video keeps only its own scenes and imports the rest; animated explainer
    scenes (Naren's Manim reference) join the package as a second kind of scene.
- id: wave-3
  name: 'Wave 3: Figure close-ups for everyone'
  description: The typst-figure scenes made general.
tracks:
- id: video-package
  name: Video package
  wave: wave-1
- id: icra-video
  name: ICRA video
  wave: wave-2
- id: figure-scenes
  name: Figure scenes
  wave: wave-3
- id: explainer-animation
  name: Explainer animation
  wave: wave-2
items:
- id: krrollywood-on-krrimage
  title: krrollywood (cram2/crollywood) depends on krrimage instead of its own frame types
  repository: cram2/crollywood
  track: video-package
  status: not_started
  depends_on:
  - domain-models/krrimage
  notes: '#472 (cram2#742) will not be merged: crollywood becomes its own repository, cram2/crollywood,
    renamed krrollywood, on krrimage instead of its own frame types (moved to krrimage in
    #524).'
  branch: claude/krrollywood-on-krrimage
- id: icra-video-on-core
  title: '#429 rebuilt on the general package, keeping only the ICRA scenes'
  branch: claude/the-icra-video-shows-the-plan-being-answered
  pull_request_number: 429
  track: icra-video
  status: not_started
  depends_on:
  - krrollywood-on-krrimage
  notes: '#429 imports krrollywood and must follow its API changes listed on #471 (latest:
    ee1e7bdad''s renames, and an experiments/video module restoring SubmissionLimits and VideoOutsideTheLimits
    as a VideoProduction subclass, with a ResultsTable slide). #429 is based on real-experiments-tracy-icra-2026,
    so the package must reach that branch first (merge main into it once krrollywood-on-krrimage
    lands). The ICRA branch keeps sources, perception, twin, grasp, rules, attribution, perturbations,
    long_term, script, icra_video, the framework.typ changes, backend inks, TABLE_FRAMING
    and the icra_2027 limits.'
- id: figure-stages-general
  title: Typst-figure close-ups (magnify, pointer, answering) made general
  branch: claude/general-figure-scenes
  track: figure-scenes
  status: not_started
  depends_on:
  - icra-video-on-core
  notes: stages.py and figure.py behind a figure abstraction, so other experiments grow close-ups
    from their own figures.
- id: manim-scenes
  title: Animated explainer scenes drawn with Manim, narrated and timed by the package
  branch: claude/video-manim-scenes
  track: explainer-animation
  status: not_started
  depends_on:
  - krrollywood-on-krrimage
  notes: 'An AnimatedScene in crollywood.animation (its own optional extra, since Manim needs
    cairo and pango) turns a Manim scene into a TimelineScene''s video: the storyboard hands
    it each NarratedLine''s spoken length (replacing timing.json), one beat per line (the
    beats-used check becomes an exception), no sound or captions of its own, rendered to PNG
    frames or a lossless clip and read back so the picture is compressed once.

    Targets the krrollywood repository instead of #472.'
