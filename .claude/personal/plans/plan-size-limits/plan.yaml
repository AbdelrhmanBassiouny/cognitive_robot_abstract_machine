  - size-budget-and-report
  status: in progress
  session: https://claude.ai/code/session_01XWy1uT1i7FozWdNhLEtcKk
  notes: 'save-plan.sh gains the gate, with a typed error naming which half of the budget
    was blown and by how much. The natural seam is alongside the existing `plan_manifest_tools.py
