- id: new-plan-when-full
  title: Open a new plan instead of growing a full one
  branch: claude/plan-size-limits-newplan-ukbbri
  pull_request_number: 277
  track: gate-and-skills
  depends_on:
  - size-budget-and-report
  status: in progress
  session: https://claude.ai/code/session_01GhTbjxmunfCd5vuXRid6m9
  notes: '/plan-create and /add-plan-item read the budget and route new work to a new plan
    when the plan they would otherwise grow is at it. Only needs the budget to exist, not
    the splits, so it can land ahead of wave 2. This item is the reason the plan exists: without
    it the budget is a wall with no door.'
- id: minimal-roadmap-writing
  title: Write roadmap sections against the budget, not against completeness
  branch: claude/plan-size-limits-minimal-roadmap-n3qz8f
  pull_request_number: 279
  track: gate-and-skills
  depends_on:
  - size-budget-and-report
  status: in progress
  session: https://claude.ai/code/session_01CqcnoLDrWd3RHWepDqDsWz
  notes: 'plan-create/SKILL.md currently instructs the opposite - "preserve its detail rather
    than compressing it away" - and plan-item-kickoff and plan-item-resolve append unbounded
    narrative through record''s --roadmap-section. Both change so the budget is not re-spent
    within weeks of a split. Measured evidence that per-item discipline cannot catch this:
    during the session that created this plan, workflow-unification grew 51 manifest and 103
    roadmap lines while gaining zero items.'
