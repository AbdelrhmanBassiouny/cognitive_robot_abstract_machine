- id: strict-limits-and-item-slices
  title: Typed per-field limits enforced on every save, and one item loaded per session
  branch: claude/happy-wozniak-nizfnv
  pull_request_number: 504
  track: gate-and-skills
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Xxsd3jwKjjEsHdyyfC8Azo
  notes: 'Stacked on #501 (base claude/brave-archimedes-nonocl); modules under basstler/src/basstler/,
