schema_version: 1
id: rdr-explanation
title: Why-questions on RDR conclusions, and the Montessori demo that narrates them
description: 'Explaining a conclusion the engine reached: the WhyQuestion/WhyAnswer value objects and
  the engine''s why() surface, the causal ''because'' vocabulary that verbalizes them, the why(...) query
  factory, the backend explanation semantics behind decision queries, rendering an explanation for whoever
  is receiving it, and the shape-sorting demo that narrates its own choices.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 94
waves:
- id: why
  name: Why-questions and their verbalization
  description: 'Sequential: the answer object, then the causal grammar, then the query surface and the
    decision-query semantics in parallel.'
- id: demo
  name: The Montessori demo
  description: Deferred until the external montessori_ijcai branch it builds on is ready.
tracks:
- id: why-answers
  name: Why-answers and causal verbalization
  wave: why
  description: From a fired conclusion to a sentence explaining it.
- id: audience-rendering
  name: Rendering by recipient
  wave: why
  description: Natural language for a human, the EQL expression itself for a program.
- id: montessori-demo
  name: Shape-sorting demo
  wave: demo
  description: Policy RDRs as decision queries, and a narrated demo loop.
