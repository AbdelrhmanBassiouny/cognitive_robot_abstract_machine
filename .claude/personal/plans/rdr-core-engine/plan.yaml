- id: d-core-expert
  title: 'RDR engine: Expert policy split'
  branch: D-core-expert
  pull_request_number: 98
  track: engine-stack
  depends_on:
  - D-core-support
  status: in_progress
  session: https://claude.ai/code/session_01Gid5Qw9cbedssFEqojo1SK
  notes: 'The Expert policy split, and the parameter-object work handed to it from the single-class
    plan. What it establishes for everything above: `ExpertInterface` carries only the expert
    Q&A surface, while the RDR holds a `ModelSaver` (in `serialization.py`, beside `save_rdr_with_case`)
    and a `ProgressReporter` as its own collaborators with Null-Object defaults — which deletes
    the engine''s `expert.interface.on_save` reach-through.'
- id: d-core-single-class
  title: 'RDR engine: EQLSingleClassRDR core inference engine'
  branch: D-core-single-class
  pull_request_number: 159
  track: engine-stack
  depends_on:
  - d-core-expert
  status: in_progress
  session: https://claude.ai/code/session_012Fy3CmMRRy1m5DtzVUhP2X
  notes: 'The `EQLSingleClassRDR` inference engine, ported from the superseded mega-slice.
    What it settled: a fit saves once on its way out through a `finally`, not once per inserted
    rule, so a crash keeps the rules it authored — and an empty tree is deliberately not saved,
    because saving unconditionally let `EmptyRuleTreeError` replace the exception the caller
    needed to see. `TemporaryModelSaver` is the default.'
- id: d-core-backend
  title: 'RDR engine: underspecified-query RDR backend'
  branch: D-core-backend
  pull_request_number: 210
  track: engine-stack
  depends_on:
  - d-core-single-class
  status: in_progress
  session: https://claude.ai/code/session_01JxHGiL16bUxxHg6B3qRSaL
  blockers:
  - The GroundTruth thread on backend.py:39 waits on the owner's pick of its three options
    (keep the alias, wrap it in a frozen dataclass, or make the alias generic). No dataclass
    in entity_query_language/rdr/ expresses a per-case ground-truth supplier.
  - 'CI on 61f78fa6 not checked: krrood and semantic_digital_twin were still running at the
    2026-11-10 resolve. That restack brought main''s pytest-rerunfailures down, the remedy
    for flaky test_world_sim_state_sync. Zoo-dataset tests not run locally.'
  notes: The underspecified-query RDR backend, and the stack tip. `RDRBackend` inherits `QueryBackend`,
    whose whole ABC is `evaluate(expression)`; neither concrete base fits, since `SelectiveBackend`
    raises on exactly the ellipsis matches this backend exists for and `GenerativeBackend`
    constructs new instances where this completes an attribute on existing ones, but neither
    of those reaches `QueryBackend` itself.
