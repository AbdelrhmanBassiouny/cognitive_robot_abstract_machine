  status: in_progress
  notes: 'The rule-tree unparser, plus the `type_hints.py` to `object_to_source.py` rename its own review
    asked for. Restacked and cascaded. One finding worth keeping: the rename''s claim to update every
    importer was narrower than stated, and CI caught `template_file_creator.py` importing the deleted
    module — a file neither side''s diff touched, so git''s merge never flagged it. That is the failure
    mode this stack has now hit three times. 2026-08-30: the generated module''s header changed here (`bb01256df`),
    because this slice owns `templates/rdr_module.py.jinja`.'
