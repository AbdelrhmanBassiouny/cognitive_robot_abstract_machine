- id: rdr-backward-inference
  title: 'RDR engine: backward inference + condition resolvers'
  branch: rdr-backward-inference
  pull_request_number: 41
  track: engine-stack
  depends_on:
  - ripple-down-rules-refactor
  status: done
  session: https://claude.ai/code/session_012xQWiZExn9frHtbfm44eR1
  notes: 'Merged 2026-08-10 as the stack bottom. Four things it settled bind later work. `GuardCondition.negated`
    stays a polarity flag rather than a `Not()` wrapper, because `not_()` reparents a live rule-tree node;
    revisit once dag-facade-hardening (#96) lands a non-mutating negation, since `Not()`-wrapping is cleaner
    at four of six use sites. `rdr/branch_semantics.py` holds per-selector traversal semantics as a `SubClassSafeGeneric`
    family, kept at the developer''s call over this plan''s own recommendation to collapse it onto the
    selector classes; that thread is theirs to close. `rdr/utils.py` is deleted and `...` replaces `UNSET`,
    on the reading that the sentinel means an oracle must supply this value, which is what `CountRange`
    already reads it as. `rdr/exceptions.py` first exists here.


    Two threads are open by design: `query_graph.pdf` is half-answered, since untracking the generated
    PDFs is a main-level fix nobody has taken; and `parameterizer.py:167` raises `InvalidEllipsis` for
    a conclusion whose type is outside random_events'' compatible types, whose reachability is filed on
    no-rule-fired-resolution.'
- id: backward-inference-rename-completion
