schema_version: 1
id: rdr-core-engine
title: The EQL-native RDR core engine, landed as a split-PR stack
description: 'The rdr/ package itself, delivered bottom-up as a stack of topic-oriented pull requests:
  backward inference and condition resolvers, the conclusion helpers, the underspecified adapter, corner-case
  provenance, the rule-tree unparser, the observer and rule-tree view, the Expert policy split, the single-class
  inference engine and the underspecified-query backend, plus the runtime behaviour left open when no
  rule fires.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 94
waves:
- id: stack
  name: The split-PR stack
  description: One linear chain from ripple-down-rules-refactor to the backend tip, merged bottom-up with
    a cascade after each landing.
- id: runtime
  name: Engine runtime behaviour
  description: Behaviour the stack deliberately left interim.
tracks:
- id: engine-stack
  name: The stack, bottom-up
  wave: stack
  description: Each slice carries one topic of the rdr/ package and its tests.
- id: superseded-slices
  name: Superseded slices
  wave: stack
  description: The umbrella and the mega-slice the three-way split replaced; kept as branches, not as
    bases anything can land through.
- id: engine-runtime
  name: No-rule-fired handling and provenance
  wave: runtime
  description: Warn, ask an expert or use a default conclusion, and record which of the three a conclusion
    came from.
