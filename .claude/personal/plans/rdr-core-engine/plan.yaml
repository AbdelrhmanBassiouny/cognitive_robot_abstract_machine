  session: https://claude.ai/code/session_01LeZ4Mkr4tfdKjvEcJrz32C
  notes: 'Off main, like #89: #41''s cascade renamed four things and left readers of the old names behind,
    which AGENTS.md counts as an unfinished rename. Opened 2026-08-13 covering two of them (ConclusionKnowledge,
    what_do_we_know_about, 5 readers); widened 2026-08-22 after the #63 review surfaced the other two
    (TargetKnowledgeResolver -> TargetSufficientConditionsBasedResolver, renamed on main in ed7b3766,
    and _materialize -> GuardCondition.as_expression). The undercount is the lesson: the missed readers
    were found by grepping main, not by reading the diff, and two sit in production source where no review
    of a test-only diff could see them. Scope settled 2026-08-22: keeps backward_inference.py''s and condition_resolver.py''s
    docstrings plus test_backward_inference.py''s test name; test_condition_resolver.py went to #63 at
    the developer''s direction, so no file is touched by both. Was untracked in any plan until 2026-08-22
    - the developer caught that on #63.'
- id: D-core-aid
  title: 'RDR engine: ConclusionAid (expert-labelling assistance)'
  branch: D-core-aid
  pull_request_number: 63
  track: engine-stack
  depends_on:
  - rdr-backward-inference
  status: done
  session: https://claude.ai/code/session_01FAzdUMtdoASWUESoTsfDD6
  notes: 'Merged, and promoted upstream as cram2 #557. The upstream review settled this item''s substance:
    `aid.py` became `conclusion_helper.py`, and `ConclusionAid` split into a `ConclusionHelper` base plus
    `ConclusionSupportPresenter.present()` and `ConclusionSuggester.suggest()` mixins that a helper opts
    into. Dropping the two no-op defaults is the substance rather than the rename: a consumer now selects
    the helpers that suggest instead of assuming every helper answers both hooks.


    The consumers on #67, #98 and #159 were renamed in the same round rather than left to the cascade,
    because a merge of this rename into a branch whose imports still say `aid` produces no conflict at
    all and fails at import instead. LucaKro''s separate review, that the class is used nowhere but the
    tests, is unanswered and the developer''s; the fact that answers it is that `present()` has no production
    call site anywhere in the stack while `suggest()` has one.'
