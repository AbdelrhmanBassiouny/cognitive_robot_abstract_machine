- id: no-rule-fired-resolution
  title: 'No-rule-fired handling: warn / ask-expert / default-conclusion modes + provenance'
  branch: null
  pull_request_number: null
  track: engine-runtime
  depends_on:
  - d-core-single-class
  status: blocked
  blockers:
  - Blocked until the Wave-0 engine stack lands on main.
  notes: 'Beyond interim classify->UNSET. Conclusion provenance coordinates with Wave-3 JTMS (rdr-justifications).
    2026-08-09: the sentinel itself is being unified with ... (Ellipsis) -- see rdr-backward-inference
    and roadmap Sec.17 -- so this item now inherits "no conclusion" being spelled the same way as "generate
    one". Two consequences it owns. (1) Expert delegation: once ... is the sentinel, an expert typing
    `conclusion = ...` in the shell is asking the generative backend to supply the value, but make_conclusion_validator
    (rdr/expert.py:94) currently rejects that as "No rule fired for this case" unless allow_unset. Routing
    it to a backend instead is a capability the engine does not have, and it belongs here rather than
    on any D-core slice. (2) The parameterizer narrowing: parameterizer.py:167 raises InvalidEllipsis
    outside random_events compatible_types, so a non-enumerable conclusion (str/arbitrary class) left
    unclassified may be unrepresentable as ... -- if reachable, the no-rule-fired modes are where the
    answer lives.'
