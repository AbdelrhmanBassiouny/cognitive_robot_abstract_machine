- id: d-core-expert
  title: 'RDR engine: Expert policy split'
  branch: D-core-expert
  pull_request_number: 98
  track: engine-stack
  depends_on:
  - D-core-support
  status: in_progress
  session: https://claude.ai/code/session_01Gid5Qw9cbedssFEqojo1SK
  notes: 'The Expert policy split, and the parameter-object work handed to it from the single-class plan.
    What it establishes for everything above: `ExpertInterface` carries only the expert Q&A surface, while
    the RDR holds a `ModelSaver` (in `serialization.py`, beside `save_rdr_with_case`) and a `ProgressReporter`
    as its own collaborators with Null-Object defaults — which deletes the engine''s `expert.interface.on_save`
    reach-through. `ConditionResolver.resolve(rdr, context)` takes the RDR under `TYPE_CHECKING` and applies
    the corner-case gate once for the whole family, so a strategy inherits the precondition rather than
    restating it. `AnswerName` and `NamespaceName` live together in `rdr/answer_vocabulary.py`, because
    `AnswerName.example_assignment` is built over `NamespaceName.CASE_VARIABLE` and both must sit below
    `interface.py` and `exceptions.py` to avoid a circular import.


    Outstanding. The interactive layer absorbs the segregation''s cost, reported at comment 5201827158
    and now carried by the D-ui item in the rdr-interface-and-decorator plan. `test_null_saver_writes_nothing_for_a_fitted_tree`
    asserts nothing — `tmp_path` is never handed to `NullModelSaver`, and swapping in a genuinely writing
    saver leaves it passing — reported on the pull request and not fixed. Three of the seven remaining
    unittest modules in `test_eql_rdr` are this pull request''s, and the options were put to the developer
    rather than chosen. CI has queued nothing since 82eb69fb (2026-08-12).'
- id: d-core-single-class
  title: 'RDR engine: EQLSingleClassRDR core inference engine'
  branch: D-core-single-class
  pull_request_number: 159
  track: engine-stack
  depends_on:
  - d-core-expert
  status: in_progress
  session: https://claude.ai/code/session_012Fy3CmMRRy1m5DtzVUhP2X
  notes: 'The `EQLSingleClassRDR` inference engine, ported from the superseded mega-slice. What it settled:
    a fit saves once on its way out through a `finally`, not once per inserted rule, so a crash keeps
    the rules it authored — and an empty tree is deliberately not saved, because saving unconditionally
    let `EmptyRuleTreeError` replace the exception the caller needed to see. `TemporaryModelSaver` is
    the default. The `SelfReferentialInsertionError` retry loop is reachable rather than dead — an expert
    answering with `context.trace.firing_anchor` reaches it — so it is kept, and `ConditionsNotInsertable`
    carries the `answer_name` the re-prompt reads. The convergence check keeps its any-earlier-pass semantics:
    the oscillation fixture runs {red} to {blue} to {red}, so comparing only against the preceding pass
    never terminates. `conditions_root` is correct because the engine has exactly one construction path,
    pinned by reachability rather than by reading `_parent_`.


    One real defect found and deliberately not fixed: `fit` without targets never re-checks convergence,
    so two cases labelled differently but justified by a shared condition end with the first classifying
    as the second''s label, where the same input with targets raises `RDRDidNotConvergeError`. Three options
    are on thread r3838361318; the fix changes what a labelling fit costs a human. Seven design threads
    from the 2026-08-23 review remain open and were not guessed at, among them whether the retry''s gate
    should key on whether the expert was asked rather than on `resolution_mode`.'
- id: d-core-backend
  title: 'RDR engine: underspecified-query RDR backend'
  branch: D-core-backend
  pull_request_number: 210
  track: engine-stack
  depends_on:
  - d-core-single-class
  status: in_progress
  session: https://claude.ai/code/session_015bucsUoPW3ktQ1NnTZbbVx
  blockers:
  - The GroundTruth thread on backend.py:36 is answered and deliberately left open. No dataclass in entity_query_language/rdr/
    expresses a per-case ground-truth supplier; the only one that does is ripple_down_rules CaseQuery._target,
    in the package this split retires. Whether the type alias should become a class of its own is the
    developer's call, with three options on the thread.
  - 'CI check test_each_lib (semantic_digital_twin) fails on test_multi_sim.py::test_world_sim_state_sync,
    a physics-settling assertion this pull request''s krrood/rdr files cannot reach. It is not this branch''s
    work and cannot be fixed inside it. #190 added pytest-rerunfailures to the dev extra on main (merged
    2026-08-24) so that test''s @pytest.mark.flaky reruns instead of failing outright, but D-core-backend
    and every branch from D-core-support up is 342 commits behind main and still lacks it, leaving the
    mark inert. Only a steward cascade clears it.'
  notes: 'The underspecified-query RDR backend, and the stack tip. `RDRBackend` inherits `QueryBackend`,
    whose whole ABC is `evaluate(expression)`; neither concrete base fits, since `SelectiveBackend` raises
    on exactly the ellipsis matches this backend exists for and `GenerativeBackend` constructs new instances
    where this completes an attribute on existing ones, but neither of those reaches `QueryBackend` itself.
    `evaluate` is `fill`''s eager completion, so the decision-query pattern `an(InsertionAction)(slot=...).evaluate(backend=rdr)`
    works; it returns an iterator rather than being a generator, so a non-`Match` expression raises `QueryIsNotAMatch`
    at the call. Narrowing the parameter to `Match` was rejected as a Liskov violation.


    Two decisions taken differently from what a thread asked, recorded rather than done silently: `key_from_attribute`
    became `ModelKey.from_attribute` rather than moving to `core/helpers.py`, since a `core/` module naming
    an `rdr/` dataclass as its return type inverts the layering; and `fit` calls the engine''s `fit` once
    over the filtered domain instead of the mega-slice''s per-case `fit_case` loop, which would both save
    the whole model per case and lose convergence.'
