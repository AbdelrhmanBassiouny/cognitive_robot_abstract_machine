schema_version: 1
id: dag-facade-hardening
title: DAG-vs-tree facade hardening in SymbolicExpression
description: 'Close the design smell where EQL''s SymbolicExpression - a genuine rooted DAG
  (shared subexpressions; _parents_ is a list) - exposes tree-shaped _parent_/_root_ accessors
  (a single first-attached "primary" parent and a walk up that chain). The in-flight stack
  (#89/#90/#92) already fixed the individual leaks via evaluation-scoped context; this plan
  does the root-cause hardening they deferred: make the structural accessors hard to misuse,
  fix the remaining QuantifiedConditional cache-staleness bug, and add a systematic audit
  plus a guard test.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 96
waves:
- id: wave-0
  name: Wave 0 - prerequisite leak-fixes (in-flight)
  description: 'The already-open stack that fixes the individual shared-node leaks by resolving
    the owner from evaluation-scoped context instead of the structural pointer. This plan
    composes on top of it.

    '
- id: wave-1
  name: Wave 1 - root-cause hardening & audit
  description: 'The make-it-hard-to-misuse work those PRs consciously deferred.

    '
tracks:
- id: leak-fixes
  name: In-flight leak-fixes (#89/#90/#92)
  wave: wave-0
- id: bugs-and-audit
  name: Remaining bug + systematic audit
  wave: wave-1
- id: facade-rename
  name: Facade rename + reusable accessor + guard
  wave: wave-1
items:
- id: quantified-conditional-and-audit
  title: Fix QuantifiedConditional cache staleness + systematic shared-node audit
  branch: null
  pull_request_number: null
  track: bugs-and-audit
  depends_on: []
  status: not started
  notes: 'bug-labeled PR. Phase C: stop caching a per-query value on a shared Exists/ForAll
    node (_ids_of_variables_to_add_to_sources_, a @cached_property over _root_query_ at logical_quantifiers.py:147);
    resolve the owning query from context (reuse #92''s OutermostQueryClaim) and key any cache
    by owning-query id on EvaluationContext. Watch-item (accepted 2026-08-01): evaluation_context.py
    already carries five parallel record classes; if Phase C adds per-owning-query caching,
    fold the records into a single ownership collaborator on EvaluationContext instead of
    growing a sixth parallel class.'
- id: non-mutating-negation
  title: Negating a live expression must not reparent it
  branch: null
  pull_request_number: null
  track: bugs-and-audit
  depends_on: []
  status: not started
  notes: 'Surfaced 2026-08-03 by rdr-refactor''s #41 review thread r3702021144, which asked
    whether GuardCondition.negated could be replaced by wrapping the guard expression in Not().
    It cannot, today, and the reason is this plan''s defect class: factories.not_ -> SymbolicExpression._invert_
    -> Not(self) -> base_expressions.py:299 child._parent_ = self, so negating a node that
    belongs to a live tree reparents it. The developer kept the flag on that basis and asked
    for the underlying defect to be filed here.'
- id: facade-rename-and-guard
  title: Rename structural accessors + reusable ownership accessor + guard test
  branch: null
  pull_request_number: null
  track: facade-rename
  depends_on:
  - quantified-conditional-and-audit
  status: not started
  notes: 'Sequenced last to rebase cleanly (largest diff; collides with the leak-fix stack).
    Phase A: rename _parent__/_parent_ -> _structural_parent_ and _root_ -> _structural_root_
    (keep _parents_ authoritative); update the construction/layout call sites. Phase B: consolidate
    the "resolve from evaluation context else structural fallback" pattern into one reusable
    EvaluationContext accessor (Open/Closed), behaviour-preserving - generalize from is_child_of_truth_value_operator,
    its first slice (landed via #90''s review round, commit 58671190).'
- id: rule-tree-context-stack-ownership
  title: Replace the class-level with-context stack with a root-owned RuleTreeContextStack
  branch: claude/symbolic-expression-stack-refactor-ridull
  pull_request_number: 142
  track: facade-rename
  depends_on: []
  status: in progress
  session: https://claude.ai/code/session_01PoUhMvymUQjsGL1JFpBsez
  notes: 'Not a bug PR - no bug label. Raised 2026-08-04 by the developer looking at #118:
    _symbolic_expression_stack_ is still a ClassVar mutable list on SymbolicExpression. Verified
    that the literal proposal (the root with-block owns the stack and inner blocks find it
    through their root) cannot work: add(), refinement(), alternative() and next_rule() are
    reached from freshly built, unattached nodes - the three selectors through classmethods
    with no instance at all - so the only route to an enclosing root is _conditions_root_/_root_,
    this plan''s own facade.'
