  - id: pr-92-shared-node-followups
    title: "Fix _root_-based query_root for a variable shared across two queries"
    branch: claude/dag-parent-root-and-querygraph-followups
    pull_request_number: 92
    track: leak-fixes
    depends_on: [pr-90-is-condition-participant]
    status: in_progress
    session: https://claude.ai/code/session_011nQuYfjic8RoZYhWk9z3AB
    notes: >
      bug label; open draft. Was blocked 2026-08-03..2026-08-07 on a
      needs-resolution merge conflict in query_graph.py, not on CI (all 20
      checks green) or review (zero review threads) - three routine comments,
      all naming that one file. Cause: this branch merged an earlier state of
      #90's branch (#90's tip d63dce6b is not an ancestor of it, but is of
      main), and #90's review round then deleted the machinery fix 2 was built
      on - exactly the hazard recorded on pr-90-is-condition-participant.
      Resolved 2026-08-07 (via /plan-item-resolve): fix 2 is dead on main, since
      #90 removed the position-dependent is_condition_participant term from
      construct_graph's is_satisfied as redundant, so the memoization can no
      longer stale. Verified empirically - fix 2's test passes on main
      unmodified, fix 1's fails there. query_graph.py resolved to main's version
      wholesale (the branch no longer touches it); fix 2's test kept as a
      visit-order-independence guard, renamed after that behaviour. What remains
      is fix 1 only: OutermostQueryClaim.node + _resolve_query_root, 4 files,
      +118/-10. Full run 1437 passed, 7 skipped, zero failures. PR title/body
      rewritten to match; needs-resolution label cleared by hand so later
      maintenance passes stop skipping the branch. Also flagged for Phase D and
      not fixed here: _is_faded_gate reads node.parent while
      _add_children_to_graph reassigns child_node.parent on every visit, so a
      node reached through two parents keeps only the last-assigned one.
      Still explicitly flags the QuantifiedConditional cache staleness as
      out-of-scope - picked up by this plan's Wave 1.

  - id: quantified-conditional-and-audit
    title: "Fix QuantifiedConditional cache staleness + systematic shared-node audit"
    branch: null
    pull_request_number: null
    track: bugs-and-audit
    depends_on: [pr-89-drop-dead-parent-recovery, pr-90-is-condition-participant, pr-92-shared-node-followups]
    status: not_started
    notes: >
      bug-labeled PR. Phase C: stop caching a per-query value on a shared
      Exists/ForAll node (_ids_of_variables_to_add_to_sources_, a
      @cached_property over _root_query_ at logical_quantifiers.py:147); resolve
      the owning query from context (reuse #92's OutermostQueryClaim) and key
      any cache by owning-query id on EvaluationContext. Watch-item (accepted
      2026-08-01): evaluation_context.py already carries five parallel record
      classes; if Phase C adds per-owning-query caching, fold the records into
      a single ownership collaborator on EvaluationContext instead of growing
      a sixth parallel class. Phase D (audit half):
      enumerate remaining semantic _root_/_root_query_/_parent_ reads and
      per-node caches, TDD a shared-node regression test for each unsafe one,
      fix via the context accessor. TDD throughout; krrood-internal mimics only.
      Handed over from #92 on 2026-08-07: _is_faded_gate (query_graph.py) reads
      node.parent while _add_children_to_graph reassigns child_node.parent on
      every visit, so a node reached through two parents keeps only the
      last-assigned one for the faded BFS. Same defect class; no failing test
      constructed for it yet.
      Phase D's audit scope explicitly includes rules/conclusion_selector.py (on
      main) and, once rdr-refactor's Wave-0 stack lands, rdr/rule_tree.py and
      rdr/rule_tree_view.py - the RDR rule-tree consumers are not on main yet, so
      an audit run before then silently under-covers them.

  - id: insert-at-ownership-parentage
    title: "Resolve insert_at splice parentage from the owning rule-tree context"
    branch: claude/dag-facade-hardening-emrhza
    pull_request_number: 118
    track: bugs-and-audit
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01ScQBrWpJoYmhB9T8uBuxWp
    notes: >
      Merged 2026-08-05. bug label. Fixed by carrying the owning parent edge on the
      `with`-context stack (RuleTreeContext in core/base_expressions.py) rather
      than by any `_parents_` heuristic, so Phase A's rename and Phase D's guard
      test stay compatible. #78 closed as superseded 2026-07-31; its regression
      test was not carried over (it lives in test_eql_rdr/, absent on main).
      ConclusionSelector.insert_at (rules/conclusion_selector.py:67)
      splices above `anchor._parent_`, the first-attached primary parent, so a
      shared-identity MappedVariable used inside a Comparator in one branch and
      bare in a sibling branch splices above the incidental Comparator and drags
      the new refinement out of the rule tree. This plan's own defect class, at
      construction time rather than evaluation time: resolve the parent relative
      to the asking rule-tree context (the `with`-context stack
      create_and_update_rule_tree already uses via _get_current_context_condition)
      instead of reading the structural pointer. Deliberately depends_on nothing -
      it needs none of Wave 0's evaluation-scoped machinery and is reproducible on
      main with core EQL plus rules/ alone, so it lands early rather than behind
      the rename. Supersedes rdr-refactor's D-ui-splice-fix (#78).

  - id: non-mutating-negation
    title: "Negating a live expression must not reparent it"
    branch: null
    pull_request_number: null
    track: bugs-and-audit
    depends_on: []
    status: not_started
    notes: >
      Surfaced 2026-08-03 by rdr-refactor's #41 review thread r3702021144, which
      asked whether GuardCondition.negated could be replaced by wrapping the guard
      expression in Not(). It cannot, today, and the reason is this plan's defect
      class: factories.not_ -> SymbolicExpression._invert_ -> Not(self) ->
      base_expressions.py:299 child._parent_ = self, so negating a node that
      belongs to a live tree reparents it. The developer kept the flag on that
      basis and asked for the underlying defect to be filed here.
      The concrete instance is rdr/condition_resolver.py:104, where _materialize
      calls not_(guard.expression) on a live rule-tree node - honouring the
      no-mutation rule during traversal and violating it at rule-insertion time.
      Two halves, and only the first belongs to this plan: a way to build a negated
      view of an expression without adopting the operand (the same "resolve
      ownership from the asking context rather than the structural pointer" move as
      insert-at-ownership-parentage, applied to construction). The _materialize call
      site is then a one-line follow-up, but condition_resolver.py is not on main
      yet - it arrives with rdr-refactor's #41 - so the fix lands here and the call
      site is repointed whenever that stack lands, whichever order they merge in.
      Once this exists, rdr-refactor should revisit GuardCondition.negated: the
      #41 analysis found Not()-wrapping cleaner at 4 of 6 concrete sites, with this
      hazard the only thing standing against it.

  - id: facade-rename-and-guard
    title: "Rename structural accessors + reusable ownership accessor + guard test"
    branch: null
    pull_request_number: null
    track: facade-rename
    depends_on: [quantified-conditional-and-audit]
    status: not_started
    notes: >
      Sequenced last to rebase cleanly (largest diff; collides with the
      leak-fix stack). Phase A: rename _parent__/_parent_ -> _structural_parent_
      and _root_ -> _structural_root_ (keep _parents_ authoritative); update the
      construction/layout call sites. Phase B: consolidate the "resolve from
      evaluation context else structural fallback" pattern into one reusable
      EvaluationContext accessor (Open/Closed), behaviour-preserving -
      generalize from is_child_of_truth_value_operator, its first slice
      (landed via #90's review round, commit 58671190). The 2026-08-01
      discussion confirmed this consolidation, not a graph library, is the
      right refactor for the context machinery (roadmap addendum). Phase D
      (guard half): architectural test asserting semantic modules never
      reference the _structural_* accessors, so the class cannot silently
      reappear.

  - id: rule-tree-context-stack-ownership
    title: "Replace the class-level with-context stack with a root-owned RuleTreeContextStack"
    branch: claude/symbolic-expression-stack-refactor-ridull
    pull_request_number: 142
    track: facade-rename
    depends_on: [insert-at-ownership-parentage]
    status: in_progress
    session: https://claude.ai/code/session_01PoUhMvymUQjsGL1JFpBsez
    notes: >
      Not a bug PR - no bug label. Raised 2026-08-04 by the developer looking at
      #118: _symbolic_expression_stack_ is still a ClassVar mutable list on
      SymbolicExpression. Verified that the literal proposal (the root with-block
      owns the stack and inner blocks find it through their root) cannot work:
      add(), refinement(), alternative() and next_rule() are reached from freshly
      built, unattached nodes - the three selectors through classmethods with no
      instance at all - so the only route to an enclosing root is
      _conditions_root_/_root_, this plan's own facade. Ambient lookup is therefore
      unavoidable; what goes is the process-global mutable list. The second half of
      the idea stands and already has a precedent at the other end of the
      lifecycle: evaluation_context.py's _evaluation_context_var ContextVar, owned
      by the outermost _evaluate_ (owns_an_evaluation_context). Same shape here - a
      RuleTreeContextStack created by the outermost with block, held in a
      ContextVar, discarded when that block closes. Knock-on wins: Query.__enter__
      deletes entirely (Query overrides only _rule_tree_anchor_, so a query module
      no longer pushes onto base-class state with no matching __exit__), the three
      selectors' duplicated stack lookups collapse into one
      ConclusionSelector._enclosing_condition_, and the four DSL entry points raise
      RuleTreeEditWithoutEnclosingBlock instead of a raw AttributeError outside a
      with block - user-facing, since scope.py injects Add/Refinement/Alternative/Next
      into the expert shell namespace. Removes one future Phase D guard-test
      violation (Conclusion.__post_init__'s dead _conditions_root_ fallback);
      leaves insert_at's anchor._parent_ fallback and Alternative's
      _parent_/_conditions_root_ reads for Phase D, none made worse. Deliberately
      excluded on the developer's call: the cross-thread regression test - one
      thread's blind __exit__ popping another's frame is real and the ContextVar
      fixes it, but it ships uncovered (see roadmap addendum). PR #142 opened as
      a draft 2026-08-04 based off #118's branch. #118 merged 2026-08-05, so GitHub
      auto-retargeted #142 onto main; main was merged into the branch (clean, no
      conflicts, contrary to a routine's report that named no conflicting files) and
      the needs-resolution label cleared. Promotion is no longer blocked - it waits
      only on the PR leaving draft. Subscribed to its activity.
