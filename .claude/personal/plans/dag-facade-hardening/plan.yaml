schema_version: 1
id: dag-facade-hardening
title: "DAG-vs-tree facade hardening in SymbolicExpression"
description: >
  Close the design smell where EQL's SymbolicExpression - a genuine rooted
  DAG (shared subexpressions; _parents_ is a list) - exposes tree-shaped
  _parent_/_root_ accessors (a single first-attached "primary" parent and a
  walk up that chain). The in-flight stack (#89/#90/#92) already fixed the
  individual leaks via evaluation-scoped context; this plan does the
  root-cause hardening they deferred: make the structural accessors hard to
  misuse, fix the remaining QuantifiedConditional cache-staleness bug, and add
  a systematic audit plus a guard test.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 96

waves:
  - id: wave-0
    name: "Wave 0 - prerequisite leak-fixes (in-flight)"
    description: >
      The already-open stack that fixes the individual shared-node leaks by
      resolving the owner from evaluation-scoped context instead of the
      structural pointer. This plan composes on top of it.
  - id: wave-1
    name: "Wave 1 - root-cause hardening & audit"
    description: >
      The make-it-hard-to-misuse work those PRs consciously deferred.

tracks:
  - id: leak-fixes
    name: "In-flight leak-fixes (#89/#90/#92)"
    wave: wave-0
  - id: bugs-and-audit
    name: "Remaining bug + systematic audit"
    wave: wave-1
  - id: facade-rename
    name: "Facade rename + reusable accessor + guard"
    wave: wave-1

items:
  - id: pr-90-is-condition-participant
    title: "Fix is_condition_participant misclassifying nodes shared across queries"
    branch: claude/entity-query-parent-props-w789od
    pull_request_number: 90
    track: leak-fixes
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01Aa2WZP5URWHoQDTpL34m9L
    notes: >
      bug label; open draft, mergeable clean. Adds TruthValueOperatorChildren
      to EvaluationContext (per-pass parent) - the exact latent bug flagged
      during this plan's design as the TDD seed. 2026-08-01 review round
      handled (commit 58671190): new EvaluationContext.
      is_child_of_truth_value_operator accessor (first slice of Wave 1
      Phase B), redundant participant check dropped from construct_graph
      (membership in satisfied_condition_ids already implies it), sentinel
      removed, abbreviations fixed. 5/8 threads resolved; 3 judgment threads
      left open with justifications. Summary discussion held and accepted by
      the developer 2026-08-01 (after a false start where the commit was
      pushed before the discussion): is_condition_participant stays as a thin
      dispatcher (explicit parent -> evaluation context -> structural
      fallback) - its question is positional/per-edge, so it cannot become a
      type property or a construction-time tag; no rustworkx for
      evaluation-time tracking (see roadmap addendum); the real refactor is
      Phase B consolidation. Warning: PR #92
      merges this branch and touches query_graph.py - it must re-merge tip
      58671190 (construct_graph parent-param revert may conflict). 2026-08-03
      review round handled (commit d63dce6b, via /plan-item-resolve): the
      TruthValueOperatorChildren docstring's unexplained "DAG" reference was
      spelled out and named explicitly as SymbolicExpression's own directed
      acyclic graph of parents, disambiguating it from QueryGraph; thread
      resolved, test_eql (1143 passed, 3 skipped) and test_ormatic (132
      passed) rerun clean.

