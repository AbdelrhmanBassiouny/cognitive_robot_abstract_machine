schema_version: 1
id: knowledge-directed-expectation
title: 'Knowledge-directed perception: expectation and failure detection'
description: 'The expectation wave of knowledge-directed-perception (split out on 2026-09-05 to get
  every successor under the plan-size budget): what the robot did, and what Segmind saw it do, say
  where a thing should now be. Perception looks there, and reports a violated expectation as a failure
  rather than as an absence - the end-to-end story the paper is written around. Depends on items
  of `knowledge-directed-requests` and `knowledge-directed-grounding` that could not be preserved
  as `depends_on` across the plan split - see the affected items'' own `blockers`. See `knowledge-directed-grounding`''s
  roadmap.md for the programme-wide why, the three waves, the deadline budget and the sequencing
  decisions this plan inherits.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201
