schema_version: 1
id: knowledge-directed-expectation
title: 'Knowledge-directed perception: expectation and failure detection'
description: 'The expectation wave of knowledge-directed-perception (split out on 2026-09-05
  to get every successor under the plan-size budget): what the robot did, and what Segmind
  saw it do, say where a thing should now be. Perception looks there, and reports a violated
  expectation as a failure rather than as an absence - the end-to-end story the paper is written
  around.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201
waves:
- id: expectation
  name: Perception knows what should be true
  description: What the robot did, and what Segmind saw it do, say where a thing should now
    be. Perception looks there, and reports a violated expectation as a failure rather than
    as an absence.
tracks:
- id: events
  name: Expectation and failure
  wave: expectation
- id: executors
  name: A second detector behind the interface
  wave: expectation
  description: The evidence that the reasoning layer is executor-agnostic, and the route by
    which this work reaches RoboKudo after the deadline.
- id: demo-expectation
  name: The demo detects and recovers from a failure
  wave: expectation
items:
- id: episode-replayed-into-the-world
  title: Replay a recorded episode into the world so Segmind can say what happened
  branch: claude/episode-replayed-world-kickoff-6ye5bb
  pull_request_number: 246
  track: events
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01UdpwcAQGVFCKEy8VA2iFwv
  blockers:
  - One of the four review threads of 2026-09-03 is left open deliberately, and it is the
    developer's to close rather than work for this item.
  notes: An expectation about where a thing now is comes from what was done to it, and on
    a recording nothing has been done to anything until the recording is replayed. Segmind
    already has the extension point - `EpisodePlayer` -> `DataPlayer` -> `FilePlayer` - so
    a player reading a rosbag's transform tree and joint states is the same kind of member
    over a different file, and `EpisodeSegmenterExecutor` produces support/pick-up/placing/
    insertion events over it unchanged. Touches only segmind, so it started immediately, off
    `main`.
- id: expectations-from-events
  title: Expect what the action promised, and report the difference as a failure
  branch: claude/plan-item-kickoff-expectations-2zvpmn
  pull_request_number: 257
  track: events
  depends_on:
  - episode-replayed-into-the-world
  status: in_progress
  session: https://claude.ai/code/session_0124wGjWgkgfuDHX1xTJh6St
  blockers:
  - 'One thread is open on #257 and it is the developer''s to settle. r3940953108 asked whether
    an event''s declared effect duplicates Segmind''s statechart, and on 2026-09-05 he proposed
    making InsideOf answer for regions as the fix.'
  - r3940991795, HasPosition versus his HasLocation, was resolved by the developer without
    a rename being asked for; recorded here only because the name is still his to change.
  notes: 'Segmind already emits support/loss-of-support/pick-up/placing/insertion events over
    `is_supported_by`. Perception keeps a set of expectations from them - after `LossOfSupport(piece,
    table)` stop searching the table; after `Placing(piece, lid)` search the lid - and the
    action model gets there first, since an action declares its effect before the event confirms
    it. The same mechanism is free failure detection: perception looked exactly where the
    action promised, found nothing (or something else), and says so.'
- id: predicted-state-from-declared-effects
  title: Predict the twin's current state from what the actions and the events declared, and
    ask perception from it
  branch: null
  pull_request_number: null
  track: events
  depends_on:
  - expectations-from-events
  status: not_started
  notes: 'Added 2026-09-04 at the developer''s ask on #257 (r3934932647 and r3937639689).
    expectations-from-events keeps what holds of one piece the robot acted on, from the action''s
    declared effect and each event''s declared Effect, both stated as the twin''s own relations.'
- id: robokudo-detector
  title: Answer a request with a RoboKudo analysis engine
  branch: perception_robokudo_detector
  pull_request_number: null
  track: executors
  depends_on:
  - knowledge-directed-requests/choose-detection-method
  status: deferred
  blockers:
  - 'Deferred past the 2026-09-15 deadline: nothing depends on it and no demo item needs it.'
  notes: 'One adapter implementing the detector interface over a RoboKudo analysis engine,
    so the rule tree can choose a learned detector (RoboKudo ships CLIP and YOLO annotators)
    for a target with no geometric model. Proves the reasoning layer is executor-agnostic
    and is the route by which this work moves into RoboKudo after the deadline. Deliberately
    last and expected to fall after it: nothing else depends on it, no demo item needs it,
    and it is the first thing to drop if the deadline tightens.'
- id: demo-detects-and-recovers-a-failed-insert
  title: A failed insertion is noticed because perception looked where the action promised
  branch: tracy_icra
  pull_request_number: null
  track: demo-expectation
  depends_on:
  - expectations-from-events
  - knowledge-directed-requests/demo-asks-by-query
  status: not_started
  notes: 'The end-to-end story the paper is written around: the robot picks a piece, Segmind''s
    LossOfSupportEvent takes the table out of the search, the insertion''s declared effect
    points perception at the board''s lid, and when the insertion fails perception finds the
    piece somewhere the plan did not expect and says so. Recovery follows from that report.
    Narrowed for the deadline: report the violated expectation, and let recovery be the plan
    re-asking rather than a policy of its own. If the deadline forces a cut, this is the item
    to protect and robokudo-detector is the one to drop.'
- id: translation-detector-answers-snapshot-corrections
  title: TranslationDetector decides whether a piece moved, not SnapshotWorkingMemory
  branch: null
  pull_request_number: null
  track: events
  depends_on: []
  status: not_started
  notes: 'Split out of icra-mechanism''s `snapshot-working-memory` (#301) on 2026-09-11, per
    the developer''s own direction on that PR''s review thread: `SnapshotWorkingMemory` now
    writes every perceived pose onto the twin unconditionally, and deciding whether a piece
    actually moved -- versus perception noise -- is `TranslationDetector`''s question (`segmind/src/segmind/detectors/atomic_event_detectors_nodes.py`),
    not perception''s. Quoted from the review thread: "translation event should happen by
    segmind...'
