- id: demo-detects-and-recovers-a-failed-insert
  title: A failed insertion is noticed because perception looked where the action promised
  branch: tracy_icra
  pull_request_number: null
  track: demo-expectation
  depends_on:
  - expectations-from-events
  status: not_started
  blockers:
  - Depends on `knowledge-directed-requests`'s `demo-asks-by-query` (not_started) - a cross-plan
    dependency that `split-knowledge-directed-perception` could not preserve (`depends_on` cannot
    cross a plan). Dropped from `depends_on` here; tracked only as this free-text blocker, with no
    automatic readiness or dependency chip.
  notes: 'The end-to-end story the paper is written around: the robot picks a piece, Segmind''s LossOfSupportEvent
    takes the table out of the search, the insertion''s declared effect points perception at the
    board''s lid, and when the insertion fails perception finds the piece somewhere the plan did
    not expect and says so. Recovery follows from that report. Narrowed for the deadline: report
    the violated expectation, and let recovery be the plan re-asking rather than a policy of its
    own. If the deadline forces a cut, this is the item to protect and robokudo-detector is the one
    to drop.'
