schema_version: 1
id: plan-tracking-skills
title: 'The plan-item skills: deciding where work goes, and recording it before doing it'
description: The skills a session uses to place a piece of work and to keep the manifest honest
  about it - deciding whether something is new work or a change to work in flight, opening
  an item's branch and draft pull request before implementation rather than after, and choosing
  whether a kickoff asks for approval or proceeds.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: skills
  name: The skills themselves
  description: Each adds or corrects one decision the skills were leaving to a session's judgement.
tracks:
- id: skills
  name: Plan-item skills
  wave: skills
items:
- id: plan-item-bootstrap-yaml-indent
  title: Fix plan_item_bootstrap writing item fields at the wrong indentation
  branch: claude/plan-item-bootstrap-yaml-indent-y8qs0m
  pull_request_number: 160
  status: in progress
  session: https://claude.ai/code/session_0157EHWeTzFSYf1nqHX5J7NC
  track: skills
  depends_on: []
  notes: 'Bug fix off `main`, found by using the bootstrap script on `rdr-refactor`. `open`
    patched the item''s fields at a hardcoded four-space indent, which does not parse in a
    manifest whose items are written flush with `items:` - `rdr-refactor`''s style - so `save-plan.sh`
    failed in `yaml.safe_load`. The depth is now read off the manifest being edited. Two defects
    in the same path are fixed with it: the save swallowed `save-plan.sh`''s output, and it
    reported success without checking the write landed. It now raises with the script''s own
    message and reads the plan back off the notes branch afterwards.'
- id: plan-item-edit-guard
  title: 'PreToolUse guard: refuse source edits from a branch with no plan item'
  branch: null
  status: not started
  track: skills
  depends_on: []
  notes: 'The third and strongest of the three fixes recorded on `session-start-plan-and-setup-guards`,
    split out at that item''s kickoff: the only one that makes the miss impossible rather
    than merely unlikely, where the two that shipped make it unlikely by reporting better.
    A `PreToolUse` hook on `Edit|Write` that refuses a source edit from a branch no plan item
    tracks.'
- id: report-document-naming
  title: One name for the report-to-document method across the .claude tooling
  branch: null
  status: not started
  track: skills
  depends_on: []
  notes: 'From an upstream review of cram2 #537: "i feel like you have `as_document`, `as_dict`,
    `as_json`, `as_json_dict` etc scattered across your different PRs". Measured rather than
    taken on impression: `as_document` returns a dict in two files, `to_json_dict` returns
    a dict in two more, and `as_json` returns a *str* in two others - one operation under
    two names, plus a genuinely different one under a third.'
- id: resolve-propagates-downstream
  title: Merge a resolved item's fix down into the pull requests stacked on it
  branch: claude/plan-item-kickoff-resolve-ic3qnu
  pull_request_number: 430
  session: https://claude.ai/code/session_01Mkoj43S6gvqMaFzRpiGwHX
  track: skills
  notes: 'Placed by `/add-plan-item` rather than by default, against nineteen unlanded tooling
    branches: nothing in flight builds downstream propagation, under this name or any other,
    so it is new work rather than a fold. **Based on `basstler-package`''s `basstler-package`
    (#185, `claude/plan-item-kickoff-workflow-cuare2`), not on `main`.** The new code is Python,
    and on #185 every `.claude/` Python module has moved into `basstler/` with its tests in
    `test/basstler_test/`; writing it against `main`''s `.claude/stack/` layout would mean
    writing it twice.'
  depends_on: []
  status: in progress
