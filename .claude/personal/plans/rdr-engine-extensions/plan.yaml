schema_version: 1
id: rdr-engine-extensions
title: Feature layer, multi-tree engines, concept trees, OO integration and TMS
description: 'Everything the forward architecture puts on top of the single-class engine: named memoized
  features computed once per case, the MCRDR and GRDR multi-tree engines, concept trees declared as vocabulary
  with a stratified dependency graph, per-class definition RDRs with candidate generators, JTMS justification
  recording, and the architecture brief that documents the finished whole.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 94
waves:
- id: foundations
  name: Independent foundations
  description: Three tracks that need only the core engine and can run in parallel.
- id: concepts
  name: Concept trees
  description: Needs both the feature layer and the multi-tree engines.
- id: integration
  name: OO integration and TMS
  description: Two parallel tracks on top of the concept layer.
- id: brief
  name: The architecture brief
  description: 'Deliberately last: the brief describes the architecture as a finished whole.'
tracks:
- id: feature-layer
  name: Feature layer
  wave: foundations
  description: Named, memoized, registry-backed derived features, computed once per case however many
    rules reference them.
- id: multi-tree-engines
  name: MCRDR and GRDR
  wave: foundations
  description: Multi-valued conclusions, then the general fixpoint loop with its monotonic-conclusions
    contract.
- id: concept-trees
  name: Concept trees
  wave: concepts
  description: Trees declared as vocabulary other trees may reference, with stratified evaluation and
    cornerstone-regression checks.
- id: oo-integration
  name: OO integration
  wave: integration
  description: Per-class definition RDRs, candidate generators and taxonomy discriminators.
- id: justifications
  name: TMS justifications
  wave: integration
  description: Justification recording per conclusion, and retraction propagation over the dependency
    graph.
- id: oo-prototypes
  name: OO prototypes on dead bases
  wave: integration
  description: Parked drafts whose bases were closed unmerged; input for the OO integration track to harvest.
- id: architecture-brief
  name: The architecture brief
  wave: brief
  description: The design document and its bibliography, re-landed.
