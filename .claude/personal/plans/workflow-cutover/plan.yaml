schema_version: 1
id: workflow-cutover
title: 'Cutover: one published site, no scheduled LLM run, the old branches retired'
description: The end state the workflow-unification work was for. Plan dashboards publish themselves
  from a single Pages site; the scheduled LLM Routine is replaced by a plain Action for the deterministic
  duties and on-demand sessions for the judgment ones; and the superseded tooling branch is tagged
  and deleted once one green cycle has run on the new paths.
