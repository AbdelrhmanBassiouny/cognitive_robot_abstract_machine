  - 'Stacked on #185 (`claude/plan-item-kickoff-workflow-cuare2`) since 2026-10-02. #280 cannot
    land before #185 does. Its upstream promotion link predates the re-cut and would now carry
    #185''s diff, so rebuild it after #185 lands.'
  - 'The gate, one green Action cycle, is reachable now but not yet met. `run-unattended`
    (`0b6e9776`) treats an already-reported branch as success, so the next real run on #280''s
    head is the check.'
  depends_on: []
  notes: 'Target revised 2026-07-31 (native-stacks pivot, user-approved): the endgame is no
    scheduled LLM run at all, which finally aligns the Routine with the no-scheduled-checks
