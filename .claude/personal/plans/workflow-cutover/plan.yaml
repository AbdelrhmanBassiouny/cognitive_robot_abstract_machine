  notes: |-
    Only after one full Routine cycle and one site-Action cycle have run green on the new paths. Tag for
    history first.

    Platform constraint, recorded 2026-07-29 and unchanged: tag pushes and branch deletes get a 403
    through a session's git proxy, so those two steps run outside the harness - the user's machine, or
    `gh api`. A session can still do every verification and prepare the exact commands. The sibling
    `session-hooks-retirement` hit the same wall and the user ran the delete.
