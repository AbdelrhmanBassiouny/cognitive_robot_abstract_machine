    from cram2/main, label hygiene, the cram2-link comment, the plans-site build, and the
    happy-path cascade, since `gh stack sync` is documented as safe in automation and Actions
    runners ship `gh`. The judgment residue - cascade conflicts, red CI after a restack -
    runs in on-demand sessions surfaced by the dashboard rather than by a timer.'
