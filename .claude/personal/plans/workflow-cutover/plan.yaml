items:
- id: stack-board-single-site
  title: 'PR 4: plans-only Pages site (stack board retired for the native stack map)'
  branch: claude/dashboard-publish-automation-hnfi5a
  pull_request_number: 218
  status: in_progress
  session: https://claude.ai/code/session_01CfwosnvBeiWvRLXxcnfHPk
  track: cutover
  depends_on: []
  blockers:
  - 'Two review rounds are answered and pushed - the 26-thread round of 2026-09-04 as
    `d61619ac`, and the single dataclass ask of 2026-09-05 as `8afbbe30`; what is left is
    the user''s own re-review. One thread stays open because it was answered differently
    from how it was asked: the git-command-runner one, where the runner adopted is this
    package''s own rather than `.claude/stack`''s, since importing that would take a
    dependency on another skill directory''s `sys.path` insertion. The user closed the
    error-base and Artifact threads themselves.'
  notes: |-
    Re-scoped 2026-07-31 to the user's one-dashboard decision: no board index is built at all.
    GitHub's native stack map covers derived stack mechanics, so the plan dashboards are the single
    surface, published as `_site/plans/<id>/` with no live session. Shipped 2026-08-30 as draft #218 off
    `main` rather than stacked on #111, at the user's instruction not to wait - the workflow does
    nothing until it is on a base branch, and #111 has been conflict-blocked since the 2026-08-29
    maintenance pass. Both recorded dependencies were dropped for the same reason; neither is needed by
    what shipped. The site publishes from this fork's own Pages, so the repository override is gone.

    Three facts the build established, each recorded because a later change would otherwise rediscover
    them. **Which branch carries the workflow decides which trigger can reach it**: `workflow_dispatch`
    is offered only from the default branch (here, `integration`), a `pull_request` run uses that pull
    request's own merge ref so it fires only where the base already carries the file, and `push` fires
    on the branch it names. No workflow design substitutes one for another. **The `github-pages`
    environment accepts deployments only from the default branch**, so `actions/deploy-pages` is
    rejected before the first step of any pull request run, and nothing reachable from `GITHUB_TOKEN`
    relaxes it; the site is pushed to a branch of its own that Pages serves from, with `pages_site.py`
    pointing Pages there through the API, so a fresh fork still needs no settings visit.
    **`fetch-depth: 0` is load-bearing**, not caution: neither that push nor the notes-branch worktree
    the merged-to-done correction commits in can push from a shallow clone.

    `build_site.py` is a deliberate single-file overlap with #111 - same path, same command-line
    contract - so whichever lands second takes #111's richer version, and this branch's `github_api.py`
    and `personal_notes.py` are then deletable in favour of the package. 50 new tests, 293 in the
    plan-dashboard suite. Verified end to end against live GitHub with the notes remote redirected to a
    local mirror: all ten plans rendered. The rejected environment deployment is pinned out by a test of
    its own.

    The user does not want this on `main` (2026-08-30). What that costs, stated rather than worked
    around: the `pull_request` trigger then covers this pull request alone. Un-drafting it makes it
    eligible for the next integration rebuild, which puts it on the default branch and makes
    `workflow_dispatch` available. Closing the rest of the gap means landing it on `main` later or
    adding a cron - deliberately not added, since the no-scheduled-checks rule makes that the user's
    call. Living on `integration` is fragile in one way worth knowing: that branch is regenerated from
    scratch, so a rebuild that drops this tip takes the workflow off the default branch with it.

    Left undone and carried by nothing else: the every-fork-pull-request-belongs-to-a-plan invariant,
    the repo/branch/upstream repository variables, and three inconsistent poll-interval statements.
- id: routine-cutover
  title: 'Retire the scheduled LLM Routine: deterministic Action + on-demand sessions'
  branch: claude/stack-maintenance-action
  status: in_progress
  session: https://claude.ai/code/session_01Q8JfYcge9pLWPxGSE9d9d1
  track: cutover
  pull_request_number: 280
  blockers:
    - >-
      None left outside this item's own next step. The gate this item was waiting on ("stack tooling
      on cram2/main and fork main fast-forwards") is now clear: verified 2026-09-06, cram2/main and
      this fork's main are the identical commit f6a53cf9, both carrying .claude/stack/ including
      maintenance.py. What remains is this item's own deliverable: no .github/workflows/*.yml calls
      the deterministic executor yet (confirmed absent on main, on integration, and on #218's
      branch).
  depends_on: []
  notes: >
    Target revised 2026-07-31 (native-stacks pivot, user-approved): the endgame is no scheduled LLM
    run

    at all, which finally aligns the Routine with the no-scheduled-checks rule. A plain scheduled
    Action

    takes the deterministic duties - fork-main fast-forward from cram2/main, label hygiene, the

    cram2-link comment, the plans-site build, and the happy-path cascade, since `gh stack sync` is

    documented as safe in automation and Actions runners ship `gh`. The judgment residue - cascade

    conflicts, red CI after a restack - runs in on-demand sessions surfaced by the dashboard rather
    than

    by a timer. The gate is unchanged: only after the stack tooling is on cram2/main and fork main

    fast-forwards; one green Action cycle flips this done. The live Routine is trigger

    `trig_01N79jHmLo3bSbg8pLM6MNTB` ("PR Stack Monitor and Update"), which the final cutover
    deletes.

    **The base-change 403 is one credential, not the platform** (corrected 2026-08-02 by

    `session-safe-pr-reparent`'s probe). The MCP `update_pull_request` tool changes a base fine,
    verified

    on throwaway pull request #129, so the "no session can ever reparent" reading was wrong and
    there is

    no close-and-recreate fallback to inherit. The Action's own credential is a third identity
    again;

    verify it with a real base change from the Action before relying on it, and if it does 403, call
    the

    same REST endpoint under a token that does not carry the restriction rather than degrade to

    renumbering pull requests.

    **Detection must be event-triggered, and one event type wider than first designed.** Tracing
    #40/#41

    on 2026-08-02 showed the human action was correct maintenance, not a mistake automation should

    prevent: the user closed #40 after rebuilding its branch, and its successor #53 merged normally
    nine

    days later. The real defect is that *any* pull request leaving the open set drops it from

    `board.json`, whether it closes unmerged or merges and GitHub auto-closes it. `pull_request:
    closed`

    fires for both, so the Action re-sweeps git ancestry for every remaining open fork pull
    request's

    base on that one event - not only the closed pull request's own branch. In the real case that
    would

    have caught #41's orphaning at #53's merge, days before a review round noticed it by accident.

    **The interim pointer prompt is adopted and live** (2026-08-02). The user replaced the Routine's

    ~17.5k-token inline prompt with the short pointer this item specified: HARD RULES inline,
    because

    they must bind before any file is read, plus "read `.claude/stack/ROUTINE.md` and execute". It

    resolves `origin/main` first and falls back to the landed-parent-detection branch while

    `.claude/stack/` is still in review, so that branch is live production input and an edit to

    `ROUTINE.md` ships on push with no deploy step. That is what stops doctrine corrections needing
    a

    manual paste. Adoption immediately exposed a latent ordering bug, fixed in #117: SETUP step 0

    asserted that `stack.py` and `stack.toml` were already on the checkout, written in anticipation
    of a

    landing that had not happened. Under the pointer the Routine would have resolved its doctrine,

    believed the tooling present, and failed on the first `stack.py` call in phase 2 - after phase 1
    had

    already mutated pull requests. Step 0 now fetches `.claude/stack/` from the same ref instead of

    asserting it. Two deletions fall due when `.claude/stack/` reaches main: the pointer prompt's

    second source line, which needs a manual paste, and step 0's fetch fallback. Neither breaks
    anything

    if forgotten; both are dead weight.

    Re-checked 2026-09-06 after finding the item in_progress with no branch and no PR - the same
    "recorded state said nothing was wrong" gap #218 and #211 hit. What actually happened: the
    prerequisite work landed on a sibling plan and nobody came back to close the loop here.

    **The gate is clear.** cram2/main and this fork's main are the identical commit (f6a53cf9), both
    carrying .claude/stack/. Both halves of "stack tooling on cram2/main, fork main fast-forwards"
    are satisfied.

    **The 2026-08-02 open question is already answered, in code.** stack-maintenance-executor (#139,
    done) probed the Action's own credential directly and recorded the result in its own notes:
    "label writes, conflict comments and description writes are all available to deterministic code;
    only the base change needs the MCP client. That table is what the cutover's Action needs for its
    own credential." maintenance.py's module docstring independently confirms it and adds:
    run-report --json exists "so a scheduled job with no model in the loop can emit it directly."
    The deterministic executor this item's endgame calls for is already built
    (board/fast-forward/restack/promote/run-report); restack conflicts already self-report (comment
    + needs-resolution, via conflict_report()/DefaultLabel.NEEDS_RESOLUTION); the only un-surfaced
    residue is reparents (base retargets), which nothing today posts a notice for.

    **The interim pointer prompt is superseded twice over.** ROUTINE.md no longer exists anywhere
    (renamed away in the bastler-package rename); the live Routine's own registered prompt
    (trig_01N79jHmLo3bSbg8pLM6MNTB, per .claude/skills/stacked-pr-maintenance/routine-prompt.md
    merged 2026-08-13) already invokes `/stacked-pr-maintenance --non-interactive` directly rather
    than pointing at a doctrine file. The two dead-weight deletions the old note flagged (the
    pointer's second source line, SETUP step 0's fetch fallback) are themselves now moot in a
    different way - there is no pointer prompt left to carry them.

    **A live coordination gap, not a blocker:** stack-maintenance is still investing in the
    session/Routine-invoked path - promotion-summaries-and-table (#162, in_progress) is adding
    features to the pass an LLM session runs, and routine-prompt.md documents registering exactly
    the scheduled Routine this item retires. Not a scope overlap (different deliverables: skill
    enrichment vs. this item's Action wrapper), but #162's open "an already-registered scheduled
    run's notification setting has no field on the update API" question resolves itself once this
    item deletes the registration - worth flagging to whoever picks up #162 next.

    Plan: add reparent notification (comment + needs-resolution) to the executor, since nothing
    posts one today, then a stack-maintenance.yml Action calling run-report --json on
    pull_request:closed / schedule / workflow_dispatch, using the same GH_TOKEN/GITHUB_TOKEN the
    executor already reads (no new secret). Routine deletion and flipping this item done still wait
    on this item's own recorded gate: one green cycle of that Action, which needs the PR on the
    default branch first.
- id: artifact-path-retirement
  title: Retire the Artifact publishing path once the Pages site has run one green cycle
  branch: null
  status: not_started
  track: cutover
  depends_on:
  - stack-board-single-site
  notes: |-
    Raised by the user on #218's review of `SKILL.md` (2026-09-04): now the dashboards publish to
    Pages, is the Artifact path still needed? Kept out of #218 as a plan-level scope change rather
    than a review fix, and tracked here because it is what finishes this plan's own "one published
    surface" goal.

    What retiring it removes: `record_dashboard_url.py` and its tests, the
    `_generated/dashboard-urls.yaml` cache, `plan-dashboard/SKILL.md` step 3, and the "republish the
    dashboard" instruction every plan skill and the personal notes carry - each of which would
    instead dispatch the workflow.

    Three things to settle first, because they are what the Artifact still does and Pages does not.
    The Pages site is public on the fork while an Artifact is private, so retiring it publishes the
    plan data's rendering to anyone with the URL - the data itself is already public on
    `claude/personal-notes`, so this is a discoverability change rather than a disclosure one, but it
    is the user's call. The workflow only covers plans once it is on a base branch that carries it,
    which today is #218's own pull request alone. And a manifest edit raises no event GitHub can
    see, so the republish becomes a `workflow_dispatch` call rather than a skill invocation.

    Gate: one green site-Action cycle, the same bar `tooling-branch-retirement` already uses.
- id: tooling-branch-retirement
  title: Tag and delete claude/stack-workflow-tooling after one green cycle
  branch: null
  status: not_started
  track: cutover
  depends_on:
  - routine-cutover
  - stack-board-single-site
  notes: |-
    Only after one full Routine cycle and one site-Action cycle have run green on the new paths. Tag for
    history first.

    Platform constraint, recorded 2026-07-29 and unchanged: tag pushes and branch deletes get a 403
    through a session's git proxy, so those two steps run outside the harness - the user's machine, or
    `gh api`. A session can still do every verification and prepare the exact commands. The sibling
    `session-hooks-retirement` hit the same wall and the user ran the delete.
