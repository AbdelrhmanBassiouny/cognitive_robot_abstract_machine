schema_version: 1
id: ontomatic-port
title: Port Ontomatic and the paper's EQL/ORMatic work to upstream
description: 'Bring Ontomatic (OWL ontology to KRROOD model, ABox loading with OWL 2 RL materialization,
  AAMAS 2027 paper Section 5) from the fork''s aamas27-experiments branch onto current main as a clean
  rewrite-in-place, and land the paper''s EQL/ORMatic work alongside it. Closing the OWL 2 RL gaps and
  going past RL is ontomatic-reasoning.

  '
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 507
waves:
- id: port
  name: Port to upstream
  description: Parity with the paper on current main, cleaned up per AGENTS.md.
tracks:
- id: paper-eql-ormatic
  name: Paper EQL/ORMatic work
  wave: port
  description: Split aamas27-unification-revision (15 commits) into per-root-cause PRs off main.
- id: ontomatic-core
  name: Ontomatic port
  wave: port
  description: Descriptors, terminology, compiler, loader, check, verification, experiments.
items:
- id: eql-predicate-call-memo
  branch: eql-predicate-call-memo
  title: 'EQL: call each predicate once per distinct argument tuple'
  track: paper-eql-ormatic
  depends_on:
  - eql-existential-semantics/correlated-quantifiers
  status: not_started
  notes: Source commit 08f9178dd2 on aamas27-unification-revision.
- id: ormatic-collection-translation
  branch: ormatic-collection-translation
  title: 'ORMatic: translate EQL over collection-valued attributes to SQL'
  track: paper-eql-ormatic
  depends_on:
  - eql-existential-semantics/correlated-quantifiers
  status: not_started
  notes: Source commits 5f4cfb9aee, eeeb2e48db.
- id: ormatic-identifier-selection
  branch: ormatic-identifier-selection
  title: 'ORMatic: select identifiers such as IRIs and join only the tables a query needs'
  track: paper-eql-ormatic
  depends_on:
  - ormatic-collection-translation
  status: not_started
  notes: Source commits aa8e9299a3, 67a666b1e2, 20f6990f69, f083e650c4.
- id: ormatic-reference-fixes
  branch: ormatic-reference-fixes
  title: 'ORMatic: keep same-class references, reject a variable used as a condition'
  track: paper-eql-ormatic
  depends_on:
  - ormatic-identifier-selection
  status: not_started
  notes: Source commits 8316e4c8b8, 9936287aac.
- id: descriptor-characteristics
