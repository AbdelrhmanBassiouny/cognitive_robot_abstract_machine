schema_version: 1
id: ontomatic-port
title: Port Ontomatic to upstream, harden it, and grow it past OWL 2 RL
description: >
  Bring Ontomatic (OWL ontology to KRROOD model, ABox loading with OWL 2 RL materialization,
  AAMAS 2027 paper Section 5) from the fork's aamas27-experiments branch onto current main as a
  clean rewrite-in-place, land the paper's EQL/ORMatic work alongside it, close the OWL 2 RL
  gaps the supplement lists, then extend it natively in Python towards OWL 2 DL.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 507
waves:
- id: port
  name: Port to upstream
  description: Parity with the paper on current main, cleaned up per AGENTS.md.
- id: robustness
  name: Close the OWL 2 RL gaps
  description: The supplement's unsupported and partial rules, and the paper's limitations.
- id: beyond-rl
  name: Beyond OWL 2 RL, natively in Python
  description: Profile detection, EL classification, witnesses, open-world query answers.
tracks:
- id: paper-eql-ormatic
  name: Paper EQL/ORMatic work
  wave: port
  description: Split aamas27-unification-revision (15 commits) into per-root-cause PRs off main.
- id: ontomatic-core
  name: Ontomatic port
  wave: port
  description: Descriptors, terminology, compiler, loader, check, verification, experiments.
- id: rl-gaps
  name: OWL 2 RL gaps
  wave: robustness
  description: Independent PRs, each proven by a failing test first.
- id: dl-extensions
  name: OWL 2 DL extensions
  wave: beyond-rl
  description: Sound always, complete where a tractable procedure exists, explicit otherwise.
items:
