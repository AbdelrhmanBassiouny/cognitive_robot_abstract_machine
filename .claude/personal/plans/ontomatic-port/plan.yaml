  notes: Port ontomatic/property_descriptor/mixins.py from aamas27-experiments onto main's descriptors.
- id: descriptor-provenance
  branch: descriptor-provenance
  title: Inferred facts with provenance and fact placement in PropertyDescriptorRelation
