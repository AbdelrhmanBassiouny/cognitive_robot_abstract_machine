- id: eql-truth-unification
  title: Unified OperationResult truth
  branch: claude/eql-truth-unification-refactor-pfux7f
  pull_request_number: 99
  track: eql-core
  depends_on:
  - eql-core-prep
  status: done
  session: https://claude.ai/code/session_01YTSdjBA54dAdBxsCujdjTX
  notes: '`OperationResult.is_false` is dropped, truth reads from `bindings[operand._id_]`, and `is_condition_false`
    is gone. Two divergences from the design doc, which predated the code: the invariant needed qualifying,
    since for entities, aggregators and arithmetic the single binding is the selected value, so a verbatim
    reading dropped query results whose value was 0 or empty — `TruthValuedExpression` tells truth-binding
    from value-binding expressions apart, and only truth-recording roots are filtered by truth. And the
    field was removed outright rather than transitioned through a flag, so a missed call site fails loudly.


    Reconciled onto conditions-root-drop-dead-parent-recovery, which merged first and had independently
    added a `_true_results_()` that filtered on `is_true` unconditionally — the very bug this item exists
    to fix. The method keeps its name and gains this branch''s guard.'
