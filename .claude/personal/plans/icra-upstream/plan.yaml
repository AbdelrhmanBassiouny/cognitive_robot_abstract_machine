schema_version: 1
id: icra-upstream
title: ICRA work lands upstream, one final-tree pull request at a time
description: The ICRA tip (real-experiments-tracy-icra-2026) holds 669 files not on main.
  Each item cuts one layer of that final tree into a pull request based on main or on the
  layer below, so every file is reviewed once; libraries first, then Montessori, experiments,
  Tracy and the paper. The pull requests each item supersedes close naming it. Replaces icra-foundation,
  icra-evidence and icra-mechanism.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 521
waves:
- id: libraries
  name: Library packages
  description: Every experiment imports these; smallest first so other teams see them early.
- id: montessori
  name: Montessori
- id: experiments
  name: Experiments
- id: tracy-and-paper
  name: Tracy and paper
tracks:
- id: libraries
  name: Libraries
  wave: libraries
- id: montessori
  name: Montessori world, actions and monitoring
  wave: montessori
- id: experiments
  name: Scenarios, episodes and questions
  wave: experiments
- id: tracy-and-paper
  name: Tracy, open slots and paper
  wave: tracy-and-paper
items:
- id: probabilistic-relational-circuit
  title: probabilistic_model gains the relational circuit
  branch: icra-upstream/probabilistic-relational-circuit
  track: libraries
  status: not_started
  notes: 'About 660 lines, all from #265. First to promote to cram2: smallest and self-contained.'
- id: giskardpy-executor-statecharts
  title: giskardpy executor and motion statechart changes
  branch: icra-upstream/giskardpy-executor-statecharts
  track: libraries
  status: not_started
  notes: 'About 290 source lines from #265. Overlaps Simon''s statechart work on his fork:
    send him the patch first and land whatever he does not absorb.'
- id: krrood-eql-changes
  title: 'krrood EQL: backends, match, mapped variables, predicates, JSON serializer'
  branch: icra-upstream/krrood-eql-changes
  track: libraries
  status: not_started
  notes: 'About 4,400 source lines from #265, the #355 chain, #408, #416 and #417; split in
    two if review needs it. Check each change against ontomatic-port first, which lands the
    AAMAS EQL work, and fold any overlap into that item instead.'
- id: place-grasp-rebased
  title: Settle how a place learns the grasp it carries, against main rather than a branch
  branch: claude/the-place-an-insertion-builds-on
  pull_request_number: 422
  track: libraries
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01RyWyuVvJYP9E3gWEw7Z8qF
  notes: 'main gained PlaceAction._grasp_description in 98d847a776. #295 and #296 both forked
    before that, and #296 meanwhile built _how_the_object_is_held for the same job plus the
    grasp_description field that feeds it. So this is #296 diverging from main, not from another
    branch -- a shape only a per-pull-request scan against main can see, and the reason a
    pairwise scan missed it. #422 resolves it by keeping main''s method and folding #296''s
    stated-grasp preference in as its first branch, which is how #355 resolved it on the integration
    branch.'
- id: insertion-action
  title: An insertion is an action of its own
  branch: claude/an-insertion-is-an-action-of-its-own
  pull_request_number: 423
  track: libraries
  depends_on:
  - place-grasp-rebased
  status: in_progress
  session: https://claude.ai/code/session_01RyWyuVvJYP9E3gWEw7Z8qF
  notes: 'Extracted from #355''s 8483223f69: the InsertAction designator, the landing_region
    move from the montessori ShapeSortingHole up to Aperture, the coraplex test datasets and
    295 lines of tests. Import- and attribute-verified against its base tree by AST. That
    check is what found the two dependencies a file-level one misses -- InsideOf(minimum_containment_ratio=...)
    needs #229 and PlaceAction(grasp_description=...) needs #296, both keywords whose fields
    live in files the commit never touches.'
- id: coraplex-actions-on-cramph
  title: coraplex pick-up, place and insertion, ported onto cramph statechart nodes
  branch: icra-upstream/coraplex-actions-on-cramph
  track: libraries
  depends_on:
  - krrood-eql-changes
  - insertion-action
  status: blocked
  blockers:
  - cramph (Jonas Dech, Tigul/plan-cramp-second-iter) has to reach main; it retires the PlanNode,
    executables and underspecified classes the ICRA changes edit.
  notes: 'About 2,100 source lines from #265, #422, #423 and the #355 chain. Ported onto cramph
    (decided Oct 20) rather than landed on the classes cramph retires; eql-planning builds
    on the same actions.'
