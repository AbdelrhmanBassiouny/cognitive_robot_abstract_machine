schema_version: 1
id: plan-dashboards
title: 'The plan dashboard: what it shows, what it gets wrong, and what it can publish'
description: The renderer behind /plan-dashboard. Bug fixes to what it computes about an item's
  readiness and drift, chips and toggles that keep a large plan legible, and the shared pull-request-state
  module that lets one page carry CI, size and conflict information rather than only the manifest's
  own view of itself.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: corrections
  name: What the dashboard computes
  description: Bugs in readiness, drift and merge-state classification, each fixed on its
    own root cause.
- id: legibility
  name: Keeping a large plan readable
  description: Chips, toggles and the masthead - what a plan with dozens of items needs to
    stay an overview.
- id: live-state
  name: Live pull request state on the page
  description: The shared fetch/compute module, and the promotion surface it makes possible.
tracks:
- id: corrections
  name: Computation fixes
  wave: corrections
- id: legibility
  name: Legibility and navigation
  wave: legibility
- id: live-state
  name: Shared pull request state
  wave: live-state
items:
- id: deferred-dependency-drift-check
  title: Flag an item stacked on a deferred/closed dependency instead of leaving it to a stale
    note
  branch: claude/deferred-dependency-drift-pr-qxpfsm
  pull_request_number: 184
  status: in progress
  session: https://claude.ai/code/session_01VBa9VPHJW4VjpWtdq1XLE2
  track: corrections
  depends_on: []
  notes: 'Found 2026-08-12 in `rdr-refactor`''s D-ui stack: `D-ui-splice-fix` was closed as
    superseded, but `D-ui-rendering` still depends on it and is still in progress, with no
    automated signal anywhere that its base is dead - only a previous session''s freeform
    note, which nothing re-reads. `_drift_description_of` only compared an item''s own status
    against its own live state, and `_compute_next_steps` only evaluates not-started and blocked
    items, so an in-progress item stacked on a dead dependency slipped past every check.'
- id: deferred-items-hidden-by-default
  title: Hide deferred items in the dashboard by default, behind their own toggle
  branch: claude/hidden-deferred-plan-items-6weef1
  pull_request_number: 157
  status: in progress
  session: https://claude.ai/code/session_015Fy3XzLVV5i2amFd9Mkh5Q
  track: legibility
  blockers:
  - Under upstream review as cram2/cognitive_robot_abstract_machine#725, which sits on this
    branch's current head 3fe59780d.
  depends_on: []
  notes: 'A deferred item is intentionally paused or superseded, so it is the same kind of
    noise on a dashboard as a done one, and done items have been hidden behind a sidebar toggle
    since the dashboard existed. `rdr-refactor` shows it: eight of its items are deferred
    and sit inline among the live ones. This gives deferred its own checkbox, hidden by default,
    parallel to "Show done / merged items". The substance is the indentation, not the checkbox.'
- id: dashboard-refresh-button
  title: Refresh button in the dashboard masthead, copying the command that rebuilds the page
  branch: claude/rdr-dashboard-refresh-button-tpuvo9
  pull_request_number: 206
  status: in progress
  session: https://claude.ai/code/session_0112C4kGpRE6uLmi5Lwkghx2
  track: legibility
  depends_on: []
  notes: 'Raised while refreshing a dashboard: a published page is a snapshot of the moment
    it was rendered and nothing on it can republish it, so getting a current one meant recalling
    both the skill name and the plan''s id from outside the page that needs them. The masthead
    now carries a Refresh button copying `/plan-dashboard <plan-id>`, with a hint beside it
    so it is not read as an in-page reload.'
- id: shared-pr-state-chips
  title: 'PR 3: shared pull_request_state module + LOC/CI/conflict chips in plan dashboards'
  branch: claude/shared-pr-state-chips
  pull_request_number: 111
  status: in progress
  session: https://claude.ai/code/session_01PDkiMhjnoromH2KP2z8Koy
  track: live-state
  depends_on: []
  notes: One pull-request-state fetch/compute module - CI rollup, lines changed against base,
    mergeable probe, session-link parse - shared by `stack.py` and the dashboard's own pull-request
    data fetching, plus board-semantics chips on dashboard items and a headless static-HTML
    build entry point for the Pages Action, with the Artifact path still working during the
    transition. `pr_state` also reads a pull request's native stack object through REST, GraphQL
    being unusable from sessions, and renders a stack chip when the pull request is a stack
    member; that addition is specified but not yet implemented.
  blockers:
  - 'Cross-plan dependency, not representable in depends_on: this branch is stacked on basstler-package
    (#185, basstler-package plan) since 2026-09-02 - its base is that branch and its modules
    are folded into the package. #185 is open, out of draft and promoted upstream (cram2-link-sent)
    but unmerged.'
  - 'Two review threads from the 2026-08-30 round are left open on purpose, each answered
    on the thread and waiting on the user: GitCommandRunner in the tests (answered with ScratchRepository,
    because GitCommandRunner imports basstler.stack, which imports pull_request_state) and
    the "discuss the rebase…'
- id: cross-plan-dependencies
  title: Let depends_on name an item in another plan, resolved live at dashboard time
  branch: claude/plan-dashboards-cross-dependencies-h3icfd
  pull_request_number: 253
  track: corrections
  session: https://claude.ai/code/session_01U2r4CGpBKiD551i2FE5NXW
  depends_on: []
  status: in progress
  notes: 'Decided by the developer on 2026-09-03, taking the roadmap''s open entry "Cross-plan
    dependencies are not representable" and choosing the reference form `<plan-id>/<item-id>`
    (a slash cannot occur in either kebab-case id, so a bare id keeps meaning this plan).
    Not a bug fix: tooling that never existed, so no `bug` label. What it changes. The schema
    (plan-schema.md) admits the form.'
- id: ready-to-promote-upstream-links
  title: 'PR 5: ready-to-promote sidebar list + one-click upstream create-pull-request links'
  branch: null
  status: not started
  track: live-state
  depends_on:
  - shared-pr-state-chips
  notes: 'A fifth sidebar group - "Ready to promote" - listing every item whose fork pull
    request is open-and-ready, cleanly mergeable and based on the fork''s default branch,
    each with a one-click link opening the upstream compare-and-create page with the title
    and body prefilled and the fork pull request linked from it. This is the Routine''s phase-3
    link building turned into a surface instead of an emailed summary: the same compare URL,
    computed at dashboard build time, so it reaches the user with no scheduled run - which
    is what the cutover requires of every deterministic duty.'
