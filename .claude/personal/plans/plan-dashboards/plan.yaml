schema_version: 1
id: plan-dashboards
title: 'The plan dashboard: what it shows, what it gets wrong, and what it can publish'
description: The renderer behind /plan-dashboard. Bug fixes to what it computes about an item's readiness
  and drift, chips and toggles that keep a large plan legible, and the shared pull-request-state module
  that lets one page carry CI, size and conflict information rather than only the manifest's own view
  of itself.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: corrections
  name: What the dashboard computes
  description: Bugs in readiness, drift and merge-state classification, each fixed on its own root
    cause.
- id: legibility
  name: Keeping a large plan readable
  description: Chips, toggles and the masthead - what a plan with dozens of items needs to stay an
    overview.
- id: live-state
  name: Live pull request state on the page
  description: The shared fetch/compute module, and the promotion surface it makes possible.
tracks:
- id: corrections
  name: Computation fixes
  wave: corrections
- id: legibility
  name: Legibility and navigation
  wave: legibility
- id: live-state
  name: Shared pull request state
  wave: live-state
items:
- id: ready-to-start-dependency-free-fix
  title: Fix ready-to-start dashboard list dropping dependency-free items
  branch: claude/funny-feynman-wexezs
  pull_request_number: 103
  status: done
  session: https://claude.ai/code/session_016mfBqcBibxA7Wa5eNfWtoL
  track: corrections
  depends_on: []
  notes: |-
    Merged. `_compute_next_steps` skipped items with no dependencies at all, so a dependency-free
    not-started item never reached the ready-to-start list. Found when `plan-updates-since-helper`
    failed to appear in the sidebar. Fixed with a failing test first, plus a companion test pinning that
    a dependency-free *blocked* item stays out of both lists.

    Two pre-existing tests carried an incidental dependency-free not-started fixture item that
    legitimately became ready-to-start under the corrected semantics; that item's status changed to
    blocked so each test keeps isolating only the behaviour it names, with no assertion touched.
- id: dependency-chips-blocked-fix
  title: Show unmet dependency chips as blocked on plan dashboards
  branch: claude/plan-dashboard-dependencies-1am49n
  pull_request_number: 105
  status: done
  track: corrections
  depends_on: []
  notes: |-
    Merged. Renders an item's unmet dependencies as blocked chips instead of neutral ones. A
