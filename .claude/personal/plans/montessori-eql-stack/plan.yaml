schema_version: 1
id: montessori-eql-stack
title: "Montessori demo EQL stack"
description: >
  The six-PR stacked chain that takes the Montessori demo from a fast inline
  monitor to a fully interactive EQL console: workspace-wide class naming with
  as-you-type completion, "where is ...?" queries with viewer highlighting,
  demo recording with replay around queried events, the asked question read
  back in English, and spoken questions answered by matching presets. One
  strict stack: each PR is based on the previous one (GitHub stack #173).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 174

waves:
  - id: stack
    name: "The stacked chain"
    description: "A single sequential stack; each item lands on top of the previous."

tracks:
