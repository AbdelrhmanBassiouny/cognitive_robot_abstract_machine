schema_version: 1
id: montessori-eql-stack
title: "Montessori demo EQL stack"
description: >
  The six-PR stacked chain that takes the Montessori demo from a fast inline
  monitor to a fully interactive EQL console: workspace-wide class naming with
  as-you-type completion, "where is ...?" queries with viewer highlighting,
  demo recording with replay around queried events, the asked question read
  back in English, and spoken questions answered by matching presets. One
  strict stack: each PR is based on the previous one (GitHub stack #173).
  A second wave extends the landed stack with acting from the console,
  annotated replay, and live tabbed panels.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 174

waves:

  - id: stack
    name: "The stacked chain"
    description: "A single sequential stack; each item lands on top of the previous."

  - id: interactive-ui
    name: "Interactive UI extensions"
    description: >-
      Features on top of the stack: performing actions from the console,
      annotating event replay, and live tabbed panels. Unlike the stack,
      these tracks can run in parallel.

tracks:

  - id: montessori-eql
    name: "Montessori demo EQL features"
    wave: stack

  - id: action-execution
    name: "Acting from the console"
    wave: interactive-ui
    description: "Executing robot actions from the query console."

  - id: replay-annotation
    name: "Annotated event replay"
    wave: interactive-ui
    description: "Overlays that explain a replayed segmind event inside the video."

  - id: live-panels
    name: "Live tabbed panels"
    wave: interactive-ui
    description: >-
      A tabbed panel area in the viewer with live views of the running demo,
      and the window management to arrange those tabs freely.

items:
  - id: montessori_fast_inline_monitor
    title: "A monitor tick cheap enough to stay on the planning thread"
    branch: montessori_fast_inline_monitor
    pull_request_number: 169
    track: montessori-eql
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01HPQPiabgjE3yuBHd5skUR3
    notes: >-
      Base of the stack. On 2026-08-18 main was merged in twice. The first
      merge (608bc7fe6) cleared the conflicts that had left it dirty, plus the
      two integration breaks it exposed: the giskardpy/executor.py semantic
      conflict and a pacer built the way main no longer allows. 7a9af9cd0 then
      fixed the ORMatic bug failing this branch's experiments job at
      collection, and 9877e5b99 restored PickUpAction's AttachNode and
      PlacingAction's DetachNode behind Context.update_world_model_attachment,
      which is what 8cc3cf69 had commented out wholesale. A second main merge
      (334796ab) followed once main reached 90c241168; its one conflict,
      Body.has_collision, took the resolution #170 had already settled on, and
      f44c76d73 brought down the test that pins it. The two demo directories
      08257863 never committed, coraplex_warehouse_storage_demo and
      coraplex_wind_farm_service_demo, are no longer a red job: 9877e5b99 gave
      test_warehouse_storage_layout and test_wind_farm_service_layout a skipif
      on the directory's absence, following the one test_franka_panda_equipment
      already uses, so they start running by themselves once the demos land.
      06582ca32 then made a checkout with no
      generated ORM interfaces build them instead of failing a world build into
      the run, porting ijcai-tutorial's OrmInterface/WorkspaceOrmInterfaces into
      the meta-package and running it as a second pre-flight in
      run_montessori_demo.sh. The PR description, which was still GitHub's
      auto-generated one describing unrelated demo scripts, was replaced with
      the branch's real one in the same round. 232b8ba19 then stopped tracking
      the generated ormatic_interface.py files altogether, which is what had
      made every branch switch abort while a checkout held its own generated
      copy; the whole stack, #175, #176 and #177 were restacked onto it so the
      fix reaches all of them. Now 232b8ba19, mergeable.

  - id: cramera_eql_autocomplete
    title: "Name any class of the workspace in a query, and complete as you type"
    branch: cramera_eql_autocomplete
    pull_request_number: 170
    track: montessori-eql
    depends_on: [montessori_fast_inline_monitor]
    status: in_progress
    session: https://claude.ai/code/session_01PwwiAsZeaJSjECjsWEtkog
    notes: >-
      Marked ready for review. Also carries the local-environment fixes (lark,
      sdt ORM duplicate table, costmaps inflation memory, detector-test frames)
      and the Symbol/Match-default rounds; per-round detail in
      pr-progress/cramera_eql_autocomplete.md. On 2026-08-18 cram2/main was
      merged in and the branch force-pushed as 03b3130a5; its one conflict
      (Body.has_collision) went to main's version, and the giskardpy executor
      NameError that a5080fd08 fixed on #169 was fixed here too. Later the same
      day the branch took the has_collision follow-up (a flat primitive no longer
      builds a mesh) and merged #169's tip 6d944c52e, whose only conflict was
      that both branches had independently fixed the segmind detector tests'
      frameless matrices; this branch's _move_milk helper was kept. Restacked
      again onto #169's f44c76d73 as 0e6f0bd32 (via e72937047), a content-neutral merge: #169
      had by then adopted this branch's own has_collision resolution. Restacked
      again for the ORM-untracking fix 232b8ba19: 42f3e464c.

  - id: montessori_eql_where_is_highlighting
    title: "EQL \"where is ...?\" queries with general viewer highlighting"
    branch: montessori_eql_where_is_highlighting
    pull_request_number: 164
    track: montessori-eql
    depends_on: [cramera_eql_autocomplete]
    status: in_progress
    notes: >-
      Rebased onto cramera_eql_autocomplete on 2026-08-18 (was based on
      montessori_fast_inline_monitor); reparent needed a native GitHub-stack
      dissolve, see roadmap. Restacked the same day by merging the base's
      current tip in rather than rebasing: 10ca075c2, cramera suite 488, then
      again onto the post-main-merge base, once more for 06582ca32, and again
      for the ORM-untracking fix: dc28b7d56.

  - id: montessori_event_replay
    title: "Record the live demo and replay it around queried segmind events"
    branch: montessori_event_replay
    pull_request_number: 165
    track: montessori-eql
    depends_on: [montessori_eql_where_is_highlighting]
    status: in_progress
    notes: >-
      Restacked on 2026-08-18 by merging the base in: 4d9d9ad33, cramera suite
      544, then again onto the post-main-merge base, once more for 06582ca32,
      and again for the ORM-untracking fix: b8f970a93. Its history
      carries stale duplicates of #164's commits and internal pre/post-merge
      duplicates, which is why the rounds merged rather than rebased.

  - id: cramera-question-readback
    title: "Read the asked query back big under the bar, linked to its docs"
    branch: claude/cramera-verbalization-voice-ttwcza
    pull_request_number: 167
    track: montessori-eql
    depends_on: [montessori_event_replay]
    status: in_progress
    notes: >-
      The 2026-08-18 restack dropped this branch's stale copies of #164/#165
      commits and amended an EqlSuggestions stub into its panel test harness
      (a semantic conflict with the autocomplete feature git could not see).
      Restacked again later that day by merging the base in: 408f4511b,
      cramera suite 566, then onto the post-main-merge base, once more for
      06582ca32, and again for the ORM-untracking fix: 3964d20eb.

  - id: cramera-voice-questions
    title: "Answer a spoken question by running the preset it asks for"
    branch: claude/cramera-voice-questions-ttwcza
    pull_request_number: 168
    track: montessori-eql
    depends_on: [cramera-question-readback]
    status: in_progress
    notes: >-
      Top of the stack. rapidfuzz dependency is declared in
      cramera/requirements.txt. Restacked on 2026-08-18 by merging the base in:
      5acc3d83f, cramera suite 598 and all 216 node tests green, then onto the
      post-main-merge base, once more for 06582ca32, and again for the
      ORM-untracking fix: c567ee221.

  - id: montessori_perform_queried_action
    title: "Perform a queried action from a perform button on its result"
    branch: claude/queried-action-perform-button-vg2vz3
    pull_request_number: 176
    track: action-execution
    depends_on: [montessori_event_replay]
    status: in_progress
    session: https://claude.ai/code/session_018omV81SkveD53Q5mvEiKtP
    notes: >-
      Mirrors the replay button queried segmind events get in #165: an action
      returned by a query carries a perform button that executes it on the
      robot when pressed. Implemented on 2026-08-18 and pushed as 2dee8f57,
      based on #165 and restacked onto its post-main-merge tip b76c8ede8 in the
      same session, then onto its 06582ca32 restack as acc2a1c0a and onto the
      ORM-untracking fix as 7a73346df. The branch keeps the session's
      own designated name rather than the manifest's, as
      montessori_replay_event_annotations already does - the harness allows
      pushing nowhere else. Draft PR #176 opened the same day, based on #165. cramera suite 566 green; the experiments suite
      cannot run outside the CI container (no rclpy, empty ORM interfaces,
      uninitialised cramera/scenes submodule), so its new tests were run with
      --noconftest instead.

  - id: montessori_run_written_action
    title: "Write a new under-specified action and run it with a run button"
    branch: montessori_run_written_action
    pull_request_number: null
    track: action-execution
    depends_on: [montessori_perform_queried_action]
    status: not_started
    notes: >-
      The user types an under-specified action into the console; pressing the
      run button resolves the missing parameters and executes it. Builds on
      the execute-from-the-console machinery the perform button introduces.

  - id: montessori_replay_event_annotations
    title: "Label a replayed event in the video, with arrows tracking its objects"
    branch: claude/label-replayed-event-tracking-vj0x2z
    pull_request_number: 177
    track: replay-annotation
    depends_on: [montessori_event_replay]
    status: in_progress
    session: https://claude.ai/code/session_01XVBfkBE9UCvRtcarKufjUH
    notes: >-
      During replay of a segmind event, show the event's name in the video
      with an arrow from the label to each involved object; the arrow tips
      follow the objects as they move. Started 2026-08-18 on the session's own
      designated branch rather than the planned
      `montessori_replay_event_annotations`, based on #165's current tip
      5cf53c5a. Draft #177 opened the same day with the whole item implemented:
      the answer row's replay entry became a ReplayedMoment (window, label,
      objects), the demo's SegmindEventRecord names its objects, and the scene
      panel draws the caption and its arrows from a pure
      core/event_annotation.js. cramera suite 551 green; test/experiments_test
      could not run in that environment (no rclpy). Restacked onto #165's
      current tip together with the ORM-untracking fix: 17b2a07de.

  - id: montessori_live_event_timeline_tab
    title: "A tabbed panel with a live timeline of detected segmind events"
    branch: montessori_live_event_timeline_tab
    pull_request_number: 175
    track: live-panels
    depends_on: [montessori_fast_inline_monitor]
    status: in_progress
    session: https://claude.ai/code/session_01X3d7gwqJqim7D39XJPpJij
    notes: >-
      Replaces the fixed knowledge-graph frame at the bottom of the right column
      with a selectable tab widget; its first new tab plots segmind events live
