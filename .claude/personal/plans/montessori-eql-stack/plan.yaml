  - id: montessori_plan_graph_tab
    title: "A plan-graph tab highlighting the executing plan node in real time"
    branch: claude/plan-graph-executing-node-hqkt32
    pull_request_number: 178
    track: live-panels
    depends_on: [montessori_live_event_timeline_tab]
    status: done
    session: https://claude.ai/code/session_011zuYnHUJtJLYs48VikWaYn
    notes: >-
      Implemented on 2026-08-18 as 8de5cf76, based on #175 and restacked onto
      its ORM-untracking tip 2d7f7b183 in the same session (6a496668). Draft
      #178 opened the same day, based on #175. The branch keeps the session's own designated name rather than the manifest's,
      as `montessori_perform_queried_action` and
      `montessori_replay_event_annotations` already did. The item was *not*
      redundant, but it is a replacement rather than an addition: the plan tree
      already existed as one of four sub-tabs inside the graph panel, so it was
      extracted into a panel of its own (`panels/plan_graph`) and mounted as a
      tab beside Graph and Events, and the graph panel's own Plan tab was
      dropped. Two real defects of the old tab were fixed on the way: every node
      between the root and the running step read RUNNING (the bridge now
      publishes `executing` on `/plan` - the running nodes with no running child
      - which the panel draws with its own EXECUTING ring, names above the tree,
      and centres on as execution moves), and the tab only reached the bridge
      once the recorded plan view had loaded, so a bundle whose plan view errors
      never showed the running plan at all. `graph.js` became
      `GraphView.create(container, legend)`, since two panels drawing graphs
      cannot share one renderer; `core/split-resize` now announces a drag as
      `panel:resized` on the bus instead of reaching for the renderer global.
      205 node tests green; the cramera pytest suite could not run in this
      session's container (random_events_lib is a workspace C++ extension that
      is not built there), so its Python tests were left to CI. On 2026-08-18
      the developer reported the plan showing for a moment at startup and then
      disappearing: a fourth defect, and this one in the bridge rather than the
      panel. `/plan` had no tree at all, because the plan was captured by a hook
      on `Plan.perform`, which a montessori run never calls - coraplex's
      `execute_single` hands back the root *node* and the caller performs that.
      Fixed in da2e062e3d by moving the hook to `PlanNode.perform` and reading
      the plan off the node (which covers `Plan.perform` too, since that
      performs its root); `Bridge.begin_plan` became `follow_plan`, a no-op when
      re-entering the plan already being followed. That round also fixed
      `test_knowledge_views`, red since this branch dropped the plan view's
      `live: "plan"` flag. 474 cramera tests and 234 node tests green - the
      suite does run in this session's container. Folded into #169 the same
      day at the developer's request, exactly as
      montessori_live_event_timeline_tab was:
      `claude/plan-graph-executing-node-hqkt32` was merged into
      `montessori_fast_inline_monitor` local and remote, and the merge
      fast-forwarded (f980badc80..da2e062e3d), so the whole plan-graph tab now
      ships inside #169. #178 stays *open* rather than closing itself, because
      its base is `montessori_live_event_timeline_tab` - a branch still sitting
      at f980badc80 - and not the branch the work was merged into.

  - id: montessori_detachable_panels
