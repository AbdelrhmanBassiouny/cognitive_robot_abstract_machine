    ignored_base_classes replacing a mid-method SymbolicCallable import. Full detail:
    pr-progress/eql-symbolic-function-sdt.md.

    2026-09-03 resolve run: the `Reachable` wording question this item was recorded as waiting on is
    no longer open. #229's thread r3896606294 — the developer's *"Pose Is reachable by Tip"*,
    replied to with decision 11's longer *"a Pose is reachable for the kinematic chain rooted at
    <root> and ending at <tip>"* as the alternative and deliberately left open for him to pick — now
    reads resolved on #229, where the shorter wording is what stands. A resolve is not a sentence,
    so this is read rather than stated: treat #229's shorter wording as the one to apply in the
    rebase, and put it back to the developer if he says otherwise. Decision 11 in `roadmap.md` is
    superseded to that extent.
