  notes: 'Closed 2026-07-31 as superseded by #118, which fixed the same rule-tree splice defect at the
    façade level from the owning rule-tree context, rather than by reintroducing `_last_parent_of_type_`
    — a symbol main had deleted, and a structural-accessor read dag-facade-hardening''s guard test forbids.
