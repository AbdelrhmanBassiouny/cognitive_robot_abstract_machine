schema_version: 1
id: rdr-interface-and-decorator
title: The interactive expert interface and the @rdr decorator
description: 'What a user of the engine touches: the case-table rendering, the IPython shell and its magics
  that ask the expert for conditions and conclusions, the @rdr decorator that declares a model, and the
  file store that holds it. Stacked on the core engine''s tip and merged after it.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 94
waves:
- id: surface
  name: The user-facing surface
  description: Two stacked chains, rendering then the shell, then the decorator and its store.
tracks:
- id: interactive
  name: Rendering and the interactive shell
  wave: surface
  description: Case tables, the IPython interface and its magics.
- id: decorator
  name: The decorator and its model store
  wave: surface
  description: '@rdr, its template, and the RDRFileStore lifecycle.'
