    main, and asserts through `walk_rules`/`classify_case`, so #118 covers the defect DSL-only at the
    accessor''s own contract level. The test can be re-added against the fixed API once `test_eql_rdr/`
    lands, and needs no production change to pass. The branch is kept, which is what let D-ui-rendering
    and D-ui be rebuilt without it.'
