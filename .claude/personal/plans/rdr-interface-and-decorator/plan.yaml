  session: https://claude.ai/code/session_01W5rkhDr2xdFuFVExi6bXb4
  notes: 'Rebuilt onto `D-core-backend` (#210) on 2026-08-30, which is what unblocked it: its old base
    `D-ui-splice-fix` (#78, closed unmerged) led nowhere, and the re-target its own note prescribed —
    `D-core-engine` (#68) — is deferred and leads nowhere either. Rebuilt as a branch reset rather than
    a merge so #78''s production commit (reintroducing `_last_parent_of_type_`, superseded by #118 and
    forbidden by dag-facade-hardening''s Wave-1 guard) stays out of #79''s diff; pre-rebuild tip `0a305c68`
    if it is ever wanted back. `depends_on` now names `d-core-backend`, which is where the branch actually
    sits.

    Three interfaces had moved under the branch in the six weeks it spent on a dead base and the ported
    tests were brought up to them; the two `save_path` test classes went with `EQLSingleClassRDR.save_path`
    itself, their replacement already covered by `test_fit_convergence.py` and `test_serialization.py`.
    See roadmap.md §34.

    2026-08-30 (later): a fresh `/plan-item-resolve` session picked this item up again and found a review
    round the rebuild above had drawn minutes after it pushed — 11 threads (missing docstrings and `:param:`/`:return:`
    docs, missing dataclass field docstrings, four abbreviated names, one box-drawing divider), never
    recorded here since the previous session had already reported itself finished. Applied and pushed
    as `8dc1a7c8`: every function/method/field across all eight files this PR adds now has a docstring,
    the flagged abbreviations (`_val`/`attr` in `case_table.py`, `ser` in `test_case_serializer.py`, `_animal_var`/`_mixed_alt_then_ref_query`
    in `test_rule_order.py`) are spelled out along with the rest of the same names in the same functions,
    and the divider is `# %%`. All eleven threads replied to individually (naming the commit) and resolved.
    `test_eql_rdr` unchanged: 341 passed, 0 failed. Draft was already `true`, so no restore-to-draft was
    needed. See roadmap.md §35.


    2026-08-30 (resolve): `case_table.py` gained `CaseColumnLabel` (`5a84033eb`), the `StrEnum` behind
    `render_cases_side_by_side`''s `new_label`/`corner_label` defaults. The ask was raised on #76 and
    the reviewer directed it here, since the file is this slice''s. `test_case_table_side_by_side.py`
