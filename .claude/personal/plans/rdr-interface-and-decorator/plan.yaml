- id: D-store
  title: 'D-store: RDRFileStore for the @rdr model-file lifecycle'
  branch: D-store
  pull_request_number: 80
  track: decorator
  depends_on:
  - D-ui
  status: in_progress
  notes: 'Path resolution + model-file lifecycle; standalone, no decorator dependency.


    2026-08-30 (later): a `/plan-item-resolve` session read the branch''s live state and found the restack
    the roadmap''s Open section predicted, never recorded on the item: the head is from 2026-07-19, its
    CI is red, and the branch was skipped by two maintenance passes. Recorded as blockers before any work
    started.


    The slice''s own content survives the rebuild intact - one commit, two new files, and neither exists
    on the rebuilt base - but it was written against interfaces that have since moved, the same class
    of drift #79 and #76 each hit: `FunctionInterface(answer_fn=...)` is `answer_function`, `rdr.utils.UNSET`
    is gone in favour of `...`, and the answer-dictionary keys are `AnswerName` members.


    The rebuilt base also now carries a `ModelSaver` abstraction whose `FileModelSaver` performs `RDRFileStore.save`''s
    exact body, so the store is rebuilt as a `ModelSaver` rather than as a second, parallel persistence
    path - which is also what lets `@rdr` hand the store straight to `rdr.model_saver`, the seam #76 moved
    `%save` onto.


    2026-08-31 (resolved): rebuilt as a branch reset onto `D-ui`, per decision 1, so #78''s `cfe32ad0`
    does not survive the restack; pre-rebuild tip `07cb6831`. The slice''s own work replayed unchanged
    in shape - one commit, `rdr/file_store.py` and its test - and #80 now reads 417 additions across 5
    files rather than 14,994 across 47. Restacked a second time onto `1045c6d5a` when `D-ui` gained a
    commit mid-session. `test_eql_rdr`: 548 passed, 2 skipped, against 532 passed, 2 skipped on the base;
    whole `krrood_test`, 2359 passed, with only the two Graphviz-binary failures that fail identically
    on `main`. Verified on Python 3.12, matching CI, because on 3.11 `code_generation.imports.validate_annotations`
    raises on `parameter_name in PythonBuiltinParameterNames` - a `StrEnum` value-containment check that
    only works from 3.12, though `requires-python` says 3.10.


    The store is now a `ModelSaver`. The base grew that abstraction while this branch sat on a dead base,
    and `FileModelSaver` already performs the body `save()` would have duplicated; being one is also what
    lets `@rdr` hand the store to `rdr.model_saver`, the seam #76 moved `%save` onto. Reading a model
    before one exists raises `ModelFileMissing` rather than a bare `FileNotFoundError`.


    Two defects outside this slice had to be fixed for a saved model to load at all - see roadmap sections
    11 and 12. The template one is #226 off `main`, ported here; the `save_rdr_with_case` base-class one
    belongs to #66 and was applied here, because this is the first slice that writes a generated case
    type to a file and imports it back.'
  session: https://claude.ai/code/session_01Lr5K9cBX5g6YrFEErmJMYZ
