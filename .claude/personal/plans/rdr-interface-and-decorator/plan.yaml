- id: D-ui
  title: 'RDR engine: interactive expert interface (IPython shell, magics, prompt sections/examples)'
  branch: D-ui
  pull_request_number: 76
  track: interactive
  depends_on:
  - D-ui-rendering
  status: in_progress
  session: https://claude.ai/code/session_01W5rkhDr2xdFuFVExi6bXb4
  notes: '2026-08-23: outstanding work added from the #159 review - **default the progress reporter to
    IPythonProgressBar here**. The engine keeps NullProgressReporter, which is the only default correct
    for a caller it knows nothing about; the developer agreed the interactive default belongs in this
    layer, which is the one that knows there is a shell to draw on. Done 2026-08-30, as part of the same
    change as the ExpertInterface segregation below - see roadmap.md sections 30 and 36.

    2026-08-30: rebuilt as a branch reset onto the rebuilt `D-ui-rendering` (`5269a778`), so #78''s superseded
    `_last_parent_of_type_` commit `cfe32ad0` does not survive the restack; pre-rebuild tip `c50d2109`
    if it is ever wanted back. That commit is why the maintenance pass could not integrate the new base
    and reported 19 conflicting files. The interactive layer is now on the segregated `ExpertInterface`:
    `%save` persists through the RDR''s `ModelSaver`, and attaching an RDR to an `IPythonInterface` installs
    the shell''s progress bar in place of the engine''s null default. Also ported to `AnswerName`/`NamespaceName`,
    `conclusion_helper`''s presenter/suggester mixins, `...` for `UNSET`, and the validator/backward-inference
    renames. Two defects fixed with a failing test each: the `%conclusion`/`%conditions` magics no longer
    rejected invalid answers after `validate()` became a list, and the shipped user guide - which CI executes
    through `test_eql_documentation.sh` - still called `FunctionInterface(answer_fn=...)`. Every function,
    method and field across the 21 files this PR adds now carries a docstring. test_eql_rdr: 524 passed,
    2 skipped (341 on the base, 183 added). See roadmap.md section 36.


    2026-08-30 (later): a fresh `/plan-item-resolve` session found a 50-thread review round opened on
    #76 between 14:34Z and 17:13Z - twenty-five minutes after the rebuild session posted its own completion
    note and stopped - and none of it recorded here. Sixth instance of that staleness class on this plan.
    Applied as `a07a4458` and `c40da8fa`. The substantive part is a redesign the round asked for rather
    than conformance: the magics are classes under a `Magic` base, each carrying its own name, collaborators
    and `register(shell)`; `MagicName`, `MagicKind` and `NamespaceKey` replace the name literals and the
    four private key constants; `%knows` becomes `%sufficient_conditions_for`; the prompt sections become
    eleven `PromptSection` subclasses identified by a `PromptSectionName` member; and the 1,456-line prompt-sections
    test splits into four files named for their subjects. `rdr/__init__.py` is restored to the base, so
    the pull request no longer touches it. Magic selection and registration were reachable only through
    a real terminal, so eight tests now cover them against a shell stub. test_eql_rdr: 532 passed, 2 skipped.
    Forty-five threads replied to and resolved; five replied to and left open, because the answer differed
    from the ask or the identifier belongs to #79, #67 or the base template - see roadmap.md decisions
    5 and 6.


    2026-08-30 (later still): a `/plan-item-resolve` session read the pull request''s live state and found
    the round was not finished. The roadmap''s count of five threads answered-and-left-open is stale:
    the developer resolved three of them, accepting the answers as given (the `match`/`case` lookup table,
    the removed `except Exception: pass`, and the `elision` rename declined for want of a better word).
    The remaining two carry fresh instructions rather than agreement, and neither change lands on #76:
    the generated-model header goes to the pull request that owns `templates/rdr_module.py.jinja`, which
    is #66 (`D-core-serialization`), open and unmerged; the side-by-side column labels go to #79.


    Both dependencies read ready and the head is current: #76''s base sha is #79''s head sha, so there
    is no restack owed here. The pull request is out of draft, and nothing in the record says a session
    marked it so, which is why it was left ready rather than restored to draft.


    2026-08-30 (resolve): the two threads the reviewer answered at 21.55Z/21.56Z are worked. The side-by-side
    labels became `CaseColumnLabel` in `case_table.py` on `D-ui-rendering` where he directed them (`5a84033eb`),
    and this branch merged that tip and put `test_ipython_side_by_side.py` onto the members (`783546029`);
    that thread is replied to and resolved. `rdr/__init__.py` is out of #76''s diff for real now - the
    round''s own reply had claimed it was, but the PR-wide `format_docstrings.py` sweep had reflowed the
    base''s one-line module docstring into three, so the file stayed modified; the formatter reproduces
    that every time it runs over the file, so the sweep has to skip it. The generated-model header is
    the one thread still open, and deliberately - `templates/rdr_module.py.jinja` belongs to #66 (`D-core-serialization`),
    open and unmerged, so by the reviewer''s own rule it changes there, five branches down and in another
    plan. Replied with the proposed wording and left open pending the developer''s word on whether this
    session pushes to #66. See roadmap.md sections 7 to 9.


    2026-08-30 (resolve, second half): the developer chose to have the header change pushed rather than
    deferred, so it landed in #66 (`bb01256df`) with the first test of that header, and #76 brought its
    three `fitted_models/` copies onto the new wording (`1045c6d5a`). Both threads from the round are
    now replied to and resolved, and the item has no open review threads left. `rdr-core-engine`''s D-core-serialization
    item records the #66 side. What is knowingly inconsistent until the stack restacks: `rdr_module.py.jinja`
    on this branch is #66''s file and untouched here, so it still reads the old line while the three generated
    modules beside it read the new one, and regenerating a model on this branch before #66 arrives would
    put the old header back.'
  blockers:
  - CI has never run on this branch - the pull request reports zero check runs on any head it has had
    - so every figure recorded for it is a local measurement. This session could not close that gap either,
    because the container has no project interpreter provisioned; the suite ran with --noconftest against
    the packages the rdr modules import (415 passed, 119 skipped of 534 collected, identical before and
    after the change) and the conftest-dependent tests were not exercised.
