schema_version: 1
id: match-implicit-prediction
title: Infer predicted attributes in underspecified matches
description: >
  Make an underspecified Match read like a normal EQL query. Generative backends
  predict every unstated required field without ..., and expand required nested object
  fields automatically. Optional fields are predicted only when marked with ...;
  otherwise they keep their defaults.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
waves:
  - id: semantics
    name: Unstated means free
tracks:
  - id: match
    name: Match semantics
    wave: semantics
items:
  - id: infer-required-attributes
    branch: infer-required-match-attributes
    title: Infer required fields and expand required nested objects in generative backends
    track: match
    depends_on: []
    status: not started
    notes: >
      new-feature, based on main. GenerativeBackend.evaluate calls
      Match._infer_required_attributes_() first. Each unstated required factory
      parameter becomes ... if its type is compatible with random events, a recursively
      inferred a(Type)() if it is a constructible class, and otherwise raises a new
      RequiredAttributeCannotBeGenerated (references, unsized lists, recursive types).
      Optional fields are never inferred. Also drop the redundant hip_rotation=... in
      coraplex training_environment.py.
      Skip patterns given a domain: their objects exist, so unstated fields are not
      inferred.

  - id: complete-domain-objects
    branch: complete-domain-objects
    title: Generative backends complete the missing attributes of domain objects
    track: match
    depends_on:
      - eql-existential-semantics/match-generation
    status: not started
    notes: >
      new-feature, based on main after #557. `...` (and cause) in a pattern with a domain,
      top-level or nested, fills only attributes that are None on each domain object,
      returning completed copies (one per generated value) and leaving the originals
      unchanged; objects that already have the value pass unchanged. Deterministic backend
      enumerates; probabilistic samples the missing attribute given the object's known
      fields. Replaces #557's GenerativeBackendCannotFillInADomainObject; fixes the
      top-level TypeError on main. Settle at kickoff: is a nested completed copy fine?
