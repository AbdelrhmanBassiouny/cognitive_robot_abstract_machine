schema_version: 1
id: knowledge-directed-grounding
title: 'Knowledge-directed perception: scene grounding'
description: 'The scene grounding wave of knowledge-directed-perception (split out on 2026-09-05
  to get every successor under the plan-size budget): the three faults visible on the running
  demo - a clip that shows the floor, pieces on the board''s lid that are never found, and
  duplicate detections on the board''s borders - are one fault, the scene being described
  by constants instead of read from the world the node already fetches.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201
waves:
- id: grounding
  name: Perception reads the scene from the world
  description: 'The three faults visible in the running demo - a clip that shows the floor,
    pieces on the board lid that are never found, and duplicate detections on the board''s
    borders - are one fault: the scene is described by constants instead of read from the
    world the node already fetches. Removing the constants is what this wave does, and each
    fault is the test that its item worked.'
tracks:
- id: package-landing
  name: The perception package reaches main
  wave: grounding
  description: Everything in this plan edits files that exist on no branch but tracy_icra.
    Landing them first is what makes every later item a normal reviewable pull request.
- id: surfaces
  name: Surfaces, not constants
  wave: grounding
  description: 'Sequential: each item edits the same pipeline the previous one left behind,
    so they stack rather than run in parallel.'
- id: demo-grounding
  name: The demo runs on perception that reads the world
  wave: grounding
  description: 'The deadline deliverable, tracked in the same wave as the work it integrates
    rather than left to the end. Runs in parallel with the surfaces track: an item merges
    into tracy_icra when it works, not when its pull request lands.'
items:
- id: montessori-perception-on-main
  title: Land the Montessori perception package on main
  branch: montessori_perception_on_main
  pull_request_number: 202
  track: package-landing
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Pk12hDbP8k2C16ZQWvcroA
  notes: 'Cuts a branch off `main` carrying the Montessori perception package alone - sorinar329''s
    original node commit 75258debd plus the seven that follow it - so the rest of the plan
    stacks on reviewable ground instead of a branch whose upstream points at a colleague''s
    fork (`tracy_icra` itself is left alone). `depends_on: []`, and nothing in this plan waits
    for it to merge, per the plan''s standing rule that `depends_on` means stacked on, never
    waiting for a merge. Built 2026-08-28 as PR #202 (12 commits, 34 files, +9,664/-0).'
- id: surfaces-from-world
  title: Take the workspace from the table the robot knows about, not from a constant
  branch: perception_surfaces_from_world
  pull_request_number: 205
  track: surfaces
  depends_on:
  - montessori-perception-on-main
  status: in_progress
  session: https://claude.ai/code/session_01ScJk8zKUuToafxg38Bcag5
  blockers:
  - 'Unanswered question to the developer, raised on #205 at review time and still open: WorkspaceSurface.of_body
    picks the body''s widest horizontal face, following table_top_z''s existing rule, where
    the highest face is arguably the truer reading of "the surface things rest on".'
  notes: 'Fixes the first fault: the clip shows the floor because TRACY_WORKSPACE (node.py:102)
    is a hand-written 1.0 x 1.2 m rectangle. table_top_z() already pulls the tabletop''s collision
    shape out of the fetched world for its height and discards scale.x, scale.y and the origin,
    which are exactly the bounds being guessed. Derives the region and every plane height
    from the world, and from HasSupportingSurface.supporting_surface where one exists. The
    review round of 2026-08-29 is answered in full.'
- id: detect-per-supporting-surface
  title: Look at every supporting surface, not only the table
  branch: perception_per_supporting_surface
  pull_request_number: 221
  track: surfaces
  depends_on:
  - surfaces-from-world
  status: in_progress
  session: https://claude.ai/code/session_01T8CPPnj2uqZB7bACWBFJhb
  notes: 'Fixes the second fault: a piece resting on the board''s lid is invisible twice over.
    The pipeline rectifies loose pieces onto exactly one plane (table_height), so a piece
    eighty millimetres higher is parallax-shifted out of both silhouettes; and pipeline.py:626
    drops any contour the board encloses, coding the board as an obstacle when it is physically
    a supporting surface like the table. One detection pass per surface, each at its own plane
    height, with detections attributed to the surface supporting them. Built 2026-08-30 as
    #221, 2744c23d.'
- id: one-detection-per-thing
  title: One physical thing, one detection, and none inside a body already known
  branch: claude/plan-item-kickoff-kdp-z4pv7l
  pull_request_number: 225
  track: surfaces
  depends_on:
  - detect-per-supporting-surface
  status: in_progress
  session: https://claude.ai/code/session_01RRu7SutvRcNWHYNVUDCUFr
  notes: 'Fixes the third fault: the duplicate boxes on the board''s borders are the lid''s
    own edges, which a rectangular or triangular prism template fits at about 0.7 - above
    the 0.62 threshold. board.encloses only rejects a contour whose centre falls inside the
    board, and a contour riding the border has its centre outside; nothing anywhere forbids
    two detections occupying one place. Rejects a detection intersecting a known body''s volume,
    and resolves overlapping detections against each other. semantic_digital_twin.reasoning.predicates.is_place_occupied
    already exists for the first half.'
- id: holes-fitted-like-pieces
  title: Find the board's holes by fitting its whole known layout, not one contour at a time
  branch: claude/plan-item-kickoff-ge8541
  pull_request_number: 236
  track: surfaces
  depends_on:
  - pieces-looked-for-where-expected
  status: in_progress
  session: https://claude.ai/code/session_01TSK8GxG8qC6udSB7sjwzXf
  notes: 'The board''s holes are found by fitting the mesh''s own rigid six-hole layout over
    the lid in one shot - three degrees of freedom for all six holes together, seeded from
    the board detection''s own pose - rather than classifying each contour on its own. A free
    per-contour fit was tried first and is what put the fault there: a triangular prism template
    laid anywhere near the board''s middle reaches 0.85-0.89 agreement in every capture, higher
    than any genuine piece on the lid, and converges on the same spot each time.'
- id: pieces-looked-for-where-expected
  title: Look for a piece where it is expected, not only where a colour blob appears
  branch: claude/plan-item-kickoff-kdp-o4l189
  pull_request_number: 232
  track: surfaces
  depends_on:
  - one-detection-per-thing
  status: in_progress
  session: https://claude.ai/code/session_0158YvLwWkcdv4Hqz9i4926W
  notes: The structural change the rest of the plan's perception work needs. Today a piece
    is only found where colour segmentation isolated a blob, so one wearing the lid's own
    hue, or touching another piece, is never fitted however plainly its edges show.
- id: competing-explanations
  title: Decide a detection by comparing explanations, not against a fixed threshold
  branch: claude/plan-item-kickoff-kdp-r8nttk
  pull_request_number: 270
  track: surfaces
  depends_on:
  - pieces-looked-for-where-expected
  - holes-fitted-like-pieces
  status: in_progress
  session: https://claude.ai/code/session_01BxhH7rCvhti967uCAmAaKr
  notes: 'PieceMatcher.minimum_agreement is one number, 0.62, standing for how much of an
    outline must lie along a seen edge before a piece is reported, and its recorded justification
    is that a correct piece reaches 0.63 to 0.86 while the best wrong piece of the same colour
    reaches 0.62. Measured on 2026-08-31, that boundary does not hold anywhere near the board:
    a triangular prism template reaches 0.85 to 0.89 on the board''s own middle in every capture,
    above every genuine piece detection on the lid in the same captures, which run 0.64 to
    0.71 for the most part.'
- id: montessori-classes-in-the-orm
  title: Map the Montessori package's own classes, which the ORM has never seen
  branch: claude/montessori-classes-orm-s7vxu1
  pull_request_number: 223
  track: package-landing
  depends_on:
  - montessori-perception-on-main
  status: in_progress
  session: https://claude.ai/code/session_01PWzamoTtp8TNZyqhWornUs
  notes: experiments/src/experiments/montessori/ has no __init__.py, and never has on any
    branch, so pkgutil does not report it as a subpackage of experiments and the ORM generator's
    package walk skips the whole thing. Nothing under experiments.montessori is in experiments/orm/ormatic_interface.py
    - not MontessoriShape, not CubeShape, not ShapeSortingBoard.
- id: demo-runs-on-grounded-perception
  title: The demo sees only the table, finds pieces on the lid, and reports each once
  branch: tracy_icra
  pull_request_number: null
  track: demo-grounding
  depends_on:
  - one-detection-per-thing
  status: not_started
  notes: 'Wave one is finished when the three faults are gone on the real robot, not when
    their pull requests are approved: the clipped windows show the table and nothing beyond
    it, a cube resting on the board''s lid is detected there, and no detection rides the board''s
    borders. Verified against the live camera, with a captured frame kept for the tests.'
