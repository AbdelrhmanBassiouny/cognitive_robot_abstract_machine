schema_version: 1
id: krrood-light-core
title: 'krrood light core: krrood-* distributions, a light krrood-core'
description: Each krrood part is its own pip-installable krrood-* distribution under the krrood.<part>
  namespace, released at one version with exact sibling pins; `pip install krrood` installs
  them all. krrood-core (patterns, class_diagrams, symbol_graph, exceptions) is light and
  Windows-installable; EQL, serialization, ORMatic, RDR, ontomatic and the probabilistic parts
  are distributions of their own. krrood-development-tools builds on basstler-rules. Replaces
  the separate krrood_core package (#506).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 510
waves:
- id: decoupling
  name: Core stops importing heavy modules
  description: Each item cuts one import edge from core into a heavy dependency, with a fresh-interpreter
    test.
- id: extras
  name: The distributions exist
  description: krrood-* workspace members, the krrood package depending on all, per-distribution
    CI.
tracks:
- id: optional-imports
  name: Optional imports and their mechanism
  wave: decoupling
- id: core-boundaries
  name: Core module boundaries
  wave: decoupling
- id: guards
  name: Guards that keep core light
  wave: decoupling
- id: packaging
  name: Distributions and packaging
  wave: extras
- id: command-line
  name: krrood command line
  wave: extras
items:
- id: matplotlib-optional
  title: matplotlib is imported only when drawing
  branch: claude/bold-ramanujan-vb0e9c
  status: in progress
  track: optional-imports
  pull_request_number: 547
  session: https://claude.ai/code/session_01JxHGiMUhYaVsG6NkZNgzAC
  depends_on: []
  notes: 'Stacked on #546. matplotlib imported inside the functions that draw; no enums or
    decorator. #546''s CoreBoundaryChecker enforces it; graph_visualizer and rxnode no longer
    cross the boundary.'
- id: type-hint-resolver-skips-missing-modules
  title: Type-hint resolution skips modules that are not installed
  branch: claude/relaxed-wozniak-eu4gdv
  status: in progress
  track: optional-imports
  pull_request_number: 545
  session: https://claude.ai/code/session_01JxHGiMzkomLaQ42NXK331R
  depends_on: []
  notes: 'In review in #545: get_scope_from_imports attempts a plain import under TYPE_CHECKING
    and an ImportError makes it bind no name (developer-approved exception to no-try/except;
    find_spec missed modules with missing dependencies). Runtime imports keep raising. After
    #546 lands, move these helpers into krrood.source_analysis and share ModuleLevelImportFinder.type_checking_flag.'
- id: serializer-without-heavy-dependencies
  title: JSON serializer and symbol graph import no sqlalchemy, scipy or casadi
  branch: null
  status: not_started
  track: core-boundaries
  depends_on:
  - type-hint-resolver-skips-missing-modules
  notes: 'HasGeneric moves from ormatic.data_access_objects.base into patterns; the scipy
    sparse-array support moves to its own serializer module; numpy array support stays core
    (rustworkx already requires numpy, import ~0.07 s); symbol_graph.helpers stops importing
    symbolic_math (casadi) at import. Reuse #506 (closed) for what it extracted. Removes its
    entries from the guard ratchet.'
- id: eql-probabilistic-split
  title: Core EQL imports no random_events or probabilistic_model
  branch: claude/friendly-volta-bny36w
  status: in progress
  track: core-boundaries
  pull_request_number: 609
  session: https://claude.ai/code/session_01JxHGiNCuZYy4zJDsmbyfwZ
  depends_on:
  - type-hint-resolver-skips-missing-modules
  notes: 'Split operators/causal.py: Cause/Confounder/CausesEffect stay core, the random_events
    dataclasses move out; probabilistic_queries.py and backends.py move to krrood-probabilistic.
    number_like_field (user-approved cleanest): plain check, int/float subclass and not bool/Enum,
    matching random_events today. aggregators interval stays method-local.'
- id: verbalization-realization-split
  title: Verbalization vocabulary stays in krrood-eql, realization moves out of it
  branch: null
  status: not_started
  track: core-boundaries
  depends_on:
  - type-hint-resolver-skips-missing-modules
  notes: 'User-approved: _verbalization_fragment_ stays abstract and unchanged. The vocabulary
    (clause, Noun, Verb, fragments) is declarative; only morphology (inflect ~1.7 s, lemminflect,
    typeguard) and the pipeline (jinja2, IPython) move out of krrood-eql (which distribution
    is decided in krrood-distributions). Needs navigation_path and parts_of_speech to stop
    calling morphology while building a clause (cardinal, verb_lemma become fragments realized
    later).'
- id: core-weight-regression-check
  title: CI compares core install size and import time against the base branch
  branch: null
  status: not_started
  track: packaging
  depends_on:
  - krrood-distributions
  notes: 'One CI job, only when krrood or its pyproject changes: installs krrood-core from
    base and head into empty environments and compares installed size and distribution count
    (deterministic), then median import time over alternating runs on the same runner. Fails
    only past a relative and an absolute threshold, both named settings; prints both numbers
    in the job summary. Catches a heavy package added to core''s own dependencies.'
- id: command-line-on-cyclopts
  title: krrood's command line is built on cyclopts
  branch: null
  status: deferred
  track: command-line
  depends_on: []
  notes: 'Asked in review of #547. Absorbed by development-tools-on-basstler-rules: krrood''s
    command is then mounted on basstler-rules'' cyclopts commands. Delete once that item starts.'
- id: classproperty-in-patterns
  title: krrood-core imports nothing outside patterns, class_diagrams, symbol_graph and exceptions
  branch: claude/dreamy-ptolemy-v7pxjm
  status: in progress
  track: core-boundaries
  pull_request_number: 608
  session: https://claude.ai/code/session_01JxHGiKzJUPxGJDd4Czwnrm
  depends_on: []
  notes: 'Draft PR open; all five core crossings removed, krrood tests pass. classproperty
    moved to krrood.patterns.classproperty; symbol_graph loads ontomatic''s introspector
    inside _build_class_diagram; symbol_graph.helpers moved to entity_query_language.class_diagram_lookup,
    causal_relation to entity_query_language, module_generation to code_generation. A test
    keeps the core boundary checker silent over core. Development tools stay out of core
    (user decision).'
- id: namespace-package
  title: 'krrood is a namespace package: krrood/__init__.py removed'
  branch: null
  status: not_started
  track: packaging
  depends_on: []
  notes: Several distributions share the krrood. prefix only if none ships krrood/__init__.py.
    Each distribution reads its version with importlib.metadata; the krrood logger moves to
    the package that uses it; every `from krrood import logger` and krrood.__version__ reader
    is fixed. Breaking for outside readers of krrood.__version__.
- id: krrood-distributions
  title: krrood-* distributions as workspace members, a krrood package depending on all, per-distribution
    CI
  branch: null
  status: not_started
  track: packaging
  depends_on:
  - matplotlib-optional
  - serializer-without-heavy-dependencies
  - eql-probabilistic-split
  - verbalization-realization-split
  - classproperty-in-patterns
  - namespace-package
  notes: 'One workspace member per distribution (krrood-core, -eql, -serialization, -ormatic,
    -rdr, -ontomatic, -probabilistic, -development-tools...), cut by the decoupling items;
    sibling pins == root VERSION. A krrood distribution depending on all keeps `pip install
    krrood` whole. random_events and probabilistic_model depend on krrood-core/-eql only,
    ending the krrood <-> random_events cycle. #546''s checker checks a per-distribution map.
    CI installs each alone on Linux and Windows.'
- id: development-tools-on-basstler-rules
  title: krrood-development-tools builds on basstler-rules' rule engine
  branch: null
  status: blocked
  track: command-line
  depends_on:
  - krrood-distributions
  blockers:
  - Waits on basstler's basstler-packages/krrood-sync (basstler-rules is the engine) and its
    first PyPI release (basstler-packages/pypi-release).
  notes: 'krrood-development-tools depends on basstler-rules>=X,<X+1 (a range, never ==, so
    neither repository''s release waits on the other) and deletes development_tools/agents''
    engine: rule, section, checker, instructions, formatting. It keeps krrood''s shipped rules
    (EQL a/an, serializer, core-boundary) as a basstler-rules ruleset and the krrood command
    mounted on basstler-rules'' commands. Absorbs command-line-on-cyclopts.'
