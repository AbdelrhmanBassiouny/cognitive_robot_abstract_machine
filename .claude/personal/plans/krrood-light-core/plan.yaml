schema_version: 1
id: krrood-light-core
title: 'krrood light core: heavy dependencies move behind krrood[all]'
description: A plain `pip install krrood` installs a light, Windows-installable core (patterns,
  exceptions, JSON serializer, class diagrams, symbol graph, EQL); verbalization realization,
  random_events/probabilistic_model, casadi, numpy/scipy serialization, ORMatic, RDR, ontomatic
  and matplotlib move behind `krrood[all]`. Replaces the separate krrood_core package (#506).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 510
waves:
- id: decoupling
  name: Core stops importing heavy modules
  description: Each item cuts one import edge from core into a heavy dependency, with a fresh-interpreter
    test.
- id: extras
  name: The extras exist
  description: pyproject split, workspace packages switched, core-only CI job.
tracks:
- id: optional-imports
  name: Optional imports and their mechanism
  wave: decoupling
- id: core-boundaries
  name: Core module boundaries
  wave: decoupling
- id: guards
  name: Guards that keep core light
  wave: decoupling
- id: packaging
  name: Packaging and CI
  wave: extras
- id: command-line
  name: krrood command line
  wave: extras
items:
- id: matplotlib-optional
  title: matplotlib is imported only when drawing
  branch: claude/bold-ramanujan-vb0e9c
  status: in progress
  track: optional-imports
  pull_request_number: 547
  session: https://claude.ai/code/session_01JxHGiMUhYaVsG6NkZNgzAC
  depends_on:
  - core-boundary-guard
  notes: 'Stacked on #546. matplotlib imported inside the functions that draw; no enums or decorator. #546''s CoreBoundaryChecker enforces it; graph_visualizer and rxnode no longer cross the boundary.'
- id: type-hint-resolver-skips-missing-modules
  title: Type-hint resolution skips modules that are not installed
  branch: claude/relaxed-wozniak-eu4gdv
  status: in progress
  track: optional-imports
  pull_request_number: 545
  session: https://claude.ai/code/session_01JxHGiMzkomLaQ42NXK331R
  depends_on: []
  notes: 'Implemented in draft #545: get_scope_from_imports skips an import under TYPE_CHECKING
    whose top-level package find_spec cannot find; runtime imports keep raising (user decision,
    so RDR typos still fail at load). find_spec only catches packages not installed at all: a
    plain TYPE_CHECKING import of an installed krrood module whose dependencies are missing
    still raises, so later items should use from-imports there.'
- id: core-boundary-guard
  title: One guard over every core module, with import-linter and a shrinking offender list
  branch: claude/keen-feynman-4xcf4m
  status: in progress
  track: guards
  pull_request_number: 546
  session: https://claude.ai/code/session_01JxHGiNxUAghACotuu2UKYp
  depends_on: []
  notes: 'PR #546 (reworked in the #547 review session): [tool.krrood.core-boundary] declares core and its dependencies once; CoreBoundaryChecker (shipped rule, `krrood check` pre-commit hook) checks the module-level import graph, chains included; one-interpreter runtime backstop test. No import-linter, no offender lists: `krrood check --all-lines` is the inventory.'
- id: serializer-without-heavy-dependencies
  title: JSON serializer and symbol graph import no sqlalchemy, scipy or casadi
  branch: null
  status: not_started
  track: core-boundaries
  depends_on:
  - type-hint-resolver-skips-missing-modules
  - core-boundary-guard
  notes: 'HasGeneric moves from ormatic.data_access_objects.base into patterns; the scipy
    sparse-array support moves to its own serializer module; numpy array support stays core
    (rustworkx already requires numpy, import ~0.07 s); symbol_graph.helpers stops importing
    symbolic_math (casadi) at import. Reuse #506 (closed) for what it extracted. Removes its
    entries from the guard ratchet.'
- id: eql-probabilistic-split
  title: Core EQL imports no random_events or probabilistic_model
  branch: null
  status: not_started
  track: core-boundaries
  depends_on:
  - type-hint-resolver-skips-missing-modules
  - core-boundary-guard
  notes: 'Split operators/causal.py: Cause/Confounder/CausesEffect stay core, the random_events
    dataclasses move out; probabilistic_queries.py and backends.py are `all`. number_like_field
    (user-approved cleanest): plain check, int/float subclass and not bool/Enum, matching
    random_events today. aggregators interval stays method-local.'
- id: verbalization-realization-split
  title: Verbalization vocabulary stays core, realization moves to all
  branch: null
  status: not_started
  track: core-boundaries
  depends_on:
  - type-hint-resolver-skips-missing-modules
  - core-boundary-guard
  notes: 'User-approved: _verbalization_fragment_ stays abstract and unchanged. The vocabulary
    (clause, Noun, Verb, fragments) is declarative; only morphology (inflect ~1.7 s, lemminflect,
    typeguard) and the pipeline (jinja2, IPython) move to `all`. Needs navigation_path and
    parts_of_speech to stop calling morphology while building a clause (cardinal, verb_lemma
    become fragments realized later).'
- id: krrood-core-and-all-extras
  title: pyproject core and all extras, workspace packages switched, core-only CI job
  branch: null
  status: not_started
  track: packaging
  depends_on:
  - matplotlib-optional
  - core-boundary-guard
  - serializer-without-heavy-dependencies
  - eql-probabilistic-split
  - verbalization-realization-split
  notes: 'Breaking for outside users: pip has no default extras. Every workspace package that
    lists krrood switches to krrood[all]. Core-only CI job on Linux and Windows runs the guard
    and core tests; `krrood check --all-lines` must report no core-boundary crossing. basstler (basstler#12, item
    basstler-krrood-dependency in basstler''s notes) then depends on plain krrood.'
- id: core-weight-regression-check
  title: CI compares core install size and import time against the base branch
  branch: null
  status: not_started
  track: packaging
  depends_on:
  - krrood-core-and-all-extras
  notes: 'One CI job, only when krrood or its pyproject changes: installs core krrood from
    base and head into empty environments and compares installed size and distribution count
    (deterministic), then median import time over alternating runs on the same runner. Fails
    only past a relative and an absolute threshold, both named settings; prints both numbers
    in the job summary. Catches a heavy package added to core''s own dependencies.'

- id: command-line-on-cyclopts
  title: krrood's command line is built on cyclopts
  branch: null
  status: not_started
  track: command-line
  depends_on: []
  notes: 'Asked in review of #547. Every `krrood` subcommand (format, agents-md, check) moves
    from argparse to cyclopts, added to the development-tools extra; all at once, never one
    subcommand alone.'
