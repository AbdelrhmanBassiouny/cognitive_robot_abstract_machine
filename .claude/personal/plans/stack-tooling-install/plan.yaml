schema_version: 1
id: stack-tooling-install
title: Stack tooling on main, and the skills that install it anywhere
description: 'Getting the stacked-pull-request workflow''s machinery out of a personal tooling
  branch and onto main as reviewed code, with guided setup for a repository that takes it
  natively and for a fork that has to overlay it. Portability is the rule throughout: no repository
  names outside configuration defaults.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: landing
  name: The tooling reaches main
  description: The base pull request, the tooling port, and the native-stacks evaluation that
    re-scoped it.
- id: install
  name: Setup, scripted
  description: Each setup skill keeps only the questions; everything mechanical becomes a
    script.
- id: base-correctness
  name: What a branch is cut from
  description: Bugs in which refs the tooling fetches and which branch new work is based on.
tracks:
- id: landing
  name: Tooling onto main
  wave: landing
- id: install
  name: Guided setup
  wave: install
- id: base-correctness
  name: Branch bases and refs
  wave: base-correctness
items:
- id: setup-personal-notes-script
  title: Extract a deterministic setup script from /setup-personal-notes
  branch: claude/setup-personal-notes-script
  pull_request_number: 107
  status: in progress
  session: https://claude.ai/code/session_01DbUfzLJEFqE4U3fKBFd2WA
  track: install
  depends_on: []
  blockers:
  - 'Cross-plan dependency, not representable in depends_on: stacked on basstler-package (#185,
    basstler-package plan, upstream cram2#659) since 2026-10-04.'
  notes: Extracts the mechanical half of `/setup-personal-notes` into a script, leaving the
    skill only the questions. **The item's original premise is disproved and no longer applies.**
    Two steps recorded as session-only are both scriptable - the login and the label read
    and create are all plain API calls, and the "no create-label tool" limit is true of MCP,
    not of the API. So the whole setup runs with no session, and the skill became a thin question-asking
    wrapper (238 lines to 153) rather than the "script plus two API steps" split originally
    described.
- id: setup-stacked-prs-skill
  title: 'PR 2: /setup-stacked-prs guided one-command setup skill'
  branch: claude/setup-stacked-prs-skill
  pull_request_number: 110
  status: in progress
  session: https://claude.ai/code/session_015HBn7bNMj6Ao5inyStmrMN
  track: install
  depends_on: []
  blockers:
  - 'Its base, setup-personal-notes-script (#107), was restacked onto basstler-package (#185)
    and rebuilt in basstler''s shape on 2026-10-04 (`57480ed4`): `github-api.sh`, which this
    branch''s `setup-stacked-prs.sh` sources, no longer exists.'
  notes: 'Mirrors its two siblings'' read-only-check plus guided-skill pattern, with two install
    modes: native (tooling on the target repository''s main) and fork-overlay (a never-merged
    tooling branch on the user''s fork, where re-running the skill is the updater). Creates
    missing labels, writes the personal configuration, emits the prompt. Based on `setup-personal-notes-script`
    rather than directly on the tooling port, because its own script sources `github-api.sh`,
    which exists on no other branch.'
- id: unfetched-parent-branches
  title: Fetch every parent branch the pass decides about, and refuse to decide from a missing
    ref
  branch: claude/maintenance-tooling-pinning-gdod18
  pull_request_number: 198
  status: in progress
  session: https://claude.ai/code/session_01THzpHsajMptZ3X1DmwAU2c
  track: base-correctness
  depends_on: []
  notes: Bug fix, root-caused while asking why a pull request was never reparented onto main
    nor promoted after its parent merged that morning. `load_stack()` fetches only the *head*
    branches of the open pull requests on the board, so a parent whose own pull request is
    closed or merged is never fetched; the merged predicate then runs `merge-base --is-ancestor`
    through a helper that cannot tell exit 128 (ref missing) from exit 1 (not an ancestor).
- id: session-branch-base
  title: Cut session branches from main, not the integration branch
  branch: claude/plan-item-kickoff-workflow-s3mfvk
  pull_request_number: 199
  status: in progress
  session: https://claude.ai/code/session_014Fp9aaMYx1E6toT2jDDWdW
  track: base-correctness
  depends_on: []
  notes: 'Found while checking whether the fork''s default branch caused the sibling bug.
    It did not, but it is causing something else and is already live: the fork''s `HEAD` resolves
    to the regenerated `integration` branch, whose whole design is to be rebuilt and never
    merged out of. A session investigating that bug was handed a branch byte-identical to
    `origin/integration` - 78 commits behind main, carrying eight unlanded branches'' merge
    commits - because the branch existed only locally, so the clone created it at the default
    branch''s tip. Every future session cut from this fork does the same.'
