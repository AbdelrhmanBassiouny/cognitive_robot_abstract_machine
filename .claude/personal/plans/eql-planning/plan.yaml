- id: action-schema-progression
  branch: eql-planning/action-schema-progression
  title: ActionSchema with an EQL precondition and assignment effects, applied to a State
  track: planning-core
  depends_on:
  - fluent-state-overlay
  - state-objects-and-domains
  status: not_started
  notes: 'Effects can create and remove objects (state-objects-and-domains). Field types of the class
    diagram type-check effects. Effects are facts (State.with_facts) whose value may depend on the
    binding (x.support := y); #535 accepts only constant values. Appending to a collection is an effect
    here, not a fact (#535 review): a fact only fixes an existing fluent.'
- id: declared-setter-implications
  branch: eql-planning/declared-setter-implications
  title: Assignments follow the implications a setter declares, such as ontomatic inverse properties
  track: planning-core
  depends_on:
  - action-schema-progression
  status: not_started
  notes: 'ontomatic PropertyDescriptor.__set__ applies inverse, super-property and transitive implications;
    a state assigning one side must assign the implied ones too, from the declared structure. Lets
    a domain declare how its setter''s effects are modelled, lifting AssignmentBypassesSetter (#535)
    for it.'
