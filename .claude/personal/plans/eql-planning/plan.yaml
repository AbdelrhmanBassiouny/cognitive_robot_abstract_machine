- id: instantiated-variable-type-and-factory
  branch: claude/eql-planning-instantiated-variable-cue1io
  title: InstantiatedVariable separates its result type from the factory that builds it
  track: eql-prerequisites
  pull_request_number: 542
  session: https://claude.ai/code/session_01JxHGiPsM8oqLSysqVaSFHa
  blockers:
    - >-
      Owner to answer the three open #542 threads asking why _factory_, not _type_
      (plan_transformations.py:334, task_conditions.py:477, planner.py:118). Upstream cram2#862 has
      two approvals and no open threads.
    - >-
      CI on the merge of main at 9bd5951e46 was still running when read; not run locally (pyjpt
      cannot be installed here).
  depends_on: []
  status: in progress
  notes: >
    Bug-style PR off main, landing on its own (#542). One field for the result type, always a type;
    inference takes only the factory and the type is inferred from it by HasFactoryAndKwargs, the
    same way Match infers its type. A factory with no usable return annotation raises; there is no
    object fallback. A method annotated -> Self builds the class it is bound to.

    InstantiatedVariable inherits HasFactoryAndKwargs, like Match; _declared_factory_ holds the
    decorated symbolic function.
