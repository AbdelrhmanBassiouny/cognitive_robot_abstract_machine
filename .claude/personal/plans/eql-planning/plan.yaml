schema_version: 1
id: eql-planning
title: 'EQL planning: goals as EQL conditions, planners as EQL backends'
description: 'Domain-agnostic planning over EQL in krrood: fluents and a State overlay, action
  schemas with assignment effects, and a PlanningBackend that answers a goal query with plans,
  with compiled heuristic search, regression-based explanation, trajectory constraints and
  a unified-planning backend. Its robot use is eql-planning-robots (#522). Core by Nov 13;
  target IROS 2027.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 513
waves:
- id: foundation
  name: EQL prerequisites (Oct 15-31)
  description: EQL fixes the planner cannot run correctly without.
- id: core
  name: Planning core in krrood (Nov 2-13)
  description: The domain-agnostic planner, tested on blocksworld, gripper and logistics.
- id: evaluation
  name: Constraints and external planners (January)
  description: Trajectory constraints and the comparison with external planners.
tracks:
- id: eql-prerequisites
  name: EQL prerequisites
  wave: foundation
- id: planning-core
  name: Planning core
  wave: core
- id: evaluation
  name: Constraints and external planners
  wave: evaluation
items:
- id: state-aware-predicate-cache
  branch: eql-planning/state-aware-predicate-cache
  title: Predicate results cached per state, not per argument tuple alone
  track: eql-prerequisites
  depends_on:
  - ontomatic-port/eql-predicate-call-memo
  status: deferred
  notes: 'Changes the per-argument cache (ontomatic-port eql-predicate-call-memo, commit 08f9178dd
    on aamas27-unification-revision): fold into whichever PR lands that cache. Keys on the
    State that fluent-state-overlay introduces. Deferred at kickoff on 2026-10-20.'
- id: state-objects-and-domains
  branch: ccr-b32c8432-18ncpi
  title: 'Objects in a State: a state adds and removes objects, and default EQL domains come
    from it'
  track: planning-core
  pull_request_number: 541
  session: https://claude.ai/code/session_018wfiv5yasD7se5ZBXvUw5i
  blockers:
    - >-
      #541 conflicts with main at fa1dc1af6e (merge probe, base 20c49dd413): #535 landed with later
      review changes (value_of_term, owners compared by identity), colliding in core/variable.py,
      evaluation_context.py, ground_term.py and planning/state.py. Being resolved by merging main.
  depends_on: []
  status: in progress
  notes: 'In #541 (draft, on #535): state objects, TermReader.instances_of, per-evaluation
    default domains, expression domains as FlatVariable/InstanceFilteredFlatVariable (a(T).from_(expr)
    too). First review addressed in fa1dc1af6e; the owner chose to filter removed objects
    out of list/tuple/set fluent values, captured lists stay unfiltered.

    Open: a thread asks for match syntax everywhere; the binding test keeps variable() since
    a match in set_of does not correlate (correlated-quantifiers). Unregistered objects are
    left to action-schema-progression.

    '
- id: action-schema-progression
  branch: eql-planning/action-schema-progression
  title: ActionSchema with an EQL precondition and assignment effects, applied to a State
  track: planning-core
  depends_on:
  - state-objects-and-domains
  status: not_started
  notes: 'Effects can create and remove objects (state-objects-and-domains). Field types of
    the class diagram type-check effects. Effects are facts (State.with_facts) whose value
    may depend on the binding (x.support := y); #535 accepts only constant values. Appending
    to a collection is an effect here, not a fact (#535 review): a fact only fixes an existing
    fluent.'
- id: declared-setter-implications
  branch: eql-planning/declared-setter-implications
  title: Assignments follow the implications a setter declares, such as ontomatic inverse
    properties
  track: planning-core
  depends_on:
  - action-schema-progression
  status: not_started
  notes: ontomatic PropertyDescriptor.__set__ applies inverse, super-property and transitive
    implications; a state assigning one side must assign the implied ones too, from the declared
    structure. Lets a domain declare how its setter's effects are modelled, lifting AssignmentBypassesSetter
    (#535) for it.
- id: planning-backend-search
  branch: eql-planning/planning-backend-search
  title: PlanningBackend answers a goal query with plans; breadth-first search on test domains
  track: planning-core
  depends_on:
  - action-schema-progression
  - eql-existential-semantics/correlated-quantifiers
  status: not_started
  notes: Test domains write each derived fact that passes the three-part rule (changes during
    a plan, used by a goal or precondition, relational) as an EQL body, not Python.
- id: regression-and-explanation
  branch: eql-planning/regression-and-explanation
  title: Successor state axioms generated from effects; regression explains each step
  track: planning-core
  depends_on:
  - action-schema-progression
  status: not_started
- id: compiled-search-ff
  branch: eql-planning/compiled-search-ff
  title: Grounding through EQL, compiled integer state, greedy best-first and A* with the
    FF heuristic
  track: planning-core
  depends_on:
  - planning-backend-search
  - state-aware-predicate-cache
  status: not_started
  notes: 'Grounding, finite-domain variables and h_add/h_FF need each condition''s read set
    before search: they see through EQL bodies only; Python bodies are attachments. Field
    types give grounding and finite domains.'
- id: trajectory-constraints
  branch: eql-planning/trajectory-constraints
  title: Trajectory constraints (PDDL3 subset) checked in search and monitored during execution
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
- id: unified-planning-backend
  branch: eql-planning/unified-planning-backend
  title: Compile EQL domains to unified-planning; cross-check against Fast Downward on IPC
    domains
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
