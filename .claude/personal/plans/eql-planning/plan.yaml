schema_version: 1
id: eql-planning
title: 'EQL planning: goals as EQL conditions, planners as EQL backends'
description: 'Domain-agnostic planning over EQL in krrood: fluents and a State overlay, action schemas
  with assignment effects, and a PlanningBackend that answers a goal query with plans, with compiled
  heuristic search, regression-based explanation, trajectory constraints and a unified-planning backend.
  Its robot use is eql-planning-robots (#522). Core by Nov 13; target IROS 2027.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 513
waves:
- id: foundation
  name: EQL prerequisites (Oct 15-31)
  description: EQL fixes the planner cannot run correctly without.
- id: core
  name: Planning core in krrood (Nov 2-13)
  description: The domain-agnostic planner, tested on blocksworld, gripper and logistics.
- id: evaluation
  name: Constraints and external planners (January)
  description: Trajectory constraints and the comparison with external planners.
tracks:
- id: eql-prerequisites
  name: EQL prerequisites
  wave: foundation
- id: planning-core
  name: Planning core
  wave: core
- id: evaluation
  name: Constraints and external planners
  wave: evaluation
items:
- id: state-aware-predicate-cache
  branch: eql-planning/state-aware-predicate-cache
  title: Predicate results cached per state, not per argument tuple alone
  track: eql-prerequisites
  depends_on:
  - fluent-state-overlay
  - ontomatic-port/eql-predicate-call-memo
  status: deferred
  notes: 'Changes the per-argument cache (ontomatic-port eql-predicate-call-memo, commit 08f9178dd
    on aamas27-unification-revision): fold into whichever PR lands that cache. Keys on the State
    that fluent-state-overlay introduces. Deferred at kickoff on 2026-10-20.'
- id: fluent-state-overlay
  branch: claude/zealous-albattani-uoew5i
  title: Fluents and a State overlay that EQL queries are evaluated against
  track: planning-core
  pull_request_number: 535
  session: https://claude.ai/code/session_01JxHGiMbWLBgK8nT2DHNmxJ
  depends_on: []
  status: in progress
  notes: 'Review round 2 addressed (Oct 31, d52af4309): typed value terms (AttributeTerm, IndexTerm,
    CallTerm) bound per expression via GroundTermExpression[TermT]; queries take state= and State.as_current
    is gone. Merges bug PR #538. Next: separate PR off main splitting InstantiatedVariable type and factory,
    merged here; 6 review threads await the owner.'
- id: state-objects-and-domains
  branch: eql-planning/state-objects-and-domains
  title: 'Objects in a State: a state adds and removes objects, and default EQL domains come from
    it'
  track: planning-core
  depends_on:
  - fluent-state-overlay
  status: not_started
  notes: 'A variable without a domain ranges over the state''s objects, not the global SymbolGraph.
    A world''s collection is an EQL expression (variable(Type, world.connections) on a world variable),
    read through the state like any fluent; effects that add or remove objects assign it. No filtering
    fallback. variable(Type, expression) and variable_from(expression) must evaluate the expression
    per binding, flattened and type-filtered: on main they yield the expression itself. Values stay
    as given.'
- id: action-schema-progression
  branch: eql-planning/action-schema-progression
  title: ActionSchema with an EQL precondition and assignment effects, applied to a State
  track: planning-core
  depends_on:
  - fluent-state-overlay
  - state-objects-and-domains
  status: not_started
  notes: Effects can create and remove objects (state-objects-and-domains). Field types of the class
    diagram type-check effects. Effects are facts (State.with_facts) whose value may depend on the
    binding (x.support := y); #535 accepts only constant values.
- id: planning-backend-search
  branch: eql-planning/planning-backend-search
  title: PlanningBackend answers a goal query with plans; breadth-first search on test domains
  track: planning-core
  depends_on:
  - action-schema-progression
  - eql-existential-semantics/correlated-quantifiers
  status: not_started
  notes: Test domains write each derived fact that passes the three-part rule (changes during a plan,
    used by a goal or precondition, relational) as an EQL body, not Python.
- id: regression-and-explanation
  branch: eql-planning/regression-and-explanation
  title: Successor state axioms generated from effects; regression explains each step
  track: planning-core
  depends_on:
  - action-schema-progression
  status: not_started
- id: compiled-search-ff
  branch: eql-planning/compiled-search-ff
  title: Grounding through EQL, compiled integer state, greedy best-first and A* with the FF heuristic
  track: planning-core
  depends_on:
  - planning-backend-search
  - state-aware-predicate-cache
  status: not_started
  notes: 'Grounding, finite-domain variables and h_add/h_FF need each condition''s read set before
    search: they see through EQL bodies only; Python bodies are attachments. Field types give grounding
    and finite domains.'
- id: trajectory-constraints
  branch: eql-planning/trajectory-constraints
  title: Trajectory constraints (PDDL3 subset) checked in search and monitored during execution
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
- id: unified-planning-backend
  branch: eql-planning/unified-planning-backend
  title: Compile EQL domains to unified-planning; cross-check against Fast Downward on IPC domains
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
