schema_version: 1
id: eql-planning
title: 'EQL planning: goals as EQL conditions, planners as EQL backends'
description: 'Domain-agnostic planning over EQL in krrood: fluents and a State overlay, action schemas
  with assignment effects, and a PlanningBackend that answers a goal query with plans, with compiled heuristic
  search, regression-based explanation, trajectory constraints and a unified-planning backend. Its robot
  use is eql-planning-robots (#522). Core by Nov 13; target IROS 2027.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 513
waves:
- id: foundation
  name: EQL prerequisites (Oct 15-31)
  description: EQL fixes the planner cannot run correctly without.
- id: core
  name: Planning core in krrood (Nov 2-13)
  description: The domain-agnostic planner, tested on blocksworld, gripper and logistics.
- id: evaluation
  name: Constraints and external planners (January)
  description: Trajectory constraints and the comparison with external planners.
tracks:
- id: eql-prerequisites
  name: EQL prerequisites
  wave: foundation
- id: planning-core
  name: Planning core
  wave: core
- id: evaluation
  name: Constraints and external planners
  wave: evaluation
items:
- id: correlated-quantifiers
  title: Quantifiers range per outer binding, so goals with exists, not_ and for_all are correct
  branch: fix/eql-correlated-quantifiers
  pull_request_number: 495
  track: eql-prerequisites
  status: in_progress
  notes: Already merged into aamas27-unification-revision. Also listed in ontomatic-port as eql-correlated-quantifiers,
    which records no PR; overlaps eql-existential-semantics.
- id: nested-evaluation-context
  branch: eql-planning/nested-evaluation-context
  title: An EQL evaluation started inside another one sees its own context
  track: eql-prerequisites
  status: not_started
  notes: 'Bug found in #511: a rule tree evaluated during another evaluation returns nothing (shared ContextVar).
    Bug-fix PR off main with the bug label. Near #142.'
- id: state-aware-predicate-cache
  branch: eql-planning/state-aware-predicate-cache
  title: Predicate results cached per state, not per argument tuple alone
  track: eql-prerequisites
  depends_on:
  - fluent-state-overlay
  status: deferred
  notes: 'Changes the per-argument cache (ontomatic-port eql-predicate-call-memo, commit 08f9178dd on
    aamas27-unification-revision): fold into whichever PR lands that cache. Keys on the State that
    fluent-state-overlay introduces. Deferred at kickoff on 2026-10-20.'
  blockers:
  - 'eql-predicate-call-memo has no PR; it waits on #495 (needs-resolution).'
  - fluent-state-overlay has not started, so there is no State to key the cache on.
- id: fluent-state-overlay
  branch: eql-planning/fluent-state-overlay
  title: Fluents and a State overlay that EQL queries are evaluated against
  track: planning-core
  depends_on:
  - nested-evaluation-context
  status: not_started
- id: action-schema-progression
  branch: eql-planning/action-schema-progression
  title: ActionSchema with an EQL precondition and assignment effects, applied to a State
  track: planning-core
  depends_on:
  - fluent-state-overlay
  status: not_started
- id: planning-backend-search
  branch: eql-planning/planning-backend-search
  title: PlanningBackend answers a goal query with plans; breadth-first search on test domains
  track: planning-core
  depends_on:
  - action-schema-progression
  - correlated-quantifiers
  status: not_started
- id: regression-and-explanation
  branch: eql-planning/regression-and-explanation
  title: Successor state axioms generated from effects; regression explains each step
  track: planning-core
  depends_on:
  - action-schema-progression
  status: not_started
- id: compiled-search-ff
  branch: eql-planning/compiled-search-ff
  title: Grounding through EQL, compiled integer state, greedy best-first and A* with the FF heuristic
  track: planning-core
  depends_on:
  - planning-backend-search
  - state-aware-predicate-cache
  status: not_started
- id: trajectory-constraints
  branch: eql-planning/trajectory-constraints
  title: Trajectory constraints (PDDL3 subset) checked in search and monitored during execution
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
- id: unified-planning-backend
  branch: eql-planning/unified-planning-backend
  title: Compile EQL domains to unified-planning; cross-check against Fast Downward on IPC domains
  track: evaluation
  depends_on:
  - planning-backend-search
  status: not_started
