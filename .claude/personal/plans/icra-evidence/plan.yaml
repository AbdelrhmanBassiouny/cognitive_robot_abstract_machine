  notes: >-
    A repository a reader can run the simulation experiments from and compare against the robot episodes with: the Scenario definitions, the question set, the VLM prompts, the Condition and Perturbation definitions, the six captures plus every new one, and a dump of the episode database. The rosbags stay out (4.7 GB). Packaged on the memo's 12 to 13 September.
