- id: cross-episode-question-set-and-ground-truth
  title: >-
    The questions asked of the episode history, with ground truth read from what the runner recorded
  branch: null
  pull_request_number: null
  track: experiment-d
  depends_on:
  - question-set-and-ground-truth
  status: not_started
  notes: >-
    Four kinds, each a Question in the shape question-set-and-ground-truth already defines - EQL, English, answer type, and the facts it structurally requires - but spelled over the SQL backend and reaching across episodes rather than into the current scene: has this happened to the robot before and in which episode; what the goal and the conditions were at that time; what differed between the earlier episodes and the current one that bears on the question; and how a failure was resolved the last time it happened. This is the second spelling question-set-and-ground-truth already names for the temporal bucket, carried to every bucket. Ground truth is read from the recorded trial log directly and never through the query under test - the runner's record is what actually happened, and a query checked against itself proves nothing.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `episodes-queried-by-eql` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
- id: experiment-d-in-simulation
  title: >-
    Experiment D in simulation: the episode history questioned through EQL and through the vision-language baseline
  branch: null
  pull_request_number: null
  track: experiment-d
  depends_on:
  - cross-episode-question-set-and-ground-truth
  status: not_started
  notes: >-
    First a corpus worth asking about: the scenarios run under varied conditions and perturbations so the history holds repeats, failures resolved differently, and goals that changed between runs. Then every question through both systems, repeated for variance the way Experiment A does, reporting accuracy against the recorded ground truth, latency, determinism across repetitions, and information availability - whether the corpus holds the facts a question declares it requires. Availability is measured on the corpus once rather than per system, because both systems see the same episodes, so a question nothing could have answered is scored apart from one both had the evidence for. Simulation only, decided 2026-09-04: the questions are about recorded episodes, so the robot episodes Experiments A and C record join the same corpus without a robot session of their own.
  blockers:
  - >-
    Cross-plan: depends on icra-mechanism's `episode-corpus-given-whole-to-the-vlm` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
  - >-
    Cross-plan: depends on icra-foundation's `montessori-scenarios` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
