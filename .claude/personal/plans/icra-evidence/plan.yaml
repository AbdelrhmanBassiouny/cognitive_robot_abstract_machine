schema_version: 1
id: icra-evidence
title: >-
  ICRA experiments: experiments in simulation, then on the robot, then released
description: >-
  The evidence wave of icra-experiments (split 2026-09-05 for the plan size budget -- see plan-size-limits' roadmap.md for why): Experiments A, B, C and D, each run end to end in simulation before the robot, and the released artifact. Every experiment stacks on icra-foundation's scenario model and episode recording, and most stack on icra-mechanism's routing, verification and baselines too; those depends_on edges could not cross the plan boundary and are recorded as blockers instead (see roadmap.md).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: evidence
  name: Experiments in simulation, then on the robot, then released
  description: >-
    Each experiment runs end to end in simulation first, with its episodes in the database and its report generated, and only then on the robot. The artifact packages what both produced.
tracks:
- id: experiment-a
  name: 'Experiment A: question answering'
  wave: evidence
  description: Lane 3 in simulation, robot time shared.
- id: experiment-b
  name: 'Experiment B: decomposition and verification'
  wave: evidence
  description: Lane 1.
- id: experiment-c
  name: 'Experiment C: manipulation under ablations'
  wave: evidence
  description: Lane 2.
- id: experiment-d
  name: 'Experiment D: long-term memory across episodes'
  wave: evidence
  description: >-
    Lane 2. The questions Experiment A asks about the current scene, asked instead of the episode history, against a vision-language model given the whole recorded corpus. Simulation only.
- id: release
  name: Figures and the artifact
  wave: evidence
  description: Lane 3.
items:
- id: question-set-and-ground-truth
  title: >-
    The twelve questions in four buckets, as EQL and English, with ground truth and structural requirements
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on: []
  status: not_started
  notes: >-
    Freeze first, on the memo's day one. Lookup (links, joints, gripper finger pose), spatial (what, where, colour, surface, left or right), temporal (moved, moved by you, picked up) and embodiment (in hand), each a Question dataclass carrying its EQL, its English, its answer type and the inputs it structurally requires (the memo's table). The temporal questions have two spellings: over working memory (segmind events) and over long-term memory (the SQL backend). Ground truth is the twin in simulation, exact, and the calibrated twin plus a human check on the robot, stated as such. Several of these already exist as presets in the console stack's live_query_source; reuse their EQL.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `scenario-domain-model` (in_progress, PR #261), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
- id: experiment-a-in-simulation
  title: >-
    Experiment A run end to end in simulation: scenes, temporal scenarios, determinism, three systems, report
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on:
  - question-set-and-ground-truth
  status: not_started
  notes: >-
    Every scene and scripted scenario through the runner, every question through EQL and both VLM systems, five repetitions for variance, episodes in the database, the accuracy-per-bucket, latency, variance and footprint tables generated. The point is that the robot runs are a rerun of a script that already works, with only the scenes replaced.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `montessori-scenarios` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
  - >-
    Cross-plan: depends on icra-mechanism's `query-routed-per-predicate` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
  - >-
    Cross-plan: depends on icra-mechanism's `vlm-baseline-harness` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
  - >-
    Cross-plan: depends on icra-foundation's `episodes-recorded-through-ormatic` (in_progress, PR #271), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
- id: experiment-a-on-the-robot
