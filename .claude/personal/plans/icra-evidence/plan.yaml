schema_version: 1
id: icra-evidence
title: >-
  ICRA experiments: experiments in simulation, then on the robot, then released
description: >-
  The evidence wave of icra-experiments (split 2026-09-05 for the plan size budget -- see plan-size-limits' roadmap.md for why): Experiments A, B, C and D, each run end to end in simulation before the robot, and the released artifact. Organised 2026-09-08 by the levels of Bloom's taxonomy the questions exercise -- Remembering over long-term memory (D), Understanding over working memory (A), and Applying under knowledge ablations (C), with B showing that all three run on one representation -- and carrying the resource cost of every answer beside its correctness, which is the comparison against vision-language models the paper actually makes. Every experiment stacks on icra-foundation's scenario model and episode recording, and most stack on icra-mechanism's routing, control and baselines too; those depends_on edges could not cross the plan boundary and are recorded as blockers instead (see roadmap.md).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: evidence
  name: Experiments in simulation, then on the robot, then released
  description: >-
    Each experiment runs end to end in simulation first, with its episodes in the database and its report generated, and only then on the robot. The artifact packages what both produced.
tracks:
- id: experiment-a
  name: 'Experiment A: understanding the current scene'
  wave: evidence
  description: >-
    Lane 3 in simulation, robot time shared. Bloom's Understanding level: the questions are answered from what is already represented, in the query language, without inferring anything new.
- id: experiment-b
  name: 'Experiment B: one representation across the subsystems'
  wave: evidence
  description: >-
    Lane 1. That perception, control, memory and event segmentation are answered through one query language over one representation, shown by decomposing a mixed statement across backends and by swapping a backend without changing anything above it.
- id: experiment-c
  name: 'Experiment C: applying the knowledge under ablations'
  wave: evidence
  description: >-
    Lane 2. Bloom's Applying level: the demo runs on the whole representation, then with one part of it removed at a time, and the failures that follow are typed and predicted.
- id: experiment-d
  name: 'Experiment D: remembering across episodes'
  wave: evidence
  description: >-
    Lane 2. Bloom's Remembering level: the questions Experiment A asks about the current scene, asked instead of the episode history, against a vision-language model given the whole recorded corpus. Simulation only.
- id: efficiency
  name: What an answer costs
  wave: evidence
  description: >-
    Lane 3. The resource cost of every answer on every system, reported beside its correctness, which is what the comparison against vision-language models rests on.
- id: release
  name: Figures and the artifact
  wave: evidence
  description: Lane 3.
items:
- id: question-set-and-ground-truth
  title: >-
    The question set in six buckets, as EQL and English, each labelled by Bloom level, with ground truth and structural requirements
  branch: claude/plan-item-kickoff-icra-evidence-zyzfnj
  pull_request_number: 295
  track: experiment-a
  session: https://claude.ai/code/session_01LrEoLWVFPJUoLjAKjFPb9f
  depends_on: []
  status: in_progress
  notes: >-
    Freeze first; everything downstream is written against it. Each question is a Question dataclass carrying its EQL, its English, its answer type, the Bloom level it exercises and the inputs it structurally requires. Six buckets, widened from four on 2026-09-08 so that the control program and the robot's own body are questioned in the same language as the scene: scene (what objects do you see now, what colours are they, where are they), support and spatial relations (what surfaces are they standing on, is the cube left or right of the cylinder), temporal and agency (did anything recently move, which, did you move it, was the cube recently picked up), embodiment (is it currently in your hand), self-model (where is your gripper left finger, how many links do you have, how many joints do you have) and control (what are you constrained by right now, which task is active, why did the motion stop). Every bucket has two spellings, not only the temporal one: over working memory (the twin plus the segmind event log) and over long-term memory (the SQL backend), which is what makes Understanding and Remembering separately measurable.

    The Bloom labelling is the paper's evaluation frame and it is deliberately bounded. Remembering is recall from the store; Understanding is interpreting what is already represented well enough to answer a direct question in the query language, whether spatial, temporal or logical; Applying is Experiment C. Questions that need new knowledge inferred by combining facts - what can you pick up, and why or why not - are above Understanding and are explicitly out of scope, stated as such in the paper rather than left for a reviewer to ask about. Ground truth is the twin in simulation, exact, and the calibrated twin plus a human check on the robot, stated as such. Several of these already exist as presets in the console stack's live_query_source; reuse their EQL.

    Reviewed 2026-09-08 and largely rebuilt in response. Nothing is handed to a question any more: every variable is domainless and ranges over the symbol graph, what a question is about is a condition, and what is left of the source is the robot itself, which is whose memory it is. `DetectionEvent` inherits `Symbol` so an event joins working memory by being made; agency is asked through a new `ManipulatesBodies` mixin rather than through `PickUpEvent` alone; and the set is read off the question subclasses, each saying how a scene fills it in, rather than from a hand-maintained list. Two defects were measured rather than assumed: `exists` answers the agency shape with every object that moved whether the robot acted on it or not - a wrong answer rather than the dropped row eql-existential-semantics predicts - so both spellings use a join; and a membership condition over a collection does not translate to a join, which is what blocks the long-term half. Selecting a collection was the other half of that and is fixed in krrood.

    Resolved 2026-09-08 (second pass). Two review threads had gone unanswered since 13:25 that day and were what actually stalled the item, neither recorded here at the time. The first asked for the collection-membership defect to be fixed in the EQL-to-SQL converter rather than left as a strict xfail, which overrides the earlier call that per-variable aliasing "belongs to an EQL plan rather than to this item"; it is fixed here. The second said the `ManipulatesBodies` mixin was meant for coraplex actions rather than segmind events, because an event's tracked object is already the object acted on, and named `AgentInteractionEvent` as what segmind should carry instead.


    CI on that round is what first ran the long-term questions end to end, and it found the fix half-made: the join translated, but a question selecting an attribute reached through a collection answered nine rows where three and one were right, because the table it selects from was left with nothing joining it and a condition relating two members was dropped as a table-level join between two aliases of one class. Both are fixed, each with a failing krrood test first, and the ORM suite is 140 passed. The lesson for whoever asserts a query's answer: assert the rows, not the set of them - every test of the first round sorted distinct names, so a duplicated row was invisible to all of them.
    The membership fix is per-variable aliasing after all, and it is what unblocks the long-term half: each variable now ranges over a FROM element of its own, so an owner and a member whose classes share a mapped base are told apart in the ON clause, and two variables of one class over one collection reach two of its members. So the long-term spellings are answerable rather than frozen-and-expected-to-fail, and the accuracy table this item's successor produces is no longer bounded to the working-memory half. `AgentInteractionEvent` also removes the one long-term question shape that could not translate at all: `manipulated_bodies` was a Python property, while `tracked_object` is a mapped relationship.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `scenario-domain-model` (in_progress, PR #261), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
  - >-
    Awaiting the developer on two review threads left deliberately open, neither of which blocks the branch from being reviewed: whether a body in the gripper counts as an object the robot sees or as part of the robot (`AbstractRobot.bodies` includes what the robot holds, so `ObjectsSeen` no longer lists the held cube), and whether an episode should record which links were the robot's (the embodiment bucket's long-term spelling and the robot's own degree-of-freedom count both need it, and recording the world does not answer it).
  - >-
    Cross-plan: the self-model and control buckets need their long-term-memory spelling from icra-foundation's `episodes-recorded-through-ormatic` (PR #271), which is where the episode gains a reference to the world it ran in and the motion statechart it ran, and from icra-mechanism's `control-constraints-and-degrees-of-freedom-queried`, which is what gives the constraints and the used degrees of freedom a name and an EQL spelling. The working-memory spelling of the self-model bucket needs neither: the live twin already holds bodies, connections and degrees of freedom, and all of them are already ORMatic-mapped.
- id: question-set-answered-from-memory
  title: >-
    Every bucket answered through EQL over working memory and over long-term memory, before any baseline exists
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on:
  - question-set-and-ground-truth
  status: not_started
  notes: >
    Prioritised to the front on 2026-09-08 at the developer's direction, and the item two people can
    run in parallel from the day the question set is frozen: one takes the working-memory spelling
    over a live simulated scene, the other the long-term-memory spelling over the recorded corpus,
    and neither waits for the other or for a vision-language model. Every question in all six
    buckets, scored against ground truth, with its answer, its latency and its resource cost
    recorded as an episode row like any other query. It is the paper's own numbers standing alone -
    what the system can answer and what it cannot - and it is what the Understanding and Remembering
    claims are made of; Experiment A and Experiment D then layer the baselines on top of it rather
    than establishing it. Because it needs no external model and no credentials, it is also the
    fallback if the baseline arms are cut: the accuracy, latency and footprint tables exist without
    them.

    Updated 2026-09-08 from `question-set-and-ground-truth` (#295), which froze the set this item
    scores: the long-term-memory half is thinner than the working-memory one, and three buckets have
    no long-term spelling to answer yet. Support and spatial relations needs icra-mechanism's
    `query-routed-per-predicate`, because the spatial relations are geometric predicates and
    answering them from rows is a routed predicate. Embodiment reduces to the pick-up record the
    temporal bucket already asks, unless an episode also records which links were the robot's -
    recording the world does not answer that, since a held object hangs off a link without becoming
    one. Control has no spelling in either memory until
    `control-constraints-and-degrees-of-freedom-queried`. So the accuracy table this item produces
    is over five buckets live and three recorded until those land.

    Updated again 2026-09-08 after #295's review round, and the long-term half is not merely thinner but currently unanswerable: every long-term question reaches a run's ticks and their events through a to-many collection, and a membership condition over a collection does not translate to a join - each variable translates to its unaliased data access object, so an owner and a member whose classes share a mapped base cannot be told apart in the ON clause. #295 fixes the other half (selecting a collection now returns its members rather than the association rows) and records this one as a strict xfail in krrood's own suite; the fix is per-variable aliasing in the translator and belongs to an EQL plan. Until it lands this item's long-term half produces no accuracy table at all, so the working-memory half is the whole of what two people can run in parallel today.
  blockers:
  - >-
    Cross-plan: the long-term-memory half depends on icra-foundation's `episodes-queried-by-eql` (in_progress, PR #278) and `episode-corpus-generated-at-scale` (not_started); the working-memory half on `integrated-simulation-pipeline` (in_progress, PR #265). depends_on cannot cross a plan boundary.
- id: objects-seen-asked-of-the-perception-system
  title: >-
    What the robot sees is what its perception system reports, from detectors built for what the belief state says is detectable
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on:
  - question-set-and-ground-truth
  status: not_started
  notes: >-
    Added 2026-09-08 at the developer's direction on #295's review, where `ObjectsSeen` answers from the belief state directly. It should ask the perception system instead, and the query it puts is open-ended: give me every object you can detect. The backend answers it by reading what the belief state (the symbol graph) already holds -- semantic annotations and bodies -- finding which of them carry perceptually detectable properties it has detectors for, combining those properties into a detection pipeline, running it, and returning what it found. Where it has a detector that finds whatever is in view rather than one keyed to a property (YOLO, or SAM with CLIP, or their like), it uses that and returns hypotheses: semantic annotations filled in as far as the evidence goes and no further.

    That makes what the robot sees a perception result rather than a reading of what it already believes, which is what the scene bucket claims to measure. It is also the sharpest form of the knowledge-directed claim in the question set: the detectors are chosen by what the robot knows is out there, so the same question asked of a scene the robot knows nothing about is answered by the general detector alone.

    Until it lands, `ObjectsSeen` keeps the implementation #295 froze -- every object in the belief state visible to the simulated camera view in MuJoCo -- which the developer asked for explicitly rather than as a placeholder nobody chose.

    Recorded in this plan because that is where the question it changes lives, and because #295's review is where it was asked for. It may belong in icra-mechanism's `backend-routing` track instead, beside `backends-declare-their-capabilities` (which is where a perception backend says what it can answer) and `perception-backends-are-interchangeable`; moving it is a one-line change to `track` and the plan file it sits in.
  blockers:
  - >-
    Cross-plan: needs icra-mechanism's `backends-declare-their-capabilities` for the perception backend to say which detectors it has, and `query-routed-per-predicate` for a question to reach it at all; both not_started. depends_on cannot cross a plan boundary.
