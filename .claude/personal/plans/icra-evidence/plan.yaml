    Widened 2026-09-08 with the question set itself: every bucket has a long-term-memory spelling, and these four kinds are the ones that only long-term memory can answer at all. Each is a Question in the shape question-set-and-ground-truth already defines - EQL, English, answer type, and the facts it structurally requires - but spelled over the SQL backend and reaching across episodes rather than into the current scene: has this happened to the robot before and in which episode; what the goal and the conditions were at that time; what differed between the earlier episodes and the current one that bears on the question; and how a failure was resolved the last time it happened. This is the second spelling question-set-and-ground-truth already names for the temporal bucket, carried to every bucket. Ground truth is read from the recorded trial log directly and never through the query under test - the runner's record is what actually happened, and a query checked against itself proves nothing.
