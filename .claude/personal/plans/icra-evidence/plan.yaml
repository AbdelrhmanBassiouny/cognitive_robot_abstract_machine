schema_version: 1
id: icra-evidence
title: 'ICRA experiments: experiments in simulation, then on the robot, then released'
description: 'The evidence wave of icra-experiments (split 2026-09-05 for the plan size budget
  -- see plan-size-limits'' roadmap.md for why): Experiments A, B, C and D, each run end to
  end in simulation before the robot, and the released artifact.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: evidence
  name: Experiments in simulation, then on the robot, then released
  description: Each experiment runs end to end in simulation first, with its episodes in the
    database and its report generated, and only then on the robot. The artifact packages what
    both produced.
tracks:
- id: experiment-a
  name: 'Experiment A: understanding the current scene'
  wave: evidence
  description: 'Lane 3 in simulation, robot time shared. Bloom''s Understanding level: the
    questions are answered from what is already represented, in the query language, without
    inferring anything new.'
- id: experiment-b
  name: 'Experiment B: one representation across the subsystems'
  wave: evidence
  description: Lane 1. That perception, control, memory and event segmentation are answered
    through one query language over one representation, shown by decomposing a mixed statement
    across backends and by swapping a backend without changing anything above it.
- id: experiment-c
  name: 'Experiment C: applying the knowledge under ablations'
  wave: evidence
  description: 'Lane 2. Bloom''s Applying level: the demo runs on the whole representation,
    then with one part of it removed at a time, and the failures that follow are typed and
    predicted.'
- id: experiment-d
  name: 'Experiment D: remembering across episodes'
  wave: evidence
  description: 'Lane 2. Bloom''s Remembering level: the questions Experiment A asks about
    the current scene, asked instead of the episode history, against a vision-language model
    given the whole recorded corpus. Simulation only.'
- id: efficiency
  name: What an answer costs
  wave: evidence
  description: Lane 3. The resource cost of every answer on every system, reported beside
    its correctness, which is what the comparison against vision-language models rests on.
- id: release
  name: Figures and the artifact
  wave: evidence
  description: Lane 3.
items:
- id: objects-seen-asked-of-the-perception-system
  title: What the robot sees is what its perception system reports, from detectors built for
    what the belief state says is detectable
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on: []
  status: not started
  notes: 'Added 2026-09-08 at the developer''s direction on #295''s review, where `ObjectsSeen`
    answers from the belief state directly. It should ask the perception system instead, and
    the query it puts is open-ended: give me every object you can detect. The backend answers
    it by reading what the belief state (the symbol graph) already holds -- semantic annotations
    and bodies -- finding which of them carry perceptually detectable properties it has detectors
    for, combining those properties into a detection pipeline, running it, and returning what
    it found.'
  blockers:
  - 'Cross-plan: needs icra-mechanism''s `backends-declare-their-capabilities` for the perception
    backend to say which detectors it has, and `query-routed-per-predicate` for a question
    to reach it at all; both not_started. depends_on cannot cross a plan boundary.'
- id: experiment-a-in-simulation
  title: 'Experiment A run end to end in simulation: scenes, temporal scenarios, determinism,
    three systems, report'
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on: []
  status: not started
  notes: Every scene and scripted scenario through the runner, every question through EQL
    and both VLM systems, five repetitions for variance, episodes in the database, the accuracy-per-bucket,
    latency, variance and footprint tables generated. The point is that the robot runs are
    a rerun of a script that already works, with only the scenes replaced. Since 2026-09-08
    this item is the baseline comparison layered onto question-set-answered-from-memory rather
    than the first place the questions are asked, so a cut here costs the comparison and not
    the result.
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `montessori-scenarios` (not_started), split
    out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
  - 'Cross-plan: depends on icra-mechanism''s `query-routed-per-predicate` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: experiment-a-on-the-robot
  title: 'Experiment A on the UR10: random, partial and ambiguous scenes, temporal scenarios,
    determinism'
  branch: null
  pull_request_number: null
  track: experiment-a
  depends_on:
  - experiment-a-in-simulation
  status: not started
  notes: 15 to 20 random scenes, five partial, five near-ambiguous, the four temporal scenarios
    five times each, every query five times; lighting only if time remains. Robot state recorded
    with the camera in every take. Ground truth annotated the same day.
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `tracy-demo-takes-the-integrated-branch` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: experiment-b-in-simulation
  title: 'Experiment B in simulation: mixed-predicate routing with and without the twin''s
    knowledge, and verification under injected errors'
  branch: null
  pull_request_number: null
  track: experiment-b
  depends_on: []
  status: not started
  notes: 'H1 and H3. The mixed statements with the triangle believed in versus not, reporting
    per-predicate assignment, region size, detector calls and latency, extending the ratios
    #238 already measured on the six captures. Then about thirty injected events (offsets,
    wrong object, pushes) through the perceive-commit-verify loop, reporting precision and
    recall of disagreement as a detector.'
  blockers:
  - 'Cross-plan: depends on icra-mechanism''s `query-routed-per-predicate` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
  - 'Cross-plan: depends on icra-mechanism''s `physics-verification-backend` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: experiment-b-on-the-robot
  title: Experiment B on the UR10
  branch: null
  pull_request_number: null
  track: experiment-b
  depends_on:
  - experiment-b-in-simulation
  status: not started
  notes: The same script on the live feed. The memo's cut order drops the injection half first
    and keeps the decomposition half; the simulation numbers stand in for whatever is cut,
    stated as such.
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `tracy-demo-takes-the-integrated-branch` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: experiment-c-in-simulation
  title: 'Experiment C in simulation: every condition, twenty to thirty trials, typed and
    predicted failures'
  branch: null
  pull_request_number: null
  track: experiment-c
  depends_on: []
  status: not started
  blockers:
  - 'Cross-plan: the failure-detection story (perception looks where the action promised and
    reports the difference) is knowledge-directed-perception''s expectations-from-events,
    which that plan owns and has not started. Without it Experiment C reports typed failures
    but not detected ones.'
  - 'Cross-plan: depends on icra-mechanism''s `knowledge-ablations` (not_started), split out
    of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
  notes: The insertion trial from a randomised start pose under every condition, board-level
    completion reported too, every failure typed and every prediction scored, the stacked
    failure-type bars generated from the database. Runs in batches the way batch_runner already
    does, so hundreds of trials survive the process's memory growth.
- id: experiment-c-on-the-robot
  title: 'Experiment C on the UR10: twenty trials per condition'
  branch: null
  pull_request_number: null
  track: experiment-c
  depends_on:
  - experiment-c-in-simulation
  status: not started
  notes: Twenty trials per condition, thirty only if the pipeline is stable; the perturbation
    conditions are never cut. Two days of robot time.
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `tracy-demo-takes-the-integrated-branch` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: cross-episode-question-set-and-ground-truth
  title: The questions asked of the episode history, with ground truth read from what the
    runner recorded
  branch: null
  pull_request_number: null
  track: experiment-d
  depends_on: []
  status: not started
  notes: 'Widened 2026-09-08 with the question set itself: every bucket has a long-term-memory
    spelling, and these four kinds are the ones that only long-term memory can answer at all.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `episodes-queried-by-eql` (not_started), split
    out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: experiment-d-in-simulation
  title: 'Experiment D in simulation: the episode history questioned through EQL and through
    the vision-language baseline'
  branch: null
  pull_request_number: null
  track: experiment-d
  depends_on:
  - cross-episode-question-set-and-ground-truth
  status: not started
  notes: 'First a corpus worth asking about: the scenarios run under varied conditions and
    perturbations so the history holds repeats, failures resolved differently, and goals that
    changed between runs. Then every question through both systems, repeated for variance
    the way Experiment A does, reporting accuracy against the recorded ground truth, latency,
    determinism across repetitions, and information availability - whether the corpus holds
    the facts a question declares it requires.'
  blockers:
  - 'Cross-plan: depends on icra-mechanism''s `episode-corpus-given-whole-to-the-vlm` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
  - 'Cross-plan: depends on icra-foundation''s `montessori-scenarios` (not_started), split
    out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: benchmark-artifact
  title: 'The released artifact: scenes, ground truth, questions, prompts, conditions, captures
    and the episode database'
  branch: null
  pull_request_number: null
  track: release
  depends_on:
  - experiment-a-on-the-robot
  - experiment-b-on-the-robot
  - experiment-c-on-the-robot
  status: not started
  notes: 'A repository a reader can run the simulation experiments from and compare against
    the robot episodes with: the Scenario definitions, the question set, the VLM prompts,
    the Condition and Perturbation definitions, the six captures plus every new one, and a
    dump of the episode database. The rosbags stay out (4.7 GB). Packaged on the memo''s 12
    to 13 September.'
- id: resource-cost-measured-per-system
  title: What every answer costs, on every system, reported beside whether it was right
  branch: null
  pull_request_number: null
  track: efficiency
  depends_on: []
  status: not started
  notes: 'The claim the paper makes about vision-language models is about cost, not about
    accuracy alone, so the cost is measured rather than asserted. Per question and per system:
    wall-clock latency, processor time, peak resident memory, and the size of what had to
    be held - the database on disk and in memory for the query backends, the model''s parameters
    and the tokens sent and received for the vision-language arms, with the monetary and energy
    figures those imply stated with the assumption behind them.'
