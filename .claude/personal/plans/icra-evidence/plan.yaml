- id: resource-cost-measured-per-system
  title: >-
    What every answer costs, on every system, reported beside whether it was right
  branch: null
  pull_request_number: null
  track: efficiency
  depends_on:
  - question-set-answered-from-memory
  status: not_started
  notes: >-
    The claim the paper makes about vision-language models is about cost, not about accuracy alone, so the cost is measured rather than asserted. Per question and per system: wall-clock latency, processor time, peak resident memory, and the size of what had to be held - the database on disk and in memory for the query backends, the model's parameters and the tokens sent and received for the vision-language arms, with the monetary and energy figures those imply stated with the assumption behind them. Reported per bucket and per Bloom level, so the shape of the difference is visible rather than one aggregate: recall from a database against recall from a sampled video corpus is a different comparison from answering a spatial relation about the scene in front of the robot. Every number comes from the episode rows the runner already writes, so the table is regenerated by the figures script rather than transcribed. A measurement item, not an experiment: it instruments what the other experiments run.
