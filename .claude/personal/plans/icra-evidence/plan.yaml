  status: not_started
  notes: >-
    15 to 20 random scenes, five partial, five near-ambiguous, the four temporal scenarios five times each, every query five times; lighting only if time remains. Robot state recorded with the camera in every take. Ground truth annotated the same day.
  blockers:
