# Plan manifest — schema_version 1. See ../README.md for the full schema
# reference and .claude/skills/plan-dashboard/SKILL.md (on main) for how this
# file is read and cross-checked against live GitHub state.
#
# `status` here is always the session's own manual planning assessment
# (not_started | in_progress | blocked | deferred | done). It never encodes
# draft/ready-for-review/merged/CI state — that is fetched live from GitHub
# by the dashboard skill every time it runs, so it can never go stale in this
# file. The skill flags any item where `status` looks inconsistent with what
# GitHub actually reports (e.g. status: in_progress on a PR that's already
# merged).
schema_version: 1
id: rdr-refactor
title: "RDR / EQL Master Roadmap"
description: >
  Programme to land the EQL-native RDR engine, the feature layer ("poor
  man's Rete"), MCRDR/GRDR multi-tree engines, concept trees (NRDR), OO
  integration, and TMS justifications on top of EQL — plus the Why &
  Montessori explanation track that was prioritized alongside it.
default_repo: AbdelrhmanBassiouny/cognitive_robot_abstract_machine

waves:
  - id: wave-0
    name: "Wave 0 — finish landing the engine"
  - id: why-montessori
    name: "Why & Montessori track (priority after Wave 0)"
  - id: wave-1
    name: "Wave 1 — independent foundations"
  - id: wave-2
    name: "Wave 2 — concept trees"
  - id: wave-3
    name: "Wave 3 — OO integration + TMS"

tracks:
  - id: S0-steward
    name: "Steward — the split-PR stack"
    wave: wave-0
    description: >
      Babysit the open stack bottom-up; merge in dependency order; propagate
      restacks forward after each merge.
  - id: S1-d-ui
    name: "D-ui — interactive expert interface"
    wave: wave-0
  - id: S2-d-deco
    name: "D-deco — @rdr decorator + file store"
    wave: wave-0
  - id: S3-docs
    name: "Docs — re-land the architecture brief"
    wave: wave-0
  - id: oo-prototypes
    name: "OO-track prototypes (stale bases, harvested by Wave 3)"
    wave: wave-3
  - id: why-track
    name: "Why track (W1-W3, C1)"
    wave: why-montessori
  - id: montessori-track
    name: "Montessori demo (M1-M2, deferred)"
    wave: why-montessori
  - id: track-f
    name: "Track F — feature layer"
    wave: wave-1
  - id: track-g
    name: "Track G — multi-tree engines (MCRDR/GRDR)"
    wave: wave-1
  - id: track-t
    name: "Track T — truth unification"
    wave: wave-1
  - id: concept-trees-track
    name: "Concept trees (NRDR)"
    wave: wave-2
  - id: oo-definitions-track
    name: "OO integration"
    wave: wave-3
  - id: justifications-track
    name: "TMS justifications"
    wave: wave-3

