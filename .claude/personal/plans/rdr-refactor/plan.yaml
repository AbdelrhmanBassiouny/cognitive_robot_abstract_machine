    2026-08-02: reparented onto main (PR comment 5157212715) now that ripple-down-rules-refactor''s
    content has landed via #53, so depends_on below is satisfied and the diff is the real
    7 files / +1,318 rather than the stale-merge-base 268 files.
    2026-08-03: the "ready for the steward to merge" claim above is superseded -- a new review
    thread (r3702021144, backward_inference.py:64) asks whether GuardCondition.negated should be
    replaced by wrapping the guard expression in Not(), considering every use of the guard across
    this plan rather than just this PR. It is a discussion request, so the PR is blocked on the
    developer''s call, not on code. Answered at r3702169709 recommending the field be kept: the
    alternative was already designed and rejected in backward_inference_design.md ("no live tree
    mutation"), and the hazard was re-verified live -- factories.not_ -> _invert_ -> Not(self) ->
    base_expressions.py:299 child._parent_ = self reparents a live rule-tree node, the same defect
    class dag-facade-hardening (#96) exists to fix. Recommendation carries an expiry: Not()-wrapping
    is cleaner at 4 of 6 concrete sites and wins outright once #96 lands a non-mutating negation.
    CI green, 20/20 checks on head cbbf7bf3. Thread deliberately left unresolved. Full account in
    roadmap.md section 12.
    2026-08-03 (later): resolved -- the developer resolved thread r3702021144 without counter-argument
    and marked #41 ready for review. Decision: keep GuardCondition.negated. All 23 review threads are
    now resolved, draft: false, mergeable_state: clean, so #41 is genuinely ready for the steward to
    merge as the stack bottom. Three small follow-ups offered in the reply are NOT yet applied and
    need the developer''s go-ahead, since pushing would force the PR back to draft per the standing
    convention: record the no-live-tree-mutation rationale in the field docstring (its design doc is
    on the dropped krrood/docs/ path), correct the misleading evaluation comment at
    backward_inference.py:82-90, and TDD-pin whether the isinstance(OperationResult) branch in
    holds_for is reachable before deleting it.
    All three applied and pushed as 29c27cca; PR converted back to draft per convention. The
    reachability probe corrected an earlier claim of mine: evaluate() does not only yield true
    results -- a leaf predicate yields a literal False when it fails, so bool(result) is
    load-bearing and "did it yield anything" would have been wrong. Only the isinstance branch
    was dead. Verified against a clean run of the previous head in the same container: 206 failed
    / 935 passed before, 206 failed / 937 passed after, the +2 being exactly the new tests.
    scripts/format_docstrings.py was deliberately not run on the result -- it rewrites the whole
    module (125 unrelated lines) and regresses ":return: ``True``" to ":return:``True``"; flagged
    on the thread as deserving its own pass. The _materialize live-node mutation is filed as
    dag-facade-hardening''s non-mutating-negation item, per the developer''s call; when that
    lands, GuardCondition.negated should be revisited, since Not()-wrapping was cleaner at 4 of
    6 sites and the mutation hazard was the only thing against it.
    2026-08-03 (final): the developer marked #41 ready for review again after the push. CI green
    20/20 on head 29c27cca including test_each_lib (krrood), draft: false, mergeable_state: clean,
    all 23 threads resolved. CI passing is the stronger verification here -- the resolve session''s
    own container lacked the dependency set entirely (206 environment failures, identical before and
    after), whereas CI runs the real one. Nothing outstanding: #41 is ready to merge as the stack
    bottom, and the next steward pass should cascade it forward through #63-#67/#98. 2026-08-08:
    reopened by the developer as a design question -- should GuardCondition move into
    rules/conclusion_selector.py, should the selectors move into rdr/, or is the isinstance dispatch
    in _leaf_guards/_collect_rule_paths fine as a closed set? Answered: neither move (conclusion_selector.py
    has EQL-core consumers in factories.py/scope.py/query_graph.py, so moving the selectors inverts the
    layering; GuardCondition has only rdr/ consumers, so moving it does the same in miniature), but the
    open/closed instinct was right for a reason other than extensibility -- ConclusionSelector already
    makes the insertion side polymorphic (_get_current_context_condition, _create_between_two_expressions)
    while traversal was an isinstance ladder over the same three classes, and one per-selector rule set
    lived in two functions with nothing forcing them to change together. Landed as rdr/branch_semantics.py
    (SelectorBranchSemantics, one class per selector holding both sibling_guards and branches), dispatching
    through krrood/patterns/specificity_ranking.py -- the same primitives behind the grammar PhraseRule
