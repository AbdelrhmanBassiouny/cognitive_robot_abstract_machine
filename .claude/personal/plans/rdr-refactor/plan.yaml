  notes: '2026-08-22 resolve: narrowed to aid.py, then took test_condition_resolver.py back at the developer''s direction (c21e1fe3). The 2026-08-21 review round opened 4 threads none of which the item notes had recorded - same staleness class as sections 5/14/18/19. Chasing the stale `_materialize` / `TargetKnowledgeResolver` names found 9 readers on main, 2 of them in production source (condition_resolver.py:11 and :230), so the fix first moved wholesale to #161; the developer then asked for the test-file half here, so this PR now owns test_condition_resolver.py entire (dividers, header names, the 3 test_target_knowledge_resolver_* names, the module docstring and the materialized_guard wording) and #161 keeps only the readers this PR does not touch. No file is touched by both, verified with git merge-tree. test_aid.py deleted as asked - its 3 tests restated a declaration or the language, coverage already on #159''s test_ask_for_rule.py. The test_rdr_alchemy.py flaky skip moved to bug PR #189 off main. Also merged current main (8c041a10) after CI went red on test_world_sim_state_sync: this branch was 10 commits behind and predated a7c21ffe6''s flaky marking. test_eql_rdr 45 passed / 0 failed, collected-id diff exactly the 3 renames; test_eql 1179 passed / 3 skipped / 0 failed. Full account in roadmap.md section 23.2026-08-22 (later): also removes main''s obsolete @unittest.skip on test_rdr.py::TestRDR::test_fit_mcrdr_stop_only (b39fb248), at the developer''s direction to do it here rather than as a separate main-based PR - the same call they made for test_condition_resolver.py. The skip was never justified: 57a1babac applied it 2026-07-10 blaming nondeterminism, but b25353559 fixed the real fault on 2026-07-15 (every .py fixture''s answer delimiter was double-quoted while experts.py splits on single quotes, so the loader silently returned 1 answer instead of 18 and fell through to a live prompt). Reproduced with the pre-fix fixture. Stress-swept before removing: 400/400 on main, 150/150 on this branch, 400/400 on the alchemy sibling, 100/100 whole-class, all over PYTHONHASHSEED. test_ripple_down_rules now 76 passed / 2 skipped, one more passing and one fewer skipped. This PR is now 3 files: aid.py, test_condition_resolver.py, test_rdr.py.2026-08-23 resolve: nothing in the code was wrong - CI 23/23 green on b39fb248, mergeable_state clean against main 3f643cff, rdr-backward-inference merged. Two things outside the diff were holding it. First, the three review threads the 2026-08-22 round left open had in fact been answered by c21e1fe3 (the file moved here whole, as the developer then asked) but were never replied to or resolved on their own threads; all seven threads are now resolved, each with a reply checked against the branch head rather than the outdated diff snippet GitHub shows. Second, the actual blocker: the pull request carried the cram2-link-sent label while its description had no ## Promote section at all. A later description rewrite dropped the section, and that label is exactly what stops a maintenance pass rebuilding one - promote() skips any pull request carrying it, and clear_spent_promotion_labels only clears it once the branch is in-review or merged. So the bottom of the seven-PR stack had no create-link and nothing was going to give it one. Restored under ## Promote as a plain compare link: a compare URL carrying an encoded title=/body= prefill is neutralised into inline code when written from a session, so the title and summary to paste sit beside the link as text. Not re-drafted, per the developer having marked it ready. Full account in roadmap.md section 27.2026-08-23 correction, after the developer asked whether the upstream-reviews Action had been run: it had not, and running it overturns the paragraph above. This branch is already promoted - it is cram2 #557 - and it is stalled on an upstream request for changes, not on a missing create-link. The in_review_label was never applied at promote time, which is the one signal both the resolve skill and the maintenance pass read, so the fork side looked unpromoted to everything including the check that decides whether to read upstream review state at all. Corrected: the pull request is now labelled in-review, cram2-link-sent is cleared, and the ## Promote section added earlier is removed, since clicking it would have opened a duplicate upstream pull request. Upstream state: LucaKro changes-requested ("this code is not used anywhere but the tests, so to me this is dead code"), tomsch420 changes-requested with no body, and one unresolved thread on aid.py:27 about the name Aid, which the developer answered on 2026-08-23T10:28Z with the design to implement - a ConclusionHelper abstract base plus one mixin per method (ConclusionSuggestor and a presenting counterpart), each mixin itself a ConclusionHelper, so a helper can implement either or both. That rename is this item''s outstanding work and is not yet started. Full account in roadmap.md section 27.2026-08-23 round 2, the upstream review''s actual ask: aid.py is renamed to conclusion_helper.py and ConclusionAid split into the family the developer settled on cram2 #557''s aid.py:27 thread - a ConclusionHelper base declaring the family, plus one mixin per method, ConclusionSupportPresenter.present() and ConclusionSuggester.suggest(), a helper implementing either or both. Spellings corrected from the thread (Suggestor -> Suggester, Presenstor -> Presenter) with the developer''s agreement. Pushed as 39da5f22. Nothing on this branch imports the module, so the split''s own coverage is on #98; test_eql_rdr 45 passed here. The consumers moved in the same round rather than being left to the cascade, because a merge of this rename into a branch whose imports still say aid produces no conflict for git to flag - #67 04a3fe89, #98 af77399b, #159 34df6172. Merge chain re-probed with git merge-tree afterwards: clean end to end. LucaKro''s separate dead-code review is unanswered and is the developer''s, per their instruction that upstream is theirs. Full account in roadmap.md section 28.'
