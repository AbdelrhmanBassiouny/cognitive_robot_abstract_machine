  notes: 'Off main, like #89 and #189. a7c21ffe6 marked test_world_sim_state_sync @pytest.mark.flaky, but pytest-rerunfailures is in no requirements file and not in the dev extra CI installs, so pytest treated it as an unknown mark and ran the test exactly once - failing the run the mark was added to survive, which is how #63 went red on a 49-line krrood diff. One line in pyproject.toml''s dev extra. Measured on the pinned pytest 7.4.4: plugin installed + bare mark -> 1 passed / 1 rerun; plugin absent -> 1 failed + unknown-mark warning. So a bare mark needs no rerun count, no --reruns and no pytest.ini registration - which corrects this session''s own earlier reading that it did. The guard test asserts only that the plugin is loaded, the invariant this repo owns: an earlier draft asserting the rerun behaviour passed on plugin 16.1 and failed on 10.3 with the rerun happening in both, because older versions tear the session fixture down between attempts, so it was really testing the plugin''s fixture semantics. Bears on #189, which uses @unittest.skip where the marker would keep coverage - that PR''s call, not this one''s. Checked against upstream cram2 rather than assumed, after the developer asked: upstream main is at the same commit as this fork''s (3f643cffb), its dev extra is byte-identical with no pytest-rerunfailures, no rerun plugin appears in any of its requirements/toml/cfg/ini/workflow files, and the flaky mark and pytest.ini are the same there. So the defect is upstream''s own, the fix is not a duplicate, and it belongs promoted upstream.'
