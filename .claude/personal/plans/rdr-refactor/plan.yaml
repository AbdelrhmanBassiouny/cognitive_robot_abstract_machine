  notes: 'Implemented and pushed as PR #99 (draft, off main). The OperationResult.is_false field is dropped;
    is_false reads bindings[operand._id_] directly and is_condition_false is gone. Branch is the session''s
    designated claude/... branch, not the originally planned eql/truth-unification. Two deliberate divergences
    from the design doc, which predates the current code: (1) the invariant needed qualifying — an expression
    has one binding, and for Entity/aggregators/arithmetic that binding is the selected value, so taken
    verbatim the doc dropped query results whose value was 0 or empty; a new TruthValuedExpression tells
    truth-binding from value-binding expressions apart and only truth-recording roots are filtered by truth.
    (2) The _is_false_flag transition was rejected — removing the field outright makes a missed call site
    fail loudly instead of silently compiling. _evaluate_child_as_condition_ was kept (now a pass-through)
    so PRs #90/#92 keep their recording hook. Design doc landed with the PR, rewritten to match.

    2026-08-03: a /plan-item-resolve session found and fixed the real blocker — mergeable_state had gone
    dirty (restack conflicts in base_expressions.py, evaluation.py, test_explanation.py, recurring since
    2026-07-30 across 3 failed bot restack attempts). Root cause: PR #89 (conditions-root-drop-dead-parent-recovery)
    merged to main first and independently added a _true_results_() method plus reworked
    SatisfiedConditionTracker.on_conclusions_processed — the same two things #99 changes — without knowledge
    of #99''s TruthValuedExpression fix (#99''s own coordination note named #89/#90/#92 but was written before
