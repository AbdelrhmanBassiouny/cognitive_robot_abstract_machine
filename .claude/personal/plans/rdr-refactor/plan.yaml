    already addressed by commit 7faa806, confirmed against the current file heads -- replied to with
    the specific evidence and resolved 2026-07-31.
    2026-08-02: reparented onto main (PR comment 5157212715) now that ripple-down-rules-refactor''s
    content has landed via #53, so depends_on below is satisfied and the diff is the real
    7 files / +1,318 rather than the stale-merge-base 268 files.
    2026-08-03: the "ready for the steward to merge" claim above is superseded -- a new review
    thread (r3702021144, backward_inference.py:64) asks whether GuardCondition.negated should be
    replaced by wrapping the guard expression in Not(), considering every use of the guard across
    this plan rather than just this PR. It is a discussion request, so the PR is blocked on the
    developer''s call, not on code. Answered at r3702169709 recommending the field be kept: the
    alternative was already designed and rejected in backward_inference_design.md ("no live tree
    mutation"), and the hazard was re-verified live -- factories.not_ -> _invert_ -> Not(self) ->
    base_expressions.py:299 child._parent_ = self reparents a live rule-tree node, the same defect
    class dag-facade-hardening (#96) exists to fix. Recommendation carries an expiry: Not()-wrapping
    is cleaner at 4 of 6 concrete sites and wins outright once #96 lands a non-mutating negation.
    CI green, 20/20 checks on head cbbf7bf3. Thread deliberately left unresolved. Full account in
    roadmap.md section 12.
    2026-08-03 (later): resolved -- the developer resolved thread r3702021144 without counter-argument
    and marked #41 ready for review. Decision: keep GuardCondition.negated. All 23 review threads are
    now resolved, draft: false, mergeable_state: clean, so #41 is genuinely ready for the steward to
    merge as the stack bottom. Three small follow-ups offered in the reply are NOT yet applied and
    need the developer''s go-ahead, since pushing would force the PR back to draft per the standing
    convention: record the no-live-tree-mutation rationale in the field docstring (its design doc is
    on the dropped krrood/docs/ path), correct the misleading evaluation comment at
    backward_inference.py:82-90, and TDD-pin whether the isinstance(OperationResult) branch in
    holds_for is reachable before deleting it.
    All three applied and pushed as 29c27cca; PR converted back to draft per convention. The
    reachability probe corrected an earlier claim of mine: evaluate() does not only yield true
    results -- a leaf predicate yields a literal False when it fails, so bool(result) is
    load-bearing and "did it yield anything" would have been wrong. Only the isinstance branch
    was dead. Verified against a clean run of the previous head in the same container: 206 failed
    / 935 passed before, 206 failed / 937 passed after, the +2 being exactly the new tests.
    scripts/format_docstrings.py was deliberately not run on the result -- it rewrites the whole
    module (125 unrelated lines) and regresses ":return: ``True``" to ":return:``True``"; flagged
    on the thread as deserving its own pass. The _materialize live-node mutation is filed as
    dag-facade-hardening''s non-mutating-negation item, per the developer''s call; when that
    lands, GuardCondition.negated should be revisited, since Not()-wrapping was cleaner at 4 of
    6 sites and the mutation hazard was the only thing against it.
    2026-08-03 (final): the developer marked #41 ready for review again after the push. CI green
    20/20 on head 29c27cca including test_each_lib (krrood), draft: false, mergeable_state: clean,
    all 23 threads resolved. CI passing is the stronger verification here -- the resolve session''s
    own container lacked the dependency set entirely (206 environment failures, identical before and
    after), whereas CI runs the real one. Nothing outstanding: #41 is ready to merge as the stack
    bottom, and the next steward pass should cascade it forward through #63-#67/#98. 2026-08-08:
    reopened by the developer as a design question -- should GuardCondition move into
    rules/conclusion_selector.py, should the selectors move into rdr/, or is the isinstance dispatch
    in _leaf_guards/_collect_rule_paths fine as a closed set? Answered: neither move (conclusion_selector.py
    has EQL-core consumers in factories.py/scope.py/query_graph.py, so moving the selectors inverts the
    layering; GuardCondition has only rdr/ consumers, so moving it does the same in miniature), but the
    open/closed instinct was right for a reason other than extensibility -- ConclusionSelector already
    makes the insertion side polymorphic (_get_current_context_condition, _create_between_two_expressions)
    while traversal was an isinstance ladder over the same three classes, and one per-selector rule set
    lived in two functions with nothing forcing them to change together. Landed as rdr/branch_semantics.py
    (SelectorBranchSemantics, one class per selector holding both sibling_guards and branches), dispatching
    through krrood/patterns/specificity_ranking.py -- the same primitives behind the grammar PhraseRule
    registry and the SpecificityRule families -- plus a new rdr/exceptions.py for
    AmbiguousBranchSemanticsError. Behaviour unchanged: the 33 existing tests pass untouched, 12 new ones
    added (33 -> 45), and the test_eql + test_eql_rdr sweep went 109 failed/921 passed -> 109 failed/933
    passed with the 264 failed+errored ids byte-for-byte identical. A suspected soundness bug was probed
    and NOT confirmed: _leaf_guards(Alternative, negated=False) returns both sides into a conjunctive
    SufficientConditionSet, but instrumenting four DSL-built shapes recorded 0 positive-Alternative calls
    (only a hand-built Refinement(Alternative(A,B), C) triggers it), because refinement() anchors on a
    with-entered condition while alternative()/next_rule() anchor on the conditions root -- so an
    Alternative always sits above a refinement, never as its left child. No semantics changed; the
    constraint is now documented on AlternativeBranchSemantics. Pushed as 19e387a9 and converted back to
    draft per the always-drafts-until-ready convention. Scoping note: the change touches only files #41
    introduces, so per the fold-don''t-stack rule it went onto #41 rather than becoming a separate PR from
    the session branch claude/rdr-guard-conclusion-arch-8htmfu. Neither subscribe_pr_activity tool could
    subscribe this session to #41, so its CI result is unwatched -- check it manually.
    2026-08-08 (review round): 11 new threads on 19e387a9. Developer chose to keep the
    branch-semantics family and apply every other fix; my own recommendation in the session
    had been the opposite (collapse it into methods on the selector classes), so that thread
    is deliberately left unresolved for the developer to close. Landed as b0107c76: the
    dispatch key is now a bound generic parameter via SubClassSafeGeneric instead of a
    ClassVar (frozen=True had to be dropped -- a frozen dataclass cannot inherit from a
    non-frozen one); every method is a classmethod so most_specific_for returns the class and
    nothing is constructed; GuardCondition moved to its own rdr/guard_condition.py, which is
    what let LeafGuardDecomposition drop its quoted type arguments (backward_inference
    runtime-imports branch_semantics, so the reverse import was a cycle); the abstract methods
    take ConclusionSelector rather than SymbolicExpression; GuardedBranch.node became
    child_expression. The reviewer also caught a real test defect: comparing SymbolicExpressions
    with == builds a truthy Comparator, so 9 assertions in test_branch_semantics.py asserted
    nothing about which expression was returned -- proven by making the expected value
    deliberately wrong and watching them pass. They now compare _id_, and three fresh mutants
    (swapped Refinement branch order, Next repeating one child, Alternative dropping a side)
    each fail exactly one test. Sweep unchanged against the 19e387a9 baseline: 109 failed/933
    passed, 264 failed+errored ids byte-for-byte identical. AGENTS.md rule for
    SubClassSafeGeneric opened separately as PR #148 off main (draft), deliberately not
    migrating PhraseRule.construct or the SpecificityRule families.
    2026-08-09: developer asked whether UNSET can be removed in favour of ... (Ellipsis), to
    conform with underspecified statements. Answer: yes -- and my first answer was wrong. I
    argued a sentinel over Any must sit outside the value space; EQL deliberately does the
    opposite. CountRange (operators/aggregators.py:234,268) already counts `value is ...` over
    evaluated results and domains, widening an int to a closed SimpleInterval, so ... in a
    *result* already means "not yet determined" -- exactly UNSET''s meaning. Every other
    Ellipsis check in krrood/src reads the query template, never a case instance
    (backends.py:181,198, parameterizer.py:160-170,237, query/match.py:462-463,
    planner.py:199), so a case attribute holding ... confuses nothing; type(Ellipsis) is
    already in ormatic leaf_types so it persists; both are singletons compared with `is`, so
    every site substitutes unchanged. The unifying reading is the developer''s: ... means "an
    oracle must supply this value", and rdr/backend.py is the RDR playing the role
    ProbabilisticBackend plays for a model. One open narrowing, deliberately not guessed at:
    parameterizer.py:167 raises InvalidEllipsis for a field whose type is outside
    random_events compatible_types, while ConclusionDomain supports str/arbitrary-class
    conclusions -- so an unclassified case with a str conclusion could hit it IF such a case
    can reach the parameterizer. Reachability is a probe for the slice that has consumers.
    Landed on #41 as efc8a0679: rdr/utils.py deleted outright, because UNSET had ZERO
    consumers here (git grep matched only utils.py; nothing imported rdr.utils) -- all ~40
    sites live on d-core-expert and above. This also cleared the catch-all `utils` filename
    AGENTS.md forbids. The same commit restored query_graph.pdf to main''s blob. Verified
    45/45 test_eql_rdr and a test_eql+test_eql_rdr sweep of 207 failed/982 passed on both
    sides with 214 failed+errored ids byte-for-byte identical (3 files excluded for the
    documented probabilistic_model relational.rspn gap; this container could not load the root
    conftest at all -- giskardpy_bullet_bindings -- so the sweep ran with --confcutdir and CI
    stays the load-bearing check). PR converted back to draft, fourth time. The
    query_graph.pdf thread (PRRT_kwDOQhJw3c6Xg0sj) was replied to but deliberately LEFT OPEN:
    its ask had two halves and only the revert was done -- untracking the generated PDFs is a
    main-level fix. Root-caused it: QueryGraph.render defaults to filename="query_graph.pdf"
    in the working directory (query_graph.py:160), test_rendering.py exercises it, and the
    file is both gitignored (.gitignore:152) and tracked, so any local suite run dirties it.
    Reproduced accidentally -- the verification sweep also dirtied drawer_explanation.pdf
    (.gitignore:154), so it is at least two files. Still to do, on d-core-expert and above:
    the is UNSET -> is ... substitution, the parameterizer reachability probe, and fixing
    single_class.classify, annotated -> Optional[Any] with "or None if no rule fires" while it
    returns the sentinel (observer.py:132-137) -- the #68 review''s classify()->UNSET decision
    was implemented in the observer and the signature never followed.
    2026-08-09 (closed): the developer marked #41 ready for review at 13:20Z, which under the
    standing convention ends the working session''s job on it. CI green 20/20 on efc8a0679
    (the earlier total_count:0 reading was simply taken before the run queued -- it is NOT
    another instance of the #98 CI-trigger problem in Sec.14). draft: false, mergeable_state:
    clean, 11 files / +1,946. Session unsubscribed from #41 activity and armed no check-in.
    Two review threads remain open by design: the branch-semantics family (Sec.16, the
    developer''s to close) and query_graph.pdf (half-answered -- the revert is done, untracking
    the generated PDFs is a main-level fix, offered but not taken). #41 is ready for the
    steward to merge as the stack bottom; the next pass should cascade it through
    #63-#67/#98.'
