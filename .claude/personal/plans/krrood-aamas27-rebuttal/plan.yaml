schema_version: 1
id: krrood-aamas27-rebuttal
title: "KRROOD AAMAS 2027: one version, new evidence, rebuttal"
description: >
  Answer the AAMAS 2027 reviews of submission 1481 (KRROOD) by 24 November. Port Ontomatic and the
  earlier version's property rules onto the current version, rerun every experiment on that one
  version, add LUBM, a retraction variant of the agent loop and a reflection listing, update the
  proofs, and write the rebuttal and the revised paper.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 615
waves:
  - id: one-version
    name: "One version (20-22 Nov)"
    description: "Everything the paper claims runs on the current version."
  - id: evidence
    name: "Reruns and new evidence (22-23 Nov)"
  - id: response
    name: "Rebuttal and revision (by 24 Nov)"
tracks:
  - id: port
    name: "Port to the current version"
    wave: one-version
  - id: theory
    name: "Proofs"
    wave: one-version
  - id: evaluation
    name: "Experiments"
    wave: evidence
  - id: writing
    name: "Rebuttal and paper"
    wave: response
items:
  - id: property-rules-port
    title: "Port the earlier version's property rules and provenance onto the current version"
    track: port
    depends_on: []
    status: not started
    recommended_model: opus
    notes: >
      aamas27-unification-revision only has super, inverse and transitive rules. Port from
      aamas27-experiments: equivalent properties, symmetry, chains, InferredThrough provenance,
      the symmetric-transitive component (step 5) and storing a fact on the object of its
      individual that declares the property. main already ported most of the runtime rules
      (krrood-ontomatic); reuse that code. Rules must match Definition assign and Lemma Step 4
      of supplement/formalization.
  - id: ontomatic-tbox-port
    title: "Port Ontomatic's TBox compilation to the current API"
    track: port
    depends_on: []
    status: not started
    recommended_model: opus
    notes: >
      From aamas27-experiments: owl_to_python.py, owl2rl_tbox.py, axioms.py, the jinja templates,
      rdrs/ (domain and range inference), alternative_mappings.py, roleFor. Generated roles use the
      current Role pattern (patterns/role.py), not the hash-by-root-taker template base. Can run
      in parallel with property-rules-port; agree on the descriptor API with its owner first.
  - id: ontomatic-abox-loader-port
    title: "Port ABox loading (Algorithm 1) and the after-load check"
    track: port
    depends_on: [property-rules-port, ontomatic-tbox-port]
    status: not started
    recommended_model: opus
    notes: >
      Port owl_instances_loader.py (steps 1-5) and owl2rl_check.py. Store each value on an object
      whose class fits the property's range, so Corollary 5.4 holds under identity equality.
      Done when the OWL2Bench closure from the ported loader equals the earlier run's closure,
      assertion by assertion.
  - id: experiments-on-current-version
    title: "Run the experiments and the agent loop on the current version only"
    repository: AbdelrhmanBassiouny/krrood_experiments
    track: port
    depends_on: [ontomatic-abox-loader-port]
    status: not started
    recommended_model: sonnet
    notes: >
      Branch from unification-revision. Move code/earlier/experiments (OWL2Bench model generation,
      the 18 queries per system, scripts/aamas27, the agent loop and baselines) onto code/current;
      the bundle then has one KRROOD environment. Baselines that do not use KRROOD stay as they are.
  - id: proofs-on-current-version
    title: "Point the proofs at the current version and sketch them in the paper"
    repository: AbdelrhmanBassiouny/krrood_experiments
    track: theory
    depends_on: []
    status: not started
    recommended_model: opus
    notes: >
      supplement/formalization: Section 5 lemmas cite earlier-only files (owl_instances_loader.py,
      the earlier descriptor relation), Theorem 6.1 cites the current translator. Update the file
      references once the port lands, rewrite Corollary 5.4's proof for identity equality (it
      relies on the earlier equality), drop the two-version text, and write a 3-5 line sketch per
      result for the paper.
  - id: owl2bench-rerun
    title: "Rerun every OWL2Bench result on the current version"
    repository: AbdelrhmanBassiouny/krrood_experiments
    track: evaluation
    depends_on: [experiments-on-current-version]
    status: not started
    recommended_model: sonnet
    notes: >
      Correctness (closure vs GraphDB and Nemo, 18 answer sets), Tables 2-5 including 2-8
      universities, the ORMatic 18-query check and the agent loop with the runtime comparison.
      Only KRROOD's rows need rerunning. Record provenance.txt per result; report any number that
      moves by more than run-to-run variance.
  - id: lubm-evaluation
    title: "Evaluate on LUBM: closure, loading and its 14 queries"
    repository: AbdelrhmanBassiouny/krrood_experiments
    track: evaluation
    depends_on: [experiments-on-current-version]
    status: not started
    recommended_model: sonnet
    notes: >
      Start from src/krrood_experiments/lubm and test/test_lubm. LUBM's class equivalences with
      existential right-hand sides (e.g. Chair) are outside OWL 2 RL: compare against GraphDB's
      OWL 2 RL closure and state the covered fragment. The other systems' runs do not need the port
      and can start now. LUBM has no symmetric, transitive property, which answers the step-5 point.
  - id: retraction-agent-loop
    title: "Agent loop variant whose perceived facts change and disappear"
    repository: AbdelrhmanBassiouny/krrood_experiments
    track: evaluation
    depends_on: [experiments-on-current-version]
    status: not started
    recommended_model: opus
    notes: >
      Students drop courses and leave colleges, fans stop being fans. Measure separately:
      computed predicates (recomputed per query), reassigned attributes (replaced) and facts
      derived by property rules (not retracted). Compare decisions with Nemo, which recomputes the
      closure, and report every stale rule-derived fact honestly.
  - id: reflection-listing
    title: "Listing: an EQL query over the agent's own queries and rules"
    track: evaluation
    depends_on: []
    status: not started
    recommended_model: sonnet
    notes: >
      Branch from aamas27-unification-revision. Executable listing test, e.g. which rules derive
      T20CricketFan, which decisions call CanReach, why a fact was inferred (provenance). Goes in
      supplement/listings and is the paper's evidence for reflection (Newell's knowledge level);
      contrast with storing SPARQL queries as RDF.
  - id: rebuttal-response
    title: "Write the author response to the four reviews"
    track: writing
    depends_on: []
    status: not started
    recommended_model: opus
    notes: >
      Due 24 Nov; draft now, fill numbers from the reruns. Lead with one version. Points:
      motivation (sync code, reflection), closed world as certain answers of positive queries
      (no open-world claim), step 5 exact and general, LUBM, retraction in three kinds, joins vs the
      SQL path, citations. Do not add the Legal BERT reference.
  - id: paper-revision
    title: "Revise the paper for the response and the camera-ready"
    track: writing
    depends_on: [proofs-on-current-version, owl2bench-rerun]
    status: not started
    recommended_model: opus
    notes: >
      Remove footnotes 2-3 and the earlier-equality clause, add proof sketches, cite GraphDB, Nemo
      and Owlready2 in the introduction, full sentences in Section 3, fix the 1.42 million
      sentence, narrower title, a novelty paragraph tied to Table 1, reflection and retraction
      paragraphs, LUBM results, cite the rela-model paper.
