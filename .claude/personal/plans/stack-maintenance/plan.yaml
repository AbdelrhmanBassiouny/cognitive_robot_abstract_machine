schema_version: 1
id: stack-maintenance
title: 'The maintenance pass and the integration branch: running a stack of pull requests'
description: 'What keeps a stack of pull requests moving without a person driving each step:
  a deterministic executor that fast-forwards, restacks, promotes and reports; reparenting
  a child whose parent has landed; reading upstream review threads from a fork; and a regenerated
  integration branch that answers whether the in-flight branches actually coexist.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: pass
  name: The maintenance pass
  description: The executor, what it decides for itself, and the version of itself it runs.
- id: integration
  name: The integration branch
  description: A branch regenerated from upstream plus every reviewed tip, built to be worked
    from rather than merged out of, and judged by real CI.
tracks:
- id: pass
  name: Maintenance pass
  wave: pass
- id: integration
  name: Integration branch
  wave: integration
items:
- id: manifest-currency-first
  title: Write the manifest and republish the dashboard before anything else, at every transition
  branch: claude/plan-manifest-update-priority-ex2zst
  pull_request_number: 151
  status: in progress
  session: https://claude.ai/code/session_01Rm1Xa8ujsXWBai4U8v6ThY
  track: pass
  blockers: []
  depends_on: []
  notes: 'Every skill that can affect a plan must treat writing the manifest and republishing
    the dashboard as its first priority, at every point that makes a recorded field stale.
    The bootstrap item inverted this ordering for exactly one moment - a kickoff whose plan
    has just been approved; this generalizes it to every transition and every bound skill.
    **The premise is recorded rather than asserted**: this work''s roadmap named the manifest
    "the least accurate source" three times in one week, and each time everything needed to
    diagnose the item was already on the pull request.'
- id: pinned-stack-tooling
  title: Pin the stack tooling for the length of a maintenance pass
  branch: claude/stack-tooling-pinning-qf5r2m
  pull_request_number: 158
  status: in progress
  session: https://claude.ai/code/session_016DukdvsJzggwAAF3CkKaDZ
  track: pass
  blockers:
  - ''
  depends_on: []
  notes: Found while running a maintenance pass, and fixed at the source rather than worked
    around. The skill invoked the tooling by its in-tree path for a whole run, which assumes
    that path is the same file from step 0 to the end - and it is not, since it is tracked
    content and a pass switches branch in the checkout it runs from. The failure is either
    loud (a command validated in step 0 comes back as an invalid choice, which is exactly
    what a rename produces) or quiet (the same command name answering with semantics the skill
    does not describe).
- id: promotion-summaries-and-table
  title: Promote with a written summary, and report the links as a table rather than a notification
  branch: claude/plan-item-kickoff-workflow-y38l38
  pull_request_number: 162
  status: in progress
  session: https://claude.ai/code/session_01Vc9tayconnyqgvN3r5g6pi
  track: pass
  depends_on:
  - pinned-stack-tooling
  notes: 'The user''s requirements for a pass''s promotion phase: the compare-and-create link
    must be built by the script rather than assembled by the session; the upstream pull request
    must open with a title and with a body that always links back to the fork pull request
    and otherwise carries text the caller supplies; the skill must always supply that text
    as a point-based summary; neither the skill nor a scheduled run may send a notification;
    and every promoted branch must be reported as a table in the session the pass ran in.'
- id: integration-branch
  title: 'Regenerated personal integration branch: build, check, resolve, report'
  branch: claude/plan-item-kickoff-workflow-ixbvxl
  pull_request_number: 154
  status: in progress
  session: https://claude.ai/code/session_01Ra51SAHQKy7TVYRG2HRERW
  track: integration
  depends_on:
  - manifest-currency-first
  notes: 'The constraint is upstream review throughput: pull requests are produced faster
    than the upstream merges them, so shipped-but-unreviewed features are unusable in daily
    work, and two in-flight features that conflict only discover it at the far end of the
    review queue. The answer is a regenerated integration branch - the upstream base with
    every in-flight reviewed tip merged on top, rebuilt from scratch on demand, existing to
    be built *from* rather than to be history. Nothing merges out of it.'
- id: integration-branch-ci-verdict
  title: Move the integration branch's verdict to CI, with a stable branch and a targeted
    job
  branch: claude/plan-item-kickoff-workflow-unification-wg4w4x
  pull_request_number: 211
  status: in progress
  session: https://claude.ai/code/session_01KgTu7rha5xxBYAVm41e3uV
  track: integration
  depends_on:
  - integration-branch
  blockers: []
  notes: 'Part D of `integration-branch`''s review round: the verdict moves from a local test
    run to real CI. Folded back onto that item''s branch after being split out, so it has
    no pull request of its own - the scope test inverted at the fold, because it had first
    been run against *planned* content none of which had been written, the same expiry a basing
    decision has. **One measured fact shapes the whole design**: `ci.yml` triggers on push
    to `main` and on `pull_request` and nothing else, so a pushed build collects no checks
    at all.'
- id: red-candidate-localisation
  title: Localise a red candidate to the branches that caused it
  branch: claude/plan-item-kickoff-workflow-unification-wg4w4x
  pull_request_number: 211
  status: in progress
  session: https://claude.ai/code/session_0138w5mqzbkyMPtotF7PD59Z
  track: integration
  depends_on:
  - integration-branch-ci-verdict
  notes: What happens when the candidate's verdict comes back red for a reason the local suite
    cannot see. The local localisation re-assembles the tips and re-runs the configured tooling
    suite, so it reaches a break between two branches whose tooling code disagrees and reaches
    nothing in the docker matrix.
- id: per-plan-integration-branches
  title: One integration branch per plan, and a complete branch built from their last green
    builds
  branch: null
  status: deferred
  track: integration
  depends_on:
  - integration-branch-ci-verdict
  notes: 'Proposed by the user and recorded without being built: one integration branch per
    plan, plus a complete branch merging them. Everything below is settled by measurement;
    **the deferral is the only part that is a judgement.** The scope check was run rather
    than eyeballed, and the answer is that this is a new item: strip the edits to the files
    its siblings introduce and what remains is nine build branches, nine candidate cycles,
    a complete branch with a build rule of its own and per-plan cleanup - substantial and
    standing alone by a wide margin.'
