  depends_on:
  - integration-branch
  blockers:
  - 'Waiting on a dispatch that reaches a candidate. The base fix landed in `c77b9ea79` and the
    block-and-continue fix in `ba65d62bc4`. Two dispatches on 2026-08-31 each found one cross-branch
    break and ended on it - #110 first, then #107, its own base - so two runs and roughly two hours of
    queue bought two labels and no candidate, which is what the second fix ends: a rebuild now blocks the
    break and assembles again without it, up to five times in one run. The candidate half of the pipeline
    - the base change, the title discriminator, the close-and-move-past - remains unexercised against
    real GitHub until a run gets past the suite. Read the build''s `left_out`, which every attempt now
    prints, to confirm it carries #211 and #154 before anything publishes.'
  notes: 'Part D of `integration-branch`''s review round: the verdict moves from a local test run to real CI.

    Folded back onto that item''s branch after being split out, so it has no pull request of its own - the

    scope test inverted at the fold, because it had first been run against *planned* content none of which

    had been written, the same expiry a basing decision has.


    **One measured fact shapes the whole design**: `ci.yml` triggers on push to `main` and on

    `pull_request` and nothing else, so a pushed build collects no checks at all. That is what makes a

    candidate pull request the only shape that reaches a verdict rather than one option among several.

    The candidate is never merged - a build is regenerated from scratch, so it shares no history with the

    branch it replaces and merging would give that branch a history the next build cannot regenerate.

    Green force-updates the pointer onto the build and closes the candidate unmerged; red closes it naming

    the failing checks; unfinished does nothing and says so with its own status.


    **Two kickoff conclusions were corrected by measurement.** A marked-only job cannot be the build''s

    verdict, because with no matching tests pytest exits 5 - so a healthy build''s marked job is empty and

    says nothing; the marker keeps its place aimed at whether a recorded break is *fixed*, which is the

    automatic clearing condition `integration-conflict` shipped without. And nothing that opens the

    candidate may use the default token, since GitHub creates no workflow run from an event it triggered -

    a fine-grained token is a required setup step, not a hardening. One trap found while probing it: the

    checkout action persists the default token as an http header that overrides credentials in a push URL,

    so the token has to be handed to the checkout rather than to the push.


    **Six defects found after the pipeline had published zero builds, each measured rather than guessed.**

    The rebuild''s own check was judging branches, because a rebuild triggered by a branch leaving draft

    attaches its own check to that branch''s head, and the red-tip exclusion then left that branch out of

    the build its flip had asked for - the pipeline''s check names are read off the workflow files now, and

    holding them to being shared with no other workflow is what found a probe job colliding with `ci.yml`''s

    names. The `pull_request` arm could not work at all, because it correctly pins the checkout to the

    default branch and that branch is a *build output*, so it always lags whatever is in flight; a

    too-old pipeline is an answer now rather than a usage error. The warm-up was one to two orders of

    magnitude short and no constant fixes it - measured queue delays of 19 minutes and 2h47m - so the

    verdict moved off the run that opens the candidate entirely: a rebuild settles whatever an earlier run

    left, then assembles the next. The maintenance pass was adopting candidates, which is how the pointer

    branch would accumulate history across rebuilds; the exclusion moved to the one place both readers

    derive their work from. And what passed is remembered now, keyed on a build''s git *tree* - because

    re-assembling the same branches over the same base gives a new commit every time and the same tree

    every time - as one git reference each, which needs nothing created or merged, cannot lose a

    concurrent write, and carries its own age so pruning needs no object fetch. Only passes are recorded,

    deliberately: a red is cleared by re-running the same commit.


    **Selection learned three things, each from a build going wrong.** Blocking labels: the stack was read

    *before* the restack ran and built from the same object, so labels that pass had just written were

    invisible - the same snapshot-invalidated-by-a-later-step shape as the promotion incident. A branch''s

    own checks: a build was guaranteed red whenever any carried tip was red alone, so a finished-badly tip

    and anything standing on it is left out, named apart from blocked because what lets it back in is its

    checks going green rather than a label coming off. This does not reopen the no-CI-gate decision, whose

    reasoning still holds: requiring *green* empties the build after every restack, while excluding a

    *known* failure has no such deadlock and is self-limiting, since a restacked branch reads running and

    is carried.


    The targeted job''s first real run failed for a reason that follows from its own design: collecting

    from the repository root loads every `conftest.py`, including the robotics stack''s, so a runner

    carrying the tooling dependencies alone died during collection before reaching a reproduction. It

    collects the four directories the tooling CI job names, read off that job rather than listed a second

    time, since what makes the two trees the same is the install.


    Also settled: the pipeline runs from the default branch rather than waiting for `main`, because a

    schedule registers from the *default* branch and that branch is main plus every carried tip - the

    proof was already sitting there. And this branch stays out of draft deliberately, overriding the

    re-draft convention, because a draft is excluded from every build.


    Deliberately kept rather than removed: the local test run. It caught a real cross-branch break hours

    before any candidate existed, and it answers before a build is pushed rather than after a matrix has

    run. What the CI verdict replaces is the *publishing* decision.


    **The review round of 2026-08-30 found the one thing the design had no rule for: a branch the pipeline creates
    and nothing takes down.** `publish()` dropped a build''s branch because the pointer then held the same commit,
    and that was the *only* path that did - so a candidate closed red, one nothing ever reported a check against,
    and a build superseded before it was judged each left a branch for good, at four rebuilds a day. Eight had
    gathered on the fork; seven had a closed candidate. The rule now is what keeps a build rather than what drops
    it: a pull request still open against it, which covers the candidate judging it and a filtered `--plan` build
    somebody is working from, and it runs before a rebuild reaches anything it can stop on, since a run that
    stopped early is exactly the kind that left one. It narrows the earlier decision to keep a red build''s branch
    for whoever reads its checks rather than reversing it - that branch now lasts until the next rebuild instead
    of forever.


    **One complaint, made about four lines, reached a fifth nobody had looked at.** Asking for structure over
    hard-coded keys turned up `GitHubRepository.open_pull_request` sending `{"title", "head", "base", "body"}`
    and reading `["number"]` back straight past the enum that reads them, with no test over the payload at all
    - found only because the *test* records built beside it were being routed through that enum. And a whole
    section of `test_integration_verdict.py` was still walking `integration-refresh.yml` by hand, having survived
    the round that introduced `workflow_document.py` intact: a model does not retire the hand-rolled readers
    it replaces, because nothing breaks when it lands.

    **Both threads the 2026-08-30 round left open are answered, and the recorded blocker had the first

    one wrong.** The repeated string was never the `sys.path` insertion `bastler-package` owns: asked

    again, the author said it is the measured check timing, written out at four of the designs it

    explains. It is one `CandidateCheckTiming` in `integration_verdict.py` now, referred to rather than

    restated, held by one test that derives the figure from the record and one that holds each design to

    naming it. The limit is stated rather than hidden - the first catches a numeral, not a restatement

    spelled out in words.

    And the cadence is no longer a scope call. Told what a `workflow_run` trigger on `ci.yml` completing

    would buy, the author asked only where it should land, and the mechanical check answered: every file

    it touches is absent from `main`, so it folded here. **What made it safe to add is that it stops

    itself** - the run it starts assembles the next build, and a build whose tree is already recorded as

    passing publishes with no candidate, so once nothing in flight has moved there is no matrix left to

    answer to. Two spellings a workflow forces are asserted against their definitions: `workflow_run`

    matches a workflow''s *name* rather than its file, and a workflow''s branch filter does not take the

    character class `BUILD_BRANCH_PATTERN` uses, so reusing it would have matched nothing - silently, in

    the losing direction, both times.

    **The pipeline was found deadlocked on 2026-08-30, and the base of the candidate is why.** A build is

    opened against `integration`, which is the branch it will replace - and that branch is itself an

    older build of the same branches, so the two conflict and GitHub can compute no merge reference,

    which is what a `pull_request` run checks out. No reference, no run, no verdict, and a rebuild that

    stops on the candidate it cannot judge. **It is not self-recovering**, and it explains why one build

    is the only one this pipeline has ever judged: it works while `integration` is close behind and

    wedges permanently once it is not.

    The fix is not the one-line base swap it looks like. `find-candidate` tells the candidate to settle

    from a `--plan` build by *which branch it was opened against*, deliberately - so opening every

    candidate against the upstream base needs a discriminator that is not the base, or a one-plan build

    gets published over everything in flight. Two halves are wanted: open candidates against a base the

    build always merges with, and make an unjudgeable candidate something a rebuild closes and moves past

    rather than stops on - without the second, an outage long enough to let `integration` drift wedges it

    again with no way out.

    **The verification run of 2026-08-30 confirmed the base diagnosis and found something worse behind

    it.** Opened against `main`, the same build had its merge reference within seconds and 23 checks

    within twenty, all green - where the candidate against `integration` had neither in eleven hours. But

    the build carries no pipeline: nine branches, and neither of the two the pipeline lives on, because

    #211 conflicts with #160''s branch over `plan_item_bootstrap.py`. **Publishing it would have deleted

    the automation** - `integration` is the default branch a schedule registers from, so a build with no

    `integration-refresh.yml` in it takes the scheduled workflow down and leaves nothing able to publish a

    later build. Nothing was published. The order the remaining work has to happen in follows from that: a

    guard against publishing a build that would remove the pipeline comes *before* making candidates

    judgeable, because the first checkable green build is otherwise the one that ends the pipeline.


    **That guard is built, and it is the first of the three.** `publish()` refuses a build whose tree

    carries no rebuild - the refresh workflow and the entry points it drives, derived from the enums

    naming them rather than listed again - and refuses it on both routes to the pointer, since a guard

    on the judged path alone is one the recorded pass walks straight past, and the recorded pass is what

    publishes on the ordinary day. Presence is not the whole test: a workflow left with only a dispatch

    is a rebuild somebody has to remember to press, so the carried workflow is asked whether it still

    answers to the schedule. A refused build stops the rebuild rather than being judged - a matrix would

    reach the same answer - which turned `_publish_recorded_pass` into a status rather than a bool.


    **It reaches the run that needs it before it reaches the default branch**, which is the part worth

    stating: a scheduled run executes the published copy and so predates the guard, but nothing can

    publish through that copy today - no tree is recorded as passing, and no candidate can be judged -

    while the bootstrap dispatch checks out `github.ref` and therefore runs the guard. So the one run

    that could have ended the pipeline is the one it is in force for.


    Retired on the way through: `VerdictReport` modelled the settling''s document and had no production

    caller, the command hand-building a second copy of the same keys beside it. The command emits the

    report now and takes its exit status from the `published` field it carries, so a run cannot exit

    success over a report saying it published nothing. 926 tests pass, from 913; six mutations checked.


    **#160 was closed on 2026-08-31, superseded by #151, so the fold is done and the blocker naming it

    is gone.** What kept the pipeline out of every build was that #160''s branch was carried first and

    collided with this one over `plan_item_bootstrap.py`; with it closed it is off the board, so a build

    should now carry #211 and the #154 beneath it. Recorded as expected rather than as measured: no

    build has been assembled since, and the first one''s `left_out` is what confirms it. One thing to

    check with it - #151 is a draft, and readiness is read down the whole chain, so anything rooted on

    it is left out entire.


    **The base is fixed, in `c77b9ea79`, and the discriminator is the title rather than a label.** Every candidate
    is opened against the base its build was assembled over, which a build merges with by construction; `CandidateTitle`
    says which plans a build was asked for, and `candidate_for_everything_in_flight` replaces `open_candidate_on`.
    The title won over a label on one argument: it is set in the call that creates the candidate, where a label
    is a second call that can fail on its own - and a candidate nothing recognises is one no later run settles,
    which is the wedge being fixed rather than a new one to introduce. `BoardExport.is_a_candidate` needed no
    code change, as recorded, and a test now holds both kinds off the export both a build and a maintenance pass
    derive their work from. An unjudgeable candidate is closed and replaced now rather than stopping the run,
    and the run still exits `CANDIDATE_UNCHECKED`, so nothing is lost by carrying on. 967 tests pass across the
    four directories CI runs, from 956; seven mutations checked, and an eighth test was removed rather than kept
    because its own mutation walked past it.


    **Two recorded expectations were refuted by looking at the fork before dispatching.** `#154` is based on
    `main` rather than on `#151`''s branch, and `#151` is not a draft - so the "readiness is read down the whole
    chain, and anything rooted on a draft is left out entire" hazard recorded here does not apply to the pipeline
    chain at all. It is `main` to `#154` to `#211`, neither a draft, neither carrying a blocking label. No candidate
    was open, so the bootstrap had nothing to settle first.


    **One defect found in the way, reported rather than folded in.** `plan_item_bootstrap.py update` writes an
    item''s fields at a hardcoded four-space indent, so replacing this item''s `blockers` emitted the key inside
    `depends_on`''s sequence and the manifest no longer parsed. It reproduces the defect `manifest-currency-first`
    already records against its own branch, which is where the `ItemIndentation` fix belongs - #151 introduces
    `update` and `ValueStyle.SEQUENCE`, so it is the only branch that can test one. Reported rather than folded
    in here; every manifest write in this session went through a hand-edited splice and `save-plan.sh` instead.


    **The first bootstrap dispatch reached the build and stopped at the suite, which is the pipeline working
    rather than failing.** `find-candidate` answered `no-candidate-open` - the new title discriminator''s first
    live exercise - the base came forward, the build assembled, and the local suite then failed on it: #110 and
    #80 merge cleanly and break together. `block-branch` labelled #110 `integration-conflict` and said so on
    the pull request. No candidate was opened, so the base change, the discriminator and the close-and-move-past
    rule are all still unexercised against real GitHub; the next rebuild leaves #110 out and should reach one.


    **One gap the run exposed, in `RefreshPipeline._build`.** A build that fails its suite prints neither its
    own report nor the block''s: the branch that reports a status other than `TESTS_FAILED` prints `assembled.output`,
    and the `TESTS_FAILED` branch above it returns without printing either document. So the run says `tests-failed
    (11)` three times and nothing else - and `left_out`, the one thing that has to be read before a second dispatch
    can publish, is exactly what it swallows. The collision itself was still recoverable, but only because `block-branch`
    writes to the culprit''s pull request rather than to the run''s log.


    **Two dispatches, two breaks, no candidate - and that is what made the stop-on-first-break rule indefensible.**
    Run 17 blocked #110 after 1h45m of queue; run 18 then blocked #107, which is #110''s own base. Each break
    cost a whole cycle because the rebuild ended on it, and there was no reason it had to: the tree that failed
    carries the culprit, but the build *without* the culprit is one the same run can make, and it is exactly
    what the next rebuild would have produced a cycle later. `ba65d62bc4` blocks and assembles again, bounded
    at five by `BREAKS_ONE_REBUILD_BLOCKS` - a budget rather than a measurement, since what a run blocked stands
    either way. A search that could blame no single tip still ends the run, because it leaves the same branches
    to merge and so would rebuild the same failing tree for ever. A recovering run exits success, as a build
    that left a tip out already does: the break is reported on the culprit''s own pull request, which is where
    its owner reads it.


    **The reporting gap was wider than the one reported.** `_build` printed the build''s document only on the
    statuses that leave nothing to judge - so neither a failed suite nor a *successful* build ever said what
    it had left out, and the one document that has to be read before publishing had never been printed by any
    run that could publish. Every attempt prints it now, and the block prints what it blocked, read through the
    key the block writes rather than through the verdict''s, which has no name for a blocked branch.

    '
- id: red-candidate-localisation
  title: Localise a red candidate to the branches that caused it
  branch: claude/plan-item-kickoff-workflow-unification-wg4w4x
  pull_request_number: 211
  status: in_progress
  session: https://claude.ai/code/session_0138w5mqzbkyMPtotF7PD59Z
  track: integration
  depends_on:
  - integration-branch-ci-verdict
  notes: |-
    What happens when the candidate's verdict comes back red for a reason the local suite cannot see. The
    local localisation re-assembles the tips and re-runs the configured tooling suite, so it reaches a
    break between two branches whose tooling code disagrees and reaches nothing in the docker matrix.

    **The gap is narrower than it was.** A candidate can go red for two reasons: a tip whose checks had not
    finished when the build was assembled and have since failed, which the next rebuild leaves out by
    itself; or a genuine break only the matrix sees, where two branches each pass their own run, merge
    cleanly, and fail a matrix job together. Only the second needs this item, and only the second is a
    break in the sense the workflow means.

    Localising it means re-running the matrix rather than a suite: push each prefix of the merge order as
    its own branch, dispatch a run for each, and read the conclusions - against roughly twenty minutes a
    run and sixteen jobs apiece. The waiting, the concurrency, the credential and what a partial answer
    means are all different from the local path. **Measure the cheaper variant first**: re-run only the
    failing job per prefix, which the per-library job names make expressible.

    It does not replace the local localisation, which answers before a build is pushed.

    **Review turned the pipeline from YAML into code, and the reason is the one that matters.** Every
    decision the rebuild block made was a decision about an exit status, and written in a job's `run:`
    those were loops and exit-code literals nothing could run outside a runner - so there was no way to be
    wrong about an exit code and find out before a scheduled run did the wrong thing silently. The workflow
    dropped 223 lines to about 107 and calls one command. Four guards that had asserted the shape of the
    shell were replaced by two stronger ones: every subcommand a rebuild names checked against the live
    registry, and the keys the steps hand each other held equal across the two enums that write and read
    them.

    A workflow is parsed once into named things now, so no reader indexes into a mapping under keys it
    spells itself - and writing that caught the hazard it exists to prevent: **a trigger block is not
    under `"on"`**, because YAML reads a bare `on` key as the boolean, so triggers live under `True` and a
    reader that forgets concludes the workflow responds to nothing. Similarly, the matrix's libraries are
    derived from the matrix job rather than enumerated, because an enum matching the workflow and held by
    nothing would answer a new library's failures as naming no library at all - silent, and in the
    direction that loses a real break.

    **One collision the round uncovered, which a union type had been hiding**: two push methods across a
    class boundary were the same git command under two names with incompatible signatures, and nothing had
    passed the new type down that path yet. There is one push now, on the runner that runs git, taking the
    object that already decides forcing.

    **One defect the tests could not have caught by reading, and did not.** A conditional written as a
    folded scalar whose continuation lines were indented further than its first is kept verbatim by YAML,
    so it parsed cleanly into a string with newlines inside an expression, for GitHub to reject at run
    time - while the assertion about it passed throughout. Found by printing the parsed value.

    **And one shape the pipeline got wrong twice in the same place**: settling closed the candidate on any
    verdict that was not "running", and "absent" is what a candidate opened two seconds ago looks like,
    before GitHub has created its run. The first reading closed the pull request, no run was ever created,
    and every later reading found the same absence. Both readings come from one predicate now, so the close
    and the exit status cannot disagree about which verdicts are answers.

    The git-command-vocabulary thread is answered with measurements and left open, because the question is
    owned elsewhere: no git command name is spelled twice for the same operation, so an enum would be 16
    members with one reader each, and the class-per-command hierarchy is what the method signature already
    is. It goes to `bastler-notes-core-python`, which owns the git seam by name and has four callers
    waiting - deciding the ergonomics before the raise-versus-answer-nothing question is settled means
    deciding them twice.
- id: per-plan-integration-branches
  title: One integration branch per plan, and a complete branch built from their last green builds
  branch: null
  status: deferred
  track: integration
  depends_on:
  - integration-branch-ci-verdict
  notes: 'Proposed by the user and recorded without being built: one integration branch per plan, plus a complete

    branch merging them. Everything below is settled by measurement; **the deferral is the only part that

    is a judgement.**


    The scope check was run rather than eyeballed, and the answer is that this is a new item: strip the

    edits to the files its siblings introduce and what remains is nine build branches, nine candidate

    cycles, a complete branch with a build rule of its own and per-plan cleanup - substantial and standing

    alone by a wide margin.


    **The partition is real**: 9 plans, 125 indexed branches, 63 open pull requests; every sampled

    open-pull-request head has a plan, and stacks stay inside one, including a chain that looks

    cross-domain and is filed entirely under one plan.


    **It saves no CI on its own.** The complete branch''s tree changes whenever any sub-build changes, so

    one branch moving still forces a full check at the top: one matrix run today becomes two. The saving

    people expect from it is the pass record, which needs no new branches at all.


    **The complete check cannot be waived.** Six of the nine plans all edit the shared library, and the

    cross-library job exists because these packages import each other. Only the tooling-only plan is

    separable.


    What it does buy is one free level of attribution - a red sub-build is an intra-plan break,

    all-green-sub-builds-but-red-complete is a cross-plan one, which halves the localisation search - and

    graceful degradation. **But only in a form other than the one proposed**: merging current tips leaves

    one red area blocking everyone, so the complete branch is built from each plan''s *last known-green

    sub-build*, which composes with the pass record rather than needing a mechanism of its own.


    Per-plan branches do not change what a session clones: the fork has one default branch, so they are

    opt-in checkouts.


    Deferred for sequencing rather than doubt. The pipeline has published very little; nine sub-branches,

    nine candidates per cycle, nine times the stale-branch cleanup and the adoption defect multiplied by

    nine is how you end up unable to tell which layer is broken. Revisit once green cycles have run and the

    real cost is known. **Reachable before then without any of it**: a `--plan` filter carries one plan''s

    tips through the ordinary build and candidate, which answers "does this plan hold together on its own"

    - most of what the topology was wanted for - with no extra branch and nothing that can publish.


    **Asked for again on 2026-08-30, in four parts, and only one of them is this item.** The request was a
    control on the plan-dashboard index: tick the plans to integrate, press integrate, and get a copied command
    that runs integration over them, labels the conflicts and leaves a dedicated branch to work from - plus
    a choice of what the build is based on, from a dropdown of the author''s own branches. Running over chosen
    plans and labelling the conflicts already exist, as `--plan` and the `plans` dispatch input that `integration-branch-ci-verdict`
    shipped, and `integration-conflict`. The dashboard control is `plan-dashboards`'' work and has a sibling
    in flight there, `dashboard-refresh-button` (#206), which copies the command that rebuilds - this is the
    same shape one level up. Choosing the base is new to both: it is `configuration.upstream_base` today, read
    from `stack.toml`, and nothing takes one per run. The dedicated per-plan branch is this item, and the deferral
    still holds for the reason it was written - the pipeline has published nothing, so nine sub-branches and
    nine candidate cycles would multiply a defect nobody has seen a clean cycle of yet.'
