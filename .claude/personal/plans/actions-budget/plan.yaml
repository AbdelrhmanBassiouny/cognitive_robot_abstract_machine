schema_version: 1
id: actions-budget
title: 'Actions budget: every workflow declared, event-driven, measured and warned on'
description: GitHub disabled Actions on the fork for wasted compute. This plan brings it back
  on quietly, then makes every workflow's triggers and expected volume an explicit, tested
  manifest in basstler, cuts pull request CI down to what a change touches, turns the integration
  and stack pipelines event-only, and adds a usage monitor that warns before a rate is exceeded.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 502
waves:
- id: unblock
  name: Unblock
  description: Get Actions back on without the load that got them switched off. No code.
- id: budget
  name: Budget in code
  description: The manifest, the trigger changes that make main's workflows conform to it,
    the changed-library matrix and the usage monitor. Highest priority - everything else waits
    on it.
- id: pipelines
  name: Pipelines event-only
  description: The fork's own pipelines brought under the manifest. Edits to the unlanded
    pull requests that introduce them, not new branches.
- id: hygiene
  name: Hygiene
  description: Removing what no longer runs but still clutters the Actions page and branch
    list.
tracks:
- id: operations
  name: Repository settings (done by the user)
  wave: unblock
- id: manifest
  name: Budget manifest and conforming triggers
  wave: budget
- id: monitor
  name: Usage monitor and warnings
  wave: budget
- id: pipelines
  name: Integration and stack pipelines
  wave: pipelines
- id: hygiene
  name: Dead workflows and stale branches
  wave: hygiene
items:
- id: budget-manifest
  title: Declare every workflow in a tested budget manifest, and make main's workflows conform
  branch: claude/inspiring-pascal-u7ruus
  repository: AbdelrhmanBassiouny/basstler
  track: manifest
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01RiyB21wDi8SaFucjBG6K3Y
  pull_request_number: 10
  notes: >-
    Moved to basstler as draft basstler#10 (carried from CRAM #503, now closed); it stays in
    this plan until depends_on can name an item in another repository's plan, then moves with
    cram-notes-cleanup. The CRAM-side ci.yml and .github/actions_budget.py belong to
    cram-uses-basstler-plugin. Reworked after review: no per-workflow manifest. basstler checks
    every workflow file against generic rules (no schedule, cancel on every pull-request push,
    job timeouts, fork-push skip, label check, and at most jobs_per_push_run jobs on every
    push). The repository's `.github/actions_budget.py` (`actions_budget()` returning an
    `ActionsBudget`) holds only limits plus per-workflow overrides (ci.yml 16 jobs,
    update_docker 120 min / fork pushes), and an override naming no workflow file is reported;
    `python -m basstler.actions_budget` writes its first version.
- id: changed-library-matrix
  title: Pull request CI tests the libraries a change touches and their dependents
  branch: claude/changed-library-matrix
  repository: AbdelrhmanBassiouny/basstler
  track: manifest
  depends_on:
  - budget-manifest
  status: in_progress
  pull_request_number: 55
  session: https://claude.ai/code/session_015LhBh1bQL2RDTPBjwCgtpQ
  notes: >-
    Split from CRAM #515 (closed). Package half is draft basstler#55 on #10:
    basstler.changed_libraries selects a project's matrix libraries a change touches plus their
    pyproject dependents (.claude and --tooling dirs run the tooling alone, docs nothing, other
    paths everything), with --project-root; a run-time matrix exclude counts by its axes. CRAM
    half (ci.yml changed-libraries job, actions_budget.py comment; override stays 16, decided
    with the user) is kept on CRAM ccr-81db28df-4rban1 at 9c946ecb3.
  blockers:
  - >-
    The CRAM ci.yml half waits for basstler-package/cram-basstler-removal, which puts the plugin
    in CRAM's CI; it then needs a real run to confirm the run-time exclude and the all-excluded
    skip on GitHub.
- id: usage-monitor
  title: Measure run volume against the manifest and warn before it is exceeded
  branch: null
  track: monitor
  depends_on:
  - budget-manifest
  status: not_started
  notes: 'A basstler module counts the last 24 hours of runs and jobs per workflow from the
    Actions API and compares them with daily ceilings it adds to `WorkflowLimits` in `.github/actions_budget.py`. Three surfaces, none on a
    timer: the session-start summary prints a warning line at 80% and an over-budget line
    at 100%; the first job of ci.yml writes the same comparison as a `::warning::` annotation
    and step summary, and past the hard limit skips the heavy matrix unless the pull request
    carries a `budget-override` label; and an on-demand report command for a full breakdown.'
- id: integration-pipeline-event-only
  title: Integration refresh, checks and probe run on events only
  branch: null
  track: pipelines
  depends_on:
  - budget-manifest
  pull_request_number: null
  status: deferred
  notes: >-
    No longer needed: the integration stack is retired (CRAM #211 and the branches stacked on it
    are closed, recorded in basstler #28-#31), and main carries no integration workflow. Its
    leftover-probe-branch fix goes with it.
- id: stack-maintenance-event-only
  title: Stack maintenance runs on events only and bounds a restack's CI fan-out
  branch: null
  track: pipelines
  depends_on:
  - budget-manifest
  pull_request_number: 16
  status: not_started
  notes: >-
    CRAM #280 is closed and carried to basstler as draft #16, whose reusable workflow already
    runs on events only, with no schedule. What remains: a restack pushes the restacked branches
    of one stack in sequence rather than all together, so a rebase-only push does not fan out a
    full matrix on every branch at once.
  repository: AbdelrhmanBassiouny/basstler
- id: dead-workflows-and-branches
  title: Disable dead workflows and delete stale build and probe branches
  branch: null
  track: hygiene
  session: https://claude.ai/code/session_01HpHnFV9u2zyPbpe2ECMMdt
  blockers:
    - >-
      The user deletes the 12 approved probe branches: git push origin --delete $(git ls-remote
      --heads origin 'integration-probe-20260913-085124-narrowing-*' | sed 's|.*refs/heads/||'). A
      cloud session's git access is refused (HTTP 403) when it deletes branches other than its own.
      Mark done once they are gone.
  depends_on: []
  status: blocked
  notes: >-
    No branch or pull request of its own: what remains is two repository actions. Dead workflows
    are done - Coraplex hang diagnosis, Integration token probe and board (plus every other fork
    pipeline) were disabled on 2026-10-13, and the user chose to leave them disabled rather than
    delete their run history. Build branches: the integration-<date> builds are already gone
    (take-down-unreferenced-builds removes them); the 12
    integration-probe-20260913-085124-narrowing-0..11 branches are left from a localisation
    round that never reached take_down. The user approved deleting them; nothing recurs, since
    the integration stack that made them is retired.
