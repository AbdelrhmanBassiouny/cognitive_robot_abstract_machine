  status: in_progress
  session: https://claude.ai/code/session_0137umDhuvEG3jkbh6iZUDzQ
  notes: 'Raised by the developer across five review threads on #222, which are one ask: a look should
    be narrowed by what the world means, not by an attribute spelled as a string. SUPPORTING_SURFACE_ATTRIBUTE_NAME
    = "supporting_surface" and the mimic''s PLACE_ATTRIBUTE_NAME are the smell; AGENTS.md''s own rule
    against a literal duplicating a value with its own source of truth condemns them independently of
    the redesign, and #222 leaves them standing with a test asserting the name is a real field.

    What replaces them, in the developer''s words: predicates for support and for spatial relations -
    LeftOf, RightOf and the rest - inheriting from Predicate rather than Symbol, and then used to devise
    the search rather than merely evaluated. "So I need to look on top of a bright shiny surface that
    has this size and look for an object supported by it and is left of another object that has a cyan
    colour, all these are clues that help us devise a pipeline and find the object we are looking for."

    Two mechanisms come with it, both the developer''s. A spatial predicate can be read as a Region with
    extents, so the image and the depth are clipped to where the thing can be before anything is detected
    - which is the same economy #222''s supporting-surface narrowing already buys, stated in the world''s
    vocabulary instead of an attribute''s. And a predicate no algorithm covers becomes a rejection sampler:
    detect what the other conditions do reach, spawn the instances found into a copy of the world - an
    imagination world - evaluate the predicate there with real Body and SemanticAnnotations, and delete
    what it rejects.

    Stacked on #222 rather than folded into it, which is the developer''s own placement on r3893312001
    ("you can make this a separate PR that this one here is stacked under"). The threads are r3893160382,
    r3893312001, r3893499716, r3893602153 and r3893576773; the sixth, r3893463818, is close to choose-detection-method''s
    existing claim and is recorded there rather than here.

    Overlaps pieces-looked-for-where-expected, added the same day and not visible to the session that
    wrote this. Both items end at the same thing - a stretch of the world a sought object is expected
    to lie in, used to narrow the search before detecting - reached from opposite ends: this item says
    where the constraint *comes from* (a predicate in the world''s own vocabulary, read as a Region),
    that one says what the searcher *does* with it (a believed pose and yaw interval, swept by the piece
    matcher). They must share the one type rather than each build it. Whichever starts second takes the
    other''s, and the sequencing follows from the tracks they already sit in: that item is in `surfaces`
    and depends only on one-detection-per-thing, so it lands first and defines the belief; this one supplies
    it from a predicate. The imagination-world rejection sampler is this item''s alone and duplicates
    nothing.'
