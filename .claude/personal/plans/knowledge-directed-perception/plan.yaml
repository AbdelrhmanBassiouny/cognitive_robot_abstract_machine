schema_version: 1
id: knowledge-directed-perception
title: Knowledge-directed Montessori perception
description: 'Perception that decides where to look and how to look from what the robot knows, rather
  than from constants written into the pipeline. The supporting surfaces, their extent and their finish
  come from the semantic digital twin; a query is answered by looking, through a perception backend of
  the entity query language that pushes what it can into the search and filters the rest afterwards; which
  detector answers it is a rule decision over the target and the surface; and Segmind''s support events
  plus an action''s declared effects arm what perception expects to find, which is what makes a failure
  detectable. Detectors sit behind an interface, so a RoboKudo analysis engine can be one of them without
  the reasoning layer knowing.

  The deliverable is the running demo on tracy_icra, not the pull requests: every item merges into that
  branch as soon as it works, without waiting for its own pull request to land on main, and each wave
  has a demo item that says what has to be true on the real robot before the wave counts as finished.

  The deadline is 2026-09-15, thirteen working days from 2026-08-28. That is less than the full scope
  needs, so every item is to be built in the narrowest form that demonstrates its claim - see roadmap.md''s
  budget section for what narrows and what must not be dropped.

  '
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201
waves:
- id: grounding
  name: Perception reads the scene from the world
  description: 'The three faults visible in the running demo - a clip that shows the floor, pieces on
    the board lid that are never found, and duplicate detections on the board''s borders - are one fault:
    the scene is described by constants instead of read from the world the node already fetches. Removing
    the constants is what this wave does, and each fault is the test that its item worked.'
- id: requests
  name: A query is answered by looking
  description: 'Perception becomes an entity query language backend beside the native and SQLAlchemy ones,
    so asking is evaluating rather than calling a pipeline by hand: the backend pushes what it can of
    a query''s conditions into the search, filters the rest over the detections that come back, and a
    rule tree over the target and the surface says which detector runs.'
- id: expectation
  name: Perception knows what should be true
  description: What the robot did, and what Segmind saw it do, say where a thing should now be. Perception
    looks there, and reports a violated expectation as a failure rather than as an absence.
tracks:
- id: demo-grounding
  name: The demo runs on perception that reads the world
  wave: grounding
  description: 'The deadline deliverable, tracked in the same wave as the work it integrates rather than
    left to the end. Runs in parallel with the surfaces track: an item merges into tracy_icra when it
    works, not when its pull request lands.'
- id: demo-requests
  name: The demo asks by query
  wave: requests
- id: demo-expectation
  name: The demo detects and recovers from a failure
  wave: expectation
- id: package-landing
  name: The perception package reaches main
  wave: grounding
  description: Everything in this plan edits files that exist on no branch but tracy_icra. Landing them
    first is what makes every later item a normal reviewable pull request.
- id: surfaces
  name: Surfaces, not constants
  wave: grounding
  description: 'Sequential: each item edits the same pipeline the previous one left behind, so they stack
    rather than run in parallel.'
- id: request-language
  name: Perception as a query backend
  wave: requests
  description: 'The backend itself and the compiler behind it, following the shape SQLAlchemyBackend already
    set: take the query, translate it into another engine''s plan, execute it there.'
- id: method-selection
  name: Choosing how to look
  wave: requests
  description: The digital twin extension and the rule tree that reads it. The annotation touches only
    semantic_digital_twin, so it can be written before or alongside the request language.
- id: events
  name: Expectation and failure
  wave: expectation
- id: executors
  name: A second detector behind the interface
  wave: expectation
  description: The evidence that the reasoning layer is executor-agnostic, and the route by which this
    work reaches RoboKudo after the deadline.
items:
- id: montessori-perception-on-main
  title: Land the Montessori perception package on main
  branch: montessori_perception_on_main
  pull_request_number: 202
  track: package-landing
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_01Pk12hDbP8k2C16ZQWvcroA
  notes: 'Everything that depends on this is *stacked* on its branch, not waiting for it to merge - the
    same way every item of montessori-eql-stack is based on an unmerged parent. Nothing in this plan blocks
    on review, so this item costs the demo nothing and can land whenever review allows, after the deadline
    included. experiments/src/experiments/montessori/perception/ and its tests exist only on tracy_icra,
    which also carries seventeen unrelated commits (Franka demos, Mujoco tuning, stacking). This item
    cuts a branch off main carrying the perception package alone - sorinar329''s original node commit
    75258debd plus the seven that follow it - so the rest of the plan stacks on reviewable ground instead
    of on a branch whose upstream points at a colleague''s fork. tracy_icra itself is left alone.

    Review on #205 assigned this item a second piece of work on 2026-08-29: splitting test/experiments_test/test_montessori_perception.py,
    which arrives with this branch at 1262 lines. The developer answered the "very big file" thread on
    #205 with "ok it should be done on 202", and the file exists on no branch but this one, so this item
    owns it. #205 has no work of its own left; it is that thread that keeps it open.

    Done as 00721be7: the 1262 lines became six modules, one per subject, with every section moved verbatim
    and the four shared fixtures registered from dataset/montessori_scene_fixtures.py. Two review threads
    opened on 2026-08-29 are still unanswered on #202 itself - an empty __init__.py and a timedelta on
    node.py:134 - and belong to this item rather than to surfaces-from-world.

    The recorded count of open review threads was wrong until 2026-08-29: the note said two ("an empty
    __init__.py and a timedelta on node.py:134") when there are thirteen, and the node.py comment is at
    line 374 about the 0.05 second poll interval in wait_for_scene, not a timedelta at line 134. Nothing
    else on the pull request is holding it: 23 of 23 checks pass, mergeable_state is clean, and it carries
    cram2-link-sent rather than in-review, so no upstream pull request exists to have collected review
    of its own.

    Resolved 2026-08-29: the four review threads asking for a change to this branch are done and pushed
    as bb37390d (the exception module), 3348e353 (named parts of a hole footprint), be8b8514 (the empty
    package __init__) and a9204f5e (the node''s own scene check period), and 142 tests pass where 140
    did. The other nine threads became the plan items detector-parameters-from-knowledge and tune-detection-rules-against-the-camera;
    seven of them are left open on the pull request deliberately, since each schedules a move rather than
    making one. The pull request stays out of draft for the reason already recorded.

    Second round, 2026-08-29: the developer resolved eleven of the thirteen threads himself and left two.
    hole_geometry.py:185''s remaining tuple became PolygonMeasurement (33fe5a798), and his question about
    world.py answered itself - tracy_experiments/montessori/world.py imports _SHAPE_COLORS from it for
    both Tracy demos, so the simulated pieces now take the colour measured off the real ones (7363d2c26):
    cyan cube and cylinder, amber prisms. 147 tests pass where 142 did. No review thread is open on the
    pull request.

    Gained the capture set on 2026-08-30 (7f053db0b), so every branch cut from this one can measure detection
    on real camera data: six looks at the real table taken out of the rosbags recorded on 2026-08-28,
    each three files - the camera''s own compressed colour payload byte for byte, the depth image registered
    onto it as a millimetre PNG, and a JSON record of the intrinsics and where the camera stood. 3.0 MB
    in all, and a reviewer can open the pictures on GitHub. captures.py reads them, recordings.py reads
    a rosbag''s camera stream, and capture_from_bag.py writes one; CameraTopic moved from node.py to camera.py,
    since a reader of a recording needs the topic names as much as a subscriber does. The rosbags themselves
    are gitignored: 4.7 GB that nothing here can regenerate.

    '
- id: surfaces-from-world
  title: Take the workspace from the table the robot knows about, not from a constant
  branch: perception_surfaces_from_world
  pull_request_number: 205
  track: surfaces
  depends_on:
  - montessori-perception-on-main
  status: in_progress
  session: https://claude.ai/code/session_01ScJk8zKUuToafxg38Bcag5
  blockers:
  - 'Unanswered question to the developer, raised on #205 at review time and still open: WorkspaceSurface.of_body
    picks the body''s widest horizontal face, following table_top_z''s existing rule, where the highest
    face is arguably the truer reading of "the surface things rest on". The two disagree only for a body
    whose widest shape is not its top. Not settleable from a container, since the rule was chosen against
    the real URDF.'
  notes: 'Fixes the first fault: the clip shows the floor because TRACY_WORKSPACE (node.py:102) is a hand-written
    1.0 x 1.2 m rectangle. table_top_z() already pulls the tabletop''s collision shape out of the fetched
    world for its height and discards scale.x, scale.y and the origin, which are exactly the bounds being
    guessed. Derives the region and every plane height from the world, and from HasSupportingSurface.supporting_surface
    where one exists.

    The review round of 2026-08-29 is answered in full. The test-file split it asked for was the developer''s
    call to place on #202, and it landed there as 00721be7, merged into this branch by d6673b48; the widest-face
    question this branch raised is the one thing still open.

    '
- id: detect-per-supporting-surface
  title: Look at every supporting surface, not only the table
  branch: perception_per_supporting_surface
  pull_request_number: 221
  track: surfaces
  depends_on:
  - surfaces-from-world
  status: in_progress
  session: https://claude.ai/code/session_01T8CPPnj2uqZB7bACWBFJhb
  notes: 'Fixes the second fault: a piece resting on the board''s lid is invisible twice over. The pipeline
    rectifies loose pieces onto exactly one plane (table_height), so a piece eighty millimetres higher
    is parallax-shifted out of both silhouettes; and pipeline.py:626 drops any contour the board encloses,
    coding the board as an obstacle when it is physically a supporting surface like the table. One detection
    pass per surface, each at its own plane height, with detections attributed to the surface supporting
    them. Built 2026-08-30 as #221, 2744c23d. The pass-per-surface restructure landed as planned, but
    a piece on the lid was invisible four times over rather than the two this note recorded, and the restructure
    alone fixes two. The lid''s wood reads within two hues of the amber prisms, so marking every piece
    colour at once merged a piece standing on it into the lid; and the edge fit ran Canny over brightness,
    where a cyan piece is one grey level from the lid against 34 from the bare table. Each colour is now
    segmented on its own and each colour channel read for edges of its own; both stay inside the one detector,
    so choose-detection-method still owns choosing between detectors - but its "the lid selects the colour
    blob" rule now needs a different justification, since the edge fit fits a cube on the lid at 0.93
    agreement. 153 tests pass across the montessori modules where 144 did. This item does not populate
    supporting_surface, against surface-finish-annotation''s prediction, so the finish question that raised
    does not arise yet. detect costs 0.35 s per frame against 0.23 s, inside the node''s 0.5 s period.

    Measured against the real camera on 2026-08-30 (8da0e84e9), on the six captures #202 now carries.
    Every loose piece lying on the bare table is found with the right category in all six - the thing
    this branch was built for. Three faults show, each with a strict expected-to-fail test naming the
    item that owns it, so the day that item lands the mark reports itself stale: a piece standing on the
    lid is reported a second time on the table (one-detection-per-thing), pieces on the lid are lost where
    they wear its colour or touch one another (detector-parameters-from-knowledge), and five of the board''s
    six holes are found with most called triangular prisms (holes-fitted-like-pieces, new).

    The branch also gained watch_bag, which is the node with a recording in place of the camera and the
    robot, and SceneWindows, so a replay and a live run draw the same three windows rather than two copies
    of the drawing. The test that plays the pick-up demo through it is skipped wherever the recordings
    are not on disk, which is every run but a developer''s own.'
- id: one-detection-per-thing
  title: One physical thing, one detection, and none inside a body already known
  branch: claude/plan-item-kickoff-kdp-z4pv7l
  pull_request_number: 225
  track: surfaces
  depends_on:
  - detect-per-supporting-surface
  status: in_progress
  session: https://claude.ai/code/session_01RRu7SutvRcNWHYNVUDCUFr
  notes: 'Fixes the third fault: the duplicate boxes on the board''s borders are the lid''s own edges,
    which a rectangular or triangular prism template fits at about 0.7 - above the 0.62 threshold. board.encloses
    only rejects a contour whose centre falls inside the board, and a contour riding the border has its
    centre outside; nothing anywhere forbids two detections occupying one place. Rejects a detection intersecting
    a known body''s volume, and resolves overlapping detections against each other. semantic_digital_twin.reasoning.predicates.is_place_occupied
    already exists for the first half.

    It now has a failing test rather than a description: measured on 2026-08-30, every one of the six
    captures reports a piece that is standing on the board''s lid a second time on the table, about 50
    mm from the first, because the table pass rectifies it onto the table''s plane and claims it there.
    That is a second shape of the same fault as the border boxes, and the wider one - it fires whenever
    anything rests on the lid, not only at its edges. test_only_the_pieces_resting_on_the_table_are_detected_there
    in test_montessori_detection_on_captures.py is the test; it is marked strict expected-to-fail against
    this item.

    Built 2026-08-31 as cf155f4a1. The note above describes the duplicate as a detection standing inside
    the board''s own volume, and it is not: measured on the six captures, every duplicate lies 14 to 63
    mm *outside* the board''s detected outline and shares no ground with it, so the planned occupancy
    rule over the board''s volume rejects none of them. What they are is the table seen past the board
    - a piece on the lid stands between the camera and the table behind it, so the table''s rectification
    places it there, outside the board along the ray from the camera. The rule is therefore line of sight
    rather than volume: the board''s outline projected away from the camera onto the table''s plane, cast
    from the top of a piece standing on the lid, is the stretch of table nothing may be reported resting
    on. Real table pieces stand 115 to 186 mm clear of it. The height half of the rule stands unchanged,
    and is what keeps a piece resting on the lid apart from a reading taken off the table below it.

    No threshold was needed: two solid things cannot stand in one another, so any shared ground at meeting
    heights is one thing read twice, and the captures show duplicates sharing their whole outline while
    no two separate detections share any. is_place_occupied was measured and not used - 0.035 s per call
    against a fifteen-body world, so six detections cost 0.21 s of a 0.5 s period detect already spends
    0.35 s of; reading every body''s bounding box costs the same. A general per-frame walk of the world''s
    bodies does not fit the frame budget, which is a finding for detector-parameters-from-knowledge rather
    than something dropped. detect costs 0.279 s per frame against the parent''s 0.289 s.

    The strict expected-to-fail mark came off five captures of six. non_inserted_objects keeps it, now
    naming holes-fitted-like-pieces: the board is reported at -29.7 degrees there against -7.6 degrees
    in the other five about the same centre, because its orientation comes from minAreaRect over the hole
    centres and only five of six holes are found, so the ground it is taken to hide is turned with it.'
- id: holes-fitted-like-pieces
  title: Find the board's holes by fitting its whole known layout, not one contour at a time
  branch: claude/plan-item-kickoff-ge8541
  pull_request_number: 236
  track: surfaces
  depends_on:
  - pieces-looked-for-where-expected
  status: in_progress
  session: https://claude.ai/code/session_01TSK8GxG8qC6udSB7sjwzXf
  notes: 'Built 2026-09-01 as 172c10209. The layout fit is what the item asked for and it works,
    but the captures turned up a root cause the item did not know about: the board mesh is not cut
    to the size of the board the recordings hold. The four dark patches that are unambiguously real
    holes match the mesh''s four corresponding hole centres only as a similarity of scale 0.854 with
    a 2.1-2.6 mm residual - 5-10 mm forced to scale 1 - individual holes are smaller in the same
    proportion, and no rectification plane closes the gap, since doing so would put the holes below
    the table the board stands on.

    So the observation is evidence about the board rather than about the look, which is the
    developer''s own direction: a law that must hold, and a hypothesis that makes it hold again.
    BoardDetector.measure_scale finds the size at which the rigid layout lands on the openings
    actually seen, answering 0.82, 0.84, 0.86, 0.87, 0.90 and 0.92 on the six captures, and their
    middle is persisted as recorded_setup.BOARD_SCALE_AGAINST_THE_MESH = 0.865 - knowledge about a
    particular board, so a scene built from the mesh still reads one. A test keeps that number
    answerable from the captures rather than only asserted by them.

    With it the board is found at (0.805, 0.10) within a degree and a half of straight in all six
    captures, against the parent''s (0.791..0.804, 0.128..0.145) at -5.6 to -29.7 degrees, and all
    six holes are reported over openings rather than five over the drawer fronts. Two expected-to-fail
    marks come off - every hole found in all six, and non_inserted_objects'' table ghost - and one
    goes on: in tracy_pickup_demo a prism laid over the round hole''s rim beats the cylinder sitting
    in that hole by nine parts in a thousand and takes its place, which is competing-explanations''
    to settle. The ghost is not new; a board read as standing 40 mm from where it does had been
    hiding it. Piece accuracy is unchanged in aggregate (7 missed, 4 reported that are not there,
    both sides). detect costs 0.560 s per frame against 0.370 s in the same run, over the node''s
    0.5 s period; #231''s RectifiedFrame and a believed place carried from the previous frame are the
    two ways to recover it. 423 passed, 1 skipped, 5 xfailed against 400/1/11 on the parent.
    CrossSectionClassifier and FootprintClassifier are now used by nothing but their own tests and
    are left standing, asked on the pull request.

    Measured again on 2026-08-31, and the item''s premise changed: the holes are not mislabelled,
    they are mislocated, so pointing the per-piece fit at each contour in turn would not have fixed them.
    Placing the board mesh''s own six hole footprints at the board pose the detector reports puts them
    across roughly 180 mm of the lid''s length, which is what the board''s 282 mm mesh says; the five
    contours the pipeline currently calls holes sit inside about 90 mm near the board''s middle. So they
    are not the holes at all. Worse, a free per-contour fit is what put them there: a triangular prism
    template laid anywhere near the board''s middle reaches 0.85 to 0.89 agreement in every capture, higher
    than any genuine piece resting on the lid reaches, and it converges on the same spot each time.

    The fix is to stop giving a hole three degrees of freedom of its own. The layout is rigid and known
    exactly from the mesh, so the board''s holes are found by fitting that one layout over the lid - three
    degrees of freedom for all six holes together, seeded from the board detection''s own pose - and each
    hole''s identity then comes from the model rather than from classifying its contour. A layout fit
    cannot invent a hole where there is none, cannot put two holes in one place, and cannot land on the
    drawer fronts below the lid, all of which the per-contour classifier does today. It also settles the
    board''s pose far better than the board detector does, since six outlines constrain it rather than
    one.

    This depends on pieces-looked-for-where-expected rather than running beside it, because fitting a
    known model at a believed pose is exactly the evaluator that item builds, and two branches independently
    writing the same evaluator is the duplication the personal notes already record twice. The original
    reasoning is kept below.

    Raised by the capture benchmark on 2026-08-30, and the largest error it found. The board''s mesh is
    cut with six holes - two circles, a square, a triangle, a slot and a disk slit - and the pipeline
    finds five of them in five captures and four in the sixth, calling three of the five triangular prisms
    in most of them. Loose pieces stopped being read this way in 4b74460f8, which replaced the threshold-based
    CrossSectionClassifier with a fit of the known outlines to the edges, and holes were left on the old
    classifier because they "read correctly" at the time; the later lighting is what they no longer read
    correctly in. Pointing the same fit at the holes is the obvious move, and the holes are the easier
    case: their outlines are known exactly from the board mesh (detect_hole_footprints), they lie flat
    in the lid''s own plane, and the board detection already says where to look. One detection also lands
    on the drawer fronts below the lid, which are not holes at all. test_every_hole_in_the_board_is_found
    in test_montessori_detection_on_captures.py is the test, marked strict expected-to-fail against this
    item; it asserts against the mesh''s own footprints rather than a copy of them.'
- id: pieces-looked-for-where-expected
  title: Look for a piece where it is expected, not only where a colour blob appears
  branch: claude/plan-item-kickoff-kdp-o4l189
  pull_request_number: 232
  track: surfaces
  depends_on:
  - one-detection-per-thing
  status: in_progress
  session: https://claude.ai/code/session_0158YvLwWkcdv4Hqz9i4926W
  notes: 'The structural change the rest of this plan''s perception work needs, and the one that takes
    the lid-piece failures off the ripple-down rules'' critical path.

    Today a piece can only be found where colour segmentation isolated a blob: LoosePieceDetector.detect
    walks the piece hues, and only a contour that survives the hue mask, the size range and the wholly-within
    test is ever handed to PieceMatcher.match. Colour is a gate, so a piece wearing the lid''s own hue,
    or touching another piece, is never fitted however plainly its edges are in the picture. That is the
    whole of test_every_piece_resting_on_the_lid_is_found''s four expected failures.

    Measured on 2026-08-31 against the shipped captures: seeding PieceMatcher.match by hand at the places
    the board detection already reports reaches agreements of 0.62 to 0.89 in captures where the bottom-up
    pass reports nothing there at all - in non_inserted_objects it reports one detection in the whole
    scene, and that one is a ghost. The evidence is in the image; the seed is what is missing. One seeded
    fit over all six candidate pieces costs 0.05 s against 0.25 s for a full bottom-up pass, so evaluating
    a handful of expected places is cheaper than the pass that misses them.

    So detection becomes the evaluation of hypotheses rather than the classification of blobs. A hypothesis
    says what is expected, where it is believed to be - a region of a named surface and an interval of
    yaw - and where that belief came from. Its evaluator is the sweep PieceMatcher already performs, with
    its radius, step, angle set and candidate list read from the belief instead of fixed: a hypothesis
    naming one piece at a known place searches finely over a few millimetres, one naming an unknown piece
    anywhere on a surface searches the way the current code does. Colour becomes one source of hypotheses
    and one piece of evidence for them, never a gate that can suppress one.

    Where the hypotheses come from is what makes this knowledge-guided, and there are three sources, in
    increasing order of what they need: the scene itself (a colour blob, as today, and the board''s own
    detected holes, which are places a piece can be); the world (a body the twin already places in the
    workspace); and the object''s own history (expectations-from-events, which is where a belief gets
    a pose and an uncertainty). The first two need nothing this plan has not already built, and they are
    enough for the four failing captures, which is why this item does not depend on the request language
    or on the rule tree.

    Every reported detection carries the hypothesis it came from and the evidence that supported it, which
    is what makes a result explainable rather than merely correct.

    Shares its central type with perception-predicates-guide-the-search, added the same day from #222''s
    review and not visible to this item when it was written. A believed place - a region of a named surface
    and an interval of yaw - is what that item''s spatial predicates compile *to* and what this item''s
    search reads *from*, so it is defined here, once, and that item supplies it rather than building its
    own. This item lands first: it is in the `surfaces` track and waits on nothing but one-detection-per-thing,
    where that one waits on perception-backend.

    This takes ownership of test_every_piece_resting_on_the_lid_is_found from detector-parameters-from-knowledge.
    That item is blocked on krrood''s ripple-down rules being usable, and the lid failures are a seeding
    fault rather than a parameter fault, so leaving them there would have put the plan''s most visible
    remaining error behind a dependency it does not have.

    Built 2026-08-31 as d8b654433. Detection is now the evaluation of hypotheses rather than the classification
    of blobs, and every one of the six captures reports exactly what the parent reported at exactly its
    cost, so the restructure is behaviour-preserving on real data. 397 passed, 1 skipped, 11 xfailed against
    376/1/11 on the parent.

    The board''s holes as a third source of hypotheses was built, measured and left out at the developer''s
    decision. Arming it costs 1.7-1.9x the shipped frame time and turns 3 false lid reports into 20, in
    exchange for 3 of the item''s 4 lid marks; narrowing it - a hole expecting only the pieces that fit
    through its own measured opening, and overlapping believed places merged - takes a third off that cost
    but recovers only 2 of the 4 marks, because the openings it reads are the same hole measurements holes-fitted-like-pieces
    says are wrong. So the item''s recall contract is not delivered here: the four lid marks stay, now
    naming expectations-from-events, the item that can say which piece at which hole and so makes a seeded
    fit cheap and precise. Recorded in full in roadmap.md, including that the first reading of the cost
    was reported in seconds against the 0.5 s period and was wrong - this container''s speed moves between
    runs by more than the difference being measured, so only a ratio to a same-run baseline survives.

    The review round of 2026-08-31 answered two comments, pushed as 571042923, and left both threads open
    at the developer''s discretion. A believed place''s centre is a PlanarPoint now - moved with PlanarSize
    out of hole_geometry into montessori/planar_geometry.py and no longer worded as the board mesh''s own
    plane - rather than a spatial_types Point2, which is identity-equal (two equal coordinates compare
    unequal) and so cannot be a field of a value object; a believed place is not a 2D pose either, being a
    disc of positions and an interval of turns rather than one placement. And BeliefSource stopped being a
    StrEnum: it is an abstract mixin in krrood/patterns/belief_source.py, which World inherits in
    semantic_digital_twin and LoosePieceDetector inherits here, so a belief keeps the source object and can
    be asked what else it says - the shape expectations-from-events needs. krrood''s ripple-down-rules
    Expert was deliberately not reused or rebased on it, which is the half of that thread answered
    differently. 400 passed, 1 skipped, 11 xfailed against 397 before the round, plus one test in
    semantic_digital_twin, whose world tests'' failing set is unchanged by World''s new base.'
- id: competing-explanations
  title: Decide a detection by comparing explanations, not against a fixed threshold
  branch: perception_competing_explanations
  pull_request_number: null
  track: surfaces
  depends_on:
  - pieces-looked-for-where-expected
  - holes-fitted-like-pieces
  status: not_started
  notes: 'PieceMatcher.minimum_agreement is one number, 0.62, standing for how much of an outline must
    lie along a seen edge before a piece is reported, and its recorded justification is that a correct
    piece reaches 0.63 to 0.86 while the best wrong piece of the same colour reaches 0.62. Measured on
    2026-08-31, that boundary does not hold anywhere near the board: a triangular prism template reaches
    0.85 to 0.89 on the board''s own middle in every capture, above every genuine piece detection on the
    lid in the same captures, which run 0.64 to 0.71 for the most part. No single threshold separates
    them, because agreement measures how well an outline follows *some* edge and says nothing about what
    put that edge there.

    A two-plane test was tried first and does not work: scoring the same outline in the lid''s own rectification
    as well as in the plane a piece''s top stands on separates neither, since both differences fall between
    +0.30 and +0.62 for holes and pieces alike. Recorded so it is not tried again.

    What does separate them is asking what else could have produced the edges. The board''s geometry is
    known exactly and, once holes-fitted-like-pieces has settled its layout over the picture, every edge
    the board itself produces can be predicted. A piece is then reported where it explains edges the board
    alone does not, and two hypotheses claiming one set of edges are settled against each other rather
    than both passing a threshold. The decision is a comparison of explanations, so it states how much
    better one explanation must be than the next, which is a statement about how costly a wrong report
    is - a thing the robot can be told - rather than a tuned constant.

    This is also what makes the plan''s central claim measurable: with one candidate and a strong belief,
    less picture evidence is needed to accept a detection than with six candidates and none, and that
    is knowledge improving perception in a quantity that can be plotted. one-detection-per-thing''s occupancy
    rule is the same idea applied to place, and the two should share their resolution rather than filtering
    one after the other.'
