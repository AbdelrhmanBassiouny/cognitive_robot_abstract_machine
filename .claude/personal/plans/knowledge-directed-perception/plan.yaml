    Two corrections from 2026-08-31. The conditions the tree reads are not only standing properties of
    the surface and the target - what finish it has, whether the target has a geometric model - but also
    what has lately happened to the target: whether it is believed to be somewhere in particular, how
    sure that belief is, and what acted on it last. A rule that fires on "the target was released over
    this hole one action ago" is the same kind of rule as one that fires on "this surface is mirror-finished",
    and it is the kind the captures actually need. And the planned rule "a matte contrasting surface selects
    the cheaper colour blob" needs its other justification writing down, since detect-per-supporting-surface
    already recorded that the edge fit works on the lid too; speed is the honest reason, not capability.

    A third reading of the same claim arrived on #222 (r3893463818), and it is this item''s rather than
    the backend''s: "we can also have perception algorithms as classes that declare explicitly their capabilities,
    what requests they can answer to, also could be described as eql conditions, then a perception reasoner
    will choose the algorithm that has a capability that can answer that request." That is this item''s
    rule tree with the condition moved onto the detector - each detector states the requests it can answer,
    and the choice is made by matching a request against those statements rather than by a tree written
    over the surface and the target. Worth settling which of the two shapes this item builds before it
    starts, since they answer the same question from opposite ends.

    Built 2026-08-31 as #231, 69f30348a. Both shapes were built, layered, at the developer''s
    direction: each detector declares the looks it can answer as an entity query language condition,
    and the ripple-down tree chooses among the ones that can. The planned third rule - a target
    wearing the surface''s own hue falls back to the edge fit - turned out not to be a rule but the
    colour blob''s capability going false, so the tree ships the two rules the budget asks for.
    Speed is the honest reason and it is measured: the colour blob costs 89 ms against the edge
    fit''s 126 ms on the same work, reporting the same pieces at comparable agreement.

    The recorded blocker was three claims and only two are true. The classic
    krrood.ripple_down_rules machinery is unusable as recorded (source-string conditions, an Expert
    required for every tree mutation), and EQLSingleClassRDR is eight unmerged pull requests deep in
    the D-core-* stack - but the EQL-native rule trees the item''s own note describes are usable on
    main today, 24 tests passing with no skips. So this item was never blocked, and neither is
    detector-parameters-from-knowledge behind it.

    One structural finding: choosing a detector per piece means a surface is searched once per
    detector, and the first working version was slower annotated than not (0.596 s/frame against
    0.521). Rectifying each plane and reading its edges once per frame rather than once per detector
    fixes it (0.494 against 0.491) and made the unannotated path faster too. Anything derived from
    the picture belongs to the frame once more than one detector answers a look.

    Nothing in this workspace states a finish yet, so every look still falls to the edge fit on the
    scenes as they stand - the same shape as surfaces-from-world''s supporting_surface being None
    everywhere, and asserted directly. The rule sending an amber piece to the edge fit reads the
    colour the world states, and BOARD_COLOR is eleven hues from the wood the camera measures, so it
    does not fire on the real board until detector-parameters-from-knowledge moves measured colours
    onto the twin.

    Corrected 2026-08-31 by the developer: the EQL-native RDR engine *is* usable. The note above read
    the D-core-* stack''s merge state as its usability, which contradicts this plan''s own rule that
    depends_on means stacked on, never waiting for a merge. #64 -> #65 -> #66 -> #67 -> #98 -> #159
    (EQLSingleClassRDR) -> #210 -> #79 -> #76 -> #80 -> #77 (the @rdr decorator) are all open, out of
    draft and reviewed. Only the classic krrood.ripple_down_rules machinery is unusable.

    #231 keeps its stated rule tree anyway, at the developer''s decision: EQLSingleClassRDR.query is
    init=False so the engine grows its tree by fitting cases through an Expert rather than taking one
    already built, which would make two known rules fitted-from-examples; and merging #159 in would add
    9,236 lines of another plan''s stack to a 600-line pull request. What the engine adds - fit,
    render_tree, the corner-case store, the model file - is what the next two items are written around.

    Review round of 2026-08-31, answered as 92afdcd82. Two threads, and the second changed the design:
    building the rule tree inside the method that evaluates it leaves nothing for anything else to
    read, so it may as well have been an if, and the point of an EQL rule tree is that new situations
    can be added to it. The tree is stated once now, in DetectorRules.__post_init__, and a look is
    decided by binding it to the one variable every rule states its conditions over and evaluating the
    tree already held - the same rebind krrood''s own GuardCondition.holds_for performs. add_rule
    attaches a new rule to the tree while it is in use, with Alternative.insert_at, beside the
    exceptions already stated so a look reaches at most one of them; a test pins that a rule added at
    runtime changes the next look''s answer, and it fails if the tree is rebuilt per look. Each
    detector states its own capability once the same way, and capability() is an ordinary method typed
    ConditionType over a TargetOnSurface rather than Any over Any, which was the other thread.
    Choosing for one surface costs 1.0 ms rather than 4.4 ms as a result. 233 tests pass across the
    montessori modules against 230 before the round.

    What the round did not do is the other half of what it asked: nothing yet asks an expert when no
    rule fires, since the expert interface is on #98/#159/#76 rather than on main. The decision to
    stay off the engine is unchanged and is the developer''s, and it is put back to him on the thread
    rather than reversed here - the thread is left open for that reason.'
- id: detector-parameters-from-knowledge
  title: Take the detectors' numbers from the objects and the surfaces they look at
  branch: claude/knowledge-directed-perception-detector-zrm57t
  pull_request_number: 239
  track: method-selection
  depends_on:
  - choose-detection-method
  status: in_progress
  session: https://claude.ai/code/session_014LgGAmWL8JZM3qW7pwwnbp
  notes: 'Raised by the developer across nine review threads on #202, which are one ask: the numbers the
    detectors carry - the saturation and darkness a pixel needs to belong to an object, the areas a hole
    and a piece may cover, how much of an outline must lie along a seen edge, how tall a loose piece stands,
    how large the board''s lid is, how far a measured hue may sit from a piece''s own, the hue of each
    piece, the hole marker''s thickness and the mesh classification thresholds - are knowledge about the
    pieces, the surfaces and the lighting, not properties of the detector that reads them. They move onto
    the objects and surfaces in the digital twin, and a ripple-down rule tree over those properties concludes
    them for a run, the way choose-detection-method''s tree already concludes which detector runs. The
    same move covers the chain of ifs that accepts or rejects a contour (pipeline.py:619), which the developer
    asked to become an inspectable rule tree rather than a hand-written condition. Depends on krrood''s
    ripple-down rules being usable, which the developer expects from the RDR/EQL refactor''s integration
    build. The piece hues gained a second reader on 2026-08-29: the simulated scene now draws each piece
    in the colour measured off the real one, so moving the hues onto the objects moves them for the twin
    as well as for the detector.

    Widened on 2026-08-31: the numbers concluded include the ones that say *how to search*, not only the
    ones that say what a pixel or a contour must look like. How far around a believed place to look, how
    finely to step and to turn, which pieces are candidates at all, and how much better one explanation
    must be than the next before it is reported, are all properties of the situation - and a situation
    where the robot knows which piece it released over which hole warrants a different set from one where
    it is looking at a table it has never seen. That is what makes the same detector measurably better
    as the robot knows more, in a quantity that can be plotted, and it is where "a specific parametrization
    for the situation the query describes" actually lives.

    Ownership of test_every_piece_resting_on_the_lid_is_found moved to pieces-looked-for-where-expected
    on 2026-08-31: those failures are a seeding fault, not a parameter fault, and this item is blocked
    on krrood''s ripple-down rules while that one is not.

    Not blocked, corrected 2026-08-31. The note above says this depends on krrood''s ripple-down rules
    becoming usable through the RDR/EQL refactor''s integration build. They are usable now: the
    EQL-native rule trees are on main, and EQLSingleClassRDR is on #159, which is open, out of draft and
    reviewed - and this plan''s rule is that depends_on means stacked on, never waiting for a merge. This
    item should stack on #159 rather than on choose-detection-method''s hand-written tree, because
    render_tree is what its own ask for "an inspectable rule tree rather than a hand-written condition"
    actually names.'
