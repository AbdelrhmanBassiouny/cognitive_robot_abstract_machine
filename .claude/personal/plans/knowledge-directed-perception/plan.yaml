- id: episode-replayed-into-the-world
  title: Replay a recorded episode into the world so Segmind can say what happened
  branch: claude/episode-replayed-world-kickoff-6ye5bb
  session: https://claude.ai/code/session_01UdpwcAQGVFCKEy8VA2iFwv
  pull_request_number: 246
  track: events
  depends_on: []
  status: in_progress
  notes: 'An expectation about where a thing now is comes from what was done to it, and on a recording
    nothing has been done to anything until the recording is replayed. Segmind already has the extension
    point: EpisodePlayer -> DataPlayer -> FilePlayer, with CSVEpisodePlayer and JSONPlayer as its two
    members, and a player supplies exactly one thing - a generator of frames, each frame a set of body
    poses. A player reading a rosbag''s transform tree and joint states is that same member over a different
    file, and EpisodeSegmenterExecutor then produces the support, pick-up, placing and insertion events
    over it without changing.

    Touches only segmind, so it can start immediately and off main.

    A constraint measured on 2026-08-31 that decides what this can be asked for. Only one of the six recorded
    bags carries the robot at all: tracy_pickup_demo holds /tf, /tf_static, /joint_states and both arms''
    and both grippers'' joint states over 150 seconds, 253,000 messages. The other five hold nothing but
    the three camera topics over about 29 seconds each. So a replayed episode gives an event history for
    the pick-up demo and for anything recorded from now on, and it gives the live demo its history directly,
    but it cannot supply one for the five scene captures. Those get their expectations from the board
    and the action model instead - the hole an insertion named is a place in the world, known without
    any recording - which is why pieces-looked-for-where-expected does not depend on this item.

    Worth recording for whoever runs it: recording /tf and /joint_states alongside the camera in future
    takes costs nothing and would remove this split entirely.'
- id: expectations-from-events
  title: Expect what the action promised, and report the difference as a failure
  branch: perception_expectations_from_events
  pull_request_number: null
  track: events
  depends_on:
  - perception-backend
  - pieces-looked-for-where-expected
  - episode-replayed-into-the-world
  status: not_started
  notes: 'Segmind already emits SupportEvent, LossOfSupportEvent, PickUpEvent, PlacingEvent and InsertionEvent
    over is_supported_by. Perception keeps a set of expectations from them - after LossOfSupport(piece,
    table) stop searching the table; after Placing(piece, lid) search the lid - and the action model gets
    there first, since an action declares its own effect and so the expectation can be armed before the
    event confirms it. The same mechanism gives failure detection: perception looked exactly where the
    action promised, found nothing, and says so.

    Widened on 2026-08-31, at the developer''s ask, from an expectation that names a surface to one that
    carries a pose. Naming the surface is the part the request language can push down, but it is not what
    the captures need: three of them - stuck_cube_in_hole, disoriented_cube_on_hole and displaced_cube_from_hole
    - are a cube that an insertion put at a *named hole*, and the hole is a place, known in the world,
    on a surface the board detection measures every frame. So an expectation is a belief about where an
    object is: a region it should lie in, an interval of yaw it should be turned through, and the surface
    it should rest on. That is precisely the hypothesis pieces-looked-for-where-expected evaluates, which
    is why the two are now linked.

    What the belief is propagated by is the action''s own declared effect, confirmed or refuted by the
    events: released over a hole, an object is believed to be at that hole, turned any way, within the
    spread a release allows; still grasped, its pose is the gripper''s; acted on by nothing, its pose
    is exactly where it was last seen. The rule that carries the weight is the last one - a belief only
    decays when something acts on the object - and it is why a history makes this tractable where a single
    frame does not.

    Failure detection then follows from the belief rather than from a surface: the insertion promised
    the cube would end up *in* the hole, and it is found resting *on* the lid, turned thirty degrees from
    where it would have had to be. Reporting which part of the expectation was violated is what a recovery
    can act on, and it is the paper''s end-to-end story.'
