    "one can interpret spatial predicates as specifying Regions (like the region class in semdt) with
    extents to look at and excluding other regions, once can clip images and depth to look only inside
    these regions."

    That is the same economy #222''s supporting-surface narrowing already buys, stated in the world''s
    vocabulary instead of an attribute''s, and it is where narrowing stops being a filter over what a
    detector returned and becomes less picture to search in the first place.

    It waits on both parents for one reason each. perception-predicates-guide-the-search is where a statement''s
    predicates are read at all, and pieces-looked-for-where-expected owns the believed place - a region
    of a named surface and an interval of yaw - which the roadmap settled is defined once, there, and
    supplied by a predicate here. Building the type in either branch alone is the duplication this repository
    has already paid for twice.


    Widened 2026-09-01 at the developer''s ask, from the two relations #227 could read to every
    relation that says where a thing may be. semantic_digital_twin gains PlacementRelation: a
    relation answers the stretch of the world it leaves (what a search reads, before anything has
    been found) and whether one place satisfies it (answered exactly, never from the box), and one
    stated about nothing is the constraint alone. The six view-dependent relations lose their six
    copies of one __call__ for the axis and the side that are all that tell them apart, and take
    entities as well as points; Between, Near and Colored are new. krrood gains Relation - a
    predicate asserted about one subject, of which Triple is the two-operand case - so a relation of
    three operands is read whole rather than down to the one thing a triple names second.


    Two faults the widening found, both fixed. A stated stretch says where the *thing* is, not which
    pixels may be read, so a cube 25 mm inside the stretch a statement allowed was never fitted; the
    picture now reaches an overhang past a stated stretch as it already did past a surface''s own
    boundary. And the board is what says how far every surface reaches, so no statement about what
    rests on it may cut the picture it is found in - one of the three rectifications a frame costs
