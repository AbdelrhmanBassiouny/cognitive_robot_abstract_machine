schema_version: 1
id: knowledge-directed-perception
title: "Knowledge-directed Montessori perception"
description: >
  Perception that decides where to look and how to look from what the robot
  knows, rather than from constants written into the pipeline. The supporting
  surfaces, their extent and their finish come from the semantic digital twin;
  a query is answered by looking, through a perception backend of the entity
  query language that pushes what it can into the search and filters the rest
  afterwards; which detector answers it is a rule decision over the target and
  the surface; and Segmind's support events plus an action's declared
  effects arm what perception expects to find, which is what makes a failure
  detectable. Detectors sit behind an interface, so a RoboKudo analysis engine
  can be one of them without the reasoning layer knowing.

  The deliverable is the running demo on tracy_icra, not the pull requests:
  every item merges into that branch as soon as it works, without waiting for
  its own pull request to land on main, and each wave has a demo item that says
  what has to be true on the real robot before the wave counts as finished.

  The deadline is 2026-09-15, thirteen working days from 2026-08-28. That is
  less than the full scope needs, so every item is to be built in the narrowest
  form that demonstrates its claim - see roadmap.md's budget section for what
  narrows and what must not be dropped.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 201

waves:

  - id: grounding
    name: "Perception reads the scene from the world"
    description: >-
      The three faults visible in the running demo - a clip that shows the
      floor, pieces on the board lid that are never found, and duplicate
      detections on the board's borders - are one fault: the scene is described
      by constants instead of read from the world the node already fetches.
      Removing the constants is what this wave does, and each fault is the test
      that its item worked.

  - id: requests
    name: "A query is answered by looking"
    description: >-
      Perception becomes an entity query language backend beside the native and
      SQLAlchemy ones, so asking is evaluating rather than calling a pipeline
      by hand: the backend pushes what it can of a query's conditions into the
      search, filters the rest over the detections that come back, and a rule
      tree over the target and the surface says which detector runs.

  - id: expectation
    name: "Perception knows what should be true"
    description: >-
      What the robot did, and what Segmind saw it do, say where a thing should
      now be. Perception looks there, and reports a violated expectation as a
      failure rather than as an absence.

tracks:

  - id: demo-grounding
    name: "The demo runs on perception that reads the world"
    wave: grounding
    description: >-
      The deadline deliverable, tracked in the same wave as the work it
      integrates rather than left to the end. Runs in parallel with the
      surfaces track: an item merges into tracy_icra when it works, not when
      its pull request lands.

  - id: demo-requests
    name: "The demo asks by query"
    wave: requests

  - id: demo-expectation
    name: "The demo detects and recovers from a failure"
    wave: expectation

  - id: package-landing
    name: "The perception package reaches main"
    wave: grounding
    description: >-
      Everything in this plan edits files that exist on no branch but
      tracy_icra. Landing them first is what makes every later item a normal
      reviewable pull request.

  - id: surfaces
    name: "Surfaces, not constants"
    wave: grounding
    description: >-
      Sequential: each item edits the same pipeline the previous one left
      behind, so they stack rather than run in parallel.

  - id: request-language
    name: "Perception as a query backend"
    wave: requests
    description: >-
      The backend itself and the compiler behind it, following the shape
      SQLAlchemyBackend already set: take the query, translate it into another
      engine's plan, execute it there.

  - id: method-selection
    name: "Choosing how to look"
    wave: requests
    description: >-
      The digital twin extension and the rule tree that reads it. The
      annotation touches only semantic_digital_twin, so it can be written
      before or alongside the request language.

  - id: events
    name: "Expectation and failure"
    wave: expectation

  - id: executors
    name: "A second detector behind the interface"
    wave: expectation
    description: >-
      The evidence that the reasoning layer is executor-agnostic, and the
      route by which this work reaches RoboKudo after the deadline.

items:

  - id: montessori-perception-on-main
    title: "Land the Montessori perception package on main"
    branch: montessori_perception_on_main
    pull_request_number: 202
    track: package-landing
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01FMKabzWhaJpTERyAaSc7Kh
    notes: >-
      Everything that depends on this is *stacked* on its branch, not waiting
      for it to merge - the same way every item of montessori-eql-stack is
      based on an unmerged parent. Nothing in this plan blocks on review, so
      this item costs the demo nothing and can land whenever review allows,
      after the deadline included.
      experiments/src/experiments/montessori/perception/ and its tests exist
      only on tracy_icra, which also carries seventeen unrelated commits
      (Franka demos, Mujoco tuning, stacking). This item cuts a branch off main
      carrying the perception package alone - sorinar329's original node commit
      75258debd plus the seven that follow it - so the rest of the plan stacks
      on reviewable ground instead of on a branch whose upstream points at a
      colleague's fork. tracy_icra itself is left alone.

  - id: surfaces-from-world
    title: "Take the workspace from the table the robot knows about, not from a constant"
    branch: perception_surfaces_from_world
    pull_request_number: 205
    track: surfaces
    depends_on: [montessori-perception-on-main]
    status: blocked
    session: https://claude.ai/code/session_011NPnTyfe9ZfBPvv13CVZcM
    blockers:
      - >-
          The only unresolved review thread on #205 cannot be closed from this branch. On 2026-08-29
          the developer answered the "this is a very big file" thread on
          test/experiments_test/test_montessori_perception.py with "ok it should be done on 202", so
          splitting that file's 1262 pre-existing lines is montessori-perception-on-main's work, on
          branch montessori_perception_on_main. The file does not exist on main, which is what makes
          #202 its owner.
      - >-
          Unanswered question to the developer, raised on #205 at review time:
          WorkspaceSurface.of_body picks the body's widest horizontal face, following table_top_z's
          existing rule, where the highest face is arguably the truer reading of "the surface things
          rest on". The two disagree only for a body whose widest shape is not its top. Not
          settleable from a container, since the rule was chosen against the real URDF.
    notes: >-
      Fixes the first fault: the clip shows the floor because TRACY_WORKSPACE
      (node.py:102) is a hand-written 1.0 x 1.2 m rectangle. table_top_z()
      already pulls the tabletop's collision shape out of the fetched world for
      its height and discards scale.x, scale.y and the origin, which are
      exactly the bounds being guessed. Derives the region and every plane
      height from the world, and from HasSupportingSurface.supporting_surface
      where one exists.

  - id: detect-per-supporting-surface
    title: "Look at every supporting surface, not only the table"
    branch: perception_per_supporting_surface
    pull_request_number: null
    track: surfaces
    depends_on: [surfaces-from-world]
    status: not_started
    notes: >-
      Fixes the second fault: a piece resting on the board's lid is invisible
      twice over. The pipeline rectifies loose pieces onto exactly one plane
      (table_height), so a piece eighty millimetres higher is parallax-shifted
      out of both silhouettes; and pipeline.py:626 drops any contour the board
      encloses, coding the board as an obstacle when it is physically a
      supporting surface like the table. One detection pass per surface, each
      at its own plane height, with detections attributed to the surface
      supporting them.

  - id: one-detection-per-thing
    title: "One physical thing, one detection, and none inside a body already known"
    branch: perception_one_detection_per_thing
    pull_request_number: null
    track: surfaces
    depends_on: [detect-per-supporting-surface]
    status: not_started
    notes: >-
      Fixes the third fault: the duplicate boxes on the board's borders are the
      lid's own edges, which a rectangular or triangular prism template fits at
      about 0.7 - above the 0.62 threshold. board.encloses only rejects a
      contour whose centre falls inside the board, and a contour riding the
      border has its centre outside; nothing anywhere forbids two detections
      occupying one place. Rejects a detection intersecting a known body's
      volume, and resolves overlapping detections against each other.
      semantic_digital_twin.reasoning.predicates.is_place_occupied already
      exists for the first half.

  - id: perception-backend
    title: "Answer a query by looking, as a backend of the entity query language"
    branch: perception_eql_backend
    pull_request_number: null
    track: request-language
    depends_on: [surfaces-from-world]
    status: not_started
    notes: >-
      A PerceptionBackend beside EntityQueryLanguageBackend and
      SQLAlchemyBackend, so evaluating a query runs perception rather than a
      pipeline being called by hand. SQLAlchemyBackend already sets the shape -
      eql_to_sql translates the query into another engine's plan and runs it
      there - and the compiler from a query to a detection pipeline is the same
      move against a camera. Conditions are split the way a query planner
      splits them: those that can be pushed down shape the search (which
      surface to rectify, which piece models are candidates, what seeds
      segmentation - via is_supported_by, is_body_in_region, InsideOf, the
      selected type and the appearance constraints), and those that cannot are
      kept as a residual filter over the detections that come back, so nothing
      is silently ignored. A condition that can be neither raises a typed
      exception alongside SelectiveBackendCannotResolveEllipsisMatch. Also
      gives the backend its own opening_directive so a query answered by
      looking verbalizes as "Look for ..." rather than "Find ...", which needs
      one Directive member in krrood. Narrowed for the deadline: support
      exactly the condition forms the demo writes - the selected type and
      is_supported_by - push those down, filter the rest as residuals, and
      raise on anything else. A general compiler is not what the claim needs. PerceivedObjects, the domain that runs
      the whole pipeline on iteration and yields everything, is retired by it:
      a query then runs only what it asked for.

  - id: surface-finish-annotation
    title: "Say in the digital twin how a surface takes light"
    branch: sdt_surface_finish_annotation
    pull_request_number: null
    track: method-selection
    depends_on: []
    status: not_started
    notes: >-
      The digital twin models a surface's colour but not its finish, which is
      the property that decides whether colour segmentation works at all: the
      brushed steel table throws a diffuse, piece-coloured reflection with no
      sharp boundary anywhere, which is why the edge fit had to be written.
      A matte / glossy / mirror finish annotation is what turns "the steel
      table and the wooden lid need different pipelines" into something the
      robot knows rather than a branch somebody wrote. Touches only
      semantic_digital_twin, so it can start off main immediately.

  - id: choose-detection-method
    title: "Choose the detector by rule from the target and the surface"
    branch: perception_choose_detection_method
    pull_request_number: null
    track: method-selection
    depends_on: [perception-backend, surface-finish-annotation]
    status: not_started
    notes: >-
      The detector interface the backend dispatches to, chosen by a rule tree -
      krrood's ripple-down rules, whose conditions are already entity query
      language expressions - over properties of the surface and the target: a mirror-finish surface with a known-geometry prism selects
      the edge fit; a matte contrasting surface selects the cheaper colour
      blob, which works there and is faster; a target with no geometric model
      selects a learned detector. This is where perception measurably gets better as
      the robot knows more, and it is the item the paper's claim rests on.

  - id: expectations-from-events
    title: "Expect what the action promised, and report the difference as a failure"
    branch: perception_expectations_from_events
    pull_request_number: null
    track: events
    depends_on: [perception-backend]
    status: not_started
    notes: >-
      Segmind already emits SupportEvent, LossOfSupportEvent, PickUpEvent,
      PlacingEvent and InsertionEvent over is_supported_by. Perception keeps a
      set of expectations from them - after LossOfSupport(piece, table) stop
      searching the table; after Placing(piece, lid) search the lid - and the
      action model gets there first, since an action declares its own effect
      and so the expectation can be armed before the event confirms it. The
      same mechanism gives failure detection: perception looked exactly where
      the action promised, found nothing, and says so.

  - id: robokudo-detector
    title: "Answer a request with a RoboKudo analysis engine"
    branch: perception_robokudo_detector
    pull_request_number: null
    track: executors
    depends_on: [choose-detection-method]
    status: deferred
    blockers: ["Deferred past the 2026-09-15 deadline: nothing depends on it and no demo item needs it."]
    notes: >-
      One adapter implementing the detector interface over a RoboKudo analysis
      engine, so the rule tree can choose a learned detector (RoboKudo ships
      CLIP and YOLO annotators) for a target with no geometric model. Proves
      the reasoning layer is executor-agnostic and is the route by which this
      work moves into RoboKudo after the deadline. Deliberately last and
      expected to fall after it: nothing else depends on it, no demo item needs
      it, and it is the first thing to drop if the deadline tightens.

  - id: demo-catches-up-with-main
    title: "Bring the demo branch up to date with main while it is still cheap"
    branch: tracy_icra
    pull_request_number: null
    track: demo-grounding
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01FMKabzWhaJpTERyAaSc7Kh
    notes: >-
      Done 2026-08-28, pushed to origin/tracy_icra as fb0d0e41 (the merge) and
      ece5eb74 (three branch-only call sites main had broken without
      conflicting). main was 277 commits ahead by the time it ran, not the 234
      measured when the plan was written. No pull request, as planned.
      Do this first and do it now. main is 234 commits ahead of tracy_icra and
      their merge base is 2026-08-19; a trial merge today conflicts in exactly
      one file, semantic_digital_twin/adapters/multi_sim.py, which is a
      colleague's Mujoco work and unrelated to perception. With the deadline on
      2026-09-15 there is no slack to spend on a merge that grows daily, and
      every day this is left it grows, and every later item in this plan is
      developed off main and has to reach this branch. No pull request: this
      merges into tracy_icra, which is not proposed anywhere.

  - id: demo-runs-on-grounded-perception
    title: "The demo sees only the table, finds pieces on the lid, and reports each once"
    branch: tracy_icra
    pull_request_number: null
    track: demo-grounding
    depends_on: [one-detection-per-thing, demo-catches-up-with-main]
    status: not_started
    notes: >-
      Wave one is finished when the three faults are gone on the real robot,
      not when their pull requests are approved: the clipped windows show the
      table and nothing beyond it, a cube resting on the board's lid is
      detected there, and no detection rides the board's borders. Verified
      against the live camera, with a captured frame kept for the tests.

  - id: demo-asks-by-query
    title: "The demo's perception runs because a query was evaluated"
    branch: tracy_icra
    pull_request_number: null
    track: demo-requests
    depends_on: [choose-detection-method, demo-runs-on-grounded-perception]
    status: not_started
    notes: >-
      Every perception call in montessori_demo.py goes through the backend
      rather than calling the pipeline by hand, and the detector that answers
      is the one the rule tree chose from the surface and the target - visibly
      a different one for the steel table than for the board's lid. This is the
      wave's claim made demonstrable: the same question, answered differently
      because the robot knows what it is looking at.

  - id: demo-detects-and-recovers-a-failed-insert
    title: "A failed insertion is noticed because perception looked where the action promised"
    branch: tracy_icra
    pull_request_number: null
    track: demo-expectation
    depends_on: [expectations-from-events, demo-asks-by-query]
    status: not_started
    notes: >-
      The end-to-end story the paper is written around: the robot picks a
      piece, Segmind's LossOfSupportEvent takes the table out of the search,
      the insertion's declared effect points perception at the board's lid, and
      when the insertion fails perception finds the piece somewhere the plan
      did not expect and says so. Recovery follows from that report.
      Narrowed for the deadline: report the violated expectation, and let
      recovery be the plan re-asking rather than a policy of its own. If the
      deadline forces a cut, this is the item to protect and robokudo-detector
      is the one to drop.
