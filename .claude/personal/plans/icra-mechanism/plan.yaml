schema_version: 1
id: icra-mechanism
title: 'ICRA experiments: what the paper measures'
description: The mechanism wave of icra-experiments (split 2026-09-05 for the plan size budget
  -- see plan-size-limits' roadmap.md for why).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: mechanism
  name: What the paper measures
  description: 'What makes the subsystems one system: capability declaration and per-predicate
    routing across interchangeable backends, a control program whose constraints are queries
    over the same knowledge, physics as one more answerer of the same predicates, the snapshot
    working memory the agency questions rest on, failure typing and prediction, and the baselines
    the experiments compare against.'
tracks:
- id: backend-routing
  name: One representation, interchangeable backends
  wave: mechanism
  description: Lane 1. Backends of every kind declare what they can answer in one vocabulary,
    a statement is routed per predicate by capability and knowledge state, a perception backend
    can be a detector stack or a vision-language model without anything above it changing,
    derived facts are verified in a physics copy of the world, and working memory is a snapshot
    refreshed only when it is worth refreshing.
- id: failure
  name: Typed and predicted failures
  wave: mechanism
  description: Lane 2. The failure taxonomy, typing from evidence, prediction from the query
    result before execution, and the knowledge ablations and perturbations that produce failures
    on purpose.
- id: control
  name: The control system answers for itself
  wave: mechanism
  description: Lane 1. The control program is already dataclasses over the same world model,
    so it is asked what it was constrained by and which degrees of freedom it used in the
    same query language as the scene - a read over what the motion statechart already holds,
    not a change to how a motion is built.
- id: baselines
  name: Verbalised memory and the VLM baselines
  wave: mechanism
  description: Lane 3. The deterministic English rendering of working memory, and the harness
    that asks a vision-language model the same questions with and without it.
items:
- id: query-routed-per-predicate
  title: A statement is routed per predicate by capability and knowledge state, and the routing
    is reported
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on: []
  status: deferred
  notes: 'The mechanism the thesis sentence names. A planner splits a statement into its predicates,
    assigns each to the backend whose capability admits it under the current twin state, orders
    them twin first, then perception for what the twin cannot answer, then physics for derived
    facts, and falls back to the next capable backend when one refuses. It returns a QueryPlan
    beside the answer: per-predicate assignment, detector calls, region searched and latency,
    which is exactly what Experiment B tabulates.'
- id: physics-verification-backend
  title: 'Perceive, commit, verify: detections spawned into a physics copy of the world and
    derived facts re-evaluated there'
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on: []
  status: deferred
  notes: 'A backend that spawns what perception reported into a copy of the world, steps MuJoCo,
    and evaluates the derived predicates there: Stable, contact and penetration, InsideOf,
    the directional relations and Reachable, all of which #229 already made predicates. It
    reports agreement or disagreement with the perception backend per fact, never re-checking
    the committed pose itself. This is the narrow form of knowledge-directed-perception''s
    imagination-world item, built here because the paper measures it; that plan''s item is
    noted as covered by this one.'
- id: failure-taxonomy-and-typing
  title: Every failed trial typed as semantic, geometric, perceptual or execution from the
    evidence
  branch: null
  pull_request_number: null
  track: failure
  depends_on: []
  status: deferred
  blockers:
  - 'Cross-plan: the violated-expectation input comes from knowledge-directed-perception''s
    expectations-from-events (not started there), which that plan owns. Typing from the plan''s
    failure and the segmind events can be built first; the expectation-derived type waits
    on it.'
  - 'Cross-plan: depends on icra-foundation''s `scenario-domain-model` (in_progress, PR #261),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
  notes: A FailureType enum with the four members, and the rule that assigns one to a finished
    trial from the plan's own failure, the segmind events and the violated expectation. Extends
    insertion_diagnosis.InsertionDiagnosis and InsertionFailureReason, which already diagnose
    an attempt from events, rather than a second diagnosis; each existing reason maps to one
    type. Recorded on the Trial and so in the episode. Tests cover one trial per type.
- id: knowledge-ablations
  title: Each knowledge source switched off through a Condition, never through a code branch
  branch: null
  pull_request_number: null
  track: failure
  depends_on: []
  status: deferred
  notes: 'The memo''s conditions as Condition instances: full; no working memory; no hole-shape
    knowledge (the board''s holes unknown to the twin, which also needs the mesh scale 0.865
    #236 measured to be in the twin first, so the full condition is honest); no degree-of-freedom
    limits (a twin edit, since DegreeOfFreedomLimits lives on the twin''s own DegreeOfFreedom
    and the controller reads it there); no pickup detection; no predicate-narrowed perception.
    Each condition removes one thing the action reads from the twin or the backends, so the
    action''s code has no ablation flags of its own.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `montessori-scenarios` (not_started), split
    out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: expectation-checked-under-perturbation-in-simulation
  title: A robot plan run in simulation under a perturbation, and the violated expectation
    reported as the failure
  branch: null
  pull_request_number: null
  track: failure
  depends_on: []
  status: deferred
  notes: 'Added 2026-09-05 at the developer''s ask on knowledge-directed-perception''s #257
    (r3940274577). The expectation process - an action''s declared effect armed as relations
    of the twin''s vocabulary, Segmind''s events moving the belief by what each declares,
    a look asked for the same relations, and the violated ones reported as the failure - is
    tested there over a rendered scene and a hand-built world, never over a plan the robot
    actually executes.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `integrated-simulation-pipeline` (in_progress,
    PR #265), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan
    boundary.'
- id: failure-predicted-from-the-query
  title: The failure type predicted from the query result before execution, and scored against
    what happened
  branch: null
  pull_request_number: null
  track: failure
  depends_on:
  - failure-taxonomy-and-typing
  - query-routed-per-predicate
  status: deferred
  notes: 'H4. Before an insertion executes, the QueryPlan and its answer predict the type:
    several candidate holes answer the target description, so semantic; Reachable is false
    for the grasp or the release pose, so geometric; the physics backend disagrees with perception
    or nothing was detected, so perceptual; otherwise none predicted. Precision and recall
    of prediction against the observed type are Metrics on the Report. Tests build one query
    result per predicted type.'
- id: working-memory-verbalised
  title: 'Working memory rendered as deterministic English: objects, poses, relations, events,
    gripper contents'
  branch: null
  pull_request_number: null
  track: baselines
  depends_on: []
  status: deferred
  notes: 'A fixed set of EQL queries over the twin whose answers are rendered through the
    verbalization framework on main, concatenated in a fixed order with rounded numbers, so
    the same state always produces the same text. The scene wordings #33 carries (support,
    the directional relations, visibility, reachability) are the ones to use; where #33 is
    not yet rebased onto #229, take its reviewed wordings rather than inventing new ones.
    A snapshot test pins the text for one simulated scene.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `integrated-simulation-pipeline` (in_progress,
    PR #265), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan
    boundary.'
- id: vlm-baseline-harness
  title: The same questions asked of a vision-language model, image only and image plus verbalised
    memory
  branch: null
  pull_request_number: null
  track: baselines
  depends_on:
  - working-memory-verbalised
  status: deferred
  notes: A harness that sends each question with the camera image, and again with the verbalised
    working memory prepended, parses the answer into the question's answer type and scores
    it against ground truth. The model sits behind an interface so the provider is one class;
    CI runs against a recorded-answer mock, and the live test is skipped without credentials.
    Each question is also run five times on the same scene to report answer variance, for
    the VLM systems and for EQL alike. Which provider and model to use is the developer's
    call and is not taken here.
  blockers:
  - 'Cross-plan: depends on icra-evidence''s `question-set-and-ground-truth` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: episode-corpus-given-whole-to-the-vlm
  title: 'The vision-language model is given the whole episode corpus: every episode''s video,
    files and transcript in one context'
  branch: null
  pull_request_number: null
  track: baselines
  depends_on:
  - vlm-baseline-harness
  status: deferred
  notes: 'What makes Experiment D''s comparison fair, and the reason a loss there reads as
    reasoning rather than lookup: every episode a question may reach over goes into one context
    - sampled video frames, the run''s files, the question-and-answer transcript - so the
    model is given everything the SQL backend can see over the same episodes. That is only
    possible with a cap, and the cap is derived rather than chosen: how many episodes fit
    once the frames are sampled to the model''s context budget. It is the baseline''s stated
    limit in the paper, and it bounds how far back a question can reach.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `episode-artifacts-recorded` (not_started),
    split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.'
- id: perception-backends-are-interchangeable
  title: A vision-language model answers a look behind the same interface the detector stack
    does, into the same twin
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on: []
  status: deferred
  notes: The sharpest demonstration that the representation is what the architecture is built
    on rather than any one perception method. A vision-language backend and a visual-question-answering
    backend implement the same interface the detector stack implements, take the same RgbdFrame,
    declare their capability in the same vocabulary, and write what they find into the twin
    as the same bodies, poses and relations - so everything above them, the routing, the control
    program, the event monitor, the episode record and the query language, is unchanged by
    the swap.
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `simulated-camera-feeds-perception` (not_started),
    which is what gives every backend the same frames; depends_on cannot cross a plan boundary.'
- id: control-constraints-and-degrees-of-freedom-queried
  title: A task is asked what it is constrained by and which degrees of freedom it used, in
    the same query language as the scene
  branch: null
  pull_request_number: null
  track: control
  depends_on: []
  status: deferred
  notes: 'The control half of the thesis, and it is a read rather than a rewrite: the motion
    statechart is already dataclasses over the same world model, so the questions are answerable
    from what it holds. What the paper asks of it - what is the constraint for inserting the
    cube, and how does it differ from the triangle''s; which degrees of freedom did the insertion
    use, and which did it fix or ignore; the same for the pick-up - are answered with the
    giskardpy constraint objects themselves, not with prose about them.'
  blockers:
  - 'Cross-plan: depends on icra-foundation''s `integrated-simulation-pipeline` (in_progress,
    PR #265); depends_on cannot cross a plan boundary.'
- id: holes-answered-as-predicates
  title: A hole is a predicate any surface can be asked about, and the board detector states
    no number of its own
  branch: null
  track: backend-routing
  blockers:
  - 'Cross-plan: needs icra-foundation''s integrated-simulation-pipeline (#265), which carries
    the detector stack and BoardDetector, and reads on the frames simulated-camera-feeds-perception
    (#298) renders; depends_on cannot cross a plan boundary.'
  notes: 'Raised by the fourth review round on icra-foundation''s simulated-camera-feeds-perception
    (#298), 2026-09-09, in the developer''s words: he does not want BoardDetector''s stated
    defaults at all -- "I want it knowledge dependent and calculable" -- and names the concepts
    under them as the real subject: "counting a specific feature on a percieved body, Hole
    related features and mechanisms, Area of a surface that may have holes", to be raised
    "to a meta level, maybe as predicates classes for each or as a generalization of a Hole
    and a Surface with Holes or without Holes detectors with capabilities".'
  depends_on: []
  status: deferred
