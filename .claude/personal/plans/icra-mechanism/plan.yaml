- id: perception-backends-are-interchangeable
  title: >-
    A vision-language model answers a look behind the same interface the detector stack does, into the same twin
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on:
  - backends-declare-their-capabilities
  status: not_started
  notes: >-
    The sharpest demonstration that the representation is what the architecture is built on rather than any one perception method. A vision-language backend and a visual-question-answering backend implement the same interface the detector stack implements, take the same RgbdFrame, declare their capability in the same vocabulary, and write what they find into the twin as the same bodies, poses and relations - so everything above them, the routing, the control program, the event monitor, the episode record and the query language, is unchanged by the swap. What the paper reports from this is that the same questions are answered over each, at the cost each incurs, not that one detects better. The classical stack stays the default because it is what the resource comparison is measured against. Tests answer one look through two backends over the same simulated scene and assert the twin holds the same kinds of fact either way, with a recorded-answer mock standing in for the model in CI.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `simulated-camera-feeds-perception` (not_started), which is what gives every backend the same frames; depends_on cannot cross a plan boundary.
- id: control-constraints-and-degrees-of-freedom-queried
  title: >-
    A task is asked what it is constrained by and which degrees of freedom it used, in the same query language as the scene
  branch: null
  pull_request_number: null
  track: control
  depends_on: []
  status: not_started
  notes: >-
    The control half of the thesis, and it is a read rather than a rewrite: the motion statechart is already dataclasses over the same world model, so the questions are answerable from what it holds. What the paper asks of it - what is the constraint for inserting the cube, and how does it differ from the triangle's; which degrees of freedom did the insertion use, and which did it fix or ignore; the same for the pick-up - are answered with the giskardpy constraint objects themselves, not with prose about them.

    What already exists: GiskardConstraint is a dataclass carrying its name, its constrained expression, its quadratic and linear weights and its normalization factor; ConstraintCollection holds a task's equality and inequality constraints grouped by the enforcement strategy that turns them into rows of the quadratic program; every MotionStatechartNode owns one, and NodeArtifacts.constraints is its assembled shape; coraplex's executable holds the MotionStatechart a plan node ran; and a constraint's expression answers free_variables(), which is what says which of the world's DegreeOfFreedom instances it actually touches.

    What is missing is only the reach and the naming. The collection and the statechart are private attributes, the executable keeps only the motion it is currently running rather than the one each plan node ran, and nothing names the degrees of freedom a task constrains as against the ones it leaves free - that has to be derived from the expressions' free variables against the world's own set. Give those a name and an EQL spelling and the bucket is answered. Tests ask the cube's insertion and the triangle's for their constraints and assert they differ in the named constraint rather than in a rendered string, and ask one insertion which degrees of freedom it used, asserting the ones it fixed are absent from the answer.

    Rewritten 2026-09-08 at the developer's correction: the first version of this item had the statechart's constraints *built* from queries over the twin, which has never been implemented and is a far larger task than the week holds. Building is not what the claim needs - the representation is already shared, so questioning it is what shows that.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `integrated-simulation-pipeline` (in_progress, PR #265); depends_on cannot cross a plan boundary.

- id: holes-answered-as-predicates
  title: "A hole is a predicate any surface can be asked about, and the board detector states no number of its own"
  branch: null
  track: backend-routing
  blockers:
    - >-
      Cross-plan: needs icra-foundation's integrated-simulation-pipeline (#265), which carries the
      detector stack and BoardDetector, and reads on the frames simulated-camera-feeds-perception
      (#298) renders; depends_on cannot cross a plan boundary. Both are expected to be merged into
      #265 and then into tracy_icra before this starts, per the branching change of 2026-09-09, so
      this item is cut off tracy_icra rather than off either of them.
  notes: >
    Raised by the fourth review round on icra-foundation's simulated-camera-feeds-perception (#298),
    2026-09-09, in the developer's words: he does not want BoardDetector's stated defaults at all --
    "I want it knowledge dependent and calculable" -- and names the concepts under them as the real
    subject: "counting a specific feature on a percieved body, Hole related features and mechanisms,
    Area of a surface that may have holes", to be raised "to a meta level, maybe as predicates
    classes for each or as a generalization of a Hole and a Surface with Holes or without Holes
    detectors with capabilities".

    Two halves, and the second is what makes the first honest. A hole and a perforated surface
    become things any body can be asked about -- predicates beside the ones semantic_digital_twin
    already carries -- rather than knowledge living inside one Montessori detector; and the
    detectors that answer them are a family, so the one that reads a surface's colour and the one
    that reads its depth stand beside each other rather than being two branches inside
    BoardDetector.detect. That second detector is the sibling ask on the same round (r3965517956):
    the depth is already read, but inside BoardDetector rather than by a detector of its own.

    With those in place BoardDetector states no number of its own. All five of today's defaults are
    calculable from what the twin already holds about the board: minimum_hole_count is the layout's
    own hole count, hole_size the holes' own footprints, minimum_lid_area the board's own lid, and
    minimum_hole_depth the lid-to-drawer gap #298 measured (10 mm -- drawers at z 0.553 with
    DRAWER_SCALE.z 0.06, tops at 0.583 against a lid at 0.593). seed_reach is the one that is
    genuinely about the search rather than about the board and may honestly stay a parameter.

    Much less new machinery than the round assumed, and it was checked rather than taken on trust:
    PerceptionDetector.capability(look) already states what a detector answers as an
    entity-query-language condition, DetectorChoice is already an EQLSingleClassRDR over the
    underspecified statement "a look whose detector is to be worked out", and SceneRequest is
    already that statement. All three are on #265 by way of #275 and #77. So what this item adds is
    the predicates and the detector family that answers them, not a selection mechanism.

    Tests assert the predicates against the twin rather than against a picture -- a board the twin
    cut six holes in answers six, a plain table answers none -- and then that a look at a rendered
    scene and a look at tracy_pickup_demo both find the board with BoardDetector stating no number
    of its own.
  depends_on: []
  status: not_started
