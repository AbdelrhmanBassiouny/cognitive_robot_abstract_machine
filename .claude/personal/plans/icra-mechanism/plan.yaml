- id: knowledge-ablations
  title: >-
    Each knowledge source switched off through a Condition, never through a code branch
  branch: null
  pull_request_number: null
  track: failure
  depends_on: []
  status: not_started
  notes: >-
    The memo's conditions as Condition instances: full; no working memory; no hole-shape knowledge (the board's holes unknown to the twin, which also needs the mesh scale 0.865 #236 measured to be in the twin first, so the full condition is honest); no degree-of-freedom limits (a twin edit, since DegreeOfFreedomLimits lives on the twin's own DegreeOfFreedom and the controller reads it there); no pickup detection; no predicate-narrowed perception. Each condition removes one thing the action reads from the twin or the backends, so the action's code has no ablation flags of its own. A test per condition asserts the knowledge really is absent (the query that would read it fails or returns nothing).
  blockers:
