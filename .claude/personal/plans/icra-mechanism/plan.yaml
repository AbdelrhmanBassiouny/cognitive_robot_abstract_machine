schema_version: 1
id: icra-mechanism
title: 'ICRA experiments: what the paper measures'
description: >-
  The mechanism wave of icra-experiments (split 2026-09-05 for the plan size budget -- see plan-size-limits' roadmap.md for why). Refocused 2026-09-08 on what makes the architecture one system rather than on any one subsystem's quality: backends of every kind - the twin, a detector stack, a vision-language model, physics, SQL - declare what they answer in the same vocabulary and are interchangeable behind it; the control program reads that same representation as the constraints of its optimization and reports back into it; and snapshot working memory, typed and predicted failure and the verbalised-memory/VLM baselines rest on both. Everything here stacks on icra-foundation's integrated pipeline, scenario model and episode recording, and one item stacks on icra-evidence's question set; those depends_on edges could not cross the plan boundary and are recorded as blockers instead (see roadmap.md).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 252
waves:
- id: mechanism
  name: What the paper measures
  description: >-
    What makes the subsystems one system: capability declaration and per-predicate routing across interchangeable backends, a control program whose constraints are queries over the same knowledge, physics as one more answerer of the same predicates, the snapshot working memory the agency questions rest on, failure typing and prediction, and the baselines the experiments compare against.
tracks:
- id: backend-routing
  name: One representation, interchangeable backends
  wave: mechanism
  description: >-
    Lane 1. Backends of every kind declare what they can answer in one vocabulary, a statement is routed per predicate by capability and knowledge state, a perception backend can be a detector stack or a vision-language model without anything above it changing, derived facts are verified in a physics copy of the world, and working memory is a snapshot refreshed only when it is worth refreshing.
- id: failure
  name: Typed and predicted failures
  wave: mechanism
  description: >-
    Lane 2. The failure taxonomy, typing from evidence, prediction from the query result before execution, and the knowledge ablations and perturbations that produce failures on purpose.
- id: control
  name: The control system answers for itself
  wave: mechanism
  description: >-
    Lane 1. The control program is already dataclasses over the same world model, so it is asked what it was constrained by and which degrees of freedom it used in the same query language as the scene - a read over what the motion statechart already holds, not a change to how a motion is built.
- id: baselines
  name: Verbalised memory and the VLM baselines
  wave: mechanism
  description: >-
    Lane 3. The deterministic English rendering of working memory, and the harness that asks a vision-language model the same questions with and without it.
items:
- id: backends-declare-their-capabilities
  title: >-
    Every query backend declares what it can answer, as an EQL condition plus preconditions on the twin
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on: []
  status: not_started
  notes: >
    The capability table the memo publishes, as code rather than a table written by hand, and the
    joint the whole architecture turns on: QueryBackend gains capability(), the same shape #231 gave
    detectors, stating the predicate and statement forms the backend answers and the precondition on
    the knowledge state under which it answers them. Every kind of answerer declares in that one
    vocabulary - the native twin backend for a body already believed in, a perception backend for a
    pose that has to be looked at, the SQL backend for anything about a past episode, physics for a
    derived physical fact, the motion statechart for what the controller is currently constrained
    by, and a vision-language or visual-question-answering backend for whatever it claims to answer.
    That last is what makes the vision-language model a backend rather than only a baseline, and it
    is why the declaration is a capability rather than a class name. Rendering the declarations is
    what prints the paper's table. Tests pin one declaration per backend against a statement it
    accepts and one it refuses.

    Amended 2026-09-09, from the fourth review round on icra-foundation's #298, and it is narrower
    than it sounds because the detector half already exists. PerceptionDetector.capability(look)
    already states what a detector answers as an entity-query-language condition, DetectorChoice is
    already an EQLSingleClassRDR over the underspecified statement "a look whose detector is to be
    worked out", and AttributeEqualityToLiteral.read_from already reads an equality about the
    selected variable's own attribute back out of a condition -- all three on #265 through #275 and
    #77. What this item takes on top of raising that shape from detectors to every query backend is
    two things the developer asked for in as many words: a capability that names "specific fields of
    specific classes as well, and this can be specified using EQL Attributes or MappedVariable in
    general instead of writing a field string name", so a backend answers "I can supply at least
    that field" against a description that says which field it wants; and the helper that fills an
    underspecified description out from the model, so that an asker naming a class -- his example is
    a MontessoriBoard -- has the features the twin already knows about one added to the description
    before any backend is chosen. Nothing does that second one today.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `integrated-simulation-pipeline` (in_progress, PR #265), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
- id: query-routed-per-predicate
  title: >-
    A statement is routed per predicate by capability and knowledge state, and the routing is reported
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on:
  - backends-declare-their-capabilities
  status: not_started
  notes: >-
    The mechanism the thesis sentence names. A planner splits a statement into its predicates, assigns each to the backend whose capability admits it under the current twin state, orders them twin first, then perception for what the twin cannot answer, then physics for derived facts, and falls back to the next capable backend when one refuses. It returns a QueryPlan beside the answer: per-predicate assignment, detector calls, region searched and latency, which is exactly what Experiment B tabulates. #238 already does this implicitly for one statement (the lid and the hole are answered from the twin before the look); this item makes it general and visible. The mixed statement "the cyan piece left of the triangle on the table", with the triangle believed in versus not, is the test.
- id: physics-verification-backend
  title: >-
    Perceive, commit, verify: detections spawned into a physics copy of the world and derived facts re-evaluated there
  branch: null
  pull_request_number: null
  track: backend-routing
  depends_on:
  - backends-declare-their-capabilities
  status: not_started
  notes: >-
    A backend that spawns what perception reported into a copy of the world, steps MuJoCo, and evaluates the derived predicates there: Stable, contact and penetration, InsideOf, the directional relations and Reachable, all of which #229 already made predicates. It reports agreement or disagreement with the perception backend per fact, never re-checking the committed pose itself. This is the narrow form of knowledge-directed-perception's imagination-world item, built here because the paper measures it; that plan's item is noted as covered by this one. Tests inject a floating piece, a penetrating piece and a wrongly classified piece and assert each disagreement fires. Its place in the argument narrowed 2026-09-08: it is one more backend answering the same predicates from a different source, which is the integrative point, and it moved off the critical path - if the week runs short it is cut before anything in the memory or control tracks.
- id: snapshot-working-memory
  title: >-
    Working memory as a snapshot: the twin follows kinematics while acting and re-perceives only when idle and changed
  branch: claude/plan-item-kickoff-icra-snapshot-f69vef
  pull_request_number: 301
  track: backend-routing
  depends_on: []
  status: in_progress
  session: https://claude.ai/code/session_018u8WnZp55ZMNsZRZizhiyk
  notes: >-
    During manipulation the grasped piece moves with the gripper through the attachment #169 restored, and perception is not consulted. When idle, a look is taken at a low rate and a piece's pose is committed only when it differs from the believed pose by more than a threshold measured as three standard deviations over a static scene. The threshold is measured in simulation first and again on the robot, both numbers recorded. Fits the frame budget the continuous node cannot: #236's layout fit costs 0.56 s per frame against the node's 0.5 s period, which is fine at idle rate. This is also where the agency questions get their answer: because the twin follows the gripper's kinematics while the robot acts and re-perceives only when something changed while it was idle, the record distinguishes a piece the robot moved from a piece that moved on its own, which is what "did it move, and did you move it" asks and what a single image cannot hold. Working memory carries no level of its own in Bloom's taxonomy, and that is the paper's point rather than a gap in it - see roadmap.md.
  blockers:
  - >-
    Cross-plan: depends on icra-foundation's `simulated-camera-feeds-perception` (not_started), split out of icra-experiments on 2026-09-05; depends_on cannot cross a plan boundary.
