- id: bastler-config-shim-slimming
  title: 'Bash→Python 7: slim the sourced config file to constants'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - bastler-save-commands-python
  - bastler-save-plan-python
  - bastler-session-start-python
  - bastler-setup-checks-python
  - bastler-dashboard-refresh-python
  notes: |-
    `resolve-personal-notes-config.sh` keeps its sourcing contract - ten documentation locations plus
    `ci.yml` twice source it for its variables and its cd-to-root side effect, so no `SKILL.md` change
    is mandatory by construction - but shrinks to the cd preamble, the three `NOTES_*` resolutions, the
    path constants and the pure-string path helpers. The behavioural functions are deleted once a grep
    of every `.md` confirms no prose instructs a session to call them.

    The residual bash/Python duplication of the precedence rules is guarded by a CI consistency test
    holding the sourced variables equal to the package's own configuration output. That test has **two**
    Python copies to hold equal, not one: `stack.py` already reimplements the same precedence, and its
    own docstrings concede as much. `plan_item_bootstrap.py` deliberately adds no third - it sources the
    shell file and calls its fetch function rather than restating the rules.
- id: bastler-github-api-unification
  title: 'One github backend: the gh-CLI-else-token rule implemented once'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - bastler-notes-core-python
  notes: |-
    `github-api.sh` (decision 9, arriving with #107) and `pr_state` (arriving with #111) implement the
    same gh-CLI-else-token-and-curl dual-backend rule twice - the strongest concrete duplication on
    record in this work. `.claude/stack/maintenance.py` makes the same calls a third time, in `urllib`
    rather than `curl`; its own review asked directly why not `gh` and why not a GitHub Python library,
    and both were deferred here rather than answered there, since adding a third copy of the rule, even
    a better one, is what this item exists to stop. One `github_backend.py` implements it once and
    `github-api.sh` becomes a shim. Scope-boxed to the backend rule, not the callers' features.

    So this item owns one decision beyond the extraction: **which backend all three converge on.** `gh`
    is absent from a session container and present on Actions runners; PyGithub would be the natural
    client but is a dependency. The question is the same for all three carriers and is answered once
    here. `upstream-review-reader` is evidence for it rather than a fourth carrier - it needed the same
    access, chose `gh api graphql` because its Actions context guarantees it, and an Actions-only caller
    can already assume `gh`.

    Two of its three recorded dependencies now live in other plans and are dropped from `depends_on`:
    `setup-personal-notes-script` (`stack-tooling-install`) and `shared-pr-state-chips`
    (`plan-dashboards`). Both are still real preconditions - they are the carriers this unifies - and
    are recorded as blockers instead.
  blockers:
  - 'Cross-plan dependency, not representable in depends_on: needs setup-personal-notes-script (#107,
    stack-tooling-install), which brings github-api.sh - one of the two carriers this item unifies.'
  - 'Cross-plan dependency, not representable in depends_on: needs shared-pr-state-chips (#111, plan-dashboards),
    which brings pr_state - the other carrier this item unifies.'
