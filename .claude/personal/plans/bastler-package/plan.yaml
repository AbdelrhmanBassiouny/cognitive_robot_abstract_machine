- id: bastler-session-start-python
  title: 'Bash→Python 4: session-start behind an inert probing shim'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - bastler-notes-core-python
  notes: |-
    `session-start.sh` keeps its path, so `settings.json` stays byte-identical, but its body becomes the
    one guarded shim: `command -v python3` plus a >= 3.11 version probe, exiting 0 with a single
    diagnostic line when absent, so the hook stays inert on machines without python3. The floor raise is
    user-accepted - every targeted environment ships 3.11 or later.

    `session_start.py` reproduces the stdout summary and every written marker byte-for-byte, pinned by
    golden-output fixtures recorded from the bash version before deletion. The `tracking_issue` grep
    pipeline that kills the hook under `pipefail` when the field is absent - found by #121's first
    session-start tests - becomes a `re.search` returning `None`.

    Its two recorded dependencies, `session-start-plan-and-setup-guards` and
    `git-identity-from-personal-notes`, are merged and now live in the `session-notes-infrastructure`
    plan, so they are dropped from `depends_on`; what mattered about them is that their
    `run_hook_script` subprocess tests carry over here as the shim contract tests rather than colliding.
- id: bastler-setup-checks-python
  title: 'Bash→Python 5: check-setup as typed rows'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - bastler-notes-core-python
  notes: |-
    `check-setup.sh` becomes a shim over `setup_checks.py`: `SetupCheckIdentifier` and
    `SetupCheckStatus` StrEnums, a frozen `SetupCheckRow`, and a `SetupReport` preserving the exact TSV
    row order and exit-code semantics, which are external API for `/setup-personal-notes` and
    `prerequisite-check.md`. The parsing enums the test file already defines move into the production
    module and the test imports them instead.

    Two fixes ride along: the `settings.json` check parses the JSON and verifies a `SessionStart` hook
    command rather than grepping for a substring anywhere in the file, and the inline `python3` heredoc
    becomes a `missing_requirements()` call through `importlib.metadata`. Runs parallel to the other
    conversions off the core item.
