schema_version: 1
id: probabilistic-knowledge-perception
title: Probabilistic knowledge-guided perception
description: A follow-up to the knowledge-directed-perception programme, deliberately outside
  the ICRA deadline. That programme shows that a robot which knows what it is looking at perceives
  better; this plan asks by how much, on a scale where the answer means something. Today a
  belief can only delete a rival candidate, so knowledge is permission to consider a piece
  rather than evidence for it - a believed piece that fits slightly worse than a ghost still
  loses.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 276
waves:
- id: evidence
  name: A belief on the same scale as the picture
  description: 'One question, asked in the order that can answer it: measure first, on the
    captures the grounding wave already ships, and only build the mechanism the measurement
    supports.'
tracks:
- id: decision
  name: What decides a detection
  description: The rule that turns accounts of a place into a report, and the quantity it
    compares.
  wave: evidence
items:
- id: belief-counts-as-evidence
  title: Let a belief count as evidence for a candidate, not only as permission to consider
    it
  branch: null
  pull_request_number: null
  track: decision
  depends_on: []
  status: not_started
  notes: 'Two halves, in order, with a decision between them. The prototype comes first and
    is a measurement, not a feature: on the six captures `montessori-perception-split/perception-node-on-main`
    ships, label every place-and-account pair the pipeline already forms, and ask whether
    `Explanation.strength` can be mapped monotonically onto a log-likelihood ratio that separates
    real pieces from ghosts better than a level on the raw score does. Held out, since six
    captures fitted and evaluated on themselves would only be `required_lead` re-tuned with
    more steps.'
