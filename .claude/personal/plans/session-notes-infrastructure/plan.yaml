schema_version: 1
id: session-notes-infrastructure
title: 'Personal notes and the session-start hook: the state a session is handed before it
  acts'
description: The personal-notes branch and the SessionStart hook that reads it. What a session
  is given at start - a fresh base, the right git identity, the local settings, the plan its
  branch belongs to, and a setup verdict - and the conventions those carry, each made a mechanism
  rather than a line of prose someone has to remember.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: slimming
  name: What the notes branch holds
  description: Getting the personal-notes branch down to conventions and data, and retiring
    what it superseded.
- id: handover
  name: What a session starts with
  description: 'The hook''s own work: the base, the identity, the settings, the plan, the
    setup verdict.'
- id: conventions
  name: Conventions that became mechanisms
  description: Standing rules that stopped being prose a session had to remember.
tracks:
- id: slimming
  name: Notes-branch slimming
  wave: slimming
- id: handover
  name: Session start
  wave: handover
- id: conventions
  name: Conventions made mechanical
  wave: conventions
items:
- id: fresh-base-at-session-start
  title: Fast-forward the fork's default branch at session start
  branch: claude/fork-main-upstream-sync-mtrzpr
  pull_request_number: 188
  status: in progress
  session: https://claude.ai/code/session_01DmexEkCHmVuQjanQpsHX4F
  track: handover
  depends_on: []
  notes: 'Raised by the user. Sessions are cut from the fork''s default branch, so a fork
    that has drifted behind upstream makes every session in that clone plan and implement
    against a stale base - invisibly, because the clone is consistent with itself. Live when
    it was raised: the fork''s main was 86 commits behind and that session''s branch was cut
    from exactly that commit.'
- id: setup-runs-without-asking
  title: Run the personal-notes setup from the planning skills instead of asking first
  branch: claude/auto-run-setup-notes-02nhxv
  pull_request_number: 156
  status: in progress
  blockers:
  - Two outdated review threads on plan-item-resolve/SKILL.md, a deferral to
  - The review thread on the guard's global constants is answered in a conversation comment
    (an inline reply is rejected while the owner has a pending review) and left open for the
    owner.
  session: https://claude.ai/code/session_01RydZutnNtFBYeT73Qt4Bxv
  track: conventions
  depends_on: []
  notes: 'Every planning skill defers its step 0 to one shared document, which told the session
    to run the setup check and then *ask* whether to run `/setup-personal-notes`. So a clone
    missing any part of the setup - in practice every fresh container, where the dashboard
    dependencies are never installed - opened every planning invocation with a yes/no question
    before doing any of the work asked for. The gate is gone: state what is missing, invoke
    the skill, re-run the check, carry on.'
- id: always-read-upstream-reviews
  title: Read upstream review threads whether or not the fork pull request is labelled
  branch: claude/plan-item-kickoff-workflow-y2xfva
  pull_request_number: 194
  status: in progress
  session: https://claude.ai/code/session_01Cs9MvTBPS4hsd1HJimooVy
  track: conventions
  depends_on: []
  notes: Read upstream review threads whether or not the fork pull request is labelled. No
    detail was recorded on this item beyond its title before the split; the pull request is
    the record.
