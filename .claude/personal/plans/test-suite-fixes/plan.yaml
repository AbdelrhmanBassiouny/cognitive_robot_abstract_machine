  status: not_started
  notes: 'Every unittest-based module outside test_eql_rdr: test_ripple_down_rules and parts
    of test_eql. Raised by the #159 review''s "all tests everywhere should be pytest"; the
    test_eql_rdr half landed on #67 and #98 while they were still unlanded, and this is the
    rest. Deliberately off main rather than stacked: it touches files the D-core stack does
    not, so stacking it would add a seventh cascade for nothing. Not started.'
