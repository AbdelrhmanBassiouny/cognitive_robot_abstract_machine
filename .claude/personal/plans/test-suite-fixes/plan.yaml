items:
- id: mcrdr-stop-only-flaky-skip
  title: Extend the flaky-test skip to test_rdr_alchemy's test_fit_mcrdr_stop_only
  branch: claude/mcrdr-stop-only-flaky-skip
  pull_request_number: 189
  track: flaky-handling
  depends_on: []
  status: deferred
  session: https://claude.ai/code/session_01LeZ4Mkr4tfdKjvEcJrz32C
  notes: 'Closed unmerged 2026-08-22, branch kept. It proposed extending a skip that should
    never have existed. A 900-run sweep over `PYTHONHASHSEED` — both siblings and the whole
    class — passed every time, and the real cause was in the history instead: b25353559 (2026-07-15)
    fixed every `.py` fixture''s answer delimiter, which used double quotes while `experts.py`
    has always split on single ones, so the loader silently returned one answer instead of
    eighteen and the run fell through to a live prompt. Reproduced by restoring the pre-fix
    fixture.'
- id: pytest-conversion-sweep
