  - id: stack-tooling-on-main
    branch: claude/stack-tooling-on-main
    title: "PR 1: stack workflow tooling on main (.claude/stack/)"
    pull_request_number: 106
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101]
    status: done
    session: https://claude.ai/code/session_01Y9egTHHu5RTXmkFL4SwXM9
    notes: >
      Implemented as draft PR #106 (2026-07-29): stack.py ported to .claude/stack/ minus the
      round-robin/WIP-cap subsystem, per-user config layering from the personal-notes branch,
      canonical ROUTINE.md + 1-page README, tests via ScratchRepository; restack.js and board
      rendering not ported (board deferred to PR 3/PR 4 as planned). Landed as plain scripts — the
      dev-tooling Python package is created in PR 3 instead (see bastler-package).
      Self-reviewed and un-drafted since: open and ready, so it unblocks its dependents by the
      plan's normal open-and-ready rule. Now also the parent of #107, which was restacked onto it
      (2026-07-30) so the upstream wave is a linear chain rather than two siblings on #101.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): before review goes deep, add one
      trim commit — (a) read stack structure from the stacks REST API when the PR is a stack member,
      keeping PR-base derivation as the fallback for preview-less repos; (b) ROUTINE.md merge
      doctrine becomes merge-async + poll only, never the classic merge API or the MCP merge tool on
      a stack member, with stack base.sha lagging the trunk head as the needs-cascade signal; (c)
      Phase 1 REPARENT must special-case stack members — PATCH base 422s on them ("Cannot change the
      base branch because the pull request is part of a stack"), so reparent via unstack → PATCH
      base → re-stack, or leave it to gh stack sync / the UI Rebase-stack button. (c) is
      load-bearing before the next cram2 landing of any stacked branch: stack #112 already exists on
      the fork. Upgraded to a cut the same day (user decision, "decision 11" in the roadmap): the
      restack subsystem (restack-plan, next, status/structure derivation) is removed from the PR
      entirely rather than trimmed — native stacks own structure, gh stack / the Rebase-stack button
      own cascading, and the preview-less-repo fallback is YAGNI (the preview is account-wide; the
      old tooling branch remains as a tagged archive). The PR keeps: ROUTINE.md rewritten around
      native mechanics (incl. the Phase-1 reparent special case and merge-async doctrine),
      stack.toml + per-user config layering, the label/cram2-link helpers, a small reparent-recovery
      script, and tests. Re-scope instruction posted on the PR itself. Assessed 2026-08-02 against
      #110 (see roadmap): the two are split correctly, but three artifacts had been built twice.
      This PR keeps all of them by landing first. Shipped here (36eda87a): `stack.py remotes`
      becomes `configuration`, printing one `field<TAB>value` line per Configuration field instead
      of four hand-written hyphenated keys, with `upstream_setup_command` moved onto Configuration
      and omitted when the remote already exists. That makes this PR's command surface and #110's
      independently-built `config` one surface, so #110's rebase deletes the resolution internals
      only. 286 CI tests pass, was 283. Description updated to match. Re-scoped again 2026-08-02
      (user-approved, session_01BByQFT6he8xf5qvBWtyUPV): the doctrine becomes a skill and the
      recipes become subcommands. ROUTINE.md is deleted;
      .claude/skills/stacked-pr-maintenance/SKILL.md carries the doctrine, is invocable as
      /stacked-pr-maintenance from any session, and is what POINTER.md's registered block now
      resolves and runs. Context resolution is arguments first (fork=/upstream=, passed through as
      configuration --fork/--upstream, so nothing is inferred when both are given), then stack.py
      configuration, then - only interactively - an AskUserQuestion whose answer is persisted to
      .claude/personal/stack.toml on the personal-notes branch; --non-interactive turns that
      question into a stop, which is what a scheduled run needs given its own rule against opening a
      discussion. Landed as one commit on this branch (e20b0bb4) rather than as a child PR: every
      path it touches is absent from main, so by the scope rule nothing standalone would have
      remained, and shipping a ROUTINE.md that its successor deletes would change the live doctrine
      twice - the pointer resolves origin/main first. Four new stack.py subcommands, each replacing
      a rule a reader had to remember: labels (the complete set a label write must send, computed
      from the current labels), preflight (refuses a wrong checked-out branch, a mismatched refspec,
      a non-fork destination, and the child-becomes-ancestor-of-parent false merge; exit 5),
      promotion-link (owns the compare URL's encoding and length limit), and reparents/landed (phase
      1 derived from git ancestry rather than pull-request state). 331 tests pass, was 294. An MCP
      server was considered and rejected: the raw PATCH base change 403s on the session git-proxy
      credential, so a local server could not own the riskiest operation, and subcommands survive
      routine-cutover's no-LLM endgame. Decision 11's half-applied cut is deliberately not
      completed: print_next and print_restack_plan are kept, because phases 2 and 3 call them and
      they are the derivation half of the scripts-over-prose choice made here. print_restack_plan's
      docstring no longer names "the restack workflow's args". One review thread stays open by
      design - stack.toml:23, the remote inference. The skill answers its interactive half; the
      remaining caller is a non-interactive run with no arguments on an unconfigured checkout, so
      the ~120-line deletion is still #110's, alongside the setup that writes fork_repository.
      Replied on the thread and on #110 rather than resolving it. stack.py:84 (from_remote_url
      parses without validating) also remains open and dies with the same deletion. Review round
      2026-08-02 (25 comments) applied in 8b7435bb; three decisions were the user's, each taken
      after the options were costed. (1) GitHub marks a pull request merged - not closed - the
      moment its head becomes an ancestor of its base, proven from live data: #101, #103 and #105
      all carry merged_at 2026-07-31T10:36:43Z, the second fork main fast-forwarded, and two carry
      no merged label. So the label-then-close step was duplicating the fast-forward and is deleted,
      the merged label with it; landed becomes a report. The fast-forward moves after the reparent
      sweep, because auto-detection only fires for a pull request whose own base moved. (2) The
      skill never writes code: a conflict it cannot merge cleanly, or a red check, is reported to
      the branch's owner and skipped. That removed every krrood, ormatic, coraplex and
      semantic_digital_twin mention, so the instructions are now repo-generic. A conflict it does
      resolve while restacking must be reported in a comment. (3) POINTER.md, prompt_model.py and
      test_prompt_documents.py are deleted - the registered prompt is a skill call now, so the
      duplication the prose tests guarded no longer exists. One test survives, that the skill names
      no fork of its own: an absence computed from live configuration rather than a sentence
      asserted against a document. 313 tests pass, was 331; the difference is exactly those 18 prose
      assertions. Consequence to carry: the HARD RULES no longer bind before the first file is read,
      which reverses design decision 4. Flagged to the user on the PR rather than buried - the
      window is now one turn, and routine-cutover deletes the scheduled run anyway. Also: commands
      are a Command StrEnum with a needs_a_board property; a pre-flight refusal carries a
      RefusalReason so callers act on which refusal rather than its wording; BranchMove is
      ProposedCommitMove; label tests read their labels from the configuration that defines them;
      promotion writes its compare link into the fork pull request's description so it outlives the
      summary. Settled 2026-08-02 (user decision): stack.py is not split in this PR. It stays ~1,540
      lines here and bastler-package does the surgery once, when it moves every .claude/
      Python file into the package - rather than twice, with #110 and #111 rebasing across the first
      attempt. The review comment that raised it stays answered rather than resolved. Manual step
      still due: register the routine's prompt as a call to /stacked-pr-maintenance with fork=,
      upstream= and --non-interactive. Until this lands on main the skill cannot be invoked by name
      from a fresh clone, so the prompt must read the file from a ref until then. Resolved
      2026-08-04 (session_01F6tM5mDZr5pTB37UgBV6N5): CI in upstream cram2 failed
      test_the_skill_names_no_fork_of_its_own with ForkRemoteNotFoundError - the checkout topology
      of a cross-fork PR's base-repo CI run (only origin, pointing at cram2 itself) has zero fork
      candidates, which load_configuration() treats as an error. Not new - #110 already hit and
      fixed the identical bug when it removed the remote inference; its fixed test computes
      candidate forks directly from the checkout's remotes and tolerates zero of them, using only
      symbols already in #106's stack.py. Ported that fix back to this branch verbatim (b3e240e6)
      rather than waiting on #110's rebase, since #106 is the parent and runs in this topology once
      promoted. Verified against a scratch clone whose only remote is cram2 (reproduces the exact
      reported traceback pre-fix, passes post-fix) plus the full test_claude_dev_tooling scope (321
      tests, no regressions). See roadmap.md for the full writeup. Merged into fork main
      2026-08-05T14:10:36Z (merged_by AbdelrhmanBassiouny, head b3e240e6 - the fork-resolution fix's
      own commit). Verified by presence on fork main rather than from the merge notification alone:
      .claude/stack/stack.py, .claude/skills/stacked-pr-maintenance/SKILL.md and
      .claude/stack/tests/test_maintenance_skill.py all git cat-file -e clean on origin/main. This
      is the fork-internal merge only - the separate cram2 promotion (the PR's own "Promote"
      compare-and-create link) is still a manual step, so routine-cutover's gate ("PR 1 on
      cram2/main and fork main fast-forwards") is not yet met by this alone. Unblocks
      #107/#110/#111/#139, all based on this branch, to rebase onto main. The only CI red on this PR
      at merge time was test_each_lib (giskardpy)'s test_pacer.py::test_with_executor - a
      physics/timing assertion unrelated to this PR's 11-file .claude/-only diff, matching this PR's
      established pattern of unrelated robotics-stack flakes; test_claude_dev_tooling itself was
      green.

  - id: setup-stacked-prs-skill
    branch: claude/setup-stacked-prs-skill
    title: "PR 2: /setup-stacked-prs guided one-command setup skill"
    pull_request_number: 110
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01QurCwih1r6STYtP34bpJpf
    notes: >
      Mirrors PR #101's pattern (read-only check-stack-setup.sh + guided skill +
      prerequisite-check.md) and #107's script/skill split. Two install modes: native (tooling on
      the target repo's main) and fork-overlay (a never-merged tooling branch on the user's fork;
      re-running is the updater). Creates missing labels, writes personal stack.toml, emits the
      Routine prompt. Based on claude/setup-personal-notes-script (#107) rather than #106, because
      setup-stacked-prs.sh:44 sources github-api.sh, which exists on no other branch; #107 already
      carries all of #106, and git merge-tree gives the identical conflict set either way, so the
      base costs nothing and keeps decision 10's one-linear-chain property. Scope assessed
      2026-08-02 and confirmed separate: removing this item's edits to #106's files leaves ~2,645
      lines of standalone setup infrastructure, so it is ordinary stacking, not a disguised
      modification of its parent.

      Rebased onto #106's review round 2026-08-03 (eecd765d + b9f8f752), which is what the
      2026-08-02 instruction list called for; that list is now consumed and is not re-recorded
      here. Five files conflicted, all under .claude/stack/, every one resolved in favour of the
      parent: ROUTINE.md's delete accepted, this branch's routine-prompt.md deleted as a duplicate
      of the skill's, stack.py's config/print_config/BOARD_FREE_COMMANDS dropped for #106's
      configuration, stack.toml and test_stack.py taken from the parent. The one thing this branch
      had that its parent did not survives: cram2_link_sent_label, without which a fresh fork's
      first promote writes a label nobody created.

      One real defect rather than a no-op, found by reading the script rather than reasoning about
      the deletions: check-stack-setup.sh:51-55 required STACK_ROUTINE_DOCUMENT and
      STACK_ROUTINE_PROMPT_FILE and :62 reported them present by name, both pointing at files that
      exist nowhere - so the check reported needs-setup on a correctly installed checkout. Both
      constants now resolve to .claude/skills/stacked-pr-maintenance/, written failing first. That
      fixed fork-overlay for free: OVERLAY_FILES already listed both, so an overlay was about to
      ship tooling with no instructions.

      The ~120-line remote inference is deleted, closing #106's two deliberately-open threads
      (stack.toml:23 and stack.py:84, both replied to and resolved). AmbiguousForkRemoteError is
      gone because ambiguity is unreachable once the fork is named; ForkRemoteNotFoundError becomes
      ForkRepositoryNotConfiguredError at the same exit 4, so the maintenance skill's step 0 keeps
      the status it keys on. RemoteResolution is symmetric now - a missing fork remote yields a
      git remote add command exactly as a missing upstream already did, which is what lets setup
      run before either remote exists. Setup writes fork_repository at install time and merges the
      override file rather than replacing it: both writers exist now, and a whole-file write
      silently discarded whichever ran first (a defect nobody had recorded). --fork/--upstream take
      an owner/name, a URL, or a remote.

      408 tests pass across the three directories CI runs, was 334 on this branch before the
      rebase. Scratch fixtures now build their bare repositories at paths naming an owner/name and
      address them as file:// URLs - not cosmetic: remotes are matched by the repository their URL
      names, and a bare local path deliberately names none. Verified live in this clone: the
      stack_tooling_files row reads ok, configuration exits 4 naming both ways to answer, and
      resolves when told. Still unverified, same reason as #107: live label creation, exercised
      only through a stub because this environment's token is a fine-grained installation token.

      Merged its base a second time 2026-08-05 (44df7fdb), after main moved a long way beneath it
      - #106 landed there, along with #109, #115 and #119. Conflicts were .gitignore and
      tests/scratch_repository.py, both the benign additive shape: two independent blocks in the
      first, two different methods added at the same place in the second (notes_branch_commit here,
      update_notes_branch_file from main). Base stays #107 - github-api.sh is still not on main,
      re-checked rather than assumed.

      One integration break the conflict markers did not show, which is the part worth carrying:
      test_personal_settings_sync.py arrives from main and installs the hook scripts it calls, but
      this branch made write-personal-notes-file.sh delegate to write-branch-files.sh - a
      transitive dependency that does not exist on main. Two tests went red only after the merge,
      with "No such file or directory". Resolving the markers alone would have left the suite
      broken; the fixture installs it now. 433 tests pass, was 408.

      Merged its base a third time 2026-08-10 (44df7fdb to 5d3cf34b), pushed by another actor
      rather than this session - a clean fast-forward, so nothing of the rebase was lost, verified
      by ancestry rather than from the notification. main had moved 203 files and ~25,700 lines
      beneath it (#516 rdr-backward-inference, #525 world_specification_fresh_worlds, #508
      stretch_real_demo among them). Re-ran the whole suite rather than trusting the merge, since
      the second merge had already produced exactly this surprise: 463 tests pass, was 433, the
      difference being main's own new tests. check-stack-setup.sh's stack_tooling_files row still
      reads ok, so the defect this item fixes survives both merges. test_claude_dev_tooling green
      on the new head, mergeable_state back to unstable, needs-resolution left for the maintenance
      pass to clear itself rather than raced. Description brought current: 463 tests, and the two
      base merges recorded on it.

      One CI red on that head is worth carrying beyond this item, because it blocks every pull
      request in the repository rather than this one: test_each_lib (robokudo) fails during uv
      sync, before any test runs, because greenlet 3.5.5 was published to PyPI with wheels for
      macOS and Windows only. greenlet is pinned nowhere here, so it resolves fresh on every job
      on every branch. Not this branch's by construction either - its entire non-.claude/ diff
      against main is a 4-line .gitignore addition, touching no dependency manifest. Nothing
      pushed for it; the mechanical workarounds are constraining greenlet below 3.5.5 or the
      tool.uv.required-environments entry uv itself suggests.

  - id: stack-maintenance-executor
    branch: claude/plan-item-kickoff-workflow-koufa6
    title: "Deterministic maintenance executor: board, fast-forward, restack, run-report"
    pull_request_number: 139
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: done
    session: https://claude.ai/code/session_014E9nB1MUvm4jwgC2UTN5GT
    notes: >
      User's proposal, 2026-08-03: automate the stacking pass with a deterministic script that
      fetches the relevant pull requests, performs the git commands, and reports everything - less
      work for the session running the skill, and more reliable. The gap is real and was verified
      rather than assumed: grep -n "git push" over stack.py's 1,600 lines returns nothing. stack.py
      is read-only derivation only, so every fetch, merge, rebase and push in the workflow is
      performed by a session following prose, and board.json is hand-assembled from MCP output - the
      same hand-assembled-input failure class as #119, where a dropped field was indistinguishable
      from a legitimate one.

      Four commands in a new module (.claude/stack/maintenance.py + its own test module), so the
      only edits to #106's files are the SKILL.md steps and the dispatch wiring: board --write
      (fetches the fork's open pull requests itself), fast-forward (step 2, refusing a
      non-fast-forward rather than forcing), restack (drives restack-plan, runs preflight before
      every push, never force-pushes without the rebase label, reporting per branch pushed /
