  - id: stack-tooling-on-main
    branch: claude/stack-tooling-on-main
    title: "PR 1: stack workflow tooling on main (.claude/stack/)"
    pull_request_number: 106
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101]
    status: in_progress
    session: https://claude.ai/code/session_01Y9egTHHu5RTXmkFL4SwXM9
    notes: >
      Implemented as draft PR #106 (2026-07-29): stack.py ported to .claude/stack/ minus
      the round-robin/WIP-cap subsystem, per-user config layering from the personal-notes
      branch, canonical ROUTINE.md + 1-page README, tests via ScratchRepository; restack.js
      and board rendering not ported (board deferred to PR 3/PR 4 as planned). Landed as
      plain scripts — the dev-tooling Python package is created in PR 3 instead (see
      dev-tooling-python-package). Self-reviewed and un-drafted since: open and ready,
      so it unblocks its dependents by the plan's normal open-and-ready rule. Now also
      the parent of #107, which was restacked onto it (2026-07-30) so the upstream wave
      is a linear chain rather than two siblings on #101.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): before review goes
      deep, add one trim commit — (a) read stack structure from the stacks REST API
      when the PR is a stack member, keeping PR-base derivation as the fallback for
      preview-less repos; (b) ROUTINE.md merge doctrine becomes merge-async + poll
      only, never the classic merge API or the MCP merge tool on a stack member, with
      stack base.sha lagging the trunk head as the needs-cascade signal; (c) Phase 1
      REPARENT must special-case stack members — PATCH base 422s on them ("Cannot
      change the base branch because the pull request is part of a stack"), so
      reparent via unstack → PATCH base → re-stack, or leave it to gh stack sync /
      the UI Rebase-stack button. (c) is load-bearing before the next cram2 landing
      of any stacked branch: stack #112 already exists on the fork.
      Upgraded to a cut the same day (user decision, "decision 11" in the roadmap):
      the restack subsystem (restack-plan, next, status/structure derivation) is
      removed from the PR entirely rather than trimmed — native stacks own
      structure, gh stack / the Rebase-stack button own cascading, and the
      preview-less-repo fallback is YAGNI (the preview is account-wide; the old
      tooling branch remains as a tagged archive). The PR keeps: ROUTINE.md
      rewritten around native mechanics (incl. the Phase-1 reparent special case
      and merge-async doctrine), stack.toml + per-user config layering, the
      label/cram2-link helpers, a small reparent-recovery script, and tests.
      Re-scope instruction posted on the PR itself.

  - id: setup-stacked-prs-skill
    branch: claude/setup-stacked-prs-skill
    title: "PR 2: /setup-stacked-prs guided one-command setup skill"
    pull_request_number: 110
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01KGBAbjVAmX7LJMnSTJprtM
    notes: >
      Mirrors PR #101's pattern (read-only check-stack-setup.sh + guided skill +
      prerequisite-check.md) and #107's script/skill split. Two install modes: native
      (tooling on the target repo's main) and fork-overlay (creates/updates a
      never-merged tooling branch on the user's fork from the skill's canonical files;
      re-running is the updater). Creates missing labels, writes personal stack.toml,
      emits the Routine prompt. Recorded decision (user can override): for cram2 itself,
      personal config lives on the personal-notes branch, not a per-user dev branch.
      Kicked off 2026-07-30; branched off claude/setup-personal-notes-script (#107)
      rather than #106 directly, because the item needs .claude/stack/* from #106 and
      github-api.sh plus the gh/curl test stubs from #107 — which is what forced the
      restack of #107 onto #106 first. Two scope calls settled at kickoff: the
      stack-board step is guidance only (the parameterized board.yml stays PR 4's, per
      the roadmap), and "prerequisite-check.md" in these notes means this skill gets its
      own, consumed by ROUTINE.md's SETUP step 0, not a second copy of #101's.
      Implemented as draft PR #110 (2026-07-30) on claude/setup-personal-notes-script:
      check-stack-setup.sh, setup-stacked-prs.sh, write-branch-files.sh (which
      write-personal-notes-file.sh now delegates to), the skill and its
      prerequisite-check.md, a board-free `stack.py config` command, and 334 tests
      passing (was 320), all network- and credential-free. Two gaps found and fixed on
      the way: cram2-link-sent was set and cleared by ROUTINE.md but had no key in
      stack.toml, so setup could not create it; and board.json was documented as
      never-committed scratch with nothing gitignoring it. Live label creation stays
      unverified for the same reason as #107 - a fine-grained installation token, so the
      label POST is exercised only through a stub.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): setup shrinks to
      labels + personal stack.toml + optionally creating the stack itself via
      POST /repos/{owner}/{repo}/stacks; the fork-overlay install mode demotes to a
      documented fallback for repos without the stacks preview. Amend while still a
      draft. #106's same-day cut narrows this further: there is no restack engine to
      install — setup is doctrine files + labels + personal stack.toml + the optional
      stack creation.

  - id: setup-personal-notes-script
    branch: claude/setup-personal-notes-script
    title: "Extract a deterministic setup script from /setup-personal-notes"
    pull_request_number: 107
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01MyxyUN3bsvPsJnb5QuNzxd
    notes: >
      Implemented as draft PR #107 (2026-07-29), based on claude/patch-pr-rheubx rather
      than main: the user overrode this item's "requires #101 MERGED" rule. That rule was
      never really about ordering — all six files this item builds on arrive with #101, so
      basing on it is what made the work possible at all.
      Restacked onto #106 on 2026-07-30 (base retargeted, #106 merged into the branch) so
      the upstream wave is one linear chain instead of two siblings on #101: PR 2 needs
      .claude/stack/* and github-api.sh together, and the diamond alternative would have
      been invisible to stack.py restack-plan, which derives exactly one parent per branch
      from the PR base. depends_on gained stack-tooling-on-main to match. GitHub retargets
      the chain upward as each parent merges.
      The item's original premise is disproved and no longer applies: the two steps
      recorded as session-only are both scriptable (GET /user for the login,
      GET /repos/{owner}/{repo}/labels/{name} for the labels, POST .../labels to create
      one — the "no create-label tool" limit is true of MCP, not of the API). So the whole
      setup runs with no session, and SKILL.md became a thin question-asking wrapper
      (238 → 153 lines) rather than the "script plus two API steps" split the dispatch
      prompt described. Delivered: .claude/hooks/setup-personal-notes.sh
      (--remote required, --starter-notes, --create-labels), .claude/hooks/github-api.sh,
      4 new path constants, 254 tests passing (was 236), all network- and
      credential-free. Carries two incidental fixes as their own commits, both hard
      prerequisites: current_branch_upstream_remote returning git's 128 instead of "no
      upstream" (which aborted create-personal-notes-branch.sh on any branch never pushed
      with -u), and a test helper that hid an executable by dropping its whole PATH entry.
      Still unverified: label creation against a real token (this environment's is a
      fine-grained installation token, so POST .../labels is exercised only via a stub).
      Cross-note stands but shifts: PR 2 (/setup-stacked-prs) should mirror this
      script/skill split, where the skill keeps only the questions and the un-scriptable
      environment-variable step — not a split reserving the GitHub calls for a session.

  - id: shared-pr-state-chips
    branch: claude/shared-pr-state-chips
    title: "PR 3: shared pr_state module + LOC/CI/conflict chips in plan dashboards"
    pull_request_number: 111
    track: dashboards
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_014KoJeaTUxyECZZpfWiVmvr
    notes: >
      Extract one PR-state fetch/compute module (CI rollup, LOC vs base, mergeable probe,
      session-link parse) shared by stack.py and plan-dashboard's pr-data fetching; add
      board-semantics chips to build_dashboard.py items; add a headless static-HTML build
      entrypoint for the Pages Action (Artifact path keeps working during transition).
      Since PR 1 (#106) landed as plain scripts, this PR also CREATES the dev-tooling
      Python package (top-level directory importable from the repo root with no install,
      plus a pyproject for optional installation) and puts pr_state in it as its first
      module — the shared import home is what forces the package into existence here.
      Kicked off 2026-07-30 (branch based on claude/stack-tooling-on-main, a sibling of
      #107 on #106 — needs only #106's files, so decision 10's linearization doesn't
      apply). Two calls settled at kickoff: the package is named development_tooling
      (abbreviation-free per AGENTS.md), and the headless site build also pushes
      merged-to-done manifest auto-corrections, same as the live refresh path.
      (This kickoff state was accidentally reverted by a concurrent stale-scaffold save
      on 2026-07-30 14:49 and restored by the routine-cutover kickoff session.)
      Implemented as draft PR #111 (2026-07-30): development_tooling package (pr_state +
      personal_notes modules, pyproject for optional install), stack.py export restored
      through it, optional chip fields in pr_data.json rendered as CI/size/conflict
      chips (old pr_data still renders chipless), and build_site.py writing _site/ for
      PR 4's Action. 302 tests passing across both CI invocations (was 254); the new
      test/development_tooling_test suite runs with --confcutdir since the shared
      test/conftest.py imports the robotics stack. One old bug fixed in the port:
      merge-tree exits 1 for both a conflict and a missing reference, so the old probe
      reported a typo as a conflict - the port verifies references first.
      Added 2026-07-31 (native-stacks pivot, user-approved): pr_state also reads the
      PR's native stack object via REST (X-GitHub-Api-Version 2026-03-10; GraphQL is
      unusable from sessions) and renders a stack chip ("layer p/n · stack #N") when
      the PR is a stack member. #106's cut may simplify or remove the "stack.py
      export restored through the package" interplay; pr_state itself is unaffected.

  - id: dev-tooling-python-package
    branch: null
    title: "Migrate the .claude Python into the dev-tooling package, tests under test/"
    track: dashboards
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main, shared-pr-state-chips]
    status: not_started
    notes: >
      Move the existing Python (.claude/stack/stack.py, build_dashboard.py + siblings,
      plan_manifest_tools.py) into the package PR 3 created, with all their tests moved
      to the standard test/ directory and the test_claude_dev_tooling CI job repointed.
      Boundary: SKILL.md files, settings.json, and the bash hook entry points stay in
      .claude/ (Claude Code discovers them by path) as thin wrappers calling python -m
      into the package. Constraints: zero-install must survive (importable from repo
      root; installation optional), and the package stays visibly dev-tooling (own
      directory, not published, not in the default install). Stronger dependency than
      the open-ready rule: requires #101 MERGED (this moves files in
      .claude/hooks/tests/ that #101's diff adds) and PR 3 merged or at least stable
      (it moves files PR 3 edits) — sequence it last in the upstream wave.

  - id: stack-board-single-site
    branch: null
    title: "PR 4: plans-only Pages site (stack board retired for the native stack map)"
    repository: AbdelrhmanBassiouny/stack-board
    track: cutover
    depends_on: [stack-tooling-on-main, shared-pr-state-chips]
    status: not_started
    notes: >
      Re-scoped 2026-07-31 per the user's one-dashboard decision: the board index is
      not built at all — GitHub's native stack map covers derived stack mechanics, and
      the plans dashboards are the single surface. board.yml checks out fork main (not
      the tooling branch) + fetches personal-notes for plans and config; publishes
      _site/ = plans/<id>/ per plan, refreshed every poll with no live session, via
      PR 3's build_site.py. Adds the every-fork-PR-belongs-to-a-plan invariant: the
      build lists open fork PRs and flags any that no plan.yaml claims. Parameterize
      repo/branch/upstream as repository variables (portability). Fix the three
      inconsistent poll-interval statements. dashboard-urls.yaml / Artifact publishing
      become optional legacy.

  - id: routine-cutover
    branch: null
    title: "Retire the scheduled LLM Routine: deterministic Action + on-demand sessions"
    track: cutover
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_017JMftn3ujp7xsyhwcMaF75
    notes: >
      Target revised 2026-07-31 (native-stacks pivot, user-approved): the endgame is no
      scheduled LLM run at all, finally aligning the Routine with the
      no-scheduled-checks rule. A plain scheduled Action takes the deterministic
      duties — fork-main fast-forward from cram2/main, label hygiene, cram2-link
      comment, plans-site build, and the happy-path cascade (gh stack sync is
      documented as safe in automation: fetches, fast-forwards the trunk, rebases the
      remaining branches, force-pushes, syncs PR status, aborts cleanly on divergence
      in non-interactive terminals; Actions runners ship gh). The judgment residue —
      cascade conflicts and red CI after a restack — runs in on-demand sessions,
      surfaced by the plans dashboard rather than a timer. The 2026-07-30 pointer-
      prompt design (roadmap addendum of that date: replacement prompt, update_trigger
      mechanism, gate checklist) is superseded as the endgame but survives as an
      optional interim step if the Action lags the tooling wave; the live Routine is
      trigger trig_01N79jHmLo3bSbg8pLM6MNTB ("PR Stack Monitor and Update"), and the
      final cutover deletes or disables it. Gate unchanged: only after PR 1 is on
      cram2/main and fork main fast-forwards; one green Action cycle flips this done.

  - id: tooling-branch-retirement
    branch: null
    title: "Tag and delete claude/stack-workflow-tooling after one green cycle"
    track: cutover
    depends_on: [routine-cutover, stack-board-single-site]
    status: not_started
    notes: >
      Only after one full routine cycle and one board-Action cycle run green on the new
      paths. Tag for history first. Platform constraint (see roadmap addendum
      2026-07-29): tag pushes and branch deletes get a 403 through a session's git
      proxy, so those two steps must run outside the harness (user's machine or gh
      api); a session can still do all verification and prepare the exact commands.

  - id: native-stacks-prototype
    branch: null
    title: "Prototype GitHub's native stacked-PRs preview against our stack tooling"
    track: stack-tooling
    depends_on: []
    status: done
    session: https://claude.ai/code/session_015db4P7UfiFTTfrbxYjU5yW
    notes: >
      Evaluation + live prototype of GitHub's stacked-PRs public preview, run on
      throwaway proto-* branches in the stack-board repo (trunk = its own throwaway
      branch; main untouched). All probes conclusive - full findings and their
      per-item consequences in the roadmap addendum of 2026-07-31. Headlines: every
      stacks REST endpoint works from a session's installation token (API version
      2026-03-10) - read, create (drafts accepted, non-main trunk, works beyond the
      fork so the preview is account-wide), extend, dissolve; merge is a new async
      endpoint (merge-async + poll) that merges everything below in one operation
      and auto-retargets the PRs above within seconds, refusing stale stacks with a
      precise not-a-linear-descendant error and refusing drafts; the classic merge
      and update-branch APIs are hard-403'd for stacked PRs (including via the
      GitHub MCP server). The one gap: no REST endpoint triggers the server-side
      cascading rebase - cascade is UI-only or a local git rebase+force-push, which
      preserves stack membership (verified). pull_request webhook/Actions payloads
      carry a stack object (id/number/position/size/base), retargets arrive as
      "edited" events, and the stack base.sha lagging the real trunk head is a
      machine-readable staleness signal. User decisions recorded: one dashboard
      only (the plans dashboard; the stack-board surface dies; every fork PR must
      belong to a plan, enforceable at dashboard build), and Stack #112 already
      wraps the seven D-core PRs on the fork. The pivot re-scopes were approved
      2026-07-31 and are recorded on the affected items (stack-tooling-on-main,
      setup-stacked-prs-skill, stack-board-single-site, routine-cutover). Round-2
      probes (same date, second addendum): PATCH base 422s on stack members (the
      Phase 1 REPARENT hazard), push-based merges are detected as merged but do not
      auto-retarget children (unlike merge-async), and unstack → PATCH base works as
      the API-only recovery. Leftover cleanup: proto-* branches on stack-board need
      out-of-harness deletion (session branch-delete 403).

  - id: plan-updates-since-helper
    branch: claude/plan-item-kickoff-workflow-n814iz
    title: "plan-updates-since.sh: delta recheck of plan state and tracking-issue comments"
    track: personal-data
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01UrxbEr6ZHMThA2p4Vcnrqv
    notes: >
      Implements the recheck-deltas convention recorded in cram-notes.md (2026-07-31): a
      small hook script next to save-plan.sh that, given a plan id and the last-seen
      personal-notes commit SHA, fetches the notes branch and prints only the delta -
      `git diff <sha>..FETCH_HEAD -- .claude/personal/plans/<id>/` - plus the plan's
      tracking-issue comments newer than that commit's timestamp (github-api.sh dual
      backend once #107 lands, else curl). session-start.sh stamps the SHA it loaded plan
      state at (gitignored file) so sessions have the baseline for free; the script
      updates the stamp. Sized as a small independent PR off fork main, like #109 - not
      part of the #101 chain. Tests via ScratchRepository, network-free.
      Kicked off 2026-07-31 via /plan-item-kickoff: confirmed with the user this is based
      off fork main directly, independent of #109 (not stacked on it) - "off fork main,
      like #109" in this item's own notes means the same *kind* of independent, main-based
      PR, not a stack on #109's branch. Expect a textual overlap in the same two files
      #109 already edits (resolve-personal-notes-config.sh, session-start.sh) - same
      no-depends_on, whichever-lands-second precedent already established for #107/#109/
      #110 sharing files with no dependency between them. github-api.sh is confirmed not
      yet on fork main (only on #107's branch, which this item doesn't depend on), so the
      dual-backend GitHub call this item needs (fetching tracking-issue comments) is
      implemented inline, matching github-api.sh's gh-then-curl+token style, rather than
      depending on that file - a later cleanup once #107 lands can dedupe the shared
      credential/repo-resolution helpers.

