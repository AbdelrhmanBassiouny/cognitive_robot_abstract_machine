      depends on, so a half-migration leaves the verdict split across two mechanisms. And its
      verification is a real CI run on a pushed branch, which is the one thing nothing else on #154
      needed - everything there was checkable against real git in the scratch fork.

      One measured fact shapes the whole design and should be re-checked at kickoff rather than
      inherited: `ci.yml` triggers on `push` to `main` and on `pull_request`, and nothing else. A
      pushed integration branch therefore gets no CI at all unless a pull request exists for it.
      That is why the user's "a PR into the existing stable integration branch" framing is the only
      shape that reaches a verdict.

      First added requirement: a stable branch and a candidate. `integration` becomes the last build
      whose CI went green rather than a pointer moved to whatever was built last; each new build is
      a candidate, opened as a pull request into it, and merged once green. A tension to settle
      rather than paper over: a build is regenerated from scratch from the upstream base plus the
      tips, so a candidate shares no history with the stable branch, its pull request's diff is
      everything that changed between two independent builds, and merging it makes `integration`
      accumulate history -the one property this design has held since the item was recorded. Whether
      the stable branch is a real merge target or a second pointer force-updated on green is the
      first decision.

      Second added requirement: a pytest marker, and a CI job that runs only what it marks. The
      failing test step 5 pushes to the breaking branch carries a marker named for the label; a job
      runs only marked tests. That gives a verdict in a fraction of the matrix's time, and it gives
      `integration-conflict` an automatic clearing condition it does not have today - the 08-11
      round established that `WithholdBlockedBranch` cannot clear it, since a failure between two
      cleanly merging branches never makes a pull request conflicted, and the label ships documented
      as never cleared automatically for that reason. A marked test that passes is a different and
      correct clearing condition. The user also offered a third option worth keeping: the script
      that writes and clears the label could run the marked tests itself, or trigger only that job,
      rather than depending on the whole run.

      Two review threads on #154 stay open pointing here rather than being resolved: the
      `DataclassException` one, whose subject `TestCommandNotConfiguredError` this item deletes
      rather than converts, and the whole-CI thread this item is the answer to.

      Re-scoped 2026-08-23 by the user's speed decision, and the branch now carries two fixes rather
      than the recorded design. The goal became development speed on the rdr, eql and montessori
      plans with every reviewed tooling fix already in daily use, so `integration` is the fork's
      default branch now (HEAD is `refs/heads/integration`), sessions clone it, and `main` stays a
      pure cram2 mirror. `upstream_base = "main"` is explicit in `stack.toml` and #188's hook reads
      it rather than `default_branch_name()`, so the fork-main sync is unaffected by the flip.

      Two corrections to what this item settled at kickoff. The marked job cannot be the build's
      verdict: with no matching tests `pytest -m integration_conflict` exits 5, so a marked-only job
      is empty on a healthy build and says nothing. The marker keeps its place, re-aimed at whether
      a recorded break is fixed and at clearing `integration-conflict`; the gate is the candidate's
      full `ci.yml` run. And nothing that opens the candidate may use `GITHUB_TOKEN`, since GitHub
      creates no workflow run from an event it triggered - a fine-grained PAT is a required setup
      step, not a hardening. Both PAT facts are now measured rather than assumed, on throwaway
      branches: the token pushed a commit touching `.github/workflows/` (Workflows permission) and a
      run appeared for the branch it pushed (recursion escaped). One trap found doing it:
      `actions/checkout` persists `GITHUB_TOKEN` as an `http.extraheader` for github.com, and that
      header overrides credentials in a push URL - the token has to be handed to `actions/checkout`
      via `token:`, not to the `git push`.

      Two defects in `integration.py` found and fixed here, both test-first. `Assembly.merge` read
      the replay marker before asking which paths were unmerged, which is right for a fully replayed
      merge and wrong for a partially replayed one - rerere replays per conflict rather than per
      merge, so a tip can carry one conflict a recorded resolution covers and another nothing has
      seen. Git prints the marker either way, so the partial case committed with files still
      unmerged and took the whole build down over one tip that should have been skipped. Reachable
      the moment any resolution is recorded, which is what /integration-conflict-triage does
      routinely. And `provenance_path` resolved git's `--git-common-dir` answer against the
      process's directory rather than the runner's working directory; git answers relatively from
      inside a main working tree, so running the suite from the repository root wrote its fixtures'
      authors over the real manifest. Observed rather than reasoned about: a resolution recorded
      `--author skill` came back from the next build reported as `human`. That record is the only
      thing that makes a machine-written replay findable later.

      State: 622 tests pass, from 620. #191 is still a draft, which is a second gate the collision
      work does not remove - a draft is excluded from every build, so the workflows cannot reach
      `integration` until it is un-drafted. `integration` still points at the Phase 1 build
      (899a04a), which reports `tests_passed: null` and was therefore never verified green; the
      newest build is red and was deliberately not pushed.

      Folded into #154 on 2026-08-23, on the user's call, and #191 is closed. The item survives as
      an item; what it does not have any more is a pull request of its own.

      The scope test was re-run against what the branch actually held rather than against the
      kickoff's plan, and it inverted the kickoff's answer. All three files #191 touched
      -`integration.py`, `.claude/shared/git_commands.py` and `test_integration_replay.py` - are
      absent from `main`, introduced by #154's own chain; the whole diff was 71 insertions across
      those three; and two of the three commits were bug fixes to #154's own code. Strip the edits
      and nothing stood alone, which is the `#133` into `#117` case exactly. The fold was a
      fast-forward, so GitHub closed #191 as merged into its base.

      The kickoff's opposite answer was not wrong when it was made - it was run against planned
      content (an Actions client, a workflow file, a marker, a new module) none of which had been
      written. Same expiry as a basing decision, which this plan already records twice.

      Part D itself also moves onto #154 rather than a fresh pull request, for a sharper reason than
      "#154 is incomplete": #154's own description concedes that `integration-conflict` ships with
      no automatic clearing condition, which Part D's marker is what closes. A blocking label
      nothing ever clears is a known defect rather than missing polish. Splitting also means cram2
      reviewing the local-verdict surface - 11 occurrences in `integration.py` alone - and then
      reviewing its removal. #154 carries no `cram2-link-sent`, so the fold costs nothing upstream.

      The practical half, which is what decided the timing: #154 is out of draft, so it is already
      carried by every integration build, where #191 was a draft and excluded from all of them.
      Folding removes the un-drafting gate entirely rather than deferring it.

      Accepted cost, stated rather than discovered later: #154 was already 52 files, 8121 additions,
      38 commits and 75 review threads before Part D is written.

      Audited 2026-08-28 (session https://claude.ai/code/session_01MwawsPiaFK3ufUK4YHak3X), and
      three premises this entry rests on have moved, all in the direction that helps.

      The token is no longer a pending setup step. `INTEGRATION_REFRESH_TOKEN` is a repository
      secret and both probes passed on 2026-08-23: one pushed a commit touching `.github/workflows/`
      through `actions/checkout`'s persisted credential, and the second run existing at all is the
      proof that the token's push started a run. The probe branches and `token-probe.yml` are gone.

      The Actions client exists as a precedent rather than as an unexercised API.
      `upstream-review-reader` (#146) merged on 2026-08-22, and what it landed is
      `.github/workflows/upstream-reviews.yml` - a `workflow_dispatch` job whose output a skill
      reads back out of the job log, which is the shape Part D needs for a candidate run's
      conclusion.

      Nothing of Part D is written, checked rather than assumed: no workflow on any branch of the
      fork triggers on `ready_for_review`, `ci.yml` still triggers on `push: main`, `pull_request`
      and `workflow_run` only, no pytest marker for `integration_conflict_label` is registered, and
      `integration_test_command`, `--test`, `--no-test` and `_run_tests` are all still live.

      The stable-branch shape is settled, by the developer on 2026-08-28: the candidate pull request
      exists to trigger CI and nothing else, `integration` is force-updated to the candidate once
      its run is green, and the candidate is closed unmerged. That keeps the regenerate-from-scratch
      property a merge target would have cost, and it is available because the branch is a pointer
      rather than history anyone builds on.

      `integration` still points at `899a04a` - `tests_passed: null`, and #199 measured it 124
      commits and five days behind `main`. So the branch this item defines as "the last build whose
      CI went green" currently holds one that was never verified and is stale besides, and its first
      correct value has to be earned by a real run rather than inherited. Rebuild cadence is the
      open question underneath that, and it is this item's to answer now that the verdict is what
      makes an automatic rebuild safe.

      Resolved 2026-08-28 (session https://claude.ai/code/session_01FWoysReVCQMi9VBY5cVgcP), and
      Part D is now half built rather than unwritten. Two things were actually stalling it, and only
      one was recorded. The recorded half was that nothing of Part D existed. The unrecorded half
      was that #154 was `mergeable_state: dirty` against `main` - 157 commits behind, conflicting in
      `plan-item-kickoff/SKILL.md` and `plan-item-resolve/SKILL.md`, reported by the maintenance
      pass four times since 2026-08-18 and last on 2026-08-24. A conflicted pull request is excluded
      from its own base merge, so the branch was drifting further out every day the item sat. `main`
      had restructured both skills around execution modes (seven sections to four) while this branch
      added a manifest-staleness step to each; both survive, with main's numbering as the live
      structure and each branch-added step demoted to a subsection of the step it generalises. The
      clearing condition `integration-conflict` shipped without is built and verified. The marker is
      derived from the label rather than spelled again - `DefaultLabel.INTEGRATION_CONFLICT` with
      the hyphen a marker name cannot carry replaced - and it is registered in `pytest.ini` and
      deliberately left in the default selection, since excluding it the way `slow` is excluded
      would keep the breaking branch's own run green, which is the one outcome the reproduction
      exists to prevent. `.claude/stack/integration_reproduction.py` is the marker, the run's
      document and the lifting; it is also the pytest plugin the targeted job loads, registered as a
      plugin instance rather than module state so a run's collection belongs to that run.
      `.github/workflows/integration-checks.yml` runs every marked test on `pull_request` and
      `workflow_dispatch` and hands the document to `integration.py clear-fixed-breaks`. 705 tests
      pass across the four directories CI runs, from 675. Three rules the tests pin rather than the
      prose asserting: a branch is fixed only when every reproduction recorded against it passes,
      since it can break more than one sibling; a reproduction counts as passing only if its body
      ran and no phase failed, so a skipped one leaves the block standing rather than lifting it on
      evidence that never ran; and a branch carrying no block is not written to at all, since a
      reproduction keeps passing on every later run once the break is gone. Both were
      mutation-checked - `all` to `any`, and clearing every recorded branch rather than only the
      fixed ones - and each fails exactly one test, for its own reason. One correction to what the
      2026-08-22 kickoff settled, found while writing it: the kickoff put the workflow's marker
      selection, plugin name, report path and subcommand in YAML with nothing checking them. A
      workflow cannot import a constant, so those four are the one place each name is spelled twice;
      they are now asserted against their definitions, and a selection naming something else would
      otherwise have run nothing while still reporting success. What is not built, and why the
      boundary is there rather than further on: the candidate pull request, the Actions/check-run
      reads, the force-update of `integration` on green, and the removal of
      `integration_test_command`, `--test`, `--no-test`, `TestCommandNotConfiguredError` and
      `_run_tests`. Two reasons, neither of them running out of room. The removal cannot come before
      the candidate/verdict is proven on a real CI run, because `build_integration` currently moves
      `integration` to every finished build unconditionally - taking that out before the verdict
      works leaves the branch never moving at all, which regresses the fast-PR process rather than
      staging it. And the shape of what opens the candidate depends on rebuild cadence, which the
      2026-08-28 audit recorded as still live and the developer's call: scheduled, per-session, or
      gated on #154 landing decides whether the candidate is opened by a workflow holding the PAT or
      by a session, and building either before that is answered builds the wrong one.

      Rebuild cadence answered 2026-08-28 by the developer: a scheduled Action. The candidate is
      opened by a workflow holding `INTEGRATION_REFRESH_TOKEN` rather than by a session, which is
      what the token was provisioned and probed for on 2026-08-23. That unblocks the rest of Part D
      and fixes its shape: `open-candidate` and the verdict read are workflow steps, not session
      commands, so `maintenance_github.py`'s Actions and check-run reads have a caller with a real
      credential and the removal of the local `--test` surface has somewhere to land. Note this is a
      timer on deterministic automation rather than a scheduled LLM check, so it sits inside
      `routine-cutover`'s endgame rather than against the no-scheduled-checks rule. Also settled the
      same day: #154 stays out of draft. The convention is to re-draft after every push, and here it
      is overridden deliberately - a draft is excluded from every integration build, so re-drafting
      would drop the branch that carries this work out of the process it exists to serve. Review
      state is carried by the pull request being open and unmerged instead.

      The targeted job's first real run failed, and the cause is worth carrying because it follows
      from the job's own design rather than from a mistake in it. It collected `-m
      integration_conflict .` from the repository root, which loads every `conftest.py` -including
      the robotics stack's, which imports `numpy` - so a runner carrying the tooling dependencies
      alone died during collection, exit 4, before reaching a reproduction at all. Fixed in
      `db134d33` by collecting the four test directories `ci.yml`'s tooling job names, which is
      exactly the tree those dependencies cover. The rule is read off that job rather than listed a
      second time, since what makes the two trees the same is the install, not the name;
      mutation-checked, and reverting to the root fails only the test that names the rule. Verified
      locally as the healthy-tree case: 706 collected, all deselected, exit 5, an empty document
      written, and the clearing step reading it back and clearing nothing at exit 0. It also makes
      the limit recorded at kickoff concrete rather than theoretical - a reproduction that has to
      live inside a robotics package is not collected here and its branch stays blocked, which is
      the safe direction. 706 tests pass across the four directories CI runs, from 705.

      Restack-then-build wired up and run on 2026-08-28, on the developer's point that a rebuild
      should depend on restacking first and can use the labels stacking writes. Half of it existed:
      `build --restack` already restacked, refreshed remotes and built. What did not is that
      `select_for_build` read draft state and the chain and never looked at a label, so a branch a
      pass had withheld went into the build anyway - and was then reported as colliding with
      whichever sibling it met there rather than as the branch whose own conflict was already
      recorded. It now leaves out any branch carrying one of `Configuration.blocking_labels` and
      anything standing on one, reported as `blocked` rather than `unreviewed`, which would send an
      author to review a branch they had already reviewed. `BuildSelection.unreviewed` and
      `IntegrationReport.unreviewed` become `left_out`, since the field now holds both reasons.

      The half that made it worth doing at all is the ordering. The stack was read before
      `restack()` ran and the same object was built from, so the labels that pass had just written
      were invisible - a write computed from a snapshot a later step in the same pass invalidates,
      which is the shape recorded against the 2026-08-05 promotion incident. `stack_to_build` reads
      it again afterwards. Four mutations checked, each caught by the test naming its rule; 715
      tests pass, from 706.

      The run is the evidence. `fast-forward` moved fork `main` 43 commits onto `cram2/main`, which
      conflicted this branch for real - the `needs-resolution` label on it was correct rather than
      stale - resolved in `pytest.ini`, additive on both sides. The next restack cleared the label,
      the build carried this branch, and the suite failed: `#158`'s pinned copy could not import
      `exceptions`, because this branch introduces `.claude/shared/` and the pin copied one
      directory flat. Two branches, both green alone, merging with no conflict, broken together -
      the exact class this design exists for, found on the first restacked build rather than by
      anyone reading a diff. Fixed on `#158` rather than here, since the under-specified pin is its
      own; the rebuilt branch is green with both in it.

      `integration` is published at `933161a263`: 0 behind `main`, 194 ahead, carrying
      `integration.py`, `.claude/shared/` and `integration-checks.yml` for the first time - so the
      default branch a fresh session clones is current with upstream and carries the tooling. Four
      tips merged, five skipped on ordinary textual collisions with this branch's `.claude/shared/`
      extraction (`build_dashboard.py`, `plan_item_bootstrap.py`, `conftest.py`), which is
      whoever-lands-second-adapts rather than a semantic break, and sixteen left out as blocked.
      Worth carrying for Part D: the local `--test` verdict is what caught the break, so it stays
      until the CI verdict replaces it rather than beside it.

      Part D built and the pipeline started, 2026-08-28. The premise that had to go first was mine
      rather than the design's: this was recorded as gated on #154 landing, because a scheduled
      Action must invoke `integration.py` and that is not on `main`. It does not have to be. A
      `schedule:` trigger registers from the repository's *default* branch, which here is
      `integration`, and `integration` is `main` plus every carried tip - so anything on #154
      reaches it. The proof was already sitting there: `integration-checks.yml` exists on no branch
      but #154 and was on `origin/integration` before any of this. So the whole pipeline is built on
      #154's branch and runs from there with no merge to `main` at all.

      What was built. `maintenance_github.py` gains `CandidatePullRequests` - open a pull request,
      close one, read a commit's check runs - declared apart from the reads and writes a maintenance
      pass makes, because nothing that maintains the stack opens a pull request and a pass handed
      that interface could open one by mistake. `integration_verdict.py` turns a commit's check runs
      into one of four verdicts, and `integration.py` gains `open-candidate` and `settle-candidate`.

      The shape of it, and why. A build is judged as a candidate pull request because `ci.yml`
      triggers on `push` to `main` and on `pull_request` and on nothing else - a pushed build
      collects no checks at all, which is what makes the candidate the only shape that reaches a
      verdict rather than one option among several. The candidate is never merged: a build is
      regenerated from scratch, so it shares no history with the branch it replaces and merging
      would give that branch a history the next build cannot regenerate. Green moves the branch onto
      the build and closes the candidate unmerged; red closes it naming the checks that failed;
      unfinished does nothing and says so with its own status, so a caller waiting asks again rather
      than discarding a build nothing had judged. `ABSENT` is told apart from `RUNNING` deliberately
      - it is the state that can mean something is wrong rather than slow, and the thing that causes
      it is exactly the credential mistake below. The waiting is in the workflow rather than in the
      command, which keeps every invocation a decision that can be read on its own.

      A published build's branch is deleted, since the pointer then holds the same commit and a
      scheduled rebuild would otherwise leave one behind four times a day; a rejected build's is
      kept, because its candidate names checks somebody has to look at and a closed pull request
      whose head is gone cannot be read.

      `.github/workflows/integration-refresh.yml` runs it four times a day and on dispatch, holding
      `INTEGRATION_REFRESH_TOKEN` rather than `GITHUB_TOKEN` - GitHub starts no workflow run from an
      event `GITHUB_TOKEN` caused, so a candidate opened with it would sit with no checks forever.
      The names the workflow retypes are asserted against their definitions, since a workflow cannot
      import a constant; that test strips the shell's comments first, which a mutation check is what
      found - branching on the wrong status still passed while the comment explaining the right one
      satisfied the search.

      744 tests pass across the four directories CI runs, from 715. Six mutations checked, each
      caught by exactly the test naming its rule. Bootstrapped by one hand-run rebuild, since the
      workflow could not dispatch itself until it was on the default branch: `integration` is at
      `201a903a67` with five tips merged and the suite green, GitHub lists `Integration refresh` as
      an active workflow, and run 33214932131 is the first dispatch of it.

      Not done, and now for a better reason than before: `integration_test_command`, `--test`,
      `--no-test` and `_run_tests` stay. The local suite is what caught the #154-against-#158 break
      hours earlier, and it answers before a build is pushed rather than after a candidate has run a
      matrix. Removing it once the CI verdict works would trade a fast answer for a slow one; what
      the CI verdict replaces is the *publishing* decision, which it now makes.

