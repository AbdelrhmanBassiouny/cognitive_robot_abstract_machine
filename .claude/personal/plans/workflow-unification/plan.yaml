      branch reachable, or no generated branch index on it, means silence), not a new setting,
      since the user's requirement is that this works automatically and reliably for both kinds
      of user with nothing to configure. Inertness is a hard constraint rather than a
      preference: .claude/settings.json is committed, so every contributor who ever inherits
      this repo inherits the hook, and one that blocked their edits would be indefensible
      upstream. Needs a per-branch opt-out for a branch that genuinely belongs to no plan.
      Depends on #121 for the discriminator helpers it builds on.
      Scope settled 2026-08-01, from the user's point that plans-and-notes users still do work
      that is purely a personal-notes edit and needs no item. Two exemptions, both mechanical
      rather than opt-outs: (a) the guard fires only for files tracked in the working tree, so
      notes-only work is exempt for free - CLAUDE.local.md is gitignored, and plan and notes
      data live on the notes branch, written by the save-*.sh scripts from scratch paths
      outside the repo; and (b) a branch whose pull request targets the notes branch is
      exempt, since it carries notes data rather than code bound for the default branch.
      (b) has no mechanism yet and is this item's own work: the branch names #121 excludes do
      not cover it, and the obvious local test - the notes branch tip being an ancestor of
      HEAD - collides with the hook tests' scratch fixture, which builds its work branch off
      the notes branch. Either the fixture branches from the initial commit instead, or the
      test reads the pull request base. #121's plan line has the same residual gap and should
      follow whatever mechanism this item settles on. The per-branch opt-out remains, but only
      for genuine no-plan *code* work, which is now the sole case it has to cover.

