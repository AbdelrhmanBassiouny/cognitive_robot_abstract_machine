      catch, spelled out in its own docstring. Its second paragraph was also wrong in a way nobody
      had caught: it said the `asdict`-backed keys were "pinned by nothing else", where those are
      exactly the ones pinned elsewhere.

      Worth carrying: a helper whose only content is a type conversion is a docstring explaining a
      surprise. Both deletions this round - `branch_names_in` and, last round,
      `create_pull_request_object` - were helpers that existed to supply one value, and in both
      cases removing the value removed the helper. The test to apply before writing one is whether
      anything remains once the single defaulted argument is passed at the call site.

      Fourth round of 2026-08-20, one comment, on the same report-keys thread the third round had
      answered with a worked example: *"can you make a test that reproduces the situation that this
      test fails in? do you think this situation can ever happen again?"*

      The first question could not be answered as a test in the ordinary sense - the situation is a
      rename that no test catches, so reproducing it is a mutation rather than an assertion - but
      asking for one exposed a real weakness in the test, which is that it asserted the enum against
      a written-out copy of the enum. Nothing in it ever rendered a document. So it caught a rename
      by noticing that a table beside the enum disagreed, rather than by noticing that what a caller
      parses had changed.

      It reads the documents now. `every_document_this_module_writes` builds one fully populated
      instance of each of the four - the build report, the localised failure, the blocked branch and
      the staged conflict - and collects every key at every depth; the literals are compared against
      that. Which then made the second half free and it had been missing entirely:
      `test_every_report_key_names_something_a_document_carries` asserts the same collected set
      equals the enum, catching a member nothing emits and a key emitted without going through the
      enum. Neither was visible before, and the first is the shape a future member arrives in.

      The reproduction is measured rather than described. Renaming `EXIT_CODE`'s value to `exitCode`
      and running the whole stack directory gives 226 passed, 1 failed - the literals test, alone,
      out of 227. A member added that nothing emits fails only the second test; a key emitted
      outside the enum fails both, correctly, since it is both a wire-format change and an unnamed
      key.

      The answer to the second question is that it can, and that nothing in this repository can stop
      it. The mirror schema made writer and reader read the same member, which is the whole reason a
      rename is silent; the other two consumers of this format, `/integration-conflict-triage` and
      `stacked-pr-maintenance`, are prose documents, so nothing executes them. Only a reader outside
      this code, exercised in CI, closes it - and then only for the keys that reader touches. It has
      already happened once here: the 2026-08-13 round records a review reply describing this
      contract test when it did not exist, found by renaming a key and noticing nothing failed.

      622 tests pass across the three directories CI runs, from 621.

      Worth carrying: **a test that pins a contract must read the artifact the contract is about.**
      This one named the right hazard and checked the wrong object for two rounds, and the tell was
      available the whole time - it imported nothing that produced a document.

      Fifth round of 2026-08-20, one comment, same thread, no code change: *"if we update the enum
      name then this test will fail and we have to update this test as well right? so how would this
      benefit us?"*

      "Enum name" splits two ways and the cases have opposite answers, so both were measured.
      Renaming the *member* - `EXIT_CODE` to `PROCESS_EXIT_CODE`, applied across production and
      every reference in the suite - leaves all 13 tests in the module green, because both tests
      read `str(key)` and never `key.name`. That cost does not exist, and it did exist under the
      previous version of the test, which read `key.name`; reading the documents removed it as a
      side effect nobody had noticed. Renaming the *value* fails 1 of 227 across the directory,
      which is the guard working: the value is the wire format, so changing it is a breaking change
      by definition and the one-line edit is the record that somebody meant it.

      The strongest form of the objection is one the reply conceded rather than answered: a test
      updated reflexively is theatre. If the failure reads only "set differs, fix the set", the next
      person edits the literal without registering that two other programs parse it, and the test
      has cost maintenance for nothing. The docstring is the only thing mitigating that, and it is
      weak mitigation.

      Three options were put to the user with a recommendation and nothing was changed, since the
      choice is intent rather than fact: leave it, move the 23 keys into a `report-wire-format.json`
      read in by the test (recommended - `AGENTS.md:87` already requires a schema to live in a file
      of its own type, and it makes a contract change show up in review as a diff on a contract file
      rather than a line moving inside a test), or delete both tests, which is defensible because
      nothing outside this repository executes the format today and `integration-branch-ci-verdict`
      may create a real consumer whose own tests become the guard.

      Worth carrying: **four rounds of objection to one test were all aimed at a real defect that
      nobody had named.** Delete it, put the enum in the tests, document it with an example,
      reproduce the situation, why does it benefit us - each was answered on its own terms and the
      underlying fault, that the test asserted the enum against a copy of itself, survived all four.
      A reviewer returning to the same line is evidence the answer has not landed, not that the
      question has been asked already.

      Sixth round of 2026-08-20, one instruction: *"Delete both tests."* Taken as given - it was one
      of the three options the previous reply had put up, chosen with the trade already stated, so
      it is a decision rather than an ask to re-argue.

      `test_the_report_keys_are_the_ones_a_caller_parses` and
      `test_every_report_key_names_something_a_document_carries` are gone, and
      `every_document_this_module_writes` and `keys_in` with them, since nothing else called them.
      117 lines, a pure deletion. 620 tests pass across the three directories CI runs, which is
      where the day started.

      **The wire format is now deliberately unguarded, and that is recorded on the pull request
      rather than quietly dropped.** With writer and reader both going through `ReportKey`, a value
      rename changes both sides identically and the whole suite stays green. The reasoning accepted
      for removing the guard: nothing outside this repository executes the format today -
      `/integration-conflict-triage` and `stacked-pr-maintenance` are prose documents, so a break is
      found by a human reading either way - and a test you are expected to edit whenever the
      contract changes is one that gets edited reflexively, which buys maintenance and no guard. The
      natural place to close the exposure is `integration-branch-ci-verdict`, which introduces a
      consumer that actually runs; that consumer's own tests are the guard worth having, and this
      item should not be carrying a stand-in for them.

      Worth carrying, and it is the whole arc of this thread rather than its last turn: the test was
      defended across five rounds and deleted in the sixth, and both were right at the time. What
      changed is that the fault under it got named. For four rounds the objection was answered on
      its own terms while the test asserted the enum against a copy of itself; fixing that in round
      five made the real question askable - is one deliberate line per breaking change worth it when
      no reader executes the contract - and the answer to that is the user's to give, not a
      measurement. A defence that survives on reasoning nobody has tested is worth less than the
      objection it is answering.

      #191 folded in on 2026-08-23 (fast-forward, so GitHub closed it as merged into this branch),
      carrying three commits that were all fixes to this branch's own code, plus the plan item
      `integration-branch-ci-verdict`, whose Part D is now this branch's work too.

      Two of the three are defects this branch shipped, both found by running a real build rather
      than by review. `Assembly.merge` read the rerere replay marker before asking which paths were
      left unmerged, which is right for a fully replayed merge and wrong for a partially replayed
      one - rerere replays per conflict rather than per merge, so a tip can carry one conflict a
      recorded resolution covers and another nothing has seen, and the marker is on git's output
      either way. The partial case concluded the merge with files still unmerged, which fails and
      ended the whole build over one tip that should have been skipped. Reachable the moment any
      resolution is recorded, which is what `/integration-conflict-triage` does routinely.

      And `provenance_path` resolved git's `--git-common-dir` answer against the process's working
      directory rather than the runner's. Git answers relatively from inside a main working tree, so
      running the suite from the repository root wrote its fixtures' authors over the real
      provenance manifest - observed, not reasoned about: a resolution recorded `--author skill`
      came back from the next build reported as `human`. That record is the only thing making a
      machine-written replay findable later. `GitCommandRunner.common_directory` now resolves it
      itself, so the mistake is unrepresentable rather than fixed once.

      Base merge taken the same day, 86 commits of `main`. One conflict, in
      `plan-item-resolve/SKILL.md`, additive on both sides and both kept: `main`'s scope-decision
      paragraph continues section 4, and #151's `## 4b` manifest-staleness step follows it.
