  - id: no-pr-subscriptions
    title: "Stop sessions from subscribing to their own pull requests"
    branch: claude/remove-auto-subscribe-pr-oowwkp
    track: personal-data
    depends_on: []
    status: done
    pull_request_number: 153
    session: https://claude.ai/code/session_012yfsn1ZZBsUcfKK1zDW1zh
    notes: >
      Raised 2026-08-10. The workflow's standing rule was that a session subscribes to every
      pull request it opens and handles each event until that PR's job ends. The user's
      decision inverts it rather than tuning it: a session never subscribes to a pull
      request's activity, and opening one is terminal for the session that opened it - push,
      report what is outstanding in the chat, stop. A CI failure or review comment gets
      handled when the user asks, in a session started for it.
      Two halves, because the rule lived in two places. The personal-notes half (not in the
      diff) replaced the bullet in cram-notes.md and fixed the three sections written around
      the old assumption: "Scheduled checks" called event subscriptions wanted, "Comment
      routing" justified its action-only rule by saying PR comments wake subscribed sessions,
      and "When your PR's job ends" was largely teardown for subscriptions that no longer
      exist. The repository half is #153: starter-notes.md ships the never-subscribe default
      to any new user of /setup-personal-notes, and plan-schema.md and session-start.sh drop
      "(in addition to your own item's PR)".
      Scope call: pull requests only. A plan's tracking issue is subscribed with the same tool
      but is a coordination mailbox several sessions read, not a PR one session owns, so
      /plan-create, /plan-item-kickoff and /plan-item-resolve keep theirs untouched.
      Two passages a grep for the tool name would have missed were also reworded, since they
      explained behaviour by the old rule rather than stating it: stack/README.md's exception
      leaving subscription "to an interactive session babysitting that one PR", and
      stacked-pr-maintenance's needs-resolution comment claiming it may arrive as a live event
      in the owning session. That skill's own NEVER-subscribe hard rule was already right.
  - id: fresh-base-at-session-start
    title: "Fast-forward the fork's default branch at session start"
    branch: claude/fork-main-upstream-sync-mtrzpr
    track: personal-data
    depends_on: []
    status: in_progress
    pull_request_number: 188
    session: https://claude.ai/code/session_01DmexEkCHmVuQjanQpsHX4F
    notes: >
      Raised 2026-08-22 by the user. Sessions are cut from the fork's default branch, so a
      fork that has drifted behind cram2 makes every session in that clone plan and implement
      against a stale base - invisibly, because the clone is consistent with itself. Live at
      the time it was raised: origin/main was 86 commits behind cram2/main and this session's
      branch was cut from exactly that commit.
      session-start.sh now runs .claude/hooks/fast-forward-default-branch.sh before printing
      its report: it resolves the upstream through stack.py configuration (so no repository is
      named in the hook and it works on a fork of anything), fetches that base branch,
      fast-forwards this clone's copy, and pushes the result to the fork - the copy the next
      session gets cloned from. Its outcome becomes the report's new "default branch" line,
      with indented rows for the fork push and for how far behind the checked-out branch now
      is. Fast-forward only in every step, that one branch only, never fatal. Verified live
      here: 86 commits in 3.9 seconds.
      Deliberately not done: merging or rebasing the checked-out branch. Whether to take a
      moved base into work already in progress is a judgement call that can conflict, so it is
      reported rather than performed.
      Carries a second fix with the same root cause: catching the base up leaves the upstream
      tip in FETCH_HEAD, and the summary's plan state SHA was re-reading FETCH_HEAD rather than
      the baseline it had already recorded, so a session rechecking from it would have diffed
      plan state from an unrelated commit. It now prints what was recorded.
      Overlaps routine-cutover's scheduled Action, which also lists a fork-main fast-forward
      among its deterministic duties - complementary rather than duplicate: that one is a timer
      keeping the fork fresh between sessions and is gated on the upstream wave landing, this
      one guarantees the base of the session about to run and is live now.

  - id: integration-branch
    title: "Regenerated personal integration branch: build, check, resolve, report"
    branch: claude/plan-item-kickoff-workflow-ixbvxl
    track: stack-tooling
    depends_on:
      - manifest-currency-first
    status: in_progress
    pull_request_number: 154
    session: https://claude.ai/code/session_01Ra51SAHQKy7TVYRG2HRERW
    notes: >
      Designed 2026-08-10; no code exists. Three implementation attempts were blocked in the
      designing session, so this enters the plan as a design with nothing behind it.

      The constraint it addresses is upstream review throughput: pull requests are produced faster
      than cram2 merges them, so shipped-but-unreviewed features are unusable in daily work, and two
      in-flight features that conflict only discover it at the far end of the review queue. The
      answer is a regenerated integration branch - upstream main with every in-flight stack tip
      merged on top, rebuilt from scratch on demand, existing to be built from rather than to be
      history. Nothing merges out of it.

      It gates nothing, and that is a decision rather than an omission. Promotion asks whether a
      branch is ready for upstream review, judged against upstream main; integration asks whether
      the branches coexist. Gating promotion on a clean build would block A because B conflicts with
      it, with no principled reason A is the one that waits.

      Almost nothing is built from scratch: board.json and GitHubRepository for the open pull
      requests, build_stack/order for the tree, has_landed_upstream for exclusion,
      maintenance.restack for staleness, GitCommandRunner.merge plus unmerged_paths to tell a real
      conflict from a refused merge, RestackWorktree for checkout safety, merge-tree for the
      non-mutating probe, MaintenanceReport and the exit-code mapping for output, and
      write-personal-notes-file.sh for durable state.

      Based on #139's branch rather than main, because maintenance.py exists only there - git
      ls-tree main -- .claude/stack/maintenance.py is empty. That makes this a genuine stack on
      unlanded work rather than an artefact of authoring order.

      Decisions taken. No CI gate: it would deadlock against the restack, since restacking rewrites
      heads, CI re-runs, every restacked branch reads pending, and a green filter yields a
      near-empty build. A single --test run on the finished branch replaces it and is strictly more
      informative - it catches semantic conflicts that per-branch CI structurally cannot, such as A
      renaming a method while B adds a caller, both green, merging clean and breaking on import.
      Conflicts skip and continue rather than halting the build, reversing the original
      stop-on-conflict spec, because a build that halts leaves nothing to work from, which is the
      whole point of the branch. Selection unit is the stack tip, since a tip already contains its
      stack. Merge order is load-bearing once skips are possible, so it is stable and stated, and
      the report names the conflicting pair rather than the casualty - "B skipped" is not
      actionable.

      Sibling conflicts are the case this hits constantly and the one with no feature-branch fix
      available: adapting B to an unlanded A makes B depend on unmerged work, which is the stacking
      this workflow exists to avoid. rerere holds those resolutions in .git/rr-cache, contaminating
      no branch, persisted to personal-notes as a tarball because containers are ephemeral. It buys
      a working daily driver, not a discharged upstream obligation, and a replayed merge is always
      reported as replayed rather than clean.

      Judgement lives in a skill, not the script. integration.py detects, attributes and skips;
      /integration-conflict-triage reads the JSON conflict report and judges each pair reconcile,
      stack or defer. Only the first two produce a pull request comment - a deferred collision is a
      pure FYI, which the comment-routing rule already sends to the manifest rather than to a pull
      request nobody is watching. No detection-time reporting is built: the maintenance pass's
      needs-resolution label and IntegrateParent comment already cover landing time, when the target
      is stable.

      Found while designing and worth telling #139 independently: stack.PullRequest.ci is declared,
      documented, read by load_board and copied onto Branch by build_stack, but never populated -
      BoardExport._pull_request sets it from record.get("ci") against a GET /pulls payload carrying
      no such key, in the one method whose stated contract is that it refuses a missing derived
      field rather than defaulting it.

      One naming constraint is not cosmetic: builds are integration-<timestamp> with a hyphen,
      because git stores refs as files, so refs/heads/integration/<timestamp> cannot exist while
      refs/heads/integration does. The obvious naming is the one git refuses.

      Open at recording time: whether --restack defaults off locally and on in the Action, whether
      --test defaults on, whether to comment on #139 about the ci field, and whether the script and
      skill are one pull request or two (recommendation: one, since a conflict report nothing
      consumes is half a feature).

      Scope widened 2026-08-10, after recording, on the user's question of whether the skill should
      resolve conflicts as well as judge them, and whether it should ask when something is unclear
      or could be harmful. It resolves, but bounded by where the resolution lands rather than by how
      confident it is - the artifact decides the risk, not the certainty.

      On a defer verdict it resolves fully, writing into .git/rr-cache. Nothing touches a feature
      branch, the integration branch is regenerated from scratch on every build, and --test checks
      the result, so a wrong answer costs one cache entry. This replaces the design's weakest step:
      resolve --record set up a worktree and expected the developer to fix the files by hand, and
      defer is both the commonest verdict and the one where the skill has everything it needs - both
      diffs and both pull request intents. On reconcile it proposes and does not apply, because that
      is a real code change to a published pull request under review and resetting an approval to
      apply an unagreed design call is the wrong default. On stack it reports: re-basing is
      maintenance.py's work, and the base-branch PATCH 403s through the agent proxy regardless. The
      boundary is restated rather than broken - the script never writes to a branch, the skill
      writes only to rr-cache, and neither pushes.

      Asking is not driven by confidence, which would make the skill a prompt generator whose
      questions get rubber-stamped. The test is whose decision it is. Uncertainty about facts - what
      a branch does, whether two things are the same abstraction - is resolved by reading the diffs,
      the pull requests and the roadmap, never by asking. Uncertainty about intent - which
      abstraction is right, whether two branches should be one pull request - is asked. That lands
      almost exactly on reconcile, and it asks before proposing, since the proposal already encodes
      the choice. #110 and #106 building the same artifact is the precedent for the cost of not
      asking.

      One hazard follows from the skill authoring resolutions rather than replaying a human's.
      rerere matches on the conflict preimage and replays automatically, so a resolution that is
      textually matching but semantically wrong is reapplied unreviewed on every later build.
      Tolerable when a developer recorded it, different when a skill did, so a recorded resolution
      carries its provenance and the build report distinguishes skill-authored replays from
      human-authored ones - the existing rule that a replay is never silent, made auditable by
      author. A --test failure following a skill-authored resolution reports and stops rather than
      attempting another, since re-resolving into the same failure is how a build starts thrashing.

      Implemented 2026-08-10, same session as the kickoff. The three open questions were closed
      first: --restack defaults off as a plain opt-in flag (it pushes to other people's branches, so
