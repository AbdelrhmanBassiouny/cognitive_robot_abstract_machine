schema_version: 1
id: workflow-unification
title: "Workflow & tooling unification (stack workflow, personal notes, dashboards)"
description: >
  Unify the distributed workflow tooling into four clean homes: reviewed machinery on
  main via cram2 (stack tooling, ROUTINE.md doctrine, setup skill — stacked on PR #101),
  personal data/config on claude/personal-notes only, one auto-publishing Pages site for
  all plan dashboards (plans are the single surface; the stack board is retired in favor
  of GitHub's native stack map, per the one-dashboard decision of 2026-07-31), and no
  scheduled LLM Routine: stack mechanics come from GitHub's native stacked-PRs preview,
  deterministic duties move to a plain scheduled Action, and judgment work (cascade
  conflicts, red CI after restacks) runs in on-demand sessions. Then retire the
  superseded session-hooks and stack-workflow-tooling branches. Portability rule
  throughout: runnable on repos other than cram2 (native or fork-overlay install, no
  hardcoded repo names outside config defaults; hand-rolled restack derivation survives
  as the fallback for repos without the stacks preview). Since the 2026-08-20 Bastler
  pivot (decision 13), the reviewed-machinery home is concretely the bastler package:
  every tooling Python file and its tests move into it first, ahead of the remaining
  feature work, because the recorded duplication carriers kept multiplying while the
  migration waited at the back of the queue.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102

waves:
  - id: immediate
    name: "Immediate cleanups"
    description: "Independent of upstream review; can start now."
  - id: upstream
    name: "Tooling to main via cram2"
    description: "The stacked PRs on top of PR #101; land through cram2 review."
  - id: cutover
    name: "Cutover & retirement"
    description: "After the upstream wave reaches cram2/main and fork main fast-forwards."

tracks:
  - id: personal-data
    name: "Personal-notes slimming"
    wave: immediate
  - id: stack-tooling
    name: "Stack tooling & setup skill"
    wave: upstream
  - id: dashboards
    name: "Dashboard unification"
    wave: upstream
  - id: bastler
    name: "Bastler package extraction"
    wave: upstream
    description: "The tooling Python and its tests move into the bastler package; the bash layer follows as shims."
  - id: cutover
    name: "Cutover & retirements"
    wave: cutover

