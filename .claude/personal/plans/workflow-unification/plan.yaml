  - id: session-safe-pr-reparent
    branch: claude/stack-landed-parent-detection
    title: "Reparent a base through the GitHub MCP server, not a raw PATCH"
    pull_request_number: 117
    track: stack-tooling
    depends_on: [landed-parent-detection]
    status: done
    session: https://claude.ai/code/session_01WvRrTrtiznzAyvaoeCdNSq
    notes: >
      Premise disproven and item re-scoped 2026-08-02. It was spun out of
      landed-parent-detection on the reading that PATCHing any pull request's base 403s
      from a Claude Code session unconditionally, and was to replace every reparent with
      close-old-PR -> create-new-PR. A direct probe on throwaway PR #129 showed the block
      is a property of one credential, not of sessions: the MCP `update_pull_request`
      tool changed the base successfully (200), while a raw PATCH with curl and GH_TOKEN
      through the session git proxy 403'd on the same pull request minutes apart. The
      earlier attempt only ever saw the 403 because the stacks endpoints have no MCP tool,
      so that session was already in curl and stayed there.
      The stack-member 422 is unchanged and orthogonal, and the full repair
      (dissolve -> MCP base change -> re-create) was rehearsed end to end on a throwaway
      stack (204/200/201) - which is exactly the sequence landed-parent-detection already
      prescribes. That item was right about the mechanics and wrong only about the client.
      So no close+create fallback, and no reparent-recovery script: the script this item's
      notes previously said #106 "already scopes" was never actually written (verified by
      git ls-tree on both #106 and #117 - .claude/stack/ holds only README.md, ROUTINE.md,
      stack.py, stack.toml, tests/), and with the base change available there is nothing
      for it to work around. Not writing new mechanics also matches decision 11's
      direction: GitHub maintains the mechanics, we maintain policy.
      What shipped: a "BASE CHANGES GO THROUGH THE GITHUB MCP SERVER" rule stated once in
      Phase 1 recording the 403 and its cause, both reparent sites deferring to it, step 3
      of the native-stack sequence using the MCP tool and stating that the child keeps its
      number/labels/review thread, and the README source-of-truth row naming the tool.
      Four contract tests written failing first over ROUTINE.md, which is prose and had no
      coverage at all; 251 tests pass in the dev-tooling suite, was 247.
      This item has no pull request of its own. It was opened as draft PR #133 stacked on
      #117, then folded into #117 itself on the user's instruction that a PR must be
      self-sufficient and correct: #133's only purpose was correcting a section #117 had
      just introduced, so leaving it stacked meant #117 would sit in review carrying an
      instruction already known to 403. The commit fast-forwarded onto
      claude/stack-landed-parent-detection, which GitHub detected as merging #133 into its
      own base and auto-closed it - merged into that branch, not into main. #117's
      description was rewritten to explain the 403-vs-422 distinction directly so it stands
      alone, and #117 was returned to draft per the always-re-draft-after-pushing rule.
      Both this item and landed-parent-detection therefore point at #117 and land together.
      Validated live on PR #41, the case the whole thread started from: recorded Stack
      #128's composition, dissolved it (204), changed #41's base to main via the MCP tool,
      re-created the stack (201). #41's diff went from 268 files/+27,825 to 7 files/+1,318
      - exactly the four rdr/ modules and three test files its own description names -
      mergeable_state clean, and it kept its number, its four comments and its
      cram2-link-sent label. Nothing was pushed to any branch; only the base moved.
      Stack #134 carries the same seven pull requests in the same order, now trunked on
      main; #63-#98's own bases were untouched. GitHub will not reuse a dissolved stack's
      number, so #112 -> #128 -> #134 is expected, not a symptom.
      Note for anyone reading the roadmap's session-blocked-operations thread: base-change
      is NOT a third member of the tag-push/branch-delete family. Those two have no MCP
      tool at all and stay genuinely blocked; this one simply needed the other client.

  - id: ready-to-promote-upstream-links
    branch: null
    title: "PR 5: ready-to-promote sidebar list + one-click upstream create-pull-request links"
    track: dashboards
    depends_on: [shared-pr-state-chips, sidebar-bug-fix-chips]
    status: not_started
    notes: >
      Adds a fifth sidebar group to the plan dashboard - "Ready to promote" - listing every
      item whose fork pull request is open-and-ready (out of draft, i.e. self-reviewed),
      cleanly mergeable, and based on the fork's default branch, and gives each one a
      one-click link that opens the upstream compare-and-create page with the title and
      body prefilled and the fork pull request linked from it. This is ROUTINE.md Phase 3's
      link building turned into a surface instead of an emailed summary: the same
      compare URL format, computed deterministically at dashboard build time, so it needs
      no scheduled LLM run to reach the user - which is exactly what routine-cutover's
      endgame requires of every deterministic duty. Portability rule applies as everywhere
      else: the upstream is a new optional plan.yaml field (upstream_repository, plus an
      optional upstream_base defaulting to the fork's own base), never a hardcoded cram2;
      a plan without it renders no group and no links. Decisions settled with the user at
      planning time (2026-08-01): the link builder lands in the bastler package
      PR 3 creates, next to pr_state, so the scheduled Action can reuse it verbatim; the
      prefilled body is the fork pull request's own description truncated to one paragraph
      plus a "Full detail" link back to it, matching the doctrine's existing warning that a
      compare URL silently drops an over-long body; check state is shown as a chip and
      never excludes an item, since a red robotics job routinely has nothing to do with the
      pull request under it; and an item leaves the list when the user applies the in-review
      label after clicking Create, with cram2-link-sent left alone entirely - it exists only
      to stop the Routine re-emailing a link, which a stateless recomputed list does not
      need. Requires three new fields in pr_data.json that PR 3's pull request entry does
      not yet carry (base, title, body) plus pr-data-fetching.md's minimum field set updated
      to match; mergeable and the check rollup come from PR 3 as-is. Sequence before
      bastler-package, which moves build_dashboard.py wholesale.

