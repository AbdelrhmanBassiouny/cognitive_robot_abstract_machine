    status: in_progress
    pull_request_number: 185
    session: https://claude.ai/code/session_01JN9p5Kf2DKtzryspPX2KqZ
    notes: >
      Move the existing Python (.claude/stack/stack.py, build_dashboard.py + siblings,
      plan_manifest_tools.py) into the package PR 3 created, with all their tests moved to the
      standard test/ directory and the test_claude_dev_tooling CI job repointed. Boundary: SKILL.md
      files, settings.json, and the bash hook entry points stay in .claude/ (Claude Code discovers
      them by path) as thin wrappers calling python -m into the package. Constraints: zero-install
      must survive (importable from repo root; installation optional), and the package stays visibly
      dev-tooling (own directory, not published, not in the default install). Stronger dependency
      than the open-ready rule: requires #101 MERGED (this moves files in .claude/hooks/tests/ that
      #101's diff adds) and PR 3 merged or at least stable (it moves files PR 3 edits) — sequence it
      last in the upstream wave.

      Fifth carrier recorded 2026-08-11, from two review comments on #151 asking why its command
      classes are not #139's and whether the duplication across the tooling pull requests can be
      fixed. The command-class pattern now exists twice: #139's MaintenanceCommand in
      .claude/stack/maintenance_commands.py, with classproperty in .claude/stack/class_property.py,
      and #151's Subcommand in .claude/hooks/plan_item_bootstrap.py - each a frozen dataclass ABC
      whose registry comes from __subclasses__(), each with its own tests.

      They differ only in where the parser is built from, which is what decides whether the name has
      to be readable off the class: #139 builds from the classes and needs classproperty, and had to
      discover that a plain one silently loses abstractness because ABCMeta resolves it through
      getattr; #151 builds from instances, where plain ABCMeta refuses a nameless command as the
      module imports. Neither is wrong for its own module, and making them textually identical today
      means copying class_property.py into .claude/hooks/ - a fifth duplicated file added in answer
      to a complaint about duplication.

      The mechanical cause is the one this item exists to remove: .claude/hooks/ and .claude/stack/
      are separate sys.path entries, so nothing in one can import the other without the hackery
      decision 8 ends. So the command base, its registry and its tests join run_git, the GitHub
      backend rule and ItemStatus on the list this migration unifies, rather than being reconciled
      pairwise beforehand. Basing #151 on #139 was considered and declined for the same reason it
      was declined for #143: it holds a dependency-free immediate-wave item behind an unlanded
      stack-tooling pull request and still does not let either import the other.

      Re-scoped, renamed and moved to the front 2026-08-20 (decision 13, user's call - see the
      roadmap entry of that date). The package is named bastler (from the first letters of the
      user's surname Bassiouny, and the German word for a tinkerer), superseding the
      development_tooling name settled 2026-07-30; this item was dev-tooling-python-package. Two
      structural changes. First, this item now creates the package itself, branched off main,
      instead of inheriting the one #111 carries - the depends_on entry for shared-pr-state-chips
      is dropped and the dependency inverted: #111 rebases onto this branch and folds its
      development_tooling modules (pr_state, personal_notes, test/development_tooling_test) in
      under the bastler name. Second, the "sequence it last in the upstream wave" constraint in
      the first paragraph is reversed: this lands first. The cost is measured, not guessed - every
      open tooling pull request except #155 touches Python this item moves (git diff against the
      merge base per branch, 2026-08-20: #154 41 files, #151 28, #110 16, #162 10, #111 8, #107 7,
      #158 4, #135 3, #146 3, #184/#150/#149/#157/#160 2, #156 1) - and accepted: each merges main
      across the move and re-applies its delta in the package, the resolution pattern #111 already
      exercised 2026-08-05, with the maintenance pass's needs-resolution flow reporting each
      conflict to its owner. A pull request already through review may instead land just before
      the migration's own final merge-main, which folds it in on the migration side - cheaper,
      and the user decides per pull request at merge time. Scope at creation is everything Python
      already on main: .claude/stack/ (stack.py, the maintenance modules, class_property.py,
      tests), .claude/skills/plan-dashboard/ (the seven modules plus tests), and .claude/hooks/
      (plan_item_bootstrap.py, plan_manifest_tools.py, plan_updates_since_support.py, tests),
      with the tests under test/bastler_test/ and the test_claude_dev_tooling CI job repointed
      and renamed test_bastler. The duplication carriers recorded on this item and its siblings
      are unified in the move rather than after it: run_git three times (#135, #143, stack.py's
      deliberately-opposite _git stays distinct), the command-class base plus classproperty twice
      (#139, #151), ItemStatus, and the personal-notes precedence rules' second Python copy. The
      GitHub backend rule stays with bastler-github-api-unification, which keeps its own item.
      Boundaries unchanged from decisions 8 and 12: SKILL.md files, settings.json and the bash
      entry points stay in .claude/ as thin wrappers; zero-install survives (importable from the
      repo root, pyproject for optional install); the SessionStart-reachable tier stays
      stdlib-only.

      Resolved 2026-08-23 (session https://claude.ai/code/session_01Hgt7hWYnT9ZMK6AgusPwkk). Two
      things were wrong and the manifest recorded neither: a merge conflict that had left this
      pull request needs-resolution and skipped by every maintenance pass since 2026-08-22, and a
      34-thread review round, all the user's, none of them answered. Fifth item on this plan where
      the pull request was the more accurate source.

      The merge was three modules rather than three conflicts. main gained Python under .claude/
      after this branch was cut - check_scope_overlap.py with #135, record_dashboard_url.py with
      #150, upstream_reviews.py with #146 - so resolving only the reported conflicts would have
      produced a branch that merges and then fails its own "no .py remains under .claude/"
      contract. All three moved into the package, with three consequences: upstream_reviews.py was
      a fourth carrier of the sys.path hackery this migration deletes (it inserted .claude/stack/
      to import stack.py's Repository, in production rather than a conftest); the two gh stubs
      recognized disjoint invocations and became one; and .claude/upstream_reviews/tests/ was in
      no CI job at all on main, so folding it into test/bastler_test/ runs it in test_bastler for
      the first time.

      The review round grouped into four asks and all four are done. The package carries its own
      metadata now - author, maintainer, license, urls, keywords, classifiers, an empty
      __init__.py with the content in bastler/README.md, and the repository's own version
      mechanism (root VERSION through scripts/sync_version.py and bastler/_version.py) rather than
      a literal; the "never published" claim is deleted from both files, with publishing and the
      agent-provider plugins left to their own item. bastler/package_layout.py holds what the
      package declares about itself and test_package_contract.py only checks it, with one test
      holding the declared module set equal to the directory's actual contents.
      test/bastler_test/constants.py holds the paths that have no import to derive them from, as
      ToolingDirectory and PersonalNotesPath, while every module name and path is read off the
      import instead. test/bastler_test/script_runner.py is the
      ScriptRunner/PythonModuleRunner/BashScriptRunner hierarchy, with the environment variation
      collapsed into one removed_variable_prefixes field, used by six call sites.

      The dependency tier's stated justification was wrong and measuring it is what fixed it. It
      claimed a hook may import only the standard library because a hook runs where nothing is
      installed; session-start.sh in fact invokes no module of this package at all - it is bash
      plus one stdlib-only heredoc inside check-setup.sh - so the framing protected a caller that
      does not exist. What a tier answers is whether an entry point runs on a checkout where
      nothing has been installed or needs pip install -r bastler/requirements.txt first.
      Auto-detection and auto-installation already exist one layer up (check-setup.sh reports,
      /setup-personal-notes installs); putting a pip install inside the SessionStart hook was
      deliberately not done, because it writes to a contributor's environment unasked on every
      fresh container and can fail where a report cannot.

      One ask cannot be done and the measurement is the answer: monkeypatch.setattr takes the
      attribute name as a string by its own signature, so "RESTACK_STEPS" cannot be derived from
      importing RESTACK_STEPS. It is already guarded, since setattr raises when the attribute does
      not exist.

      616 tests pass, against 536 before this session. check-setup.sh exits 0 with every row ok
      and all thirteen entry points answer --help. Four commits: the merge, the metadata and
      declaration, the constants and runner, the fixture moves. Still a draft.

      The run_git seam is now reachable for the first time, since check_scope_overlap.py landed on
      main with #135 and both halves of that pair are finally in one importable tree - but
      unifying it stays bastler-notes-core-python's by name, per decision 12. #151's Subcommand is
      still unlanded, so the command-class pair remains half-visible.

      Correction to the tier finding above, measured after the user asked whether the tiers
      are needed at all once a hook can install. The earlier paragraph is true of
      session-start.sh and draws too broad a conclusion from it: the standard-library tier
      does have a live caller, and it is a workflow rather than a hook.
      .github/workflows/upstream-reviews.yml runs python3 -m bastler.upstream_reviews on a
      bare ubuntu-latest with actions/setup-python and no pip install step at all, and that
      module imports bastler.stack - so both must stay standard-library-only or #146's whole
      read breaks. Verified by importing each with yaml, jinja2, markdown and nh3 made
      unimportable. The session-invoked entry points (stack, maintenance, check_scope_overlap,
      plan_updates_since_support) are the same case one step weaker: a fresh container has
      nothing installed, which is why check-setup.sh reports dashboard_dependencies
      needs-setup on essentially every one.

      So installing during a hook does not dissolve the tier - it would have to be installing
      everywhere, and adding a pip install step to a runner in order to serve a stdlib-only
      script is strictly worse than the script staying stdlib-only.

      Three members of package_layout.py were dead, though, and are deleted (d13afaf8b):
      REQUIREMENTS_FILE had no reader, since the shell resolves BASTLER_REQUIREMENTS_FILE
      itself and pyproject reads the file through setuptools' dynamic table; MODULES_BY_NAME
      and PackageModule.path had none either. 616 tests still pass.

      Re-scoped again the same day, on the user's three objections: the hand-added module
      list, having to be careful with tiers, and the fact that bastler is meant to import
      krrood eventually anyway. The first two are answered by deriving rather than declaring
      (a62a79525). The modules come from the directory, the entry points from each module's
      own __main__ block read by ast, and the requirements' import names from requirements.txt
      through importlib.metadata.packages_distributions - which is what maps PyYAML to yaml,
      the one part of it no file states. So 29 hand-written entries, the DependencyTier enum
      and the tier table are all gone, and a module added later is discovered, checked and
      held to the default with nothing written down.

      What stays declared is one flat set, MODULES_THAT_MAY_NEED_THE_REQUIREMENTS, plus one
      UninstalledInvocation naming the caller that runs a module with nothing installed. The
      default inverts: a module imports on the standard library unless named, rather than
      every module being classified into a tier. Both are held in both directions - a module
      that starts needing a requirement fails until it is named, one named that no longer
      needs one fails until it is removed, and a caller that gains an install step or stops
      invoking its module fails too.

      That reverse check found a wrong declaration on its first run: record_dashboard_url was
      PLAN_MANIFEST and imports only the standard library, because it parses the cache with a
      regex. The old tier test could not see it by construction - it only ever checked that a
      module stayed within its tier, never that it needed it. So the shape that is cheaper to
      maintain also caught something the more elaborate one could not.

      Coverage was checked rather than assumed, and the first attempt lost some: parametrizing
      only over the declared caller took the suite from 616 to 592, because 21 modules stopped
      being checked at all. The exception set restored it - the standard-library check
      parametrizes over every discovered module outside the set. 621 tests pass, five
      mutations checked, each caught by exactly the test that names it.

      The user's third point is a decision this item does not act on and the plan now records:
      bastler is to depend on krrood, to cut duplication rather than mirror its idioms. That
      makes decision 12's version-1 independence a stage rather than a permanent state - it
      stays right for this pull request, and the krrood adoption is wanted rather than
      hypothetical. It also decides the endgame for what is left declared here: once bastler
      imports krrood the standard-library default is no longer reachable, so the exception set
      inverts into a short list of what still has to run light, and the UninstalledInvocation
      entries are what say which those are. Nothing about the derivation changes, which is why
      it was worth doing first.

      Inverted again the same day (b45903ffc), on the user's objection to naming the modules
      that may import something: name the ones that must not, if anything has to be named at
      all. Taken one step further, because the must-not set is derivable. What is declared is
      UNINSTALLED_INVOCATIONS, five callers that run a module of this package with nothing
      installed - the Actions workflow plus four session-side callers, each with the reason
      its own file is checked against - and modules_that_must_not_import_third_party()
      computes the rest as the import closure of what those callers reach. Five declarations
      cover seventeen modules and no module is named anywhere.
      MODULES_THAT_MAY_NEED_THE_REQUIREMENTS is deleted.

      The default inverts with it, and this is the part that makes the previous shape wrong
      rather than merely longer: a module reached by an uninstalled caller must import on the
      standard library, and a module reached by none may import whatever it likes, because
      nothing runs it before an install. The 21-module check the exception set restored was
      over-constraining without a caller behind it - plan_model, record_dashboard_url,
      _version and package_layout are held to nothing now, correctly.

      Four mutations, each caught by exactly the test that names it: a module deep in the
      closure growing an import (three failures - maintenance, maintenance_commands,
      maintenance_report), a caller gaining a pip step, a caller ceasing to invoke its module,
      and a constrained module reaching an unconstrained one. The last found a real gap in the
      derivation: _sibling_imports_of read node.module for from bastler.x import y and missed
      from bastler import x, where the module name is in the alias. Both forms are read now.

      One process failure worth carrying, since it is the second instance in two days of the
      same shape. Deleting the exception set with a slice from one anchor to the next also
      deleted
      test_every_uninstalled_caller_still_invokes_its_module_and_still_installs_nothing, which
      sat between them - and the suite stayed green at 66, so nothing flagged it. It surfaced
      only because a mutation that had been caught an hour earlier stopped being caught. A
      green run after a deletion says nothing about what the deletion took with it; the check
      is the mutation that used to fail, or the test count.

