      Merged main twice as it moved (#106, #115, #119, #402 and others landing): the second
      integration conflicted in ci.yml, README.md and .claude/hooks/README.md, all
      additive-vs-additive and all resolved keeping both sides - the pytest line now lists
      all four test directories. resolve-personal-notes-config.sh auto-merged exactly as the
      pre-open merge-tree check predicted. 347 tests pass across the four suites, and
      .claude/stack/tests existing on main means the full four-directory command runs for the
      first time. Textual overlap with #121's and #126's session-start.sh/check-setup.sh
      work is nil; the shared surface is resolve-personal-notes-config.sh (new constants
      appended) and the three plan-*/SKILL.md files, which no other in-flight item on this
      track touches.

  - id: plan-item-bootstrap
    branch: claude/plan-item-kickoff-workflow-vocs6b
    title: "Bootstrap an item's branch, draft pull request and manifest state before implementing"
    pull_request_number: 143
    track: personal-data
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01VoH56TLkH5rA5EFu2xhML9
    notes: >
      Raised 2026-08-04. Today a session that has just had an implementation plan approved
      goes straight to writing code, and the branch, the draft pull request, the manifest's
      branch/session/status fields, the roadmap entry and the dashboard all follow at the
      end - so for the whole length of the implementation the plan says the item is
      not_started with no branch, and any other session reading it is reading a lie. The
      user's requirement is the inversion: the first step after a plan is approved creates
      the branch and the draft pull request, writes the approved plan plus branch, session
      and pull request number into plan.yaml and roadmap.md, flips the item to in_progress,
      and republishes the dashboard - and only then does implementation start. None of that
      waits on the code, because none of it depends on the code.
      Shape revised 2026-08-04 by the user, and the revision is what fixes the design: this
      is not one procedure two skills share, it is two operations one module offers, and each
      skill takes only the one it needs. Recording an item - write or update its plan.yaml
      entry and roadmap.md section, set its status, run save-plan.sh - is add-plan-item's
      whole business, and it is all add-plan-item gets. Opening the work - create the branch,
      push it, open the draft pull request, write the branch, session and pull request number
      back onto the item and flip it to in_progress - belongs only to plan-item-kickoff, the
      skill whose approved plan leads straight into implementing. Kickoff calls both, in that
      order, because the pull request number does not exist until the pull request does.
      The first shape had add-plan-item referencing the whole thing, which would have handed a
      branch-and-push step to a skill whose own opening paragraph promises it never creates a
      branch or pushes anything. Splitting on what each caller actually needs keeps that
      promise intact and gives each operation one reason to change.
      The skills stay prose that says when to run which operation; everything mechanical is
      Python with real dataclasses - a record request (plan id, item id, title, track, status,
      roadmap section) and an open request (branch name, base branch, session URL, pull
      request title and body), each with its own result - not steps a session re-improvises.
      It belongs beside plan_manifest_tools.py in .claude/hooks/ rather than in a skill
      directory, since two skills call into it and dev-tooling-save-plan-python already
      absorbs that file into the package - this rides the same migration instead of inventing
      a second destination that would have to be moved again.
      Exactly one part cannot be pure script, and the item's job is to hand it back explicitly
      rather than pretend: only a live session can call the Artifact tool, so the dashboard
      republish stays a /plan-dashboard step exactly as save-plan.sh already documents. Both
      operations end there, since both change what a published dashboard should show.
      Creating the pull request was the open question, and it was probed rather than left to
      inference. POST /repos/{o}/{r}/pulls with a deliberately unresolvable head returns 422
      Validation Failed on the head field, with documentation_url on docs.github.com - so the
      request reaches GitHub and is authorised, and the endpoint is not refused by request
      shape the way the base-branch PATCH is (whose refusal carries docs.anthropic.com). The
      script can therefore create the pull request itself, which is the answer this item
      needed. The user's framing - that it works given an exported token - is right about the
      outcome and worth correcting on the mechanism: the identical 422 comes back with the
      exported GH_TOKEN, with a junk token and with no Authorization header at all, so within
      a session the credential is irrelevant and the proxy supplies the identity. Nothing is
      gained by exporting a token here and nothing is lost by having none. What the probe does
      not cover, because a 422 on head stops evaluation before anything is created: that a
      creation actually succeeds, that draft: true is honoured, and which identity the result
      is attributed to. Those need one throwaway creation against the fork, in the shape #139
      used for its own live run.
      Portability is the reason the credential still matters even though it is inert here: the
      same script run from a terminal or from routine-cutover's Action has no proxy and the
      token is the credential. So creation goes through the one shared backend
      dev-tooling-github-api-unification builds, never a third copy of the gh-CLI-else-token
      rule that github-api.sh and pr_state already carry.
      Basing was decided by running add-plan-item's own check_scope_overlap.py against main
      rather than by feel. Everything the work builds on is already on main -
      plan-item-kickoff/SKILL.md, plan-create/SKILL.md, save-plan.sh, plan_manifest_tools.py,
      resolve-personal-notes-config.sh and the .claude/hooks/tests/ directory ci.yml already
      runs, so no new ci.yml pytest entry is needed and the one conflict #135, #106 and #107
      all share on that line is avoided outright. The only requested paths absent from main
      are .claude/skills/add-plan-item/{SKILL.md,scope-decision.md}, which #135 introduces,
      and they are needed for exactly one line - the reference from add-plan-item's step 6.
      By the scope rule's own prefer-the-change test that single line is a change to what
      #135 introduces, so it goes on #135's branch while #135 is still an open draft, and
      this item stays based on fork main with depends_on empty; if #135 lands first the line
      simply moves into this item's own pull request. Stacking the whole item on #135 for one
      line would hold a dependency-free immediate-wave item behind a draft in review, which is
      the trade add-plan-item's own basing note already refused about #106.
      Textual overlap is the usual whichever-lands-second pattern: resolve-personal-notes-config.sh
      gains new constants (shared with #106, #107, #115, #121, #126, #135) and
      .claude/hooks/tests/ gains a new file beside the ones #107, #115, #121 and #126 touch.

      Kicked off 2026-08-04 (session_01VoH56TLkH5rA5EFu2xhML9) as draft #143 on
      claude/plan-item-kickoff-workflow-vocs6b, bootstrapped by hand in the order this item
      itself prescribes - branch, draft pull request, manifest, roadmap, dashboard, and only
      then the implementation. Two calls settled at kickoff. The notes' instruction that pull
      request creation "goes through the one shared backend dev-tooling-github-api-unification
      builds" cannot be honoured from main: that item is not_started, github-api.sh is on #107
      only, and main carries no GitHub-calling Python at all (render_common.py imports urlsplit
      and nothing else). #115's recorded precedent applies instead - implement the call inline,
      deliberately without reproducing the gh-CLI-else-token discovery, and let the unification
      item absorb it; stacking on #107/#111 would reverse this item's own basing decision. And
      plan-item-kickoff/SKILL.md's opening promise has to be rewritten rather than merely
      extended: it currently reads "never writes code, creates a branch, or pushes anything",
      which is the same contradiction that ruled out hanging this off /add-plan-item. It becomes
      "never writes code, and creates the branch and draft pull request only once the plan is
      approved", with the branch and pull request work in a new step 6 after approval, leaving
      step 5's planning half untouched.

      Implemented the same session. The live creation probe the item asked for settled all
      three unmeasured facts and the third one changed the design: creation succeeds and
      draft: true is honoured, but a pull request the script creates is attributed to
      claude[bot] - the app its requests are proxied through - while the same creation
      through the session's GitHub tool is attributed to the user, verified minutes apart on
      the same repository (throwaway #144, closed). That is the authorship problem AGENTS.md
      already rules out for commits, and it would have applied to every plan item's pull
      request. So open takes --pull-request-number for one the caller already created and
      records it instead, with the creating path kept for an unattended run whose credential
      is a real one; its title and body are required only on that path. The one line on #135
      names the script's path rather than a ${PLAN_ITEM_BOOTSTRAP_SCRIPT} constant, since
      that constant arrives with this item and a variable reference would expand to nothing
      in the window where #135 has landed and this has not.
