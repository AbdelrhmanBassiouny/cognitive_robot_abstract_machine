      local Claude Code settings (.claude/personal/settings.local.json ->
      .claude/settings.local.json, gitignored), plus save-personal-settings.sh for the
      write half; seeded with a rule allowing the Artifact tool without prompting. A
      copy that is skipped whenever the local file changed since the last sync, since
      Claude Code writes its own "don't ask again" grants into that same file - the
      baseline is a hash stamp in .claude/.personal-settings-sync-hash. This widens the
      track beyond its "slimming" name: personal-data is now personal-notes data and
