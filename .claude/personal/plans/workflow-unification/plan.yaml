      both of which the conventions already forbade in prose and neither of which anything
      enforced. (1) Work began, was implemented and was pushed before the plan item
      existed, even though the request named the plan in its first sentence: session-start
      prints a bare "plan: none" for a branch absent from the generated index, which reads
      as "no plan applies here" when it can equally mean "the plan you were told about has
      no item for this branch yet". (2) check-setup.sh was never run, so the plan-dashboard
      dependencies were discovered one ModuleNotFoundError at a time across two
      interpreters, when one read-only call reports the whole picture. Three fixes, in
      increasing strength: make session-start.sh's plan line name the ambiguity and say
      what to do about it; have session-start.sh run check-setup.sh and surface a non-zero
      exit rather than leaving it to be remembered; and, if enforcement rather than
      prompting is wanted, a PreToolUse hook on Edit|Write that refuses the first source
      edit from a branch with no plan item, with an explicit opt-out for branches that
      genuinely have no plan. The first two are the recommendation; the third is the only
      one that makes the miss impossible rather than merely unlikely. Plan mode was
      considered and rejected as the mechanism: it would probably have caught the first
      failure but rests on the same judgment that missed it, and would not have caught the
      second at all. Deliberately left unimplemented here - the user is assigning it to its
      own session.
