schema_version: 1
id: workflow-unification
title: "Workflow & tooling unification (stack workflow, personal notes, dashboards)"
description: >
  Unify the distributed workflow tooling into four clean homes: reviewed machinery on
  main via cram2 (stack tooling, ROUTINE.md doctrine, setup skill — stacked on PR #101),
  personal data/config on claude/personal-notes only, one auto-publishing Pages site for
  all plan dashboards (plans are the single surface; the stack board is retired in favor
  of GitHub's native stack map, per the one-dashboard decision of 2026-07-31), and no
  scheduled LLM Routine: stack mechanics come from GitHub's native stacked-PRs preview,
  deterministic duties move to a plain scheduled Action, and judgment work (cascade
  conflicts, red CI after restacks) runs in on-demand sessions. Then retire the
  superseded session-hooks and stack-workflow-tooling branches. Portability rule
  throughout: runnable on repos other than cram2 (native or fork-overlay install, no
  hardcoded repo names outside config defaults; hand-rolled restack derivation survives
  as the fallback for repos without the stacks preview).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102

waves:
  - id: immediate
    name: "Immediate cleanups"
    description: "Independent of upstream review; can start now."
  - id: upstream
    name: "Tooling to main via cram2"
    description: "The stacked PRs on top of PR #101; land through cram2 review."
  - id: cutover
    name: "Cutover & retirement"
    description: "After the upstream wave reaches cram2/main and fork main fast-forwards."

tracks:
  - id: personal-data
    name: "Personal-notes slimming"
    wave: immediate
  - id: stack-tooling
    name: "Stack tooling & setup skill"
    wave: upstream
  - id: dashboards
    name: "Dashboard unification"
    wave: upstream
  - id: cutover
    name: "Cutover & retirements"
    wave: cutover

items:
  - id: eql-roadmap-migration
    branch: null
    title: "Migrate the EQL living roadmap out of cram-notes.md into its own plan"
    track: personal-data
    depends_on: []
    status: done
    notes: >
      Done. Ran /plan-create eql-verbalization from the cram-notes living-roadmap
      section; folded the P1-P3 review-round logs into the three pr-progress files;
      slimmed cram-notes.md to pure conventions; fixed the stale "hook lives on
      claude/session-hooks" reference; deleted superseded rdr-roadmap.md. No PR —
      personal-notes branch only.
  - id: session-hooks-retirement
    branch: null
    title: "Tag and delete the superseded claude/session-hooks branch"
    track: personal-data
    depends_on: []
    status: done
    notes: >
      Done. claude/session-hooks's tip (ece182c5) was a literal git merge-base
      --is-ancestor of main (via PR #432), so nothing was lost by skipping the tag:
      every commit on the branch already remains reachable from main. The
      tag-push/branch-delete git operations turned out to be unavailable from a Claude
      Code session (git proxy returns 403 on tag pushes and branch deletes; no GitHub
      MCP tool substitutes) - documented as a standing platform constraint in
      roadmap.md's 2026-07-29 addendum, and flagged on the sibling item
      tooling-branch-retirement, which has the same shape. The user deleted
      claude/session-hooks directly (outside the harness) once this was confirmed
      safe. Remaining cleanup: origin/claude/push-scope-test-zsq7jc, a throwaway
      branch pushed while diagnosing the tooling gap (identical content to main),
      still needs deleting the same way.
  - id: personal-settings-sync
    branch: claude/local-settings-dashboard-sync-8sx0tf
    title: "Sync personal .claude/settings.local.json off the personal-notes branch"
    pull_request_number: 109
    track: personal-data
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_0167iZiWUnXizpKSqa7xf5rC
    notes: >
      Extends the session-start hook so the notes branch also carries this project's
      local Claude Code settings (.claude/personal/settings.local.json ->
      .claude/settings.local.json, gitignored), plus save-personal-settings.sh for the
      write half; seeded with a rule allowing the Artifact tool without prompting. A
      copy that is skipped whenever the local file changed since the last sync, since
      Claude Code writes its own "don't ask again" grants into that same file - the
      baseline is a hash stamp in .claude/.personal-settings-sync-hash. This widens the
      track beyond its "slimming" name: personal-data is now personal-notes data and
      config generally, which is what the plan's target architecture already says that
      branch holds. Independent of the #101 stack - branched off fork main, PR #109 open
      and ready. Same session also added the personal-notes rule that any session
      changing a plan's data republishes that plan's dashboard in the same turn
      (notes-branch only, no PR). File overlap to expect, not a dependency: #107 adds
      path constants to resolve-personal-notes-config.sh and #110 makes
      write-personal-notes-file.sh delegate to write-branch-files.sh - this item touches
      both, so whichever lands second merges the two. CI is green on
      test_claude_dev_tooling; the one red job (semantic_digital_twin's
      test_world_sim_state_sync) fails identically on main at this PR's base commit.

  - id: setup-personal-notes-pr101
    title: "Land /setup-personal-notes (PR #101) — the foundation the stack PRs base on"
    branch: claude/patch-pr-rheubx
    pull_request_number: 101
    track: stack-tooling
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01GR1i6dZb8goJpCZBMCnVLM
    notes: >
      Done - merged into fork main 2026-07-31T10:36:43Z (head 90f69f56, by
      AbdelrhmanBassiouny); .claude/skills/setup-personal-notes/ and
      .claude/hooks/check-setup.sh are both on main, verified by git cat-file rather
      than from the merge notification alone. Pre-existing PR, not authored by this
      plan; tracked because everything in the upstream wave stacks on its branch,
      and stacking never waited for the merge. Final content beyond the original
      patch: the hooks README rewritten as a step-based guide (378 -> ~140 lines)
      with the worked example surfaced at the top, a skill step checking the
      merged/bug/in-review labels exist in the fork, and a review round that moved
      the duplicated hook-test scratch repository onto a shared ScratchRepository
      dataclass + conftest fixture and made the check-setup report typed
      (SetupCheck/CheckStatus StrEnums, CheckResult/SetupReport dataclasses).
      Follow-up agreed and deliberately NOT in this PR: extract
      .claude/hooks/setup-personal-notes.sh --remote <name-or-url> [--starter-notes]
      taking over skill steps 4-7 and 9 so the mechanical setup runs with no session
      at all, leaving the skill only the remote-ownership decision and the label
      check. Kickoff prompt was handed to the user in the session; it is now
      unblocked, since it required this PR merged first.
      Two things worth carrying forward: three merge commits authored as
      "Claude <noreply@anthropic.com>" landed on this branch from outside any
      session (against AGENTS.md's Version Control rule) and were left unrewritten
      rather than force-pushing shared history; and the robotics CI jobs flaked
      repeatedly here on tests this .claude/-only PR cannot reach
      (test_world_sim_state_sync, test_attached_self_collision_avoid_stick), which
      the user instructed be ignored rather than chased.

  - id: stack-tooling-on-main
    branch: claude/stack-tooling-on-main
    title: "PR 1: stack workflow tooling on main (.claude/stack/)"
    pull_request_number: 106
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101]
    status: in_progress
    session: https://claude.ai/code/session_01Y9egTHHu5RTXmkFL4SwXM9
    notes: >
      Implemented as draft PR #106 (2026-07-29): stack.py ported to .claude/stack/ minus
      the round-robin/WIP-cap subsystem, per-user config layering from the personal-notes
      branch, canonical ROUTINE.md + 1-page README, tests via ScratchRepository; restack.js
      and board rendering not ported (board deferred to PR 3/PR 4 as planned). Landed as
      plain scripts — the dev-tooling Python package is created in PR 3 instead (see
      dev-tooling-python-package). Self-reviewed and un-drafted since: open and ready,
      so it unblocks its dependents by the plan's normal open-and-ready rule. Now also
      the parent of #107, which was restacked onto it (2026-07-30) so the upstream wave
      is a linear chain rather than two siblings on #101.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): before review goes
      deep, add one trim commit — (a) read stack structure from the stacks REST API
      when the PR is a stack member, keeping PR-base derivation as the fallback for
      preview-less repos; (b) ROUTINE.md merge doctrine becomes merge-async + poll
      only, never the classic merge API or the MCP merge tool on a stack member, with
      stack base.sha lagging the trunk head as the needs-cascade signal; (c) Phase 1
      REPARENT must special-case stack members — PATCH base 422s on them ("Cannot
      change the base branch because the pull request is part of a stack"), so
      reparent via unstack → PATCH base → re-stack, or leave it to gh stack sync /
      the UI Rebase-stack button. (c) is load-bearing before the next cram2 landing
      of any stacked branch: stack #112 already exists on the fork.
      Upgraded to a cut the same day (user decision, "decision 11" in the roadmap):
      the restack subsystem (restack-plan, next, status/structure derivation) is
      removed from the PR entirely rather than trimmed — native stacks own
      structure, gh stack / the Rebase-stack button own cascading, and the
      preview-less-repo fallback is YAGNI (the preview is account-wide; the old
      tooling branch remains as a tagged archive). The PR keeps: ROUTINE.md
      rewritten around native mechanics (incl. the Phase-1 reparent special case
      and merge-async doctrine), stack.toml + per-user config layering, the
      label/cram2-link helpers, a small reparent-recovery script, and tests.
      Re-scope instruction posted on the PR itself.

  - id: setup-stacked-prs-skill
    branch: claude/setup-stacked-prs-skill
    title: "PR 2: /setup-stacked-prs guided one-command setup skill"
    pull_request_number: 110
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01KGBAbjVAmX7LJMnSTJprtM
    notes: >
      Mirrors PR #101's pattern (read-only check-stack-setup.sh + guided skill +
      prerequisite-check.md) and #107's script/skill split. Two install modes: native
      (tooling on the target repo's main) and fork-overlay (creates/updates a
      never-merged tooling branch on the user's fork from the skill's canonical files;
      re-running is the updater). Creates missing labels, writes personal stack.toml,
      emits the Routine prompt. Recorded decision (user can override): for cram2 itself,
      personal config lives on the personal-notes branch, not a per-user dev branch.
      Kicked off 2026-07-30; branched off claude/setup-personal-notes-script (#107)
      rather than #106 directly, because the item needs .claude/stack/* from #106 and
      github-api.sh plus the gh/curl test stubs from #107 — which is what forced the
      restack of #107 onto #106 first. Two scope calls settled at kickoff: the
      stack-board step is guidance only (the parameterized board.yml stays PR 4's, per
      the roadmap), and "prerequisite-check.md" in these notes means this skill gets its
      own, consumed by ROUTINE.md's SETUP step 0, not a second copy of #101's.
      Implemented as draft PR #110 (2026-07-30) on claude/setup-personal-notes-script:
      check-stack-setup.sh, setup-stacked-prs.sh, write-branch-files.sh (which
      write-personal-notes-file.sh now delegates to), the skill and its
      prerequisite-check.md, a board-free `stack.py config` command, and 334 tests
      passing (was 320), all network- and credential-free. Two gaps found and fixed on
      the way: cram2-link-sent was set and cleared by ROUTINE.md but had no key in
      stack.toml, so setup could not create it; and board.json was documented as
      never-committed scratch with nothing gitignoring it. Live label creation stays
      unverified for the same reason as #107 - a fine-grained installation token, so the
      label POST is exercised only through a stub.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): setup shrinks to
      labels + personal stack.toml + optionally creating the stack itself via
      POST /repos/{owner}/{repo}/stacks; the fork-overlay install mode demotes to a
      documented fallback for repos without the stacks preview. Amend while still a
      draft. #106's same-day cut narrows this further: there is no restack engine to
      install — setup is doctrine files + labels + personal stack.toml + the optional
      stack creation.

  - id: setup-personal-notes-script
    branch: claude/setup-personal-notes-script
    title: "Extract a deterministic setup script from /setup-personal-notes"
    pull_request_number: 107
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01MyxyUN3bsvPsJnb5QuNzxd
    notes: >
      Implemented as draft PR #107 (2026-07-29), based on claude/patch-pr-rheubx rather
      than main: the user overrode this item's "requires #101 MERGED" rule. That rule was
      never really about ordering — all six files this item builds on arrive with #101, so
      basing on it is what made the work possible at all.
      Restacked onto #106 on 2026-07-30 (base retargeted, #106 merged into the branch) so
      the upstream wave is one linear chain instead of two siblings on #101: PR 2 needs
      .claude/stack/* and github-api.sh together, and the diamond alternative would have
      been invisible to stack.py restack-plan, which derives exactly one parent per branch
      from the PR base. depends_on gained stack-tooling-on-main to match. GitHub retargets
      the chain upward as each parent merges.
      The item's original premise is disproved and no longer applies: the two steps
      recorded as session-only are both scriptable (GET /user for the login,
      GET /repos/{owner}/{repo}/labels/{name} for the labels, POST .../labels to create
      one — the "no create-label tool" limit is true of MCP, not of the API). So the whole
      setup runs with no session, and SKILL.md became a thin question-asking wrapper
      (238 → 153 lines) rather than the "script plus two API steps" split the dispatch
      prompt described. Delivered: .claude/hooks/setup-personal-notes.sh
      (--remote required, --starter-notes, --create-labels), .claude/hooks/github-api.sh,
      4 new path constants, 254 tests passing (was 236), all network- and
      credential-free. Carries two incidental fixes as their own commits, both hard
      prerequisites: current_branch_upstream_remote returning git's 128 instead of "no
      upstream" (which aborted create-personal-notes-branch.sh on any branch never pushed
      with -u), and a test helper that hid an executable by dropping its whole PATH entry.
      Still unverified: label creation against a real token (this environment's is a
      fine-grained installation token, so POST .../labels is exercised only via a stub).
      Cross-note stands but shifts: PR 2 (/setup-stacked-prs) should mirror this
      script/skill split, where the skill keeps only the questions and the un-scriptable
      environment-variable step — not a split reserving the GitHub calls for a session.

  - id: shared-pr-state-chips
    branch: claude/shared-pr-state-chips
    title: "PR 3: shared pr_state module + LOC/CI/conflict chips in plan dashboards"
    pull_request_number: 111
    track: dashboards
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_014KoJeaTUxyECZZpfWiVmvr
    notes: >
      Extract one PR-state fetch/compute module (CI rollup, LOC vs base, mergeable probe,
      session-link parse) shared by stack.py and plan-dashboard's pr-data fetching; add
      board-semantics chips to build_dashboard.py items; add a headless static-HTML build
      entrypoint for the Pages Action (Artifact path keeps working during transition).
      Since PR 1 (#106) landed as plain scripts, this PR also CREATES the dev-tooling
      Python package (top-level directory importable from the repo root with no install,
      plus a pyproject for optional installation) and puts pr_state in it as its first
      module — the shared import home is what forces the package into existence here.
      Kicked off 2026-07-30 (branch based on claude/stack-tooling-on-main, a sibling of
      #107 on #106 — needs only #106's files, so decision 10's linearization doesn't
      apply). Two calls settled at kickoff: the package is named development_tooling
      (abbreviation-free per AGENTS.md), and the headless site build also pushes
      merged-to-done manifest auto-corrections, same as the live refresh path.
      (This kickoff state was accidentally reverted by a concurrent stale-scaffold save
      on 2026-07-30 14:49 and restored by the routine-cutover kickoff session.)
      Implemented as draft PR #111 (2026-07-30): development_tooling package (pr_state +
      personal_notes modules, pyproject for optional install), stack.py export restored
      through it, optional chip fields in pr_data.json rendered as CI/size/conflict
      chips (old pr_data still renders chipless), and build_site.py writing _site/ for
      PR 4's Action. 302 tests passing across both CI invocations (was 254); the new
      test/development_tooling_test suite runs with --confcutdir since the shared
      test/conftest.py imports the robotics stack. One old bug fixed in the port:
      merge-tree exits 1 for both a conflict and a missing reference, so the old probe
      reported a typo as a conflict - the port verifies references first.
      Added 2026-07-31 (native-stacks pivot, user-approved): pr_state also reads the
      PR's native stack object via REST (X-GitHub-Api-Version 2026-03-10; GraphQL is
      unusable from sessions) and renders a stack chip ("layer p/n · stack #N") when
      the PR is a stack member. #106's cut may simplify or remove the "stack.py
      export restored through the package" interplay; pr_state itself is unaffected.

  - id: dev-tooling-python-package
    branch: null
    title: "Migrate the .claude Python into the dev-tooling package, tests under test/"
    track: dashboards
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main, shared-pr-state-chips]
    status: not_started
    notes: >
      Move the existing Python (.claude/stack/stack.py, build_dashboard.py + siblings,
      plan_manifest_tools.py) into the package PR 3 created, with all their tests moved
      to the standard test/ directory and the test_claude_dev_tooling CI job repointed.
      Boundary: SKILL.md files, settings.json, and the bash hook entry points stay in
      .claude/ (Claude Code discovers them by path) as thin wrappers calling python -m
      into the package. Constraints: zero-install must survive (importable from repo
      root; installation optional), and the package stays visibly dev-tooling (own
      directory, not published, not in the default install). Stronger dependency than
      the open-ready rule: requires #101 MERGED (this moves files in
      .claude/hooks/tests/ that #101's diff adds) and PR 3 merged or at least stable
      (it moves files PR 3 edits) — sequence it last in the upstream wave.

  - id: dev-tooling-notes-core-python
    branch: null
    title: "Bash→Python 1: notes-core modules (config, git seam, writer, markers)"
    track: dashboards
    depends_on: [dev-tooling-python-package]
    status: not_started
    notes: >
      Pure addition to development_tooling, no bash file changes (decision 12):
      errors.py (stdlib-only dataclass-exception base mirroring krrood's
      DataclassException idiom — typed context fields, abstract
      error_message/suggest_correction composed in __post_init__ — without importing
      krrood), personal_notes_configuration.py (ConfigurationSource StrEnum, frozen
      ResolvedSetting and PersonalNotesConfiguration.resolve with the git-config >
      environment > default precedence), git_interface.py (thin GitRepository
      dataclass as the dependency seam; the real-git ScratchRepository harness stays
      the primary test strategy, no fakes), notes_branch.py (fetch_notes_branch with
      the upstream-remote fallback, ScratchWorktree context manager with
      pid+uuid-suffixed scratch branch names, NotesBranchWriter with a bounded
      re-fetch/re-apply push retry), marker_sections.py (single source for the
      CLAUDE.local.md BEGIN/END markers currently duplicated between session-start
      and every save script), and __main__.py with only the configuration
      subcommand. The SessionStart-reachable surface is stdlib-only, enforced by an
      import-block test. Includes a real two-writer non-fast-forward retry test
      against the bare notes remote.

  - id: dev-tooling-save-commands-python
    branch: null
    title: "Bash→Python 2: the four notes writers become python -m subcommands"
    track: dashboards
    depends_on: [dev-tooling-notes-core-python]
    status: not_started
    notes: >
      save-personal-notes.sh, save-pr-progress.sh, write-personal-notes-file.sh and
      create-personal-notes-branch.sh become three-line shims (cd to root, exec
      python3 -m development_tooling <subcommand> "$@"); their bodies move onto the
      core modules, collapsing the four near-identical scratch-worktree write dances
      into NotesBranchWriter. Known defects fixed here, each proven by a failing
      test first: a missing BEGIN-PERSONAL-NOTES marker pushed the entire
      CLAUDE.local.md (PR-progress section included) into the notes file; fixed
      scratch branch names raced between concurrent sessions; a rejected
      non-fast-forward push lost the edit after the cleanup trap deleted the
      committed scratch worktree; a trailing flag died with "$2: unbound variable"
      instead of a usage message. Flag names, stdout lines and exit codes are
      external API and stay unchanged, pinned by shim-level subprocess contract
      tests. Sequence after the in-flight bash-touching PRs (#107 #109 #110 #115
      #121 #126) land — a wholesale body rewrite cannot be merged by the
      whichever-lands-second-merges convention.

  - id: dev-tooling-save-plan-python
    branch: null
    title: "Bash→Python 3: save-plan and the plan manifest tools"
    track: dashboards
    depends_on: [dev-tooling-save-commands-python]
    status: not_started
    notes: >
      save-plan.sh becomes a shim; plan_manifest_tools.py is absorbed as
      plan_manifest.py (read-id, regenerate-branch-index, YamlBooleanCoercionError).
      New validation with curated errors instead of cp/traceback noise: the roadmap
      marker block must be non-empty (today an empty block silently overwrites
      roadmap.md) and the --manifest/--roadmap source files must exist.
      test_plan_manifest_tools.py carries over with an import change;
      test_save_plan_sh.py carries over as the shim contract test.

  - id: dev-tooling-session-start-python
    branch: null
    title: "Bash→Python 4: session-start behind an inert probing shim"
    track: dashboards
    depends_on: [dev-tooling-notes-core-python, session-start-plan-and-setup-guards, git-identity-from-personal-notes]
    status: not_started
    notes: >
      session-start.sh keeps its path (settings.json stays byte-identical) but its
      body becomes the one guarded shim: command -v python3 plus a >=3.11 version
      probe, exiting 0 with a single diagnostic line when absent, so the hook stays
      inert on machines without python3 (user-accepted floor raise — every targeted
      environment ships 3.11+). session_start.py is stdlib-only end to end (yaml,
      jinja2, markdown, nh3 blocked in an import test) and reproduces the 4-line
      stdout summary and every written marker/header byte-for-byte, pinned by
      golden-output fixtures recorded from the bash version before deletion. The
      tracking_issue grep pipeline that kills the hook under pipefail when the field
      is absent (found by #121's first session-start tests) becomes a re.search
      returning None. Depends on #121 and #126 so their run_hook_script subprocess
      tests carry over as the shim contract tests instead of colliding.

  - id: dev-tooling-setup-checks-python
    branch: null
    title: "Bash→Python 5: check-setup as typed rows"
    track: dashboards
    depends_on: [dev-tooling-notes-core-python]
    status: not_started
    notes: >
      check-setup.sh becomes a shim over setup_checks.py: SetupCheckIdentifier and
      SetupCheckStatus StrEnums, frozen SetupCheckRow, SetupReport with the exact
      TSV row order and exit-code semantics preserved (external API for
      setup-personal-notes and prerequisite-check.md). The parsing enums
      test_check_setup_sh.py already defines move into the production module and the
      test imports them instead. Two fixes: the settings.json check parses the JSON
      and verifies a SessionStart hook command rather than grepping for the
      substring session-start.sh anywhere in the file, and the inline python3
      heredoc becomes missing_requirements() via importlib.metadata. Runs parallel
      to the other conversions off the core item.

  - id: dev-tooling-dashboard-refresh-python
    branch: null
    title: "Bash→Python 6: refresh_dashboard orchestration in-process"
    track: dashboards
    depends_on: [dev-tooling-save-commands-python]
    status: not_started
    notes: >
      refresh_dashboard.sh becomes a shim over dashboard_refresh.py, which calls
      sync_manifest_status/build_dashboard in-process (dev-tooling-python-package has
      moved them into the package by this point) and pushes manifest corrections
      through NotesBranchWriter instead of shelling out to
      write-personal-notes-file.sh. refresh_dashboard_support.py — which exists only
      as JSON plumbing for the shell orchestrator — is deleted along with its
      REFRESH_DASHBOARD_SUPPORT_SCRIPT constant; count-corrected/merge-summaries
      become internal functions. The merged single-JSON stdout contract and the
      --plan-id flag surface stay unchanged; test_refresh_dashboard_sh.py carries
      over as the shim contract test.

  - id: dev-tooling-config-shim-slimming
    branch: null
    title: "Bash→Python 7: slim the sourced config file to constants"
    track: dashboards
    depends_on: [dev-tooling-save-commands-python, dev-tooling-save-plan-python, dev-tooling-session-start-python, dev-tooling-setup-checks-python, dev-tooling-dashboard-refresh-python]
    status: not_started
    notes: >
      resolve-personal-notes-config.sh keeps its sourcing contract (10 doc locations
      plus ci.yml twice source it for variables and the cd-to-root side effect —
      zero mandatory SKILL.md changes by construction) but shrinks to the cd
      preamble, the three NOTES_* resolutions, the path constants, and the trivial
      pure-string path helpers. The behavioral functions
      (fetch_personal_notes_branch, current_branch_upstream_remote,
      default_branch_name, pr_progress_path, plan_id_for_branch) are deleted once a
      grep of all SKILL.md/*.md confirms no prose instructs a session to call them.
