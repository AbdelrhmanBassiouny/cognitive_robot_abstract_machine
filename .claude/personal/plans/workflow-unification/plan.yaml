      The round's centre is one ask that cannot be built, established by probing rather than by
      argument. `TipStatus` was to inherit `TipStatusSpecification` *in addition to* `StrEnum`:
      Python allows exactly one data-type mixin and `StrEnum` already spends it on `str`, so that
      raises `TypeError: too many data types` on 3.11 and on CI's 3.12 alike. Dropping `StrEnum` to
      inherit does build, and costs more than the previous round's reply knew - beyond `json.dumps`
      refusing the report, `asdict` recurses into a member that is itself a dataclass, so a status
      would silently serialize as a nested object instead of one word, changing a wire format two
      other programs parse. `dict_factory` cannot fix it, since it runs after the member is already
      a dict.

