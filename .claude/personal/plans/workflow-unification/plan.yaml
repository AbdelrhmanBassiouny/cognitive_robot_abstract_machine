      applied. What matters more is what is *not* available: rerere replays a merge conflict's
      resolution, and a semantic break has no conflict to key one on, so nothing can be recorded and
      every later build carries it until a branch changes. Reasoning by analogy from the merge case
      is the mistake the section exists to prevent, and a contract test pins that sentence because
      an agent that recorded a resolution would be reporting a fix that does not exist.

