schema_version: 1
id: workflow-unification
title: "Workflow & tooling unification (stack workflow, personal notes, dashboards)"
description: >
  Unify the distributed workflow tooling into four clean homes: reviewed machinery on
  main via cram2 (stack tooling, ROUTINE.md doctrine, setup skill — stacked on PR #101),
  personal data/config on claude/personal-notes only, one auto-publishing Pages site for
  the stack board and all plan dashboards (with LOC/CI chips everywhere), and a slim
  pointer Routine. Then retire the superseded session-hooks and stack-workflow-tooling
  branches. Portability rule throughout: runnable on repos other than cram2 (native or
  fork-overlay install, no hardcoded repo names outside config defaults).
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102

waves:
  - id: immediate
    name: "Immediate cleanups"
    description: "Independent of upstream review; can start now."
  - id: upstream
    name: "Tooling to main via cram2"
    description: "The stacked PRs on top of PR #101; land through cram2 review."
  - id: cutover
    name: "Cutover & retirement"
    description: "After the upstream wave reaches cram2/main and fork main fast-forwards."

tracks:
  - id: personal-data
    name: "Personal-notes slimming"
    wave: immediate
  - id: stack-tooling
    name: "Stack tooling & setup skill"
    wave: upstream
  - id: dashboards
    name: "Dashboard unification"
    wave: upstream
  - id: cutover
    name: "Cutover & retirements"
    wave: cutover

items:
  - id: eql-roadmap-migration
    branch: null
    title: "Migrate the EQL living roadmap out of cram-notes.md into its own plan"
    track: personal-data
    depends_on: []
    status: done
    notes: >
      Done. Ran /plan-create eql-verbalization from the cram-notes living-roadmap
      section; folded the P1-P3 review-round logs into the three pr-progress files;
      slimmed cram-notes.md to pure conventions; fixed the stale "hook lives on
      claude/session-hooks" reference; deleted superseded rdr-roadmap.md. No PR —
      personal-notes branch only.
  - id: session-hooks-retirement
    branch: null
    title: "Tag and delete the superseded claude/session-hooks branch"
    track: personal-data
    depends_on: []
    status: done
    notes: >
      Done. claude/session-hooks's tip (ece182c5) was a literal git merge-base
      --is-ancestor of main (via PR #432), so nothing was lost by skipping the tag:
      every commit on the branch already remains reachable from main. The
      tag-push/branch-delete git operations turned out to be unavailable from a Claude
      Code session (git proxy returns 403 on tag pushes and branch deletes; no GitHub
      MCP tool substitutes) - documented as a standing platform constraint in
      roadmap.md's 2026-07-29 addendum, and flagged on the sibling item
      tooling-branch-retirement, which has the same shape. The user deleted
      claude/session-hooks directly (outside the harness) once this was confirmed
      safe. Remaining cleanup: origin/claude/push-scope-test-zsq7jc, a throwaway
      branch pushed while diagnosing the tooling gap (identical content to main),
      still needs deleting the same way.
  - id: setup-personal-notes-pr101
    title: "Land /setup-personal-notes (PR #101) — the foundation the stack PRs base on"
    branch: claude/patch-pr-rheubx
    pull_request_number: 101
    track: stack-tooling
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01GR1i6dZb8goJpCZBMCnVLM
    notes: >
      Pre-existing PR, not authored by this plan; tracked because everything in the
      upstream wave stacks on its branch. Live state at plan creation: open, ready,
      mergeable clean, label cram2-link-sent (awaiting the one-click cram2 create).
      Stacking does not wait for the merge.

  - id: stack-tooling-on-main
    branch: claude/stack-tooling-on-main
    title: "PR 1: stack workflow tooling on main (.claude/stack/)"
    pull_request_number: 106
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101]
    status: in_progress
    session: https://claude.ai/code/session_01Y9egTHHu5RTXmkFL4SwXM9
    notes: >
      Implemented as draft PR #106 (2026-07-29): stack.py ported to .claude/stack/ minus
      the round-robin/WIP-cap subsystem, per-user config layering from the personal-notes
      branch, canonical ROUTINE.md + 1-page README, tests via ScratchRepository; restack.js
      and board rendering not ported (board deferred to PR 3/PR 4 as planned). Landed as
      plain scripts — the dev-tooling Python package is created in PR 3 instead (see
      dev-tooling-python-package). Self-reviewed and un-drafted since: open and ready,
      so it unblocks its dependents by the plan's normal open-and-ready rule. Now also
      the parent of #107, which was restacked onto it (2026-07-30) so the upstream wave
      is a linear chain rather than two siblings on #101.

  - id: setup-stacked-prs-skill
    branch: claude/setup-stacked-prs-skill
    title: "PR 2: /setup-stacked-prs guided one-command setup skill"
    pull_request_number: 110
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01KGBAbjVAmX7LJMnSTJprtM
    notes: >
      Mirrors PR #101's pattern (read-only check-stack-setup.sh + guided skill +
      prerequisite-check.md) and #107's script/skill split. Two install modes: native
      (tooling on the target repo's main) and fork-overlay (creates/updates a
      never-merged tooling branch on the user's fork from the skill's canonical files;
      re-running is the updater). Creates missing labels, writes personal stack.toml,
      emits the Routine prompt. Recorded decision (user can override): for cram2 itself,
      personal config lives on the personal-notes branch, not a per-user dev branch.
      Kicked off 2026-07-30; branched off claude/setup-personal-notes-script (#107)
      rather than #106 directly, because the item needs .claude/stack/* from #106 and
      github-api.sh plus the gh/curl test stubs from #107 — which is what forced the
      restack of #107 onto #106 first. Two scope calls settled at kickoff: the
      stack-board step is guidance only (the parameterized board.yml stays PR 4's, per
      the roadmap), and "prerequisite-check.md" in these notes means this skill gets its
      own, consumed by ROUTINE.md's SETUP step 0, not a second copy of #101's.
      Implemented as draft PR #110 (2026-07-30) on claude/setup-personal-notes-script:
      check-stack-setup.sh, setup-stacked-prs.sh, write-branch-files.sh (which
      write-personal-notes-file.sh now delegates to), the skill and its
      prerequisite-check.md, a board-free `stack.py config` command, and 334 tests
      passing (was 320), all network- and credential-free. Two gaps found and fixed on
      the way: cram2-link-sent was set and cleared by ROUTINE.md but had no key in
      stack.toml, so setup could not create it; and board.json was documented as
      never-committed scratch with nothing gitignoring it. Live label creation stays
      unverified for the same reason as #107 - a fine-grained installation token, so the
      label POST is exercised only through a stub.

  - id: setup-personal-notes-script
    branch: claude/setup-personal-notes-script
    title: "Extract a deterministic setup script from /setup-personal-notes"
    pull_request_number: 107
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01MyxyUN3bsvPsJnb5QuNzxd
    notes: >
      Implemented as draft PR #107 (2026-07-29), based on claude/patch-pr-rheubx rather
      than main: the user overrode this item's "requires #101 MERGED" rule. That rule was
      never really about ordering — all six files this item builds on arrive with #101, so
      basing on it is what made the work possible at all.
      Restacked onto #106 on 2026-07-30 (base retargeted, #106 merged into the branch) so
      the upstream wave is one linear chain instead of two siblings on #101: PR 2 needs
      .claude/stack/* and github-api.sh together, and the diamond alternative would have
      been invisible to stack.py restack-plan, which derives exactly one parent per branch
      from the PR base. depends_on gained stack-tooling-on-main to match. GitHub retargets
      the chain upward as each parent merges.
      The item's original premise is disproved and no longer applies: the two steps
      recorded as session-only are both scriptable (GET /user for the login,
      GET /repos/{owner}/{repo}/labels/{name} for the labels, POST .../labels to create
      one — the "no create-label tool" limit is true of MCP, not of the API). So the whole
      setup runs with no session, and SKILL.md became a thin question-asking wrapper
      (238 → 153 lines) rather than the "script plus two API steps" split the dispatch
      prompt described. Delivered: .claude/hooks/setup-personal-notes.sh
      (--remote required, --starter-notes, --create-labels), .claude/hooks/github-api.sh,
      4 new path constants, 254 tests passing (was 236), all network- and
      credential-free. Carries two incidental fixes as their own commits, both hard
      prerequisites: current_branch_upstream_remote returning git's 128 instead of "no
      upstream" (which aborted create-personal-notes-branch.sh on any branch never pushed
      with -u), and a test helper that hid an executable by dropping its whole PATH entry.
      Still unverified: label creation against a real token (this environment's is a
      fine-grained installation token, so POST .../labels is exercised only via a stub).
      Cross-note stands but shifts: PR 2 (/setup-stacked-prs) should mirror this
      script/skill split, where the skill keeps only the questions and the un-scriptable
      environment-variable step — not a split reserving the GitHub calls for a session.

  - id: shared-pr-state-chips
    branch: null
    title: "PR 3: shared pr_state module + LOC/CI/conflict chips in plan dashboards"
    track: dashboards
    depends_on: [stack-tooling-on-main]
    status: not_started
    notes: >
      Extract one PR-state fetch/compute module (CI rollup, LOC vs base, mergeable probe,
      session-link parse) shared by stack.py and plan-dashboard's pr-data fetching; add
      board-semantics chips to build_dashboard.py items; add a headless static-HTML build
      entrypoint for the Pages Action (Artifact path keeps working during transition).
      Since PR 1 (#106) landed as plain scripts, this PR also CREATES the dev-tooling
      Python package (top-level directory importable from the repo root with no install,
      plus a pyproject for optional installation) and puts pr_state in it as its first
      module — the shared import home is what forces the package into existence here.

  - id: dev-tooling-python-package
    branch: null
    title: "Migrate the .claude Python into the dev-tooling package, tests under test/"
    track: dashboards
    depends_on: [setup-personal-notes-pr101, stack-tooling-on-main, shared-pr-state-chips]
    status: not_started
    notes: >
      Move the existing Python (.claude/stack/stack.py, build_dashboard.py + siblings,
      plan_manifest_tools.py) into the package PR 3 created, with all their tests moved
      to the standard test/ directory and the test_claude_dev_tooling CI job repointed.
      Boundary: SKILL.md files, settings.json, and the bash hook entry points stay in
      .claude/ (Claude Code discovers them by path) as thin wrappers calling python -m
      into the package. Constraints: zero-install must survive (importable from repo
      root; installation optional), and the package stays visibly dev-tooling (own
      directory, not published, not in the default install). Stronger dependency than
      the open-ready rule: requires #101 MERGED (this moves files in
      .claude/hooks/tests/ that #101's diff adds) and PR 3 merged or at least stable
      (it moves files PR 3 edits) — sequence it last in the upstream wave.

  - id: stack-board-single-site
    branch: null
    title: "PR 4: stack-board Action builds board + all plan dashboards on one Pages site"
    repository: AbdelrhmanBassiouny/stack-board
    track: cutover
    depends_on: [stack-tooling-on-main, shared-pr-state-chips]
    status: not_started
    notes: >
      board.yml checks out fork main (not the tooling branch) + fetches personal-notes for
      plans and config; publishes _site/ = board index + plans/<id>/ per plan, refreshed
      every poll with no live session. Parameterize repo/branch/upstream as repository
      variables (portability). Fix the three inconsistent poll-interval statements.
      dashboard-urls.yaml / Artifact publishing become optional legacy.

  - id: routine-cutover
    branch: null
    title: "Slim the live Routine to hard rules + a pointer at .claude/stack/ROUTINE.md"
    track: cutover
    depends_on: [stack-tooling-on-main]
    status: not_started
    notes: >
      No PR — claude.ai/code/routines change. Only after PR 1 is on cram2/main and fork
      main fast-forwards. HARD RULES (never subscribe; end turn on webhook events) stay
      inline in the Routine prompt; everything else moves to ROUTINE.md.

  - id: tooling-branch-retirement
    branch: null
    title: "Tag and delete claude/stack-workflow-tooling after one green cycle"
    track: cutover
    depends_on: [routine-cutover, stack-board-single-site]
    status: not_started
    notes: >
      Only after one full routine cycle and one board-Action cycle run green on the new
      paths. Tag for history first. Platform constraint (see roadmap addendum
      2026-07-29): tag pushes and branch deletes get a 403 through a session's git
      proxy, so those two steps must run outside the harness (user's machine or gh
      api); a session can still do all verification and prepare the exact commands.
