  - id: dev-tooling-notes-core-python
    branch: null
    title: "Bash→Python 1: notes-core modules (config, git seam, writer, markers)"
    track: dashboards
    depends_on: [dev-tooling-python-package]
    status: not_started
    notes: >
      Pure addition to development_tooling, no bash file changes (decision 12):
      errors.py (stdlib-only dataclass-exception base mirroring krrood's
      DataclassException idiom — typed context fields, abstract
      error_message/suggest_correction composed in __post_init__ — without importing
      krrood), personal_notes_configuration.py (ConfigurationSource StrEnum, frozen
      ResolvedSetting and PersonalNotesConfiguration.resolve with the git-config >
      environment > default precedence), git_interface.py (thin GitRepository
      dataclass as the dependency seam; the real-git ScratchRepository harness stays
      the primary test strategy, no fakes), notes_branch.py (fetch_notes_branch with
      the upstream-remote fallback, ScratchWorktree context manager with
      pid+uuid-suffixed scratch branch names, NotesBranchWriter with a bounded
      re-fetch/re-apply push retry), marker_sections.py (single source for the
      CLAUDE.local.md BEGIN/END markers currently duplicated between session-start
      and every save script), and __main__.py with only the configuration
      subcommand. The SessionStart-reachable surface is stdlib-only, enforced by an
      import-block test. Includes a real two-writer non-fast-forward retry test
      against the bare notes remote.

      Third carrier recorded 2026-08-05, from a review question on #135 asking whether its
      check_scope_overlap.py duplicates #139's GitCommandRunner. Read against both rather
      than inferred: #139's is not a duplicate - its attempt/run split and ~14 named methods
      exist because a push that silently did nothing must not read as one that worked, and
      #135's script never writes. But #143's plan_item_bootstrap.py run_git and #135's are
      near-identical, both generic and both raising, differing only in error type and
      parameter order. So the git_interface.py seam this item already plans has three
      callers waiting, not one, and the same subprocess.run(["git", ...]) boilerplate is
      written out three times. Not unified at the time of finding: all three files are
      unlanded on three branches targeting three different directories, and main has no
      shared module to hold the seam until dev-tooling-python-package creates one - so
      extracting early would mean either a cross-dependency between three in-flight pull
      requests or the sys.path hackery decision 8 exists to end. Note the precedent does
      not cover this one: #143's own review accepted the stack.py overlap because the
      contracts were deliberately opposite (_git returns "" where run_git raises), and
      #135's and #143's contracts are not opposite.
