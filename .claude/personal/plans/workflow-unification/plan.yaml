  - id: stack-tooling-on-main
    branch: claude/stack-tooling-on-main
    title: "PR 1: stack workflow tooling on main (.claude/stack/)"
    pull_request_number: 106
    track: stack-tooling
    depends_on: [setup-personal-notes-pr101]
    status: done
    session: https://claude.ai/code/session_01Y9egTHHu5RTXmkFL4SwXM9
    notes: >
      Implemented as draft PR #106 (2026-07-29): stack.py ported to .claude/stack/ minus
      the round-robin/WIP-cap subsystem, per-user config layering from the personal-notes
      branch, canonical ROUTINE.md + 1-page README, tests via ScratchRepository; restack.js
      and board rendering not ported (board deferred to PR 3/PR 4 as planned). Landed as
      plain scripts — the dev-tooling Python package is created in PR 3 instead (see
      dev-tooling-python-package). Self-reviewed and un-drafted since: open and ready,
      so it unblocks its dependents by the plan's normal open-and-ready rule. Now also
      the parent of #107, which was restacked onto it (2026-07-30) so the upstream wave
      is a linear chain rather than two siblings on #101.
      Re-scoped 2026-07-31 (native-stacks pivot, user-approved): before review goes
      deep, add one trim commit — (a) read stack structure from the stacks REST API
      when the PR is a stack member, keeping PR-base derivation as the fallback for
      preview-less repos; (b) ROUTINE.md merge doctrine becomes merge-async + poll
      only, never the classic merge API or the MCP merge tool on a stack member, with
      stack base.sha lagging the trunk head as the needs-cascade signal; (c) Phase 1
      REPARENT must special-case stack members — PATCH base 422s on them ("Cannot
      change the base branch because the pull request is part of a stack"), so
      reparent via unstack → PATCH base → re-stack, or leave it to gh stack sync /
      the UI Rebase-stack button. (c) is load-bearing before the next cram2 landing
      of any stacked branch: stack #112 already exists on the fork.
      Upgraded to a cut the same day (user decision, "decision 11" in the roadmap):
      the restack subsystem (restack-plan, next, status/structure derivation) is
      removed from the PR entirely rather than trimmed — native stacks own
      structure, gh stack / the Rebase-stack button own cascading, and the
      preview-less-repo fallback is YAGNI (the preview is account-wide; the old
      tooling branch remains as a tagged archive). The PR keeps: ROUTINE.md
      rewritten around native mechanics (incl. the Phase-1 reparent special case
      and merge-async doctrine), stack.toml + per-user config layering, the
      label/cram2-link helpers, a small reparent-recovery script, and tests.
      Re-scope instruction posted on the PR itself.

      Assessed 2026-08-02 against #110 (see roadmap): the two are split correctly, but
      three artifacts had been built twice. This PR keeps all of them by landing first.
      Shipped here (36eda87a): `stack.py remotes` becomes `configuration`, printing one
      `field<TAB>value` line per Configuration field instead of four hand-written
      hyphenated keys, with `upstream_setup_command` moved onto Configuration and omitted
      when the remote already exists. That makes this PR's command surface and #110's
      independently-built `config` one surface, so #110's rebase deletes the resolution
      internals only. 286 CI tests pass, was 283. Description updated to match.

      Re-scoped again 2026-08-02 (user-approved, session_01BByQFT6he8xf5qvBWtyUPV): the
      doctrine becomes a skill and the recipes become subcommands. ROUTINE.md is deleted;
      .claude/skills/stacked-pr-maintenance/SKILL.md carries the doctrine, is invocable as
      /stacked-pr-maintenance from any session, and is what POINTER.md's registered block
      now resolves and runs. Context resolution is arguments first (fork=/upstream=, passed
      through as configuration --fork/--upstream, so nothing is inferred when both are
      given), then stack.py configuration, then - only interactively - an AskUserQuestion
      whose answer is persisted to .claude/personal/stack.toml on the personal-notes
      branch; --non-interactive turns that question into a stop, which is what a scheduled
      run needs given its own rule against opening a discussion. Landed as one commit on
      this branch (e20b0bb4) rather than as a child PR: every path it touches is absent
      from main, so by the scope rule nothing standalone would have remained, and shipping
      a ROUTINE.md that its successor deletes would change the live doctrine twice - the
      pointer resolves origin/main first.

      Four new stack.py subcommands, each replacing a rule a reader had to remember:
      labels (the complete set a label write must send, computed from the current labels),
      preflight (refuses a wrong checked-out branch, a mismatched refspec, a non-fork
      destination, and the child-becomes-ancestor-of-parent false merge; exit 5),
      promotion-link (owns the compare URL's encoding and length limit), and
      reparents/landed (phase 1 derived from git ancestry rather than pull-request state).
      331 tests pass, was 294. An MCP server was considered and rejected: the raw PATCH
      base change 403s on the session git-proxy credential, so a local server could not own
      the riskiest operation, and subcommands survive routine-cutover's no-LLM endgame.

      Decision 11's half-applied cut is deliberately not completed: print_next and
      print_restack_plan are kept, because phases 2 and 3 call them and they are the
      derivation half of the scripts-over-prose choice made here. print_restack_plan's
      docstring no longer names "the restack workflow's args".

      One review thread stays open by design - stack.toml:23, the remote inference. The
      skill answers its interactive half; the remaining caller is a non-interactive run
      with no arguments on an unconfigured checkout, so the ~120-line deletion is still
      #110's, alongside the setup that writes fork_repository. Replied on the thread and
      on #110 rather than resolving it. stack.py:84 (from_remote_url parses without
      validating) also remains open and dies with the same deletion.

      Review round 2026-08-02 (25 comments) applied in 8b7435bb; three decisions were the
      user's, each taken after the options were costed. (1) GitHub marks a pull request
      merged - not closed - the moment its head becomes an ancestor of its base, proven
      from live data: #101, #103 and #105 all carry merged_at 2026-07-31T10:36:43Z, the
      second fork main fast-forwarded, and two carry no merged label. So the label-then-
      close step was duplicating the fast-forward and is deleted, the merged label with
      it; landed becomes a report. The fast-forward moves after the reparent sweep,
      because auto-detection only fires for a pull request whose own base moved.
      (2) The skill never writes code: a conflict it cannot merge cleanly, or a red check,
      is reported to the branch's owner and skipped. That removed every krrood, ormatic,
      coraplex and semantic_digital_twin mention, so the instructions are now repo-generic.
      A conflict it does resolve while restacking must be reported in a comment.
      (3) POINTER.md, prompt_model.py and test_prompt_documents.py are deleted - the
      registered prompt is a skill call now, so the duplication the prose tests guarded no
      longer exists. One test survives, that the skill names no fork of its own: an absence
      computed from live configuration rather than a sentence asserted against a document.
      313 tests pass, was 331; the difference is exactly those 18 prose assertions.

      Consequence to carry: the HARD RULES no longer bind before the first file is read,
      which reverses design decision 4. Flagged to the user on the PR rather than buried -
      the window is now one turn, and routine-cutover deletes the scheduled run anyway.

      Also: commands are a Command StrEnum with a needs_a_board property; a pre-flight
      refusal carries a RefusalReason so callers act on which refusal rather than its
      wording; BranchMove is ProposedCommitMove; label tests read their labels from the
      configuration that defines them; promotion writes its compare link into the fork
      pull request's description so it outlives the summary.

      Settled 2026-08-02 (user decision): stack.py is not split in this PR. It stays ~1,540
      lines here and dev-tooling-python-package does the surgery once, when it moves every
      .claude/ Python file into the package - rather than twice, with #110 and #111 rebasing
      across the first attempt. The review comment that raised it stays answered rather than
      resolved.

      Manual step still due: register the routine's prompt as a call to
      /stacked-pr-maintenance with fork=, upstream= and --non-interactive. Until this
      lands on main the skill cannot be invoked by name from a fresh clone, so the prompt
      must read the file from a ref until then.

      Resolved 2026-08-04 (session_01F6tM5mDZr5pTB37UgBV6N5): CI in upstream cram2 failed
      test_the_skill_names_no_fork_of_its_own with ForkRemoteNotFoundError - the checkout
      topology of a cross-fork PR's base-repo CI run (only origin, pointing at cram2
      itself) has zero fork candidates, which load_configuration() treats as an error.
      Not new - #110 already hit and fixed the identical bug when it removed the remote
      inference; its fixed test computes candidate forks directly from the checkout's
      remotes and tolerates zero of them, using only symbols already in #106's stack.py.
      Ported that fix back to this branch verbatim (b3e240e6) rather than waiting on
      #110's rebase, since #106 is the parent and runs in this topology once promoted.
      Verified against a scratch clone whose only remote is cram2 (reproduces the exact
      reported traceback pre-fix, passes post-fix) plus the full test_claude_dev_tooling
      scope (321 tests, no regressions). See roadmap.md for the full writeup.

      Merged into fork main 2026-08-05T14:10:36Z (merged_by AbdelrhmanBassiouny, head
      b3e240e6 - the fork-resolution fix's own commit). Verified by presence on fork
      main rather than from the merge notification alone: .claude/stack/stack.py,
      .claude/skills/stacked-pr-maintenance/SKILL.md and
      .claude/stack/tests/test_maintenance_skill.py all git cat-file -e clean on
      origin/main. This is the fork-internal merge only - the separate cram2 promotion
      (the PR's own "Promote" compare-and-create link) is still a manual step, so
      routine-cutover's gate ("PR 1 on cram2/main and fork main fast-forwards") is not
      yet met by this alone. Unblocks #107/#110/#111/#139, all based on this branch,
      to rebase onto main. The only CI red on this PR at merge time was
      test_each_lib (giskardpy)'s test_pacer.py::test_with_executor - a physics/timing
      assertion unrelated to this PR's 11-file .claude/-only diff, matching this PR's
      established pattern of unrelated robotics-stack flakes; test_claude_dev_tooling
      itself was green.

  - id: setup-stacked-prs-skill
    branch: claude/setup-stacked-prs-skill
    title: "PR 2: /setup-stacked-prs guided one-command setup skill"
    pull_request_number: 110
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01QurCwih1r6STYtP34bpJpf
    notes: >
      Mirrors PR #101's pattern (read-only check-stack-setup.sh + guided skill +
      prerequisite-check.md) and #107's script/skill split. Two install modes: native (tooling on
      the target repo's main) and fork-overlay (a never-merged tooling branch on the user's fork;
      re-running is the updater). Creates missing labels, writes personal stack.toml, emits the
      Routine prompt. Based on claude/setup-personal-notes-script (#107) rather than #106, because
      setup-stacked-prs.sh:44 sources github-api.sh, which exists on no other branch; #107 already
      carries all of #106, and git merge-tree gives the identical conflict set either way, so the
      base costs nothing and keeps decision 10's one-linear-chain property. Scope assessed
      2026-08-02 and confirmed separate: removing this item's edits to #106's files leaves ~2,645
      lines of standalone setup infrastructure, so it is ordinary stacking, not a disguised
      modification of its parent.

      Rebased onto #106's review round 2026-08-03 (eecd765d + b9f8f752), which is what the
      2026-08-02 instruction list called for; that list is now consumed and is not re-recorded
      here. Five files conflicted, all under .claude/stack/, every one resolved in favour of the
      parent: ROUTINE.md's delete accepted, this branch's routine-prompt.md deleted as a duplicate
      of the skill's, stack.py's config/print_config/BOARD_FREE_COMMANDS dropped for #106's
      configuration, stack.toml and test_stack.py taken from the parent. The one thing this branch
      had that its parent did not survives: cram2_link_sent_label, without which a fresh fork's
      first promote writes a label nobody created.

      One real defect rather than a no-op, found by reading the script rather than reasoning about
      the deletions: check-stack-setup.sh:51-55 required STACK_ROUTINE_DOCUMENT and
      STACK_ROUTINE_PROMPT_FILE and :62 reported them present by name, both pointing at files that
      exist nowhere - so the check reported needs-setup on a correctly installed checkout. Both
      constants now resolve to .claude/skills/stacked-pr-maintenance/, written failing first. That
      fixed fork-overlay for free: OVERLAY_FILES already listed both, so an overlay was about to
      ship tooling with no instructions.

      The ~120-line remote inference is deleted, closing #106's two deliberately-open threads
      (stack.toml:23 and stack.py:84, both replied to and resolved). AmbiguousForkRemoteError is
      gone because ambiguity is unreachable once the fork is named; ForkRemoteNotFoundError becomes
      ForkRepositoryNotConfiguredError at the same exit 4, so the maintenance skill's step 0 keeps
      the status it keys on. RemoteResolution is symmetric now - a missing fork remote yields a
      git remote add command exactly as a missing upstream already did, which is what lets setup
      run before either remote exists. Setup writes fork_repository at install time and merges the
      override file rather than replacing it: both writers exist now, and a whole-file write
      silently discarded whichever ran first (a defect nobody had recorded). --fork/--upstream take
      an owner/name, a URL, or a remote.

      408 tests pass across the three directories CI runs, was 334 on this branch before the
      rebase. Scratch fixtures now build their bare repositories at paths naming an owner/name and
      address them as file:// URLs - not cosmetic: remotes are matched by the repository their URL
      names, and a bare local path deliberately names none. Verified live in this clone: the
      stack_tooling_files row reads ok, configuration exits 4 naming both ways to answer, and
      resolves when told. Still unverified, same reason as #107: live label creation, exercised
      only through a stub because this environment's token is a fine-grained installation token.

      Merged its base a second time 2026-08-05 (44df7fdb), after main moved a long way beneath it
      - #106 landed there, along with #109, #115 and #119. Conflicts were .gitignore and
      tests/scratch_repository.py, both the benign additive shape: two independent blocks in the
      first, two different methods added at the same place in the second (notes_branch_commit here,
      update_notes_branch_file from main). Base stays #107 - github-api.sh is still not on main,
      re-checked rather than assumed.

      One integration break the conflict markers did not show, which is the part worth carrying:
      test_personal_settings_sync.py arrives from main and installs the hook scripts it calls, but
      this branch made write-personal-notes-file.sh delegate to write-branch-files.sh - a
      transitive dependency that does not exist on main. Two tests went red only after the merge,
      with "No such file or directory". Resolving the markers alone would have left the suite
      broken; the fixture installs it now. 433 tests pass, was 408.

  - id: stack-maintenance-executor
    branch: claude/plan-item-kickoff-workflow-koufa6
    title: "Deterministic maintenance executor: board, fast-forward, restack, run-report"
    pull_request_number: 139
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_014E9nB1MUvm4jwgC2UTN5GT
    notes: >
      User's proposal, 2026-08-03: automate the stacking pass with a deterministic script that
      fetches the relevant pull requests, performs the git commands, and reports everything - less
      work for the session running the skill, and more reliable. The gap is real and was verified
      rather than assumed: grep -n "git push" over stack.py's 1,600 lines returns nothing. stack.py
      is read-only derivation only, so every fetch, merge, rebase and push in the workflow is
      performed by a session following prose, and board.json is hand-assembled from MCP output -
      the same hand-assembled-input failure class as #119, where a dropped field was
      indistinguishable from a legitimate one.

      Four commands in a new module (.claude/stack/maintenance.py + its own test module), so the
      only edits to #106's files are the SKILL.md steps and the dispatch wiring: board --write
      (fetches the fork's open pull requests itself), fast-forward (step 2, refusing a
      non-fast-forward rather than forcing), restack (drives restack-plan, runs preflight before
      every push, never force-pushes without the rebase label, reporting per branch pushed /
      up-to-date / conflict <files> / refused <RefusalReason>), and run-report --json as the one
      machine-readable document the skill renders and routine-cutover's Action emits directly.
      SKILL.md steps 2-4 collapse to "run it, act on the report" - the same computed-rather-than-
      recalled move #106 already made for labels/preflight/promotion-link.

      Step 0 before any design is committed: a credential probe. Already on record are the raw
      PATCH base 403, the MCP update_pull_request 200, and the stacks endpoints working via curl +
      GH_TOKEN. The 403's message names the base branch specifically, so three writes are unknown
      and decide how much can move into code - PUT /issues/{n}/labels, POST /issues/{n}/comments,
      and a body-only PATCH /pulls/{n}. Record the results either way: routine-cutover's Action
      needs the same table for its own credential.

      Staying with a session/MCP regardless: base changes, conflict resolution, and whichever of
      the three probed writes come back blocked. Scoped as its own item rather than folded into
      #106 (user's call): the executor is new files that stand alone, #106 is already 3,413
      additions across 29 commits and out of draft after a 25-comment review round, and this is a
      direct enabler of routine-cutover's no-LLM endgame. It does not reverse decision 11 - that
      cut structure derivation in favour of GitHub's stack object; this executes an already-derived
      plan.

      Kicked off and implemented 2026-08-04 via /plan-item-kickoff as draft PR #139, based on
      #106's head as a sibling of #107/#111 (it needs only #106's files; git ls-tree origin/main
      -- .claude/stack is empty, so main was never a possible base). The gap was re-verified
      against #106's head rather than taken from the earlier grep: stack.py contains no push,
      merge or rebase outside docstrings and enum members.

      Step 0's credential probe came back the opposite way round from the fear it was written
      against. On throwaway PR #138, four calls minutes apart through the same GH_TOKEN and the
      same git proxy: PUT /issues/{n}/labels 200, POST /issues/{n}/comments 201, body-only PATCH
      /pulls/{n} 200, and - as a control on the same pull request - a base-branch PATCH 403. So
      the recorded 403 is a property of the base field specifically, not of writes generally and
      not of the credential as a whole. Label writes, conflict-report comments and description
      writes are all available to deterministic code; only the base change needs the MCP server.
      That table is what routine-cutover's Action needs for its own credential, and it is
      recorded here rather than only in the pull request. This PR deliberately did not widen its
      scope to use those writes - the four commands are what was agreed - so moving the
      needs-resolution labelling and the conflict comment into code is a concrete follow-up, now
      known to be possible rather than assumed blocked.

      Delivered: .claude/stack/maintenance.py with its own argparse entry point and zero edits to
      stack.py - which keeps stack.py's read-only contract and means this branch cannot conflict
      with #110's inference deletion in that file. Entry-point shape was the one genuinely open
      question at kickoff ("the dispatch wiring" read two ways) and the user chose the separate
      CLI over new stack.py subcommands. GitCommandRunner is the one new seam: stack.py's git
      helper returns "" on failure, which is right for derivation and wrong for a push. Forcing is
      decided in exactly one place, push_arguments, and only for the rebase strategy - which
      build_stack sets only from the rebase label - and even then with a lease, so a branch
      somebody else moved comes back push-rejected and untouched.

      342 tests pass, was 321 on this branch (the 313 in #106's description predates its merges
      from main). 21 new, written failing first, against real git in a scratch fork with bare
      repositories addressed as file:// URLs per #110's fixture rule. Each was checked by breaking
      the implementation and confirming only it failed. One test corrected a wrong premise of its
      own: the executor starts each integration from the branch's published tip, so a branch that
      moved under the pass is incorporated rather than raced - pinned rather than left implicit.

      One regression found and fixed rather than shipped: board --write makes a local board.json
      routine, and two tests - one pre-existing in test_stack.py - assert on a missing board while
      reading the real board.json beside stack.py. Running a pass then the suite failed both.
      Proven by writing a board and watching them fail, then fixed with an autouse fixture in
      .claude/stack/tests/conftest.py that sets an existing snapshot aside and restores it.
      .gitignore gains board.json; #110 adds the identical line, so whoever lands second drops one
      copy - a deliberate, named duplication rather than a fourth same-artifact-twice instance.

      Not verified live and deliberately so: restack and run-report push to real branches, and the
      upstream remote is outside a session's repo scope, so they are covered end to end in the
      test harness instead. board --write was run live (44 open pull requests, and the export
      parses straight back through stack.py status); fast-forward was run live as far as its guard
      (exit 6 naming the missing cram2 remote, before any push).

      Residue: the throwaway branch claude/credential-probe-koufa6 needs deleting outside the
      harness, per the standing session-cannot-delete-branches constraint.

      Scope widened 2026-08-04 on the user's instruction, once the probe had shown the three
      writes available: "do it as well and anything you found doable in code related to this".
      All three moved into the executor rather than staying prose. A conflict is now handled end
      to end - the branch is labelled needs-resolution with the complete set LabelWrite computes,
      and its owner gets a comment naming the conflicting files and addressing the session link -
      and the next pass reads mergeable_state to either withhold the branch while it is still
      dirty or clear the label and restack it. That closes the loop the label was invented for:
      previously nothing removed it, so a resolved branch stayed withheld until somebody noticed.
      A fifth command, promote, builds each ready branch's compare-and-create link, writes it into
      the fork pull request's description under a Promote heading (replacing any already there,
      since the description is rewritten on every run that rebuilds one), adds cram2-link-sent,
      and drops that label from anything since promoted or landed. in-review stays the developer's
      to add. Reads and writes are one GitHubRepository behind PullRequestReader/PullRequestWriter,
      so the board export depends only on the reader. Retargeting a base is now the single step
      still reported rather than performed, and the report says so.

      351 tests pass, was 342. Four more mutations checked, each caught by exactly the test naming
      it: a label write computed from the addition alone, a still-dirty branch restacked anyway, a
      promotion link appended rather than replacing, and an already-linked branch promoted twice.
      The write client was exercised live against closed throwaway PR #138 - read, description
      write proven idempotent by a second write, label replace, comment - then restored. restack,
      promote and run-report are still not run against the live fork: they rewrite real
      descriptions and push real branches.

      CI then caught a real ordering defect the local run could not: resolving the credential had
      moved ahead of deriving the board, so restack on a checkout with neither reported a missing
      token instead of the missing board its caller fixes with the previous command. A session
      environment exports GH_TOKEN, so the wrong branch was never taken locally. Fixed, and the
      command-line tests now strip the credential for every run - the same ambient-state coupling
      as the board.json fixture, met a second time in one PR: a test that reads ambient state
      cannot assert about the state it is reading.

      Run live against the fork 2026-08-04 on the user's authorisation, using throwaway pull
      requests #140 (parent, non-draft) and #141 (child, draft) and a board scoped to those two
      only, from a detached worktree so the executor's checkout could not disturb the branch under
      review. All five commands exercised: restack integrated a moved parent and pushed the child;
      a real conflict pushed nothing, labelled #141 needs-resolution and posted the naming comment;
      a second pass withheld it while mergeable_state was still dirty and posted no second comment;
      once the conflict was resolved and pushed the next pass cleared the label by itself and the
      branch rejoined; promote wrote the compare link under a Promote heading taking only the first
      paragraph, applied cram2-link-sent, and on a second run replaced the section rather than
      adding another - which also survived GitHub appending its own footer to the description write;
      run-report emitted the whole pass as one document. board --write and fast-forward's guard had
      already been verified live.

      The live run found two defects the unit tests had not, both of the same shape: a restack that
      hit a conflict exited 0, and a run-report whose fast-forward was refused also exited 0. A
      caller acting on the status alone - which is precisely what routine-cutover's no-LLM endgame
      does - would have read both as nothing outstanding. Every command now derives its status from
      one exit_code_for over the report, so no two can disagree about what a clean pass is: 7 for a
      refused fast-forward (outranking the rest, since every branch is measured against that base),
      5 for a pre-flight refusal (a fault in the move, not the branch), 10 for a branch left
      unpublished for its owner. Tests written from the two observations and checked by restoring
      the old behaviour. 357 tests pass, was 351.

      Also settled live, from the user's question about supplying their own token: they cannot make
      the base-branch reparent work from a session. gh is not installed; GH_TOKEN is a 14-character
      "prox..." placeholder rather than a GitHub token; a junk Authorization header and no header at
      all both return 200 on this private repository, so the proxy discards whatever the process
      sends and substitutes its own identity; and the base-branch PATCH 403s identically with a junk
      token and with none, carrying a documentation_url on docs.anthropic.com rather than
      docs.github.com. The refusal is generated by the agent proxy from the request shape, not by
      GitHub and not by the credential, so a personal access token would be discarded before it ever
      reached GitHub. This does not bear on routine-cutover's Action, which runs outside this proxy
      and is a genuinely different actor - still worth verifying there, but for a different reason
      than the one recorded so far.

      Residue from the live run: throwaway branches claude/throwaway-parent-koufa6 and
      claude/throwaway-child-koufa6 need out-of-harness deletion; their pull requests are closed and
      their labels cleared.

      Statuses name themselves as of 2026-08-04, from the user's question about strings beside or
      instead of the numbers. Instead is not available - a process exit status is an integer by
      definition, and these stay aligned with stack.ExitCode value for value - but beside was a
      real gap: the meaning was already in the enum member and nothing emitted it. MaintenanceExitCode
      gains name_for_a_caller, derived from the member so a status can never carry a name belonging
      to another; main prints it once for any non-zero run ("maintenance.py: branch-needs-attention
      (10)") and stays silent on success; and run-report --json leads with status and exit_code,
      which is the case it matters most for, since routine-cutover's Action reads the document
      rather than the process status. 361 tests pass, was 357; three more mutations checked.

      Review round 2026-08-05 (25 comments) applied in 7048a962. Three were design decisions
      taken with the user rather than corrections, and the largest reshaped the skill: the
      document now leads with run-report --json as step 2 and demotes the four individual
      commands to a reference section for resuming a partial run. Writing it that way round the
      first time was not arbitrary - the per-command sections carried doctrine that had nowhere
      else to live, so explaining a command and stating a rule had become one paragraph. What
      made the change possible was splitting those apart: a What this pass never does section now
      holds the rules with no command attached, and it is where the reviewer's two other points
      landed - the pass never resolves a conflict (the "if you resolve one yourself" escape is
      deleted, and the header's promise changed with it from "the only file changes are conflict
      resolutions" to no file changes at all) and it never attempts to open the upstream pull
      request, which previously read as a call to try and expect to fail.

      The shape the reviewer asked for repeatedly is a member carrying its own specification, and
      it is now the module's idiom twice over: PullRequestField(FieldSpecification, Enum) carries
      each field's key, how its value has to be read and whether a record omitting it is rejected,
      and Command(CommandSpecification, Enum) carries each command's name and help text. Both hit
      the same two hazards #143's roadmap entry already records - a member's value must be the
      argument tuple rather than a built specification, and the field cannot be called name
      because Enum reserves it - so the first is guarded by a test and the second is invoked_as.
      That collapsed _required, _branch_reference and _label_names into PullRequestField.read, and
      took the three raw record.get calls in promote and the conflict check with it.

      ExternalCallFailed is the shared parent of GitCommandFailed and GitHubRequestFailed, holding
      status and detail and composing the message from an abstract call - krrood's
      DataclassException idiom mirrored rather than imported, per decision 12's stdlib-only
      boundary. GitCommandRunner has one named method per command it runs, which deleted two free
      functions and replaced four hand-spelled merge-base invocations, one of which had its
      arguments in the opposite order to its neighbours. ProposedPush is where forcing is decided,
      so the runner's push cannot decide it separately. BranchAncestry is a frozen dataclass rather
      than a returned closure; ForkPullRequests names the reader-plus-writer union, with the two
      halves kept separate so the board export cannot write.

      Dispatch is open/closed now: each command is a MaintenanceCommand subclass owning its flags
      and its work, listed once in COMMANDS, which is also what builds the parser - so a command
      that exists but is unreachable is not expressible. MaintenancePass preserves the
      board-before-credential ordering CI caught earlier. run-report deletes board.json when the
      pass finishes with it (the user's call, scoped to that command alone, since the other four
      are the resume path); a stale snapshot read as current is worse than none, and exit 3 names
      the command that fixes it.

      Three threads left open deliberately: the two asking why not gh or PyGithub - answered with
      the reason for now (gh absent, stdlib-only tier) and deferred to
      dev-tooling-github-api-unification, which exists to settle exactly that once - and the
      question about supplying a credential that can reparent, which is answered but calls for no
      change here. 364 tests pass, was 361; two new (what the export reads out of each field's own
      shape, and that every field is named by a string) plus the board-deletion one, each checked
      by mutation.

      Second review round the same day (12 comments) applied in eb648308. Two were put back to the
      user rather than guessed at, and both answers shaped the result. PreFlight becomes
      CommitMoveChecks everywhere - stack.py included, with CommitMoveRefusal, the check-move
      subcommand and MOVE_REFUSED in both tools' exit codes - because the old name said when it ran
      rather than what it did, and the new one pairs with the ProposedCommitMove it is handed. And
      "actions as dataclasses with a shared abstract parent" meant the restack's per-branch steps:
      each is now a RestackStep subclass that either concludes the branch or lets the next run,
      with BranchUnderRestack carrying what a step needs, so _restack_branch is a loop rather than
      a chain of ifs and the two free functions taking six arguments became the steps that own
      them. Unlike the commands these stay listed rather than discovered, because their order is
      the procedure; a branch no step concludes raises rather than returning silently.

      The Command enum is deleted - with a class per command it was a second registry that could
      name a command nothing implemented - and COMMANDS is derived from
      MaintenanceCommand.__subclasses__(), so a command class that exists is reachable by
      construction. PullRequestField's members name their arguments through a keyword-only helper,
      since an enum member's value has to be the argument tuple and BODY = ("body",) said nothing
      about what the two omitted values meant. FieldShape and FieldSpecification take the
      PullRequestField prefix; reading a field is a match statement.

      The skill was cut on one rule the user's own framing supplied: a sentence describing what the
      code does has nothing holding it true, so it is a future lie with a delay attached. Out went
      the conflict-labelling description, the force-with-lease rule, the board deletion, the
      per-outcome table and the flag lists - each already documented next to the code that does it.
      What is left is what the agent decides: act on the status, act on reparents, name the
      branches left for their owners. Step 2 is ~30 lines, was ~70.

      366 tests pass, was 364. Two threads stay open on purpose: whether the stack.py half of the
      rename belongs on #106's branch by the prefer-the-change rule, and whether the test pass
      should use __post_init__ regardless now that making the derived values fields removed the
      need for it (and for object.__setattr__, which is what the neighbouring comment objected to).

      Third round, four comments, in 62133080 and 16d04f99. The reviewer's reading that a member
      could be written as a constructor call was right, and prototyping it settled the shape the
      previous two rounds had both got wrong: written plainly it builds and is silently wrong -
      an enum hands a member's value straight to the type it mixes in, so the whole specification
      lands in key and required reverts to its default - but an __init__ on the enum that unpacks
      the specification onto the member fixes it, and the arguments become real keywords rather
      than a helper's. That helper, which existed only to return its arguments unchanged, is
      deleted. Removing the __init__ fails three tests, so the silent form cannot come back
      unnoticed.

      The same reviewer's suggestion to find RESTACK_STEPS from its subclasses was applied and
      then reverted on their own call once they had read why it was a list. The mutation check is
      what settled it and is worth keeping: swapping PublishBranch ahead of RefuseAnUnsafeMove
      fails test_a_push_the_move_checks_refuse_is_not_made, a behavioural test that publishes to a
      real scratch fork and asserts the destination ref never moved. So the order is load-bearing
      behaviour a test already catches, which also made the order test added during the
      auto-discovery attempt redundant - it restated the tuple - and it was dropped with the
      revert. COMMANDS stays discovered, because its list carried no meaning; the steps stay
      listed, because theirs is a decision about what a pass does.

      stack.py's enum members and its two undocumented module variables gained docstrings, swept
      by an AST pass over both modules rather than fixed at the one line flagged. 366 tests pass.

      First live run against the real stack, 2026-08-05, and it found a defect in this pull
      request that every throwaway run had missed. The pass restacked, hit a .gitignore conflict
      on this very branch, labelled it needs-resolution at 14:10:42 - and then promote stripped
      that label at 14:11:46, in the same pass, replacing the set with cram2-link-sent alone.

      Root cause: board --write exports a snapshot at the start of a pass, restack then withholds
      a conflicted branch by labelling it live, and promote read neither back. promotion_order's
      needs_resolution exclusion and LabelWrite.replacing both took branch.labels, which is the
      snapshot - so promotion promoted a branch the same pass had just conflicted on, and computed
      a whole-set label write from a list already stale. That is the production incident
      LabelWrite.replacing exists to prevent, re-entered through a different door: the rule is
      compute it from the labels the pull request carries now, and branch.labels is at board time.
      The consequence was the loop this item exists to close staying open, since with the label
      gone the next pass has nothing to withhold on and re-reports the same conflict.

      Fixed by reading both the decision and the write off the pull request record promote already
      fetches for its title and description. Two tests written failing first, each checked by
      mutation. One pre-existing test changed setup only, not assertions: the behaviour it names -
      a branch already carrying the link label is not promoted again - is unchanged and still
      correct, and only where "already carrying" is read from moved.

      Also merged main, which had moved a long way: #106 landed, so this branch's base became main
      and .claude/stack/ plus the maintenance skill are now on main (maintenance.py is not, so the
      routine prompt still has to resolve this branch). The .gitignore conflict was the benign
      two-additive-blocks shape - this branch's board.json entry and main's .plan-state-sync-sha
      stamp arriving with #115 - both kept. 385 tests pass, was 366; the difference is main's own
      tests plus the two added here.

      Confirmed rather than assumed while diagnosing: the conflict comment addressing this session
      was correct rather than a bug - get_session_link_in reads the link out of the pull request's
      own description, so a report reaches the branch's owner.

