  - id: unfetched-parent-branches
    title: "Fetch every parent branch the pass decides about, and refuse to decide from a missing ref"
    branch: claude/maintenance-tooling-pinning-gdod18
    track: stack-tooling
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01THzpHsajMptZ3X1DmwAU2c
    pull_request_number: 198
    notes: "Bug fix, root-caused 2026-08-24 while asking why PR #64 was never reparented onto main nor promoted with a cram2 link after its parent PR #63 merged that morning. load_stack() fetches only the head branches of the open pull requests on the board (stack.py:930), so a parent whose own pull request is closed or merged is never fetched; _merged_predicate.is_merged then runs merge-base --is-ancestor through _git_succeeds, which cannot tell exit 128 (ref missing) from exit 1 (not an ancestor). A ref the pass failed to obtain therefore reads as \"has not landed\", suppressing the reparent, the restack and the promotion at once. Proven read-only: with origin/D-core-aid present, reparents prints \"D-core-underspecified 64 D-core-aid main\" and next lists #64 as promotable; after git update-ref -d of that ref - the state a fresh maintenance clone is in - both go silent. #64 carries no labels, so it was never promoted on any pass. This is the unfinished half of landed-parent-detection (#117), which made the decision ancestry-based but never made the ref that decision reads present. Three layers, one pull request, each with its failing test first: fetch the union of board heads and bases; make an unresolvable ref and a failed git fetch raise instead of answering False; and give a parent whose pull request is gone a policy derived from where its commits actually are - in the upstream base, in another open board branch (#178's parent merged into its grandparent, uncovered today), or nowhere (#79 and #21, whose parents were closed unmerged), the last reported to the branch's owner the way a conflict is rather than merged every run. Layer 2 reverses a decision recorded on #139 - that a git helper returning \"\" on failure is \"correct for derivation, where a missing ref simply means no answer\" - because here a missing ref is not no answer, it is a confidently wrong one that drives writes. Scope checked rather than assumed: check_scope_overlap.py --base main returns paths_absent_from_base [] over all seven paths, so this is new work on landed code based off main; of the seven open pull requests touching stack.py (#110, #111, #151, #154, #158, #162, #185) none touches def fetch, _git_succeeds, is_merged, reparents or has_landed_upstream. Landing order rather than a dependency: #185 renames .claude/stack/*.py to bastler/*.py and carries this bug verbatim at bastler/stack.py:823, so this small fix lands first and #185 picks it up in the re-merge it already needs. Cross-reference: routine-cutover's event-triggered re-sweep addresses when the sweep runs; this addresses the sweep computing the wrong answer whenever it does."

  - id: session-branch-base
    title: "Cut session branches from main, not the integration branch"
    branch: claude/plan-item-kickoff-workflow-s3mfvk
    track: stack-tooling
    depends_on: []
    status: in_progress
    pull_request_number: 199
    session: https://claude.ai/code/session_014Fp9aaMYx1E6toT2jDDWdW
    notes: "Found 2026-08-24 while checking whether the fork's default branch caused unfetched-parent-branches. It did not, but it is causing something else and is already live. git ls-remote --symref origin HEAD resolves to refs/heads/integration - the regenerated integration branch that integration-branch (#154) exists to build, whose whole design is to be rebuilt and never merged out of. The session investigating #64 was handed claude/maintenance-tooling-pinning-gdod18 at HEAD 899a04aac, byte-identical to origin/integration: 78 commits behind main, carrying eight unlanded branches' merge commits. That branch existed only locally - git ls-remote --heads origin had no such ref - so the clone created it at the default branch's tip, which is what every future session cut from this fork will do. Not the cause of the parent-ref bug: cram2's default is still main, cram2 has no integration branch at all, and upstream_base is pinned in stack.toml, so the stack tooling never reads a default branch; no open fork pull request bases on integration today either. What does read it: default_branch_name() in resolve-personal-notes-config.sh reads refs/remotes/origin/HEAD, so PR-progress keys on the wrong branch in any clone that has the ref set, and a pull request opened through the GitHub UI would default its base to integration, corrupting the base-is-parent invariant. Adjacent to fresh-base-at-session-start (#188), which fast-forwards main and reports \"this branch is N commits behind main\" - it detected the symptom for that session but does not prevent the wrong base, and reads upstream_base rather than origin/HEAD so it is unaffected by the switch. Fix: restore the fork's default branch to main, and make a session refuse to plan or open a pull request from a branch not derived from it, so a default-branch change cannot silently re-point every future session's base again. Re-scoped 2026-08-28 on the user's objection, which reverses this item's own recorded fix. Making integration the default is deliberate - it is the whole point of the fast-PR process, putting reviewed-but-unlanded work into every fresh checkout - so restoring main as the default would destroy the thing it exists for. The requirement is instead that a pull request be based on main or on a parent pull request, never on integration, and the two are not in conflict: where a clone starts and where a work branch is cut from are separate events, and only the second is a defect. So the check's subject moves from the repository setting to the branch in hand, as a branch_base row refusing a branch that descends from the staging default. The ancestry test this item's kickoff had rejected is the right one, tested against the wrong thing: against main it flags every branch that has not merged main recently, and cannot tell a branch cut from integration from one stacked on a parent; against integration it flags 0 of this fork's 198 remote branches and never references main, so it is stable as main moves. default_branch_name() keeps reading the configured base, which is what stops pr_progress_path and branch_can_hold_plan_item treating integration as the branch no plan item can track. 541 tests pass across the four CI directories, from 538; the mutation testing ancestry against the base fails exactly the test written to reject it. Found while measuring it and not this item's to fix: integration is 124 commits and five days behind main (built 2026-08-23, main's tip 2026-08-27), so the process is currently serving unlanded work on a stale base - a rebuild-cadence question, and integration.py build is only on #154."
