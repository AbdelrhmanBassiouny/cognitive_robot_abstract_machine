      Follow-up agreed and deliberately NOT in this PR: extract
      .claude/hooks/setup-personal-notes.sh --remote <name-or-url> [--starter-notes]
      taking over skill steps 4-7 and 9 so the mechanical setup runs with no session
      at all, leaving the skill only the remote-ownership decision and the label
