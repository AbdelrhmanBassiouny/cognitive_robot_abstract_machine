      Two things worth carrying forward: three merge commits authored as
      "Claude <noreply@anthropic.com>" landed on this branch from outside any
      session (against AGENTS.md's Version Control rule) and were left unrewritten
      rather than force-pushing shared history; and the robotics CI jobs flaked
