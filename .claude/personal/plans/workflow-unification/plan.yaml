      STALLED 2026-07-31 to 2026-08-03 and RESOLVED by
      https://claude.ai/code/session_01XkWmfMzYYAaCsgyrHDuoKn (commit 5281e3f3), on two
      blockers neither of which this entry had recorded - see blockers below and the
