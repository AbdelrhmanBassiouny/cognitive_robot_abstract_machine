  - id: add-plan-item-skill
    branch: claude/add-plan-item-skill-e89irj
    title: "/add-plan-item: decide where a new piece of work belongs"
    pull_request_number: 135
    track: personal-data
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01XGMaAHK8LQCoxa52KVaMCc
    notes: >
      Raised 2026-08-02. The plan skills covered creating a plan, starting an item,
      unblocking one and publishing status, but nothing covered the most frequent event:
      someone describing new work and asking where it goes. That decision was being made
      by default, which is what produced this plan's own recorded fold chain (#133 into
      #117, #117 into #106) and the #110/#106 collision where two sessions independently
      built the same artifact under two names. Adds /add-plan-item, which derives the
      paths the work touches, gathers every plan and open pull request as candidate
      homes, runs the scope check, and proposes exactly one of four outcomes - fold, new
      item in an existing plan, new plan via /plan-create, or no item at all - through
      plan mode without writing code.
      Two decisions taken with the user before implementing. The rule itself was
      triplicated as three independently-worded copies added to plan-create,
      plan-item-kickoff and plan-item-resolve by the unlanded, PR-less branch
      claude/plan-scope-before-new-item, with no shared anchor - itself the failure mode
      the rule is about. It moves into add-plan-item/scope-decision.md, referenced in a
      line by all four skills, following the setup-personal-notes/prerequisite-check.md
      precedent. And rather than stack two pull requests, this branch was reset onto
      claude/plan-scope-before-new-item (a clean fast-forward from main, commits 3e23270a
      and 96a5b30b) so one branch carries both; that branch is retired, having never had
      a pull request. That is the new rule applied to its own introduction.
      Ships check_scope_overlap.py rather than prose alone, since the #110/#106 collision
      is exactly what eyeballing missed: given a base and the work's paths it reports
      which paths the base lacks and which unlanded branches already touch them, plus
      each candidate's full changed-file list so same-purpose/different-filename
      duplicates stay findable. Pure git, no network. Eight tests under
      add-plan-item/tests/, reusing the hooks suite's ScratchRepository rather than a
      second scratch-repository helper, wired into ci.yml's test_claude_dev_tooling job
      via a new ADD_PLAN_ITEM_TESTS_DIRECTORY constant. 230 tests pass, was 222.
      Committed and pushed 2026-08-02, then opened as draft pull request #135 based on
      fork main, no bug label (tooling that never existed, not a defect), subscribed to
      its activity. Basing was checked with this item's own check_scope_overlap.py rather
      than by feel, after the user asked whether it should sit on #106: the only paths
      absent from main are the three this item introduces, the two it shares with #106
      (resolve-personal-notes-config.sh, ci.yml) already exist on main, and nothing in
      .claude/stack/ is read or referenced - so it is textual overlap, not a dependency,
      and basing on #106 would attach a dependency-free immediate-wave item to the
      unlanded upstream chain. git merge-tree against #106 reports exactly one conflict,
      ci.yml's single pytest line, which both branches extend with their own tests
      directory; the config file auto-merges.
      Review round 2026-08-05, two comments, both answered in cd6eb839 and the thread. (1)
      The report's JSON keys become a ReportKey StrEnum, read by both as_dictionary methods
      and the test instead of being spelled out twice. Applying it removed coverage the
      literals had been providing by accident - with both sides reading the enum, renaming a
      key changes them identically and nothing notices, verified by renaming SHARED_PATHS and
      watching all 8 tests still pass. One test now pins the member names to their wire
      values, so a rename fails exactly there; 9 tests, was 8. (2) The run_git duplication
      question is answered and recorded on dev-tooling-notes-core-python as a third carrier
