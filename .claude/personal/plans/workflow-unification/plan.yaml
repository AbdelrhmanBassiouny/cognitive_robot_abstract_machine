  - id: personal-settings-sync
    branch: claude/local-settings-dashboard-sync-8sx0tf
    title: "Sync personal .claude/settings.local.json off the personal-notes branch"
    pull_request_number: 109
    track: personal-data
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01XkWmfMzYYAaCsgyrHDuoKn
    notes: >
      Extends the session-start hook so the notes branch also carries this project's
      local Claude Code settings (.claude/personal/settings.local.json ->
      .claude/settings.local.json, gitignored), plus save-personal-settings.sh for the
      write half; seeded with a rule allowing the Artifact tool without prompting. A
      copy that is skipped whenever the local file changed since the last sync, since
      Claude Code writes its own "don't ask again" grants into that same file - the
      baseline is a hash stamp in .claude/.personal-settings-sync-hash. This widens the
      track beyond its "slimming" name: personal-data is now personal-notes data and
      config generally, which is what the plan's target architecture already says that
      branch holds. Independent of the #101 stack - branched off fork main. Same session
      also added the personal-notes rule that any session changing a plan's data
      republishes that plan's dashboard in the same turn (notes-branch only, no PR).
      STALLED 2026-07-31 to 2026-08-03 and RESOLVED by
      https://claude.ai/code/session_01XkWmfMzYYAaCsgyrHDuoKn (commit 5281e3f3), on two
      blockers neither of which this entry had recorded - see blockers below and the
      2026-08-03 roadmap entry. The overlap warning above resolved itself: #107's and
      #110's files (resolve-personal-notes-config.sh, session-start.sh) auto-merged
      clean; what actually conflicted was a duplicated test fixture against main. PR
      #109 is a draft again, labelled cram2-link-sent only, mergeable against main
      9b090fc1, all three review threads resolved; 36 tests pass under
      .claude/hooks/tests (main's 28 plus this module's 8).
    blockers:
      - "Both cleared 2026-08-03."
      - >
        (1) Merge conflict against main since the 2026-07-31 fast-forward -
        mergeable_state dirty, labelled needs-resolution - in
        .claude/hooks/README.md, tests/conftest.py and tests/test_save_plan_sh.py.
        Root cause was a duplicated artifact, not drifting text: main extracted the
