  - id: deferred-dependency-drift-check
    branch: claude/deferred-dependency-drift-pr-qxpfsm
    title: "Flag an item stacked on a deferred/closed dependency instead of leaving it to a stale note"
    track: dashboards
    depends_on: []
    status: in_progress
    pull_request_number: 184
    session: https://claude.ai/code/session_01VBa9VPHJW4VjpWtdq1XLE2
    notes: >
      Found 2026-08-12 while investigating rdr-refactor's D-ui stack: D-ui-splice-fix (#78)
      was closed as superseded (the fix landed elsewhere, via dag-facade-hardening's
      insert-at-ownership-parentage, #118), but D-ui-rendering (#79) still carries
      depends_on: [D-ui-splice-fix] and is still in_progress, with no automated signal
      anywhere that its base is dead - only a previous session's freeform note, which
      nothing re-reads or re-verifies. Root cause: build_dashboard.py's
      _drift_description_of only compared an item's own status against its own live PR
      state; nothing anywhere compared a dependency's state against its dependent's, and
      _compute_next_steps only evaluates not_started/blocked items, so an in_progress item
      stacked on a dead dependency slipped past every existing check. Same defect shape as
      landed-parent-detection (#117), which taught restack_plan to decide a parent has
      landed from git ancestry rather than board membership; never ported to
      plan-dashboard's own depends_on graph.

      This entry's original "is_ready_to_unblock_dependents() has the right predicate
      already" reading is wrong and is not preserved: that predicate is is_effectively_done()
      or OPEN_READY, so it is also false for a not_started dependency and for an open draft -
      and stacking on an open draft is this repo's normal workflow, so a check built on it
      would flag most of every plan. The note's own "Proposed fix" sentence (deferred, or
      closed unmerged) was the correct condition and is what shipped, as Item.stall_reason.

      Implemented 2026-08-20 as draft PR #184 off main with the bug label (40d9d6dd), tests
      first: 22 failing, then the implementation. Item.stall_reason answers why an item has
      stopped (a StallReason: DEFERRED or PULL_REQUEST_CLOSED_UNMERGED) with is_stalled()
      derived from it; Item.drift_description becomes drift_flags, because an item can carry
      manifest drift and a stalled dependency at once and reporting one would hide the other;
      DashboardSummary gains drift_flag_count, since the banner counts flags rather than
      items. Only direct depends_on is checked - an item further up is stacked on a base that
      is itself alive and becomes correct the moment its own dependency reparents - and each
      flag names the stalled dependency's own depends_on as the reparent target, omitted when
