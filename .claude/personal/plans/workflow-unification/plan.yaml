      anything is built, rather than reading an absent suite as one that passed.

      Two failure shapes had to be told apart, and git makes them identical. A merge that fails
      leaving no unmerged paths is not a conflict - unrelated histories, a reference that does not
      resolve, something in the way - which is #123's false-positive class, inherited before meeting
      it. A replayed rerere resolution *also* fails leaving no unmerged paths, because the replay
      has already staged them, and is distinguishable only by what git says on stderr. So the replay
      marker has to be read before the unmerged-paths rule, and removing it makes every replay
      report as integration-failed - verified by mutation rather than assumed. Both were probed
      against real git before a line of the design was committed to.

