  - id: setup-personal-notes-pr101
    title: "Land /setup-personal-notes (PR #101) — the foundation the stack PRs base on"
    branch: claude/patch-pr-rheubx
    pull_request_number: 101
    track: stack-tooling
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01GR1i6dZb8goJpCZBMCnVLM
    notes: >
      Done - merged into fork main 2026-07-31T10:36:43Z (head 90f69f56, by
      AbdelrhmanBassiouny); .claude/skills/setup-personal-notes/ and
      .claude/hooks/check-setup.sh are both on main, verified by git cat-file rather
