  - id: landed-parent-detection
    branch: claude/stack-landed-parent-detection
    title: "Decide a parent has landed from git ancestry, not board membership"
    pull_request_number: 117
    track: stack-tooling
    depends_on: [stack-tooling-on-main]
    status: in_progress
    session: https://claude.ai/code/session_01URVDhViP2TijuQAHAysUKL
    notes: >
      Bug fix, found while handling a review round on PR #41. board.json carries only
      OPEN fork PRs, so a parent branch whose own PR was closed is absent from it, and
      both consumers of the parent lookup read that absence as "no parent":
      restack_plan left the child on the stale parent instead of reparenting it onto
      the upstream base, and parent_landed treated the missing parent as a root and
      reported the child promotable. Stack now carries the merged predicate and answers
      has_landed_upstream() from git ancestry - the test the doctrine already names as
      the definition of merged - and both call sites derive from it. ROUTINE.md Phase 1
      gets the matching rule (ancestry-test the base branch of every open fork PR whose
      base is neither main nor another open PR's head), and carries the full
      dissolve -> PATCH -> restack -> re-create sequence for the stack-member 422 that
      native-stacks-prototype logged as the Phase 1 REPARENT hazard, matching the
      doctrine already live on the Routine. That last point was reversed mid-review: the
      first revision treated the 422 as report-and-continue, which optimised for the
      diff-size symptom rather than the goal - a child left on a landed base cannot
      reach main and is closed outright when Phase 1 deletes that base, so deferring the
      reparent leaves the PR broken while the routine re-reports it every run. The
      doctrine now also rules out fast-forwarding the landed base branch as a shortcut:
      it fixes the merge-base only, and desynchronises a stack's recorded base.sha when
      that base is the stack's trunk. Three TDD tests, 247 dev-tooling
      tests green. Stacked on stack-tooling-on-main since the code it fixes is not on
      main yet; the identical fix was also pushed to claude/stack-workflow-tooling's
      dev/ copy (78a093e4, 37/37 there) so the live Routine stops orphaning children
      before routine-cutover - that copy dies with tooling-branch-retirement. The live
      Routine's own Phase 1 prompt text (trig_01N79jHmLo3bSbg8pLM6MNTB) is NOT updated:
      the user asked for the patch text to review and paste rather than a direct
      update_trigger call, so until they do, restack-plan emits the right parent but
      Phase 1 still will not retarget on GitHub.
      Validated 2026-08-02 (/plan-item-resolve session) against the real PR #41 stack
      the bug was found on, not just the item's own synthetic tests: confirmed live that
      ripple-down-rules-refactor (PR #40's head) is still an ancestor of origin/main while
      PR #41 is still based on it (unreparented), and that #41 is native GitHub Stack #112
      (#41 -> #63 -> #64 -> #65 -> #66 -> #67 -> #98, all open). Ran restack_plan/
      parent_landed from both #106's pre-fix stack.py and this item's fixed stack.py
      against that real 7-PR set (real git-ancestry predicate, not a stub): pre-fix
      restack_plan reparents #41 onto the stale ripple-down-rules-refactor branch exactly
      as the bug describes; the fixed version correctly emits parent: main for #41 and
      leaves #63..#98's own parent chain untouched. This was read-only (local script, no
      push, no GitHub write) - the live reparent (dissolve Stack #112 -> PATCH #41's base
      -> restack -> re-create) was proposed but deliberately not executed pending the
      user's explicit go-ahead, being destructive and force-pushing six branches.

