    session: https://claude.ai/code/session_015db4P7UfiFTTfrbxYjU5yW
    notes: >
      Evaluation + live prototype of GitHub's stacked-PRs public preview, run on
      throwaway proto-* branches in the stack-board repo (trunk = its own throwaway
      branch; main untouched). All probes conclusive - full findings and their
      per-item consequences in the roadmap addendum of 2026-07-31. Headlines: every
      stacks REST endpoint works from a session's installation token (API version
      2026-03-10) - read, create (drafts accepted, non-main trunk, works beyond the
      fork so the preview is account-wide), extend, dissolve; merge is a new async
      endpoint (merge-async + poll) that merges everything below in one operation
      and auto-retargets the PRs above within seconds, refusing stale stacks with a
      precise not-a-linear-descendant error and refusing drafts; the classic merge
      and update-branch APIs are hard-403'd for stacked PRs (including via the
      GitHub MCP server). The one gap: no REST endpoint triggers the server-side
      cascading rebase - cascade is UI-only or a local git rebase+force-push, which
      preserves stack membership (verified). pull_request webhook/Actions payloads
      carry a stack object (id/number/position/size/base), retargets arrive as
      "edited" events, and the stack base.sha lagging the real trunk head is a
      machine-readable staleness signal. User decisions recorded: one dashboard
      only (the plans dashboard; the stack-board surface dies; every fork PR must
      belong to a plan, enforceable at dashboard build), and Stack #112 already
      wraps the seven D-core PRs on the fork. The pivot re-scopes were approved
      2026-07-31 and are recorded on the affected items (stack-tooling-on-main,
      setup-stacked-prs-skill, stack-board-single-site, routine-cutover). Round-2
      probes (same date, second addendum): PATCH base 422s on stack members (the
      Phase 1 REPARENT hazard), push-based merges are detected as merged but do not
      auto-retarget children (unlike merge-async), and unstack → PATCH base works as
      the API-only recovery. Leftover cleanup: proto-* branches on stack-board need
      out-of-harness deletion (session branch-delete 403).

