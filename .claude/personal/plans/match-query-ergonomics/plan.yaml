schema_version: 1
id: match-query-ergonomics
title: 'EQL match query ergonomics: drop the .expression / .variable detours'
description: 'Remove the two documented detours match queries force on users - match.expression
  for symbolic attribute access and quantification, and match.variable for where-conditions.
  Root cause: Match does not follow the CanBehaveLikeAVariable underscore-sandwich convention
  Query uses, so its plain public fields (parent, variable, type, conditions, domain, factory,
  kwargs, ...) shadow domain attribute names and symbolic access cannot be forwarded.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 181
waves:
- id: semantics
  name: Wave 1 - attribute-rooting semantics
  description: 'Reconcile the divergent semantics of variable-rooted vs query-rooted attributes
    before any forwarding is built on top of them: forwarding to the lowered query is only
    safe once a query-rooted attribute either correlates correctly inside that query''s own
    where-clause or raises.

    '
- id: ergonomics
  name: Wave 2 - match-as-variable API
  description: 'The API change itself: Match participates in the underscore-sandwich convention
    and forwards symbolic access, the factories unwrap a Match, and every consumer and doc
    migrates off the detours.

    '
tracks:
- id: correctness
  name: Query-rooted attribute correctness
  wave: semantics
- id: match-api
  name: Match API refactor and migration
  wave: ergonomics
- id: mapping-semantics
  name: Mapping value and identity semantics
  wave: semantics
items:
- id: aggregate-signature-reads-a-missing-attribute
  title: 'Bug: every aggregate of one kind gets the same structural signature'
  branch: claude/plan-item-kickoff-match-query-npzr78
  pull_request_number: 196
  track: mapping-semantics
  depends_on: []
  status: in progress
  session: https://claude.ai/code/session_01QK8o4m3ft424DyGFmw5vE3
  notes: 'Found on #192 (2026-08-23, roadmap section 17) and measured there: verbalization/grammar/query/assembler.py:285
    reads expression._chain_expression_ on an Aggregator, which has no such attribute. A variable
    claims no underscore-prefixed name, so the read silently becomes a symbolic attribute
    of the aggregator itself, and QueryAssembler._expression_signature returns (''Sum'', None,
    ((''_chain_expression_'', None),)) for *every* Sum - reproduced directly on two different
    aggregates.'
- id: chain-signature-reads-attribute-only-names
  title: 'Bug: a structural signature cannot tell two chains apart unless every step is an
    attribute'
  branch: claude/match-query-ergonomics-chain-tozhhq
  pull_request_number: 248
  track: mapping-semantics
  session: https://claude.ai/code/session_01UqhcpSE2EKFycf3vtvU25c
  depends_on: []
  status: in progress
  blockers: []
  notes: 'Found and measured during the kickoff of aggregate-signature-reads-a-missing-attribute
    (roadmap section 21), which fixes the same root cause one line above it. QueryAssembler._expression_signature
    builds its path as (step._attribute_name_, step._owner_class_) for every step of the chain,
    and both names belong to Attribute alone - so an Index, Call or FlatVariable step takes
    the same silent-symbolic read the aggregate one did, and the signature cannot tell two
    chains apart when only that step differs. Measured on main 2b44f1e5: order.lines[0].price
    and order.lines[1].price get equal signatures.'
