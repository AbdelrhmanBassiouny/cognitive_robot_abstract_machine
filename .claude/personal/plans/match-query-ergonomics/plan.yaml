schema_version: 1
id: match-query-ergonomics
title: "EQL match query ergonomics: drop the .expression / .variable detours"
description: >
  Remove the two documented detours match queries force on users -
  match.expression for symbolic attribute access and quantification, and
  match.variable for where-conditions. Root cause: Match does not follow the
  CanBehaveLikeAVariable underscore-sandwich convention Query uses, so its
  plain public fields (parent, variable, type, conditions, domain, factory,
  kwargs, ...) shadow domain attribute names and symbolic access cannot be
  forwarded. The two handles also silently diverge: a where-condition built
  from a query-rooted attribute does not filter at all, and a selection built
  from match.variable drops the match's conditions. Fix the semantics bug
  first, then make Match behave like a variable, then let the factories
  accept a Match directly and migrate consumers and docs.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 181

waves:
  - id: semantics
    name: "Wave 1 - attribute-rooting semantics"
    description: >
      Reconcile the divergent semantics of variable-rooted vs query-rooted
      attributes before any forwarding is built on top of them: forwarding to
      the lowered query is only safe once a query-rooted attribute either
      correlates correctly inside that query's own where-clause or raises.
  - id: ergonomics
    name: "Wave 2 - match-as-variable API"
    description: >
      The API change itself: Match participates in the underscore-sandwich
      convention and forwards symbolic access, the factories unwrap a Match,
      and every consumer and doc migrates off the detours.

tracks:
  - id: correctness
    name: "Query-rooted attribute correctness"
    wave: semantics
  - id: match-api
    name: "Match API refactor and migration"
    wave: ergonomics
  - id: mapping-semantics
    name: "Mapping value and identity semantics"
    wave: semantics

items:
  - id: chain-outside-evaluation-truncates-silently
    title: "Bug: following a chain outside query evaluation drops all but the first value"
    branch: claude/match-query-ergonomics-idk9w2
    pull_request_number: 186
    track: mapping-semantics
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_0138pFr29XH5xpEzvpmcpzV7
    notes: >
      Found while answering the review on item 1 (roadmap section 10):
      apply_mapping_on_external_root took next() of each step, so a step
      reaching several values contributed only its first - measured on main,
      a flattened chain returned one drawer's handle and dropped the other.
      Its five callers in parametrization/feature_extraction all read the
      result as one value. Fixed by classifying the mappings rather than
      counting per value: Projection (Attribute, Call, IndexByValue) reaches
      exactly one, and the walk rejects any step that is not one. Index was
      split because instrumenting it showed all three of its behaviours live
      (14 literal-key, 5 row-lookup, 4 expression-key), so one class reached
      one value or many depending on its key; Index stays the abstract base
      so existing isinstance and match sites are untouched. A flattening is
      also separated on identity - each one written is its own iteration
      variable, which flat_variable already relied on and explanation.py
      depends on. Off main, independent of item 1. Landing-order correction
      2026-08-22: item 1's isinstance(step, Index) does keep matching both
      kinds, so that is not the adjustment - but item 1's Index._rebuild_on_
      constructs Index directly, which this item makes abstract, so whichever
      lands second moves that onto IndexByValue/IndexByExpression, the same
      change this item already makes for dao.py.
      Full krrood suite green (2158 passed; the two test_object_diagram
      failures are a container missing the Graphviz dot binary, and fail
      identically on main). Review rounds 2026-08-21/22 (roadmap section 15):
      the operators that build a mapping now name it in their return type
      (436514635), and the write-back moved to IndexByValue because the base
      stored under the key the index holds, which for an expression key is the
      expression object rather than the value it takes; the setter walk carried
      the same first-value truncation as the reader and now has the Projection
      guard (b5b084522). Both questions that round left open are now settled
      (roadmap section 16): the developer took SingleValueMapping, so Projection
      is renamed throughout (1ce18ca3c, prose finished in 4a9eec6e5), and the
      match walk takes the same index distinction, raising a new ReadOnlyMapping
      instead of falling into assert_never. That error also replaced the bare
      NotImplementedError the three unwritable mappings gave. The match guard is
      covered by a test (b8b9c1434) after a first reply wrongly called the case
      unreachable: AttributeMatch.variable is typed Union[Attribute,
      FlatVariable], so a flattening there is what the field itself sanctions,
      and assert_never was firing on a value the type declares valid.
  - id: where-query-rooted-attribute-no-filter
    title: "Bug: where-condition from a query-rooted attribute silently does not filter"
    branch: claude/match-query-ergonomics-where-rooted-b876wm
    pull_request_number: 182
    track: correctness
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01AoBPcJ2koNUkKxuGERs8eC
    notes: >
      q.where(q.expression.battery >= 50) returns the whole domain with no
      error (verified 2026-08-19 on main 90c241168); only
      q.variable.battery filters. Focused bug-fix PR off main with the bug
      label: failing test first, then either make the condition correlate
      with the enclosing query's bindings or raise a meaningful exception.
      Cross-reference eql-existential-semantics (issue 137): its
      evaluation-model wave targets the same uncorrelated-evaluation family;
      check during kickoff whether that work subsumes or informs this fix,
      and record the outcome on both plans' mailboxes. Urgency raised
      2026-08-19: item 2's branch already exists and forwards attribute
      access to the lowered query, so this bug now sits under the natural
      match.where(match.attr ...) spelling; re-verified through that
      forwarding on the item-2 branch. Kickoff outcome 2026-08-19: #137 does
      not subsume this - binding the outer relation first still leaves the
      chain rooted at the query and still evaluates the query as a subquery,
      so the self-reference has to be resolved structurally; recorded on
      issues 181 and 137. Fixed by re-rooting chains taken from the query
      onto the variable it selects, at the point conditions are attached
      (Query.where / Query.having), which leaves selection-side chains and
      chains rooted at another query alone; a query selecting several
      variables raises AmbiguousQueryAttribute. Full krrood suite green.
      Review round 2026-08-20 (roadmap section 9): the developer asked why
      the rebuild does not reuse apply_mapping_on_external_root; it rebuilds
      Attribute/Index/Call chains but not a flattened one, so the structural
      rebuild stays and the thread is left open on the developer's call.
      Session https://claude.ai/code/session_0138pFr29XH5xpEzvpmcpzV7 added
      the flatten test (c1206318). Follow-up round (roadmap section 10):
      pursuing the reviewer's smell found a real bug in the rebuild - it
      routed every mapping through the mapped-variable cache, collapsing two
      flattenings of one attribute into one node, so a condition relating two
      elements became one relating an element to itself. Fixed in b88a7e81:
      a flattening rebuilds as a fresh node, every mapping rebuilds once per
      root so sharing survives, and _mapping_arguments_ is replaced by a
      per-subclass _rebuild_on_. Third round (roadmap section 11): the
      developer asked whether a condition on one selection of a set_of query,
      written as query[variable].attribute, works - it did not, and on main it
      returned the cross product. Handled in 87fb3983: re-rooting now replaces
      whichever expression stands for the row, so an index naming a selected
      variable re-roots onto it. Fourth round (roadmap section 12): naming a
      selection is now a behaviour of set_of alone - indexing a single-variable
      query indexes its value - and indexing a set_of by anything it does not
      select raises UnselectedQueryVariable at the index rather than at the
      condition; the rebuild memo key became a Rerooting dataclass (62ec184aa).
      Fifth round (roadmap section 14): the developer asked whether the memo,
      being an instance field, needs the replaced id in its key at all, and
      said to verify it. Instrumenting _reroot_on_ across the krrood suite
      gave 27 calls over 25 nodes with no node ever seeing two replaced
      expressions - structural rather than incidental, since replaced was
      always either the node's own chain root (25) or the first step of its
      access path (2), both fixed once the chain exists. Rerooting is dropped
      and the memo is keyed by the root's identifier (b9825b9e); thread
      replied to and resolved. CI: the experiments ROS timeout recorded above
      has cleared; the run on 62ec184aa was red only on
      semantic_digital_twin's test_world_sim_state_sync, a MuJoCo wall-clock
      settle test that was green on this PR's exact base and is untouched by
      the diff. Landing-order note now on the PR: #186 makes Index abstract,
      and this PR's Index._rebuild_on_ constructs Index directly, so whichever
      lands second moves that onto the concrete subclasses - a wider
      adjustment than the isinstance check section 13 names.
  - id: match-underscore-rename-and-forwarding
    title: "Match behaves like a variable: underscore-sandwich rename + guarded __getattr__ forwarding"
    branch: claude/match-query-interface-refactor-l55jym
    pull_request_number: 192
    track: match-api
    depends_on:
      - where-query-rooted-attribute-no-filter
    status: in_progress
    session: https://claude.ai/code/session_01VVM3hJmz2nSnyTXmNJCith
    blockers:
      - >-
        Must not land before where-query-rooted-attribute-no-filter: on the
        branch, q.where(q.battery >= 50) via the new forwarding silently
        returns the whole domain (verified 2026-08-19), so the branch makes
        the wave-1 bug the natural default inside where.
    notes: >
      Implemented on the branch (commit 147d098d2, full krrood suite green)
      by an independent IDE-typing session that converged on this item's
      design without knowing the plan existed: underscore-sandwich rename
      across Match/AbstractMatchExpression/AttributeMatch/HasFactoryAndKwargs
      (_declared_type_, _type_, _variable_, _conditions_, _parent_,
      _children_, _resolved_, _id_, _name_, _root_, _descendants_,
      _matches_with_variables_, _has_ellipsis_attributes_, _domain_,
      _factory_, _kwargs_), dunder- and underscore-guarded __getattr__
      forwarding to the lowered query, __dir__ completion, a new
      CalledMatchAfterResolution guard, and all krrood-internal consumers
      migrated (backends, parameterizer, verbalization planners, coraplex
      plan_node, probabilistic_model rspn). Beyond the item's scope it also
      fixes the static half: an()/a()/the() type/factory overloads return
      Union[T, Match[T]] and Match.__call__ returns Union[T, Self], pinned
      by the mypy fixture. Deviations from the item notes, still to
      reconcile before a PR: variable and matches_with_variables were
      renamed with consumers migrated in-branch instead of kept as public
      compatibility properties (the D-core stack's
      test_underspecified_match.py uses both, so its cascade will break
      loudly on rebase), and the planned old-names-are-really-gone guard
      test is not yet added.
  - id: factories-unwrap-match-and-migrate
    title: "Factories accept a Match directly; migrate consumers and docs off the detours"
    branch: null
    pull_request_number: null
    track: match-api
    depends_on:
      - match-underscore-rename-and-forwarding
    status: not_started
    notes: >
      Teach _quantify_or_build_match / entity / set_of to unwrap a Match to
      its lowered query so the(match), an(match) and set_of(match.parent,
      ...) work (today the(match) mis-routes into Match(factory=match) and
      dies in _initialize_type_'s assert_never). Migrate the ~30 .expression
      user-facing sites (krrood tests, coraplex, experiments,
      probabilistic_model) and the docs that teach the detours
      (underspecified.md, inference_explanation.md,
      graph_and_visualization.md, match.md), then decide with the developer
      whether the public expression property is removed or kept as a
      documented escape hatch. Scope update 2026-08-19: the ~20 .variable
      sites were already migrated to _variable_ by item 2's branch, and the
      public variable property no longer exists there - so this item's
      variable-side decision collapses into however item 2 resolves its
      compatibility deviation.
