schema_version: 1
id: match-query-ergonomics
title: "EQL match query ergonomics: drop the .expression / .variable detours"
description: >
  Remove the two documented detours match queries force on users -
  match.expression for symbolic attribute access and quantification, and
  match.variable for where-conditions. Root cause: Match does not follow the
  CanBehaveLikeAVariable underscore-sandwich convention Query uses, so its
  plain public fields (parent, variable, type, conditions, domain, factory,
  kwargs, ...) shadow domain attribute names and symbolic access cannot be
  forwarded. The two handles also silently diverge: a where-condition built
  from a query-rooted attribute does not filter at all, and a selection built
  from match.variable drops the match's conditions. Fix the semantics bug
  first, then make Match behave like a variable, then let the factories
  accept a Match directly and migrate consumers and docs.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 181

waves:
  - id: semantics
    name: "Wave 1 - attribute-rooting semantics"
    description: >
      Reconcile the divergent semantics of variable-rooted vs query-rooted
      attributes before any forwarding is built on top of them: forwarding to
      the lowered query is only safe once a query-rooted attribute either
      correlates correctly inside that query's own where-clause or raises.
  - id: ergonomics
    name: "Wave 2 - match-as-variable API"
    description: >
      The API change itself: Match participates in the underscore-sandwich
      convention and forwards symbolic access, the factories unwrap a Match,
      and every consumer and doc migrates off the detours.

tracks:
  - id: correctness
    name: "Query-rooted attribute correctness"
    wave: semantics
  - id: match-api
    name: "Match API refactor and migration"
    wave: ergonomics
  - id: mapping-semantics
    name: "Mapping value and identity semantics"
    wave: semantics

items:
  - id: chain-outside-evaluation-truncates-silently
    title: "Bug: following a chain outside query evaluation drops all but the first value"
    branch: claude/match-query-ergonomics-idk9w2
    pull_request_number: 186
    track: mapping-semantics
    depends_on: []
    status: done
    session: https://claude.ai/code/session_0138pFr29XH5xpEzvpmcpzV7
    notes: >
      Found while answering the review on item 1 (roadmap section 10):
      apply_mapping_on_external_root took next() of each step, so a step
      reaching several values contributed only its first - measured on main,
      a flattened chain returned one drawer's handle and dropped the other.
      Its five callers in parametrization/feature_extraction all read the
      result as one value. Fixed by classifying the mappings rather than
      counting per value: Projection (Attribute, Call, IndexByValue) reaches
      exactly one, and the walk rejects any step that is not one. Index was
      split because instrumenting it showed all three of its behaviours live
      (14 literal-key, 5 row-lookup, 4 expression-key), so one class reached
      one value or many depending on its key; Index stays the abstract base
      so existing isinstance and match sites are untouched. A flattening is
      also separated on identity - each one written is its own iteration
      variable, which flat_variable already relied on and explanation.py
      depends on. Off main, independent of item 1. Landing-order correction
      2026-08-22: item 1's isinstance(step, Index) does keep matching both
      kinds, so that is not the adjustment - but item 1's Index._rebuild_on_
      constructs Index directly, which this item makes abstract, so whichever
      lands second moves that onto IndexByValue/IndexByExpression, the same
      change this item already makes for dao.py.
      Full krrood suite green (2158 passed; the two test_object_diagram
      failures are a container missing the Graphviz dot binary, and fail
      identically on main). Review rounds 2026-08-21/22 (roadmap section 15):
      the operators that build a mapping now name it in their return type
      (436514635), and the write-back moved to IndexByValue because the base
      stored under the key the index holds, which for an expression key is the
      expression object rather than the value it takes; the setter walk carried
      the same first-value truncation as the reader and now has the Projection
      guard (b5b084522). Both questions that round left open are now settled
      (roadmap section 16): the developer took SingleValueMapping, so Projection
      is renamed throughout (1ce18ca3c, prose finished in 4a9eec6e5), and the
      match walk takes the same index distinction, raising a new ReadOnlyMapping
      instead of falling into assert_never. That error also replaced the bare
      NotImplementedError the three unwritable mappings gave. The match guard is
      covered by a test (b8b9c1434) after a first reply wrongly called the case
      unreachable: AttributeMatch.variable is typed Union[Attribute,
      FlatVariable], so a flattening there is what the field itself sanctions,
      and assert_never was firing on a value the type declares valid.
  - id: where-query-rooted-attribute-no-filter
    title: "Bug: where-condition from a query-rooted attribute silently does not filter"
    branch: claude/match-query-ergonomics-where-rooted-b876wm
    pull_request_number: 182
    track: correctness
    depends_on: []
    status: done
    session: https://claude.ai/code/session_01T8fersfoxdBJpmYVSpbdh7
    notes: >
      q.where(q.expression.battery >= 50) returns the whole domain with no
      error (verified 2026-08-19 on main 90c241168); only
      q.variable.battery filters. Focused bug-fix PR off main with the bug
      label: failing test first, then either make the condition correlate
      with the enclosing query's bindings or raise a meaningful exception.
      Cross-reference eql-existential-semantics (issue 137): its
      evaluation-model wave targets the same uncorrelated-evaluation family;
      check during kickoff whether that work subsumes or informs this fix,
      and record the outcome on both plans' mailboxes. Urgency raised
      2026-08-19: item 2's branch already exists and forwards attribute
      access to the lowered query, so this bug now sits under the natural
      match.where(match.attr ...) spelling; re-verified through that
      forwarding on the item-2 branch. Kickoff outcome 2026-08-19: #137 does
      not subsume this - binding the outer relation first still leaves the
      chain rooted at the query and still evaluates the query as a subquery,
      so the self-reference has to be resolved structurally; recorded on
      issues 181 and 137. Fixed by re-rooting chains taken from the query
      onto the variable it selects, at the point conditions are attached
      (Query.where / Query.having), which leaves selection-side chains and
      chains rooted at another query alone; a query selecting several
      variables raises AmbiguousQueryAttribute. Full krrood suite green.
      Review round 2026-08-20 (roadmap section 9): the developer asked why
      the rebuild does not reuse apply_mapping_on_external_root; it rebuilds
      Attribute/Index/Call chains but not a flattened one, so the structural
      rebuild stays and the thread is left open on the developer's call.
      Session https://claude.ai/code/session_0138pFr29XH5xpEzvpmcpzV7 added
      the flatten test (c1206318). Follow-up round (roadmap section 10):
      pursuing the reviewer's smell found a real bug in the rebuild - it
      routed every mapping through the mapped-variable cache, collapsing two
      flattenings of one attribute into one node, so a condition relating two
      elements became one relating an element to itself. Fixed in b88a7e81:
      a flattening rebuilds as a fresh node, every mapping rebuilds once per
      root so sharing survives, and _mapping_arguments_ is replaced by a
      per-subclass _rebuild_on_. Third round (roadmap section 11): the
      developer asked whether a condition on one selection of a set_of query,
      written as query[variable].attribute, works - it did not, and on main it
      returned the cross product. Handled in 87fb3983: re-rooting now replaces
      whichever expression stands for the row, so an index naming a selected
      variable re-roots onto it. Fourth round (roadmap section 12): naming a
      selection is now a behaviour of set_of alone - indexing a single-variable
      query indexes its value - and indexing a set_of by anything it does not
      select raises UnselectedQueryVariable at the index rather than at the
      condition; the rebuild memo key became a Rerooting dataclass (62ec184aa).
      Fifth round (roadmap section 14): the developer asked whether the memo,
      being an instance field, needs the replaced id in its key at all, and
      said to verify it. Instrumenting _reroot_on_ across the krrood suite
      gave 27 calls over 25 nodes with no node ever seeing two replaced
      expressions - structural rather than incidental, since replaced was
      always either the node's own chain root (25) or the first step of its
      access path (2), both fixed once the chain exists. Rerooting is dropped
      and the memo is keyed by the root's identifier (b9825b9e); thread
      replied to and resolved. CI: the experiments ROS timeout recorded above
      has cleared; the run on 62ec184aa was red only on
      semantic_digital_twin's test_world_sim_state_sync, a MuJoCo wall-clock
      settle test that was green on this PR's exact base and is untouched by
      the diff. Landing-order note now on the PR: #186 makes Index abstract,
      and this PR's Index._rebuild_on_ constructs Index directly, so whichever
      lands second moves that onto the concrete subclasses - a wider
      adjustment than the isinstance check section 13 names.
      Upstream review round 2026-08-24 (roadmap section 22): the fork PR was
      green, out of draft and fully resolved, but the branch was stalled on
      cram2#563, where tomsch420 requested changes over one word - "is
      correlate the correct wording?" - and the developer had already agreed
      the name is misleading. correlate is SQL's term for the subquery
      semantics this fix works against, not for what it does, so
      _correlate_conditions_/_correlate_condition_ are renamed
      _reroot_conditions_/_reroot_condition_, the word the rest of the diff
      already used (_reroot_on_, _rerooted_chains_, _rerooted_on_selection_,
      both docstrings). No behaviour change; both are private to Query and no
      reader of either old name is left in the repository. test_eql 1191
      passed, 3 skipped.
      The landing-order hazard came due in the same session: #186 had merged
      to main, so #182 went mergeable_state dirty and this branch is the
      second lander. main is merged in and the recorded adjustment made -
      Index is abstract, so _rebuild_on_ moved onto IndexByValue and
      IndexByExpression, each naming its own class; exceptions.py conflicted
      additively only and all four new classes are kept. test_eql 1202
      passed, 3 skipped after the merge. The needs-resolution label is left
      for the stack tooling to clear itself.
  - id: match-underscore-rename-and-forwarding
    title: "Match behaves like a variable and like a query: underscore-sandwich rename, forwarding, and the shared interfaces"
    branch: claude/match-query-interface-refactor-l55jym
    pull_request_number: 192
    track: match-api
    depends_on:
      - where-query-rooted-attribute-no-filter
    status: in_progress
    session: https://claude.ai/code/session_01Hg8944NTdj8WMSGFqV4mq8
    blockers:
      - >-
          Three review threads open, all answered with measurements and none needing a change from
          this side. (1) The four translate() sites in test_random_events_translator.py keep
          _variable_, because Query._type_ is None and the random-events translator reads
          comparator.left._type_; teaching Query to report its selected variable's type is a change
          to a class main owns, so it is the developer's call. (2) The .resolve() calls in the
          feature-extraction tests stay, being load-bearing; making ground() resolve its own
          argument is a probabilistic_model change the developer should choose. (3) 2026-09-03
          15:55, on test_markov_chain.py:186 - whether part.variable was an EQL name at all.
          Measured: part is a Match and _variable_ an IndexByValue, the foreign object on that line
          is the random_events Symbolic on the other side of the ==, and restoring .variable fails
          three tests. The conflict against main is resolved and the round's other threads are
          closed.
    notes: >
      Implemented ahead of order by an independent IDE-typing session on
      claude/ide-type-inference-instances-dc6l6e (commit 147d098d2), which converged on this item's
      design without knowing the plan existed: underscore-sandwich rename across
      Match/AbstractMatchExpression/ AttributeMatch/HasFactoryAndKwargs, guarded __getattr__
      forwarding to the lowered query, __dir__ completion, a CalledMatchAfterResolution guard, all
      krrood-internal consumers migrated, plus the static half the plan had not scoped
      (an()/a()/the() return Union[T, Match[T]], Match.__call__ returns Union[T, Self], pinned by
      the mypy fixture). Resolved 2026-08-23 (roadmap section 17): the recorded blocker was a
      landing-order constraint, not an unsolved problem, so it is discharged by stacking - the work
      moved onto claude/match-query-interface-refactor-l55jym, which starts from #182's head with
      147d098d2 cherry-picked on top, and PR #192 is based on #182's branch. Not stacked on #186,
      which is independent. The developer also asked for the common parent between Match and Query,
      and it turned out to close a hole this item's own forwarding opened: getattr on the lowered
      query put the whole public namespace of Query between a match and its matched class, so
      a(Release).build returned Query.build. HasSymbolicAttributes (the dunder guard, __dir__, and a
      _get_symbolic_attribute_ hook) and HasQueryModifiers (where, having, ordered_by, distinct,
      grouped_by, limit) now state what the two share; a match forwards all six modifiers and
      returns itself. The section-7 deviation is reconciled as section 4 decided: variable and
      matches_with_variables are public compatibility properties again, so the D-core stack keeps
      working, and item 3 removes them. Section 6's guard test and the blocker's own repro are
      covered. The name policy stayed per class (_is_own_name_) because unifying it surfaced a
      pre-existing bug in the verbalization assembler and changed an exception type a backends test
      pins - both reported on #181, not fixed here. Review round 2026-08-23 (roadmap section 18):
      the developer caught that the forwarding covered attribute access alone, where a
      CanBehaveLikeAVariable offers twenty-five operations, and that Match.__call__ collides with a
      callable matched class. Both taken: the operations are now written once in
      CanBehaveLikeAValue, each built on the one expression an implementation reports as
      _symbolic_expression_ (a variable reports itself, a match its lowered query), so
      HasSymbolicAttributes is gone and CanBehaveLikeAVariable keeps only the mapped-variable cache.
      The developer's parentheses rule - first call states the pattern, later calls call the
      instance - is implemented with a callability check, so a class whose instances are not
      callable keeps raising CalledMatchMultipleTimes/CalledMatchAfterResolution and no existing
      behaviour changes. Two gaps closed to make the operations mean anything: a bare query used as
      a value in its own condition was uncorrelated (where(match == robot) returned every row) and
      is now replaced by the selected variable, raising the new AmbiguousQuerySubject for a
      multi-selection query; and Call read the return hint off the called type rather than its
      __call__, so calling any callable instance raised KeyError('return') - pre-existing, since
      variable(Adder, ...)(10) failed identically on main. Naming round 2026-08-23 (roadmap section
      19): CanBehaveLikeAValue is renamed HasSymbolicOperations, since the pair differed by one word
      that said nothing about which half holds the mapped-variable cache; the cache stays on
      CanBehaveLikeAVariable because it constructs mappings whose child must be a
      SymbolicExpression, and a second cache would split match.x from match.expression.x. The same
      round found the instance-likeness was one-directional: variable == match passed every row,
      because a match reached the comparator as a Literal. SymbolicExpression._as_operand_ now
      states once that a value standing for an expression contributes it. A match given to a
      predicate is still refused - a query argument there is evaluated uncorrelated even with no
      match involved, which is wave 1's territory - and selecting a match stays item 3's.
      test/krrood_test: 2088 passed, 6 skipped (excluding the Graphviz/flask-dependent modules,
      which fail identically with the diff stashed). Resolved 2026-09-01 (roadmap section 26): the
      only thing stalling this item was the conflict against main, and its cause was never recorded
      - the branch's merge base is 15f31d1e4, #182's branch *before* #182 merged main to take #186's
      Index split, so #192 carried none of that hierarchy while rewriting the same
      mapped_variable.py. It is the landing-order adjustment sections 13/14/22 predicted, arriving
      one branch late rather than a new problem. main is merged in and all three conflicts resolved
      by taking both sides: the operators keep this item's routing through _symbolic_expression_ and
      take #186's Attribute/Index/Call return types and the IndexByValue/IndexByExpression split;
      has_cause_attributes and causes() arrive from main's do() operator reading
      _matches_with_variables_, AttributeMatch.assigned_variable keeps main's fresh-copy branch for
      a shared Cause/Confounder, and _update_kwargs_from takes main's IndexByValue distinction;
      test_match.py keeps both sides' tests. One pin moved: the mypy fixture asserted
      a(Robot).battery as CanBehaveLikeAVariable[Robot], which predates #186 naming what each traced
      operator builds, and now asserts Attribute[Robot] - narrowing the assertion to the type main
      landed rather than reverting main's precision, which sections 15/16 settle as this plan's own
      convention. Nothing else was stalling it: #192 has no review threads at all, was never
      promoted upstream (no in-review label, so no upstream pull request to read), and its
      dependency is merged; its previous CI was green but on e9aae10be of 2026-08-24, against a base
      nine days stale. test_eql 1287 passed, 3 skipped; full test/krrood_test 2269 passed, 5
      skipped, the two test_object_diagram failures being this container having no Graphviz dot
      binary. Resolved 2026-09-02 (roadmap section 27): conflicted again one day later, and again
      the whole of it was one class statement - main took cram2#575 (probabilistic queries), whose
      HasExpression mixin adds a base to the same class Match(...) this item rewrites with
      HasQueryModifiers/HasSymbolicOperations. That line is the only conflict in the 1,518 lines
      #575 brought. Both sides kept: the two interfaces say what can be written on a match,
      HasExpression says what a match resolves to for a caller that only wants the expression to
      scan or build, and Match owes both answers. Checked before touching it, so the record names
      the cause this time: no review threads, no in-review label and never promoted upstream,
      dependency merged and ready, 23 checks green on ff5414e0. #575's new code reads a match only
      through the public expression property, so section 6's silent-miss hazard had nothing to
      catch. Left as a question on #192 and #181 rather than decided here:
      HasExpression._get_expression_ and HasSymbolicOperations._symbolic_expression_ return the same
      object on every class that has both, with different declared contracts, and unifying them
      would change an interface main landed the day before. test_eql 1310 passed, 3 skipped; full
      test/krrood_test 1916 passed, 5 skipped (excluding the flask/casadi modules), the two
      test_object_diagram failures being this container's missing Graphviz dot binary. Review round
      2026-09-03 (roadmap section 28), f70c1aff4 and 6df7b7516: the developer's first real review of
      #192, six threads left minutes after section 27's report, which is why both 26 and 27 recorded
      "no review threads". Five are acted on and resolved, one (_is_own_name_) is a question
      answered and left open. The first - "remove this and migrate the callers" on
      matches_with_variables - was extended by the developer to all three compatibility properties,
      so variable, matches_with_variables and expression are gone with every caller migrated, which
      is what consumed item 3 entirely. Removing the public expression forced two changes it had
      been standing in for: the factories now unwrap a match (the(match), entity(match),
      set_of(match, ...) and row[match] all read it through _as_operand_, the section-19 rule now
      applied at Query's selected variables and UnificationDict.__getitem__ as well as at operands),
      and marginalize_for re-roots a chain taken from the match's own query onto its selection,
      since it looked its attributes up by the chain's display name and only a variable-rooted one
      matched. expression was also the match hierarchy's abstract member, so it becomes
      _symbolic_expression_ on AbstractMatchExpression and AttributeMatch too, and Match holds the
      lowering there rather than under a third name both protocol members delegated to - which
      settles half of section 27's open question by removing the public handle standing under them.
      Also here: every _variable_-rooted spelling reads the match directly (measured identical
      verbalization, so section 7's divergence note does not survive #182), the box-drawing dividers
      become # %%, the optional empty pattern parentheses are dropped at 17 sites, the five user
      docs stop teaching the detours, and update_fields, create_or_update_variable and
      has_cause_attributes move behind the underscore convention. Recorded rather than discovered
      later: #159 (D-core-single-class, open and out of draft) still reads
      match.matches_with_variables and match.variable, so its cascade breaks - the cost sections 4
      and 17 kept the properties to avoid, now accepted on the developer's instruction.
      AttributeMatch._symbolic_expression_ has no reader anywhere, left as a question.
      test/krrood_test 1919 passed, 5 skipped.

      Resolved 2026-09-03, second round (roadmap section 30): conflicted an eighth time and reviewed
      a second time, and section 28's own report was again nine hours older than the review it said
      did not exist. The conflict was one hunk of cram2#590 (Markov-chain template), which extracted
      the part-prefix logic out of rspn.py into RelationalDistributionTemplate._prefix_for_part over
      the same lines this branch had renamed; main's extraction is kept and the extracted helper
      reads _variable_. #590 is also the first arrival since the compatibility properties were
      removed, so section 6's silent-miss hazard finally caught something: test_markov_chain.py read
      match.kwargs and interpolated f"{part.variable}.type", and template.py read
      str(part.variable), all three now on the convention - the sweeps of sections 26 and 27 came
      back clean only because #575 reached a match through the public expression that still existed
      then. Of the review round's four threads, three are done: the six CausesEffect construction
      tests read the match directly (they had been renamed .variable -> ._variable_ rather than
      migrated, and the binding is renamed arm -> pick, which it never was), and the three
      match.resolve() calls in the match-verbalization tests are gone because MatchPlanner resolves
      the match itself and every expected string is unchanged. The feature-extraction resolve()
      calls are kept and measured to be load-bearing: without them the grounded circuit carries
      SceneObject.type instead of the per-position SceneRoom.objects[i].type. The fourth is refused
      with a measurement and left open: the four translate() sites in
      test_random_events_translator.py cannot drop _variable_ because Query._type_ is None -
      SymbolicExpression._type__ delegates to self._var_ and a query is its own _var_ - so every
      chain built on a query has no type and the random-events translator, which reads
      comparator.left._type_, raises. Pre-existing on main with no match involved
      (entity(v).position.x._type_ is None there too); it never shows inside a where because #182
      re-roots the chain onto the variable at attachment. Teaching Query to report its selected
      variable's type is a change to a class main owns for every query in the language, so it is the
      developer's to route. test/krrood_test 1925 passed, 5 skipped.
  - id: aggregate-signature-reads-a-missing-attribute
    title: "Bug: every aggregate of one kind gets the same structural signature"
    branch: claude/plan-item-kickoff-match-query-npzr78
    pull_request_number: 196
    track: mapping-semantics
    depends_on: []
    status: in_progress
    session: https://claude.ai/code/session_01QK8o4m3ft424DyGFmw5vE3
    notes: >
      Found on #192 (2026-08-23, roadmap section 17) and measured there:
      verbalization/grammar/query/assembler.py:285 reads
      expression._chain_expression_ on an Aggregator, which has no such
      attribute. A variable claims no underscore-prefixed name, so the read
      silently becomes a symbolic attribute of the aggregator itself, and
      QueryAssembler._expression_signature returns
      ('Sum', None, (('_chain_expression_', None),)) for *every* Sum -
      reproduced directly on two different aggregates. _is_order_key therefore
      treats any two aggregates of one kind as the same column, so a set_of
      selecting two aggregates and ordered by one attaches the ranking
      superlative to whichever it compares first. Seven test_set_of_ranking
      tests pass only because both sides of the comparison are equally wrong,
      which is why nothing caught it. Pre-existing on main, independent of
      #192 and of every other item here; it is tracked in this plan because the
      naming convention that hides it is what this plan is refactoring, the
      same way chain-outside-evaluation-truncates-silently was. Focused bug-fix
      PR off main with the bug label: failing test first, pinning that two
      different Sums have different signatures, then read the aggregated
      expression through the field that actually holds it rather than a name
      the class does not define.
      Self-review round 2026-09-01 (roadmap section 24): the developer left an
      unresolved thread on the closing assert of
      test_ranking_names_the_ordered_by_aggregate_not_the_first_selected,
      proposing the trailing "the sum" be spelled out in full. Measured in an
      isolated venv: all 17 tests in the file pass as written, and the
      reduction is correct by AggregatorRule.build's identity-keyed
      coreference - tax is the same object in both the order key and the
      selection. The ambiguity is real for a reader regardless (proximity
      resolves "the sum" to the just-mentioned net, not the frame's tax three
      clauses back), but fixing it is a second root cause in
      AggregatorRule.build, not a one-line change to this PR. Replied on the
      thread with the measurement and left it unresolved pending which of
      "change the assert here" or "carve out a new item" the developer wants;
      PR otherwise green and out of blockers, so status is unchanged.
  - id: chain-signature-reads-attribute-only-names
    title: "Bug: a structural signature cannot tell two chains apart unless every step is an attribute"
    branch: claude/match-query-ergonomics-chain-tozhhq
    pull_request_number: 248
    track: mapping-semantics
    session: https://claude.ai/code/session_01UqhcpSE2EKFycf3vtvU25c
    depends_on:
      - where-query-rooted-attribute-no-filter
    status: in_progress
    blockers: []
    notes: >
      Found and measured during the kickoff of aggregate-signature-reads-a-missing-attribute
      (roadmap section 21), which fixes the same root cause one line above it.
      QueryAssembler._expression_signature builds its path as (step._attribute_name_,
      step._owner_class_) for every step of the chain, and both names belong to Attribute alone - so
      an Index, Call or FlatVariable step takes the same silent-symbolic read the aggregate one did,
      and the signature cannot tell two chains apart when only that step differs. Measured on main
      2b44f1e5: order.lines[0].price and order.lines[1].price get equal signatures. Not folded into
      #196 because it is a different fix, not a different symptom: no existing name is a sound key
      for a step - _name_ is a display name and Call._name_ drops the call's arguments entirely - so
      a faithful one needs each mapping subclass to report its own constructor arguments, which is
      core API in mapped_variable.py that #182 is currently rewriting.
      get_clean_name_from_mapped_variable already guards the identical read with isinstance(step,
      Attribute), so the guard is established here rather than invented. #196 routes aggregates
      through this walk for the first time, so sum(o.lines[0].price) and sum(o.lines[1].price) still
      collide after it - pre-existing, and this item's to close.

      Resolve 2026-09-01: the recorded blocker is discharged rather than solved - #182 merged to
      main on 2026-08-24, so `_rebuild_on_` (per-subclass, naming its own class) and #186's
      Projection/Index/FlatVariable hierarchy are both on main, and the per-subclass constructor
      arguments this item needs are there to model the structural key on. Dependency check:
      `where-query-rooted-attribute-no-filter` is `merged`, `is_ready: true`.

      Branch `claude/match-query-ergonomics-chain-tozhhq`, off `main` at 2318e2065. Not stacked on
      #196 (`aggregate-signature-reads-a-missing-attribute`): that pull request is still a draft,
      which is not what this workflow stacks on, and the two changes are independent - #196 reads
