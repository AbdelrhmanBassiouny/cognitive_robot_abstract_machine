schema_version: 1
id: eql-planning-robots
title: 'EQL planning on robots: Montessori sorting, cramph Achieve nodes and RoboCasa'
description: 'The planner from eql-planning (#513) put to work on robots: Montessori sorting as a
  planning domain and #511''s fifth backend, effects for the coraplex actions, a cramph Achieve(goal)
  node that plans and replans, RoboCasa goals read from the tasks'' success checks, and 5-10 RoboCasa
  tasks end to end. Feature freeze 2026-12-18; IROS 2027 experiments in January.'
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 522
waves:
- id: robot
  name: Robot domains (Nov 16-Dec 18)
  description: Montessori sorting first, then RoboCasa through cramph; freeze on Dec 18.
- id: evaluation
  name: Constraints and external planners (January)
  description: Trajectory constraints and the comparison with external planners.
tracks:
- id: montessori
  name: Montessori domain
  wave: robot
  description: Nov 16-Dec 2; the AAMAS rebuttal (Nov 20-24) falls inside it.
- id: cram-robocasa
  name: cramph Achieve node and RoboCasa
  wave: robot
  description: Dec 3-18, with Jonas's cramph statecharts.
- id: paper
  name: IROS experiments and paper
  wave: evaluation
items:
- id: montessori-planning-domain
  branch: eql-planning-robots/montessori-planning-domain
  title: 'Montessori sorting as a planning domain: SortPieceAction effects and the for_all goal'
  track: montessori
  status: not_started
  notes: 'SortPieceAction exists only on the unlanded showcase PR #511.'
  blockers:
  - '#511 (EQL showcase) has not landed.'
  depends_on:
  - eql-planning/planning-backend-search
- id: planner-as-showcase-backend
  branch: eql-planning-robots/planner-as-showcase-backend
  title: 'The planner answers the plan''s open steps as #511''s fifth backend, through the Achieve
    act'
  track: montessori
  depends_on:
  - montessori-planning-domain
  - eql-performatives/giskardpy-acts
  status: not_started
- id: blocking-restores-world-state
  branch: eql-planning-robots/blocking-restores-world-state
  title: blocking leaves its IK solution in the live world state
  track: cram-robocasa
  status: not_started
  notes: 'semantic_digital_twin reasoning/robot_predicates.py: blocking writes the IK result into
    world.state inside modify_world() and never restores it. Bug-fix PR off main with the bug label;
    failing test first.'
- id: relational-predicates-in-eql
  branch: eql-planning-robots/relational-predicates-in-eql
  title: Robot relational predicates the planner reasons through (GripperHolds, IsPartOfARobot) as
    EQL bodies
  track: cram-robocasa
  status: not_started
  depends_on:
  - eql-planning/state-objects-and-domains
  notes: 12 of the 57 workspace predicates and symbolic functions are relational; the inventory is
    in https://claude.ai/artifact/3zhr45pHQ9P9mdqxtJs5L5
  blockers:
  - 'Owner decision: internal relational questions are Python for speed. The design argues the planner
    compiles EQL bodies, so per-step speed doesn''t apply; revisit for bodies that pass the three-part
    rule.'
- id: geometric-attachments
  branch: eql-planning-robots/geometric-attachments
  title: Geometric predicates as attachments that receive the state and declare what they read
  track: cram-robocasa
  status: not_started
  depends_on:
  - eql-planning/fluent-state-overlay
  - eql-planning/state-objects-and-domains
  notes: 27 geometric bodies (inventory in the design). A SemDT world puts itself into a state only
    for code that reads it implicitly, through a reset_state_context() variant that doesn't notify
    observers.
  blockers:
  - 'Owner decision: the opaque-code contract (attachments declaring input terms, the world put into
    the state, or both), and the eql-planning roadmap rule that a State never mutates live objects.'
- id: coraplex-action-effects
  branch: eql-planning-robots/coraplex-action-effects
  title: Effects for pick, place, open, close and navigate, separate from post_condition monitors
  track: cram-robocasa
  status: not_started
  depends_on:
  - eql-planning/action-schema-progression
  - icra-upstream/coraplex-actions-on-cramph
  - concept-theory/contact-and-support
  - concept-theory/holds-estimator
  - eql-planning/state-objects-and-domains
  notes: Attaching a body removes a Connection and adds a FixedConnection, so pick and place need
    objects in a state.
- id: cramph-achieve-node
  branch: eql-planning-robots/cramph-achieve-node
  title: A cramph Achieve(goal) node that plans when expanded and replans when a step fails
  track: cram-robocasa
  status: not_started
  blockers:
