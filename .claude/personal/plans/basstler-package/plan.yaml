schema_version: 1
id: basstler-package
title: 'The basstler package: every tooling module and its bash entry points move into it'
description: The workflow tooling grew as loose Python under .claude/ across three separate
  sys.path entries, so nothing in one directory could import another and the same code was
  written out repeatedly. This moves all of it into one importable package, then converts
  the bash entry points into thin shims over it, one layer at a time. The package is named
  basstler, after the user's surname and the German word for a tinkerer.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: extraction
  name: The package exists
  description: The move itself, and the setup path a newcomer reaches it by.
- id: conversion
  name: The bash layer becomes shims
  description: Each entry point's body moves onto the package and its script becomes a shim,
    in dependency order off the core modules.
tracks:
- id: extraction
  name: Package extraction and setup
  wave: extraction
- id: conversion
  name: Bash to Python conversion
  wave: conversion
- id: carried-across
  name: Pull requests carried across the move
  wave: extraction
  description: Tooling pull requests that change a module the package moves. Each is stacked
    on basstler-package and changes the module in its new place, so it lands after the move.
items:
- id: basstler-src-layout
  title: Move basstler to the src layout, importable through an editable install
  branch: claude/brave-archimedes-nonocl
  status: in progress
  track: extraction
  depends_on: []
  pull_request_number: 501
  session: https://claude.ai/code/session_01DmYmRWYUV9qFEkWydytE7u
  notes: 'Move basstler to the `src` layout every other package here uses (`basstler/src/basstler/`),
    and make it importable through an editable install that `session-start.sh` performs when
    missing. Asked for on cram2#659 (`scripts/sync_version.py:26`, LucaKro: "why is basstler
    not a proper package like the others?"). What goes away: `FLAT_LAYOUT_PACKAGES`, `package-dir
    basstler = "."`, and `pyproject.toml` shipped as package data.'
- id: basstler-notes-core-python
  title: 'Bash→Python 1: notes-core modules (config, git seam, writer, markers)'
  branch: null
  status: not started
  track: conversion
  depends_on: []
  notes: Pure addition to the package, no bash file changes (decision 12).
- id: basstler-save-commands-python
  title: 'Bash→Python 2: the four notes writers become python -m subcommands'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-notes-core-python
  notes: '`save-personal-notes.sh`, `save-pr-progress.sh`, `write-personal-notes-file.sh`
    and `create-personal-notes-branch.sh` become three-line shims; their bodies move onto
    the core modules, collapsing four near-identical scratch-worktree write dances into `NotesBranchWriter`.'
- id: basstler-save-plan-python
  title: 'Bash→Python 3: save-plan and the plan manifest tools'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-save-commands-python
  notes: '`save-plan.sh` becomes a shim; `plan_manifest_tools.py` is absorbed as `plan_manifest.py`.
    New validation with curated errors instead of `cp`/traceback noise: the roadmap marker
    block must be non-empty, since today an empty block silently overwrites `roadmap.md`,
    and the `--manifest`/`--roadmap` source files must exist. Both existing test files carry
    over, one with an import change and one as the shim contract test.'
- id: basstler-session-start-python
  title: 'Bash→Python 4: session-start behind an inert probing shim'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-notes-core-python
  notes: '`session-start.sh` keeps its path, so `settings.json` stays byte-identical, but
    its body becomes the one guarded shim: `command -v python3` plus a >= 3.11 version probe,
    exiting 0 with a single diagnostic line when absent, so the hook stays inert on machines
    without python3. The floor raise is user-accepted - every targeted environment ships 3.11
    or later. `session_start.py` reproduces the stdout summary and every written marker byte-for-byte,
    pinned by golden-output fixtures recorded from the bash version before deletion.'
- id: basstler-setup-checks-python
  title: 'Bash→Python 5: check-setup as typed rows'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-notes-core-python
  notes: '`check-setup.sh` becomes a shim over `setup_checks.py`: `SetupCheckIdentifier` and
    `SetupCheckStatus` StrEnums, a frozen `SetupCheckRow`, and a `SetupReport` preserving
    the exact TSV row order and exit-code semantics, which are external API for `/setup-personal-notes`
    and `prerequisite-check.md`. The parsing enums the test file already defines move into
    the production module and the test imports them instead.'
- id: basstler-dashboard-refresh-python
  title: 'Bash→Python 6: refresh_dashboard orchestration in-process'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-save-commands-python
  notes: '`refresh_dashboard.sh` becomes a shim over `dashboard_refresh.py`, which calls `sync_manifest_status`/`build_dashboard`
    in-process - the package extraction has moved them by this point - and pushes manifest
    corrections through `NotesBranchWriter` instead of shelling out. `refresh_dashboard_support.py`,
    which exists only as JSON plumbing for the shell orchestrator, is deleted along with its
    constant, and its two operations become internal functions. The merged single-JSON stdout
    contract and the `--plan-id` flag stay unchanged; the existing shell test carries over
    as the shim contract test.'
- id: basstler-config-shim-slimming
  title: 'Bash→Python 7: slim the sourced config file to constants'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-save-commands-python
  - basstler-save-plan-python
  - basstler-session-start-python
  - basstler-setup-checks-python
  - basstler-dashboard-refresh-python
  notes: '`resolve-personal-notes-config.sh` keeps its sourcing contract - ten documentation
    locations plus `ci.yml` twice source it for its variables and its cd-to-root side effect,
    so no `SKILL.md` change is mandatory by construction - but shrinks to the cd preamble,
    the three `NOTES_*` resolutions, the path constants and the pure-string path helpers.
    The behavioural functions are deleted once a grep of every `.md` confirms no prose instructs
    a session to call them.'
- id: basstler-github-api-unification
  title: 'One github backend: the gh-CLI-else-token rule implemented once'
  branch: null
  status: not started
  track: conversion
  depends_on:
  - basstler-notes-core-python
  notes: '`github-api.sh` (decision 9, arriving with #107) and `pr_state` (arriving with #111)
    implement the same gh-CLI-else-token-and-curl dual-backend rule twice - the strongest
    concrete duplication on record in this work. `.claude/stack/maintenance.py` makes the
    same calls a third time, in `urllib` rather than `curl`; its own review asked directly
    why not `gh` and why not a GitHub Python library, and both were deferred here rather than
    answered there, since adding a third copy of the rule, even a better one, is what this
    item exists to stop.'
  blockers:
  - 'One carrier fewer since 2026-10-04: setup-personal-notes-script (#107, stack-tooling-install)
    no longer brings github-api.sh.'
  - 'Cross-plan dependency, not representable in depends_on: needs shared-pr-state-chips (#111,
    plan-dashboards), which brings pr_state - the other carrier this item unifies.'
