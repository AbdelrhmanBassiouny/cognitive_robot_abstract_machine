schema_version: 1
id: basstler-package
title: 'The basstler package: every tooling module and its bash entry points move into it'
description: The workflow tooling grew as loose Python under .claude/ across three separate sys.path
  entries, so nothing in one directory could import another and the same code was written out repeatedly.
  This moves all of it into one importable package, then converts the bash entry points into thin
  shims over it, one layer at a time. The package is named basstler, after the user's surname and the
  German word for a tinkerer.
default_repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
tracking_issue: 102
waves:
- id: extraction
  name: The package exists
  description: The move itself, and the setup path a newcomer reaches it by.
- id: conversion
  name: The bash layer becomes shims
  description: Each entry point's body moves onto the package and its script becomes a shim, in dependency
    order off the core modules.
tracks:
- id: extraction
  name: Package extraction and setup
  wave: extraction
- id: conversion
  name: Bash to Python conversion
  wave: conversion
- id: carried-across
  name: Pull requests carried across the move
  wave: extraction
  description: Tooling pull requests that change a module the package moves. Each is stacked on
    basstler-package and changes the module in its new place, so it lands after the move.
