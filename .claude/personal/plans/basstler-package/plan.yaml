- id: basstler-package
  title: 'Create the basstler package: the .claude Python and its tests move into it'
  branch: claude/plan-item-kickoff-workflow-cuare2
  pull_request_number: 185
  status: done
  session: https://claude.ai/code/session_014kmiZegiD2Q8w2eese2L2L
  track: extraction
  depends_on: []
  blockers:
  - >-
    Cleared 2026-09-30: `main` merged at `0c7ff268f` (clean, 665 pass); `integration_test_command`
    overridden in `.claude/personal/stack.toml` on the notes branch to `python3 -m pytest
    test/basstler_test --confcutdir=test/basstler_test`, which the published pipeline reads;
    `integration-conflict` removed from #185. The next integration build is the check. Delete the
    override once a build carrying #154 or #211 has published, since both commit the same command.
    Until then a build that leaves #185 out fails under it, and blames whichever tip it happens to
    localise.
  - >-
    Upstream review cram2#659: LucaKro (changes requested 2026-09-21) and tomsch420 (changes
    requested 2026-10-01). Every agreed thread is fixed on the fork: round one in `86e90570d`,
    round two in `1f6b3c585` - path constants grouped into `basstler/locations.py`'s two path
    enums, the dependency check asking `importlib.metadata` instead of its own regex and cache,
    `sync_version.py` finding packages from each `pyproject.toml`, the conftest `sys.path` insert
    removed, and an AGENTS.md rule on enum value types. The user replied on the upstream threads
    2026-10-01 and fixed the title. A fork review round the same day followed in `a83cca79c` and
    `96146eb45`: `.claude` named once as `ProjectLocation.CLAUDE_CODE_DIRECTORY`, and the test
    constants grouped into enums. 690 tests pass on 3.11 and 3.12. Waiting on the upstream
    reviewers. `Directory(Path, Enum)` cannot be built on 3.11, which basstler still supports, so
    the enums carry `Path` values. The user chose (2026-10-01) to make the
    cleaner `Path` mixin part of `basstler-src-layout`, together with a 3.12+ environment for basstler.
  - >-
    Upstream round three, 2026-10-02 (session
    https://claude.ai/code/session_01GzsB6xE8CwrBApLvwSbGjD): tomsch420's two new asks on cram2#659 are
    applied in `be0ed435f`. `Dependency`'s name-boundary regex is a field, and `ItemStatus`'s values
    are spaced words (`not started`, `in progress`), so `display_label` and the `status_label` filter
    are gone. The underscore spelling is still read. 705 tests pass on 3.11. The user still has to
    reply on the two upstream threads; replies are drafted in the session. Landing hazard, accepted by
    the user: this branch writes the new spelling, which `main`'s tooling rejects, so a manifest
    written by this branch's code, or by #154, #211 or #430, fails a `main`-based dashboard until #185
    lands. Then rewrite the notes-branch manifests and drop the underscore reading.
  - >-
    Upstream round four, 2026-10-02: LucaKro requested changes again (11:12). "Use logging"
    (`dependencies.py:172`, `setup_steps.py:618`) is applied in `4cdd39318`: every print in basstler
    goes through a module logger under one `StandardStreamHandler` that writes bare messages to
    stdout and stderr, so the output contracts are unchanged. "And no classvar" on the fields thread
    was already met by `be0ed435f`. The two `Repository` classes are one in
    `basstler/repository.py` (`c61a734d9`, asked by the user). "Dataclass exception gaming" on
    `dependencies.py` was answered by the user upstream as "in the coming PRs, one step at a time"
    and resolved, so it moves to `basstler-notes-core-python`. A fork review the same evening is
    applied in `105de6379`: `StandardStreamHandler` is a dataclass and the new tests name their
    strings once. A second one ("no global constants") in `37e8cf887`: `standard_streams.py` keeps
    none, the format being a handler field. 710 tests pass on 3.11. The one unresolved upstream thread is "fields / and no
    classvar", met by `be0ed435f`; the user replies there.
  notes: |-
    Moves every Python file already on main under `.claude/` into one package: `.claude/stack/`
    (`stack.py`, the maintenance modules, `class_property.py`), `.claude/skills/plan-dashboard/`'s seven
    modules, and `.claude/hooks/`'s `plan_item_bootstrap.py`, `plan_manifest_tools.py`,
    `plan_updates_since_support.py`, `plan_item_mode.py` - with their tests under `test/basstler_test/`
    and the CI job repointed and renamed `test_basstler`. Boundaries, unchanged from decisions 8 and 12:
    `SKILL.md` files, `settings.json` and the bash entry points stay in `.claude/`, since Claude Code
    discovers them by path, as thin wrappers calling `python -m` into the package; zero-install survives
    (importable from the repository root, `pyproject` for optional install).

    **Re-scoped, renamed and moved to the front 2026-08-20 (decision 13, the user's call.)** This item
    now creates the package itself off `main` instead of inheriting the one #111 carries, so #111
    rebases onto this branch and folds its modules in under the `basstler` name, and the original
    "sequence it last" constraint is reversed. The cost was measured rather than guessed - every open
    tooling pull request except #155 touches Python this moves - and accepted: each merges `main` across
    the move and re-applies its delta in the package, which is the resolution pattern #111 already
    exercised. A pull request already through review may instead land just before the migration's final
    merge; the user decides per pull request.

    **The duplication carriers are unified in the move rather than pairwise beforehand**, because
    `.claude/hooks/` and `.claude/stack/` are separate `sys.path` entries and nothing in one can import
    the other without the hackery decision 8 ends: `run_git` written out three times, the command-class
    base plus `classproperty` twice (#139's `MaintenanceCommand`, #151's `Subcommand`), `ItemStatus`, and
    the personal-notes precedence rules' second Python copy. The GitHub backend rule stays with
    `basstler-github-api-unification`; the `run_git` seam stays `basstler-notes-core-python`'s.

    **Dependency tiers were built, then deleted entirely, and the reasoning binds later items.** Three
    successive shapes - a declared tier table, a set of modules that may need the requirements, and an
    import closure derived from the callers that run with nothing installed - all existed to protect
    callers running before an install. The user's answer was that nothing should run before an install:
    `session-start.sh` now installs whatever of the declared dependencies is missing on every start,
    gated on the notes-branch fetch the hook already exits on, reporting a failure on a `dependencies:`
    summary line and finishing the run regardless. Actions runners install the package themselves.
    `package_layout.py` writes nothing down at all now. The two installers diverge on purpose: a session
    installs the missing *specifiers*, because `pip install ./basstler` would leave a second copy beside
    the clone's own and the clone's copy is what a caller imports; a runner has no such contract and
    installs `./basstler`. `basstler/requirements.txt` is deleted and the four distributions are declared
    in `basstler/pyproject.toml`'s `[project] dependencies`, matching what `main` did for every other
    workspace member; `basstler` stays out of `[tool.uv.workspace] members`, since membership would put
    it in the default `uv sync`, which decision 12 rules out. No bash entry point carries embedded
    Python any more.

    **Recorded for a later item, not acted on here:** basstler is to depend on `krrood`, to cut
    duplication rather than mirror its idioms (the user, 2026-08-23). That makes decision 12's
    version-1 independence a stage rather than a permanent state.

    State: 632 tests pass, CI green on `7730b5177`, both original dependencies merged - so the
    `depends_on` entries onto them are dropped. Two review threads from the 2026-08-23 round stay open
    on purpose, each answered differently from what it asked: the `RESTACK_STEPS` name that
    `monkeypatch.setattr` takes as a string by its own signature, and a surviving `status_label`
    assertion offered for deletion. Both are the user's to close.

    **Resolved 2026-09-03** at `674f1507f`: `main` merged, `setup_steps.py` folded into the package
    as `basstler/setup_steps.py` and its suite converted off the `sys.path` hackery, 664 tests passing.

    **The "still a draft" this note carried was wrong, and so was the absence of a blocker.** #185 has
    been out of draft since the 2026-08-23 round - which in this workflow is the promotion approval, not
    a loose end - and has carried `needs-resolution` since 2026-08-22, which withholds it from promotion
    until the branch merges `main` cleanly again. So the item was not "in progress": it was finished,
    approved, and held at the last step by a conflict nothing recorded.

    One process finding worth carrying, seen twice in two days: deleting a block by slicing from one
    anchor to the next also deleted a test that sat between them, and the suite stayed green, so nothing
    flagged it. A green run after a deletion says nothing about what the deletion took with it - the
    check is the mutation that used to fail, or the test count.

    **Resolved in part 2026-09-30** (session
    https://claude.ai/code/session_01NevegdfrGjXQZeDDabqzHE). The stall after 2026-09-19 was not a
    semantic collision with `D-store` or `D-ui`, the two krrood branches the `integration-conflict`
    comments named. Neither branch touches a file this one does. The published pipeline's configured
    suite names the directories this branch deletes, so #185 is red under it on its own. The label
    also held the branch out of the maintenance pass's `main` merges, which is why it had fallen 113
    commits behind. That merge was clean, left no `.py` under `.claude/`, and 665 tests still pass.
    The deadlock is the pipeline's, not the branch's: the fix is to change where the pipeline reads
    its suite, or to let it run once from a reference that already carries the new command. Neither
    is #185's to change. The user chose the personal override of `integration_test_command` to break
    it, and `integration-conflict` was removed.
- id: basstler-first-time-setup
  title: One-page first-time setup, with the fork/GitHub/Claude steps printed for the reader
  branch: claude/bastler-setup-first-time-6tfcun
  pull_request_number: 203
  status: done
  session: https://claude.ai/code/session_01KEdwwdMZ9vokwEx1rWPSsZ
  track: extraction
  depends_on: []
  notes: |-
    Off `main`, independent of the package extraction. `check-setup.sh` covers everything a shell can
    inspect and deliberately covers nothing held by a service - which is exactly the three steps a
    first-time user is left holding: the `merged`/`bug`/`in-review` labels a fresh fork lacks, Claude's
    access to that fork, and the `CLAUDE_PERSONAL_NOTES_*` variables an environment that clones fresh
    each session needs. Those existed only as prose across a 237-line hooks README and a 238-line setup
    skill. Adds `.claude/SETUP.md` and `.claude/hooks/setup_steps.py`, which prints those three steps
    with the fork, the label commands and the variable lines already substituted for the clone it lives
    in, dropping the repository-specific steps rather than guessing when no GitHub remote resolves. The
    two mirrored lists are pinned by test rather than trusted, against `build_dashboard.PullRequestLabel`
    and against `resolve-personal-notes-config.sh`, neither of which is readable at runtime from where
    this script runs. `setup-personal-notes/SKILL.md` is deliberately untouched, so the agent-facing path
    does not conflict with #107, which rewrites it - wiring `setup_steps.py` into the skill belongs on
    top of #107, not underneath it.

    Four review rounds, each applied. The three settings become a `PersonalNotesSetting` enum mixing in
    a frozen specification, which needs both `__new__` and `__init__` where `PullRequestField` on main
    needs only the second, because the enum machinery rebuilds a member's value by calling the mixed-in
    type with that value as its arguments. `LabelPurpose`, a `RepositoryLabel` dataclass and a
    `REQUIRED_LABELS` tuple were three things for one concept and are one `RepositoryLabel` StrEnum
    whose member is its own label name, lined up with `PullRequestLabel` so a contract test can hold the
    member names equal as well as the values. `Host` and `SetupLink` name the three services and four
    fixed pages, so `https://` and each host are written once.

    Checking the steps against the services they are about - rather than only against the script -
    is what found the rest. The docs URL named an overview that only points at the list, so a reader
    following it arrived somewhere they could not act on; the environment-variable format silently
    truncates an unquoted value at the first `#`, so a branch or path carrying one would have been set
    to a prefix of itself with nothing to see. And the access step said only "give Claude access",
    leaving a reader unable to tell whether pushing and opening pull requests were covered: they are,
    and the step says so. Its organization URL was wrong for this product - `claude-tag` is where an
    owner allows repositories, while what gates GitHub sign-in on a Team or Enterprise plan is the
    connector toggle - and the Claude GitHub App is now named as what it is: optional, adding auto-fix,
    granting nothing.

    `GitCommandRunner` stays out, measured rather than assumed: importing it from a hook costs a
    production `sys.path.insert` into `.claude/stack/`, which #185 is deleting the last of, and it
    carries no config or remote method. Recorded as a fourth caller waiting on
    `basstler-notes-core-python`'s `git_interface.py`. 561 tests pass. One thread is left open, answered
    differently from what it asked.

    **Landed 2026-09-01** as upstream pull request #577, merged into `main` at `017be2aa2`; the manifest
    had carried it as `in_progress` since. `.claude/SETUP.md`, `.claude/hooks/setup_steps.py` and
    `.claude/hooks/tests/test_setup_steps.py` are on `main` now, which is what makes them
    `basstler-package`'s to fold in under the whichever-lands-second convention.
- id: basstler-src-layout
  title: 'Move basstler to the src layout, importable through an editable install'
  branch: claude/brave-archimedes-nonocl
  status: in progress
  track: extraction
  depends_on:
  - basstler-package
  pull_request_number: 501
  session: https://claude.ai/code/session_01DmYmRWYUV9qFEkWydytE7u
  notes: |-
    Move basstler to the `src` layout every other package here uses (`basstler/src/basstler/`), and
    make it importable through an editable install that `session-start.sh` performs when missing.
    Asked for on cram2#659 (`scripts/sync_version.py:26`, LucaKro: "why is basstler not a proper
    package like the others?"). What goes away: `FLAT_LAYOUT_PACKAGES`, `package-dir basstler =
    "."`, and `pyproject.toml` shipped as package data.

    **Why it is possible now when decision 8 ruled it out.** Decision 8 required the tooling to run
    with nothing installed, and installing the package was rejected because it would leave a second
    copy in site-packages. Both premises have moved. Since the dependency-tier reversal,
    `session-start.sh` installs whatever is missing on every start: only for a clone that has done
    the setup, and never fatally. Runners and CI already install `./basstler`. And an editable
    install (`pip install -e ./basstler`) resolves `import basstler` to the clone's own source, so
    there is no second copy.

    **Open design points for this item's review.** First, the failure mode: if the editable install
    fails, nothing imports at all, where today the standard-library modules still run. Second, a
    `PYTHONPATH=basstler/src` export in `resolve-personal-notes-config.sh` covers every caller that
    sources it, but not the roughly 20 bare `python -m basstler.*` commands in `SKILL.md` and README
    files.

    **Why its own item and not part of #185** (the user, 2026-09-30). #185 is reviewable because its
    diff reads as renames, and a second move of about 40 modules would stack on that and put rename
    detection at risk. cram2#659 has changes requested and 9 open threads, and moving every file
    would shift the lines they point at. The stacked branches would each merge across a second move.
    And the install behaviour is a design change that needs its own review.

    **Sequencing, deliberately not a `depends_on`** (the user, 2026-09-30). #154, #211 and #430 do
    not depend on this: import paths stay `basstler.x`. The move is mechanical and cheap to redo
    over extra files, while each stacked branch merging across a move pays a round of conflicts. So
    land it after whichever of them is close to merging, and have the rest merge across it under
    decision 13's whichever-lands-second rule. It is not made to wait on all three, since the
    upstream queue can hold them for weeks.

    #107 (`setup-personal-notes-script`, in `stack-tooling-install`) joined the branches stacked
    on #185 on 2026-10-04, so the same whichever-lands-second rule covers it.

    **Also in scope: basstler's own Python 3.12+ environment** (the user, 2026-10-01, on #185's
    `locations.py:15` thread). The install creates a virtual environment from a 3.12+ interpreter,
    installs basstler into it editable, and the hooks run that environment's Python rather than
    whatever `python3` is. With that in place, raise `requires-python` to `>=3.12` and make
    `PathEnumeration` a real `Path` mixin, `class PathEnumeration(Path, ReprEnum)`, overriding
    `with_segments` to return a plain `Path` and restoring `__hash__ = Path.__hash__`. It is a
    one-file change in `locations.py`, since callers already treat members as paths. Mind that
    `member.name` then reads the path's file name, because `Path.name` shadows the enum's.
    Why not just bump the version: in the cloud container `python3` is 3.11.15, the only
    interpreter with the dependencies installed, and the hooks call it in 19 places. The container's
    `python3.12` is Ubuntu's system interpreter, without the dependencies and marked
    `EXTERNALLY-MANAGED`, so the hook's own `pip install` is refused there. Finding a 3.12+
    interpreter where none is the default (`uv python install` is one option) is a design point for
    this item's review. The environment also settles the `PYTHONPATH` point above, since a
    caller would run the environment's interpreter instead.

    **Landing hazard.** `basstler/` keeps existing (it holds `pyproject.toml` and the README), so
    git sees per-file renames rather than a directory rename. A module a stacked branch adds
    directly under `basstler/` then merges cleanly and silently stays in the old location, the same
    shape recorded three times for `.claude/`. The move ships a contract test that fails on any
    module directly under `basstler/`, as #185's test does for `.claude/`.
- id: basstler-notes-core-python
  title: 'Bash→Python 1: notes-core modules (config, git seam, writer, markers)'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - basstler-package
  notes: |-
    Pure addition to the package, no bash file changes (decision 12). Six modules: `errors.py` (a
    standard-library dataclass-exception base mirroring krrood's idiom - typed context fields, abstract
    `error_message`/`suggest_correction` composed in `__post_init__` - without importing krrood);
    `personal_notes_configuration.py` (a `ConfigurationSource` StrEnum, a frozen `ResolvedSetting`, and
    `PersonalNotesConfiguration.resolve` with the git-config > environment > default precedence);
    `git_interface.py` (a thin `GitRepository` dataclass as the dependency seam, with the real-git
    `ScratchRepository` harness staying the primary test strategy, no fakes); `notes_branch.py`
    (`fetch_notes_branch` with the upstream-remote fallback, a `ScratchWorktree` context manager with
    pid-and-uuid-suffixed branch names, and a `NotesBranchWriter` with a bounded re-fetch/re-apply push
    retry); `marker_sections.py` (one source for the `CLAUDE.local.md` markers currently duplicated
    between session-start and every save script); and `__main__.py` with only the configuration
    subcommand. Includes a real two-writer non-fast-forward retry test against the bare notes remote.

    `git_interface.py` has four callers waiting, not one, which is what makes the seam worth building
    here rather than pairwise. Read against each rather than inferred: #139's `GitCommandRunner` is not
    a duplicate - its attempt/run split and named methods exist because a push that silently did nothing
    must not read as one that worked, and #135's script never writes - but #143's `plan_item_bootstrap`
    `run_git` and #135's are near-identical, both generic and both raising, differing only in error type
    and parameter order, and `basstler-first-time-setup` is a fourth. The precedent that let #143 keep
    `stack.py`'s overlap does not cover these: that one was accepted because the contracts were
    deliberately opposite (`_git` returns `""` where `run_git` raises), and these are not.

    **Also owes cram2#659's "dataclass exception gaming" thread** (LucaKro, 2026-10-02), which the user
    deferred to "the coming PRs". basstler has about 35 exception classes, and this item's `errors.py`
    is where they convert. Decide here whether `errors.py` mirrors krrood's `DataclassException` or
    imports it: decision 14 says basstler depends on krrood eventually, but no item schedules that
    yet.
- id: basstler-save-commands-python
  title: 'Bash→Python 2: the four notes writers become python -m subcommands'
  branch: null
  status: not_started
  track: conversion
  depends_on:
  - basstler-notes-core-python
  notes: |-
    `save-personal-notes.sh`, `save-pr-progress.sh`, `write-personal-notes-file.sh` and
    `create-personal-notes-branch.sh` become three-line shims; their bodies move onto the core modules,
    collapsing four near-identical scratch-worktree write dances into `NotesBranchWriter`.

    Four known defects are fixed here, each proven by a failing test first: a missing
    `BEGIN-PERSONAL-NOTES` marker pushed the entire `CLAUDE.local.md`, PR-progress section included,
    into the notes file; fixed scratch branch names raced between concurrent sessions; a rejected
    non-fast-forward push lost the edit after the cleanup trap deleted the committed scratch worktree;
    and a trailing flag died with `"$2: unbound variable"` instead of a usage message.

    Flag names, stdout lines and exit codes are external API and stay unchanged, pinned by shim-level
    subprocess contract tests. Sequence after the in-flight bash-touching pull requests land: a
    wholesale body rewrite cannot be merged by the whichever-lands-second-merges convention.
