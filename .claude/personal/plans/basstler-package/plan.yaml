- id: cram-basstler-removal
  title: Move CRAM onto the basstler plugin, keeping only its configuration
  branch: null
  status: not_started
  track: extraction
  depends_on: []
  pull_request_number: null
  session: https://claude.ai/code/session_013kCsTQdNToBZd8YixgPFwG
  notes: >
    Commit .claude/basstler/stack.toml naming upstream_repository =
    "cram2/cognitive_robot_abstract_machine" and upstream_remote = "cram2", and relabel the fork's
    pull requests from cram2-link-sent to promotion-link-sent. Then, from fork main: delete
    basstler/, test/basstler_test/, .claude/hooks|skills|stack|shared|SETUP.md, the test_basstler
    job in ci.yml and the sync_version.py entry; enable the plugin in settings.json (local and CI
    sessions) and add a caller of basstler's reusable upstream-reviews workflow. Cloud sessions get
    the plugin from the user's or org's claude.ai plugins, not from the repo. Promote to cram2 only
    with the user's OK in-session.

    State on 2026-10-20: nothing of this is on fork main yet (basstler/ and the in-tree hooks are
    still there, no stack.toml, no promotion-link-sent label). Already done elsewhere: every
    CRAM-fork tooling pull request is closed (2026-10-19, #515 on 2026-10-20), basstler v0.1.5
    is released with #11, #13 and #14, and cloud sessions already run the plugin's session start.
    Still open on basstler: #16, the stack-maintenance example caller to copy here.
  blockers:
  - 'Cross-repository dependency, not representable in depends_on: basstler-package/cram-uses-basstler-plugin
    and cram-basstler-removal in AbdelrhmanBassiouny/basstler''s notes track the same work there.'
