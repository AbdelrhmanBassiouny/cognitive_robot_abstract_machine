  depends_on: []
  blockers:
  - 'Waits on basstler-package (#185, cram2#659) landing. #420 is stacked on #185''s branch,
    so promote it only after #185 lands and the maintenance pass has moved its base back to
    `main`. Then rebuild its promotion link, since the one in its description was built against
    `main` before the stack.'
  notes: 'Built 2026-09-19 (https://claude.ai/code/session_01LSQTbfwr6ankeW9mFPdB2y). Reads
    the upstream pull request''s `statusCheckRollup` in the same GraphQL query as its review
