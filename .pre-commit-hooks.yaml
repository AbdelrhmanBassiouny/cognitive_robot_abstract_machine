# Hooks for the cram-development-tools package (cram_development_tools/). They run the
# installed `cram-development-tools` command, so the repository using them installs the
# package in its development environment; see cram_development_tools/README.md.
- id: cram-development-tools-format
  name: Format Python (black, then docformatter where it doesn't conflict with black)
  description: >
    Runs black, then docformatter on top of it, keeping docformatter's docstring changes
    only when a subsequent black pass leaves them unchanged.
  entry: cram-development-tools format
  language: system
  types: [python]

- id: cram-development-tools-agents-md
  name: Generate AGENTS.md
  description: >
    Writes AGENTS.md as the generic rules shipped with cram-development-tools followed by
    the repository's own AGENTS.project.md.
  entry: cram-development-tools agents-md
  language: system
  pass_filenames: false
  always_run: true
