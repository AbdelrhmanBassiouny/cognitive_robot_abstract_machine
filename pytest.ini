[pytest]
addopts = -sv -m "not slow"
markers =
    slow: marks stress/scale tests that build large motion statecharts (run with '-m slow')
    integration_conflict(branch): marks a test reproducing the break that blocks the
        named branch; passing is what clears its integration-conflict label. Left in
        the default selection on purpose - excluded, it would be invisible on the
        very branch it was pushed to.