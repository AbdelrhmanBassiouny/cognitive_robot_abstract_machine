[pytest]
# ROS Jazzy ships three pytest plugins, launch_testing, launch_ros and launch_pytest,
# which pytest auto-discovers via their entry points whenever the overlay is on
# PYTHONPATH. launch_testing's and launch_ros's collection hooks still declare pytest 7's
# `path` argument, renamed to `module_path` in pytest 8, so pluggy rejects them at
# startup and the whole run aborts before collection. ros2/launch fixed this on rolling
# but has not backported it to jazzy.
#
# launch_pytest fails differently and more quietly: merely being loaded imports `launch`,
# whose launch.logging module calls logging.setLoggerClass() at import time to make every
# logger it creates default to propagate=False. That logger class stays the process-wide
# default for the rest of the session, so every logger first created afterwards --
# including a plain `logging.getLogger(__name__)` in this workspace's own modules --
# silently stops reaching the root logger, and with it caplog, even though the record
# still prints via Python's lastResort handler. No pluggy error marks this one; a test
# asserting on caplog.text just sees it empty.
#
# Blocking all three gives up ROS launch tests: a module whose `generate_test_description`
# is marked `@pytest.mark.launch_test` or `@pytest.mark.rostest` would collect as a plain
# module, so its launch description never starts the nodes under test and its `proc_info`
# and `proc_output` fixtures are missing. The `--launch-args` flag goes with them. This
# suite contains no such test.
# If this ever changes, we will need to reevaluate this approach.
addopts = -sv -m "not slow" -p no:launch_testing -p no:launch_ros -p no:launch_pytest
markers =
    slow: marks stress/scale tests that build large motion statecharts (run with '-m slow')
