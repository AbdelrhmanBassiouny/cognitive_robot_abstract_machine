# Optional installation only. The package is designed to be imported straight from the
# repository root with no install (cloud sessions run on fresh clones with no pip step);
# this file exists for the workflows that run it outside such a checkout. Built with an
# explicit package-dir mapping because the package *is* this directory rather than
# living under it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bastler"
version = "0.1.0"
description = "Workflow tooling (stacked-PR maintenance, plan dashboards, personal-notes hooks) for cognitive_robot_abstract_machine. Not published; repository tooling only."
requires-python = ">=3.11"

# Nothing is required to import the stdlib-only tier, which is what a hook reaches - see
# this package's own __init__ docstring for what the tiers are and why the boundary is
# load-bearing. What the tiers above it need is the `rendering` extra below.
dependencies = []
dynamic = ["optional-dependencies"]

[tool.setuptools.dynamic.optional-dependencies]
# Read from requirements.txt rather than restated here, so the list a `pip install -r`
# installs and the list this package declares cannot drift apart.
rendering = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["bastler"]

# The files the modules resolve beside themselves rather than by an argument:
# render_common.py finds the page templates as `Path(__file__).parent / "templates"`, and
# stack.py finds its committed defaults with `Path(__file__).with_name`. An install that
# left them out would import and then fail at the first render or the first configuration
# read. requirements.txt is here because the extra below is read from it.
[tool.setuptools.package-data]
bastler = ["templates/*.html", "stack.toml", "requirements.txt"]

[tool.setuptools.package-dir]
bastler = "."
