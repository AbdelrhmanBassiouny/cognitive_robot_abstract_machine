# Every workflow allowed in this repository: the events it answers, its concurrency, the
# ceiling on any one job's timeout-minutes, and what each trigger is expected to cost.
# test/basstler_test/test_actions_budget.py holds every .github/workflows/*.yml to it.
#
# Workflows only unlanded branches carry are declared here too, with the triggers they
# are meant to have, so such a branch fails that test once it merges this file.
#
# runs_per_day is the fork's expected volume, a first estimate from the October 2026
# audit for the usage monitor to measure against. jobs_per_run counts every job a run
# starts, one per matrix entry and one per job of a called reusable workflow. A reusable
# workflow starts no run of its own, so its runs_per_day is 0: its jobs are counted in
# the caller's.
#
# Timeout ceilings: the longest library job measured on 2026-10-13 took 19 minutes
# (giskardpy), and the basstler job 2.

# %% pull request and main

[[workflow]]
file = "ci.yml"
job_timeout_minutes = 15
skips_push_on_fork = true
concurrency = { group = "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}", cancel_in_progress = true }

[[workflow.trigger]]
event = "push"
branches = ["main"]
jobs_per_run = 16
runs_per_day = 3

[[workflow.trigger]]
event = "pull_request"
jobs_per_run = 16
runs_per_day = 30

[[workflow.trigger]]
event = "workflow_run"
activity_types = ["completed"]
branches = ["main"]
jobs_per_run = 16
runs_per_day = 0.2

[[workflow]]
file = "ci_reusable.yml"
job_timeout_minutes = 45

[[workflow.trigger]]
event = "workflow_call"
jobs_per_run = 1
runs_per_day = 0

[[workflow]]
file = "examples_and_demos.yml"
job_timeout_minutes = 5
skips_push_on_fork = true

[[workflow.trigger]]
event = "push"
branches = ["main"]
jobs_per_run = 8
runs_per_day = 3

[[workflow.trigger]]
event = "pull_request"
activity_types = ["ready_for_review", "labeled"]
required_label = "full-ci"
jobs_per_run = 8
runs_per_day = 5

[[workflow.trigger]]
event = "workflow_run"
activity_types = ["completed"]
branches = ["main"]
jobs_per_run = 8
runs_per_day = 0.2

[[workflow.trigger]]
event = "workflow_dispatch"
jobs_per_run = 8
runs_per_day = 0.5

[[workflow]]
file = "example_demo_reusable.yml"
job_timeout_minutes = 60

[[workflow.trigger]]
event = "workflow_call"
jobs_per_run = 1
runs_per_day = 0

[[workflow]]
file = "upstream-reviews.yml"
job_timeout_minutes = 10

[[workflow.trigger]]
event = "workflow_dispatch"
jobs_per_run = 1
runs_per_day = 5

