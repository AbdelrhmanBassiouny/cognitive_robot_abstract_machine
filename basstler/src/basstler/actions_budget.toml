# %% the integration pipeline, from the open pull requests that carry it

[[workflow]]
file = "integration-refresh.yml"
job_timeout_minutes = 90
concurrency = { group = "integration-refresh", cancel_in_progress = false }

[[workflow.trigger]]
event = "workflow_dispatch"
jobs_per_run = 1
runs_per_day = 1

[[workflow.trigger]]
event = "workflow_run"
activity_types = ["completed"]
branches = ["integration-*"]
jobs_per_run = 1
runs_per_day = 4

[[workflow.trigger]]
event = "pull_request"
activity_types = ["ready_for_review"]
jobs_per_run = 1
runs_per_day = 5

[[workflow]]
file = "integration-checks.yml"
job_timeout_minutes = 30
concurrency = { group = "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}", cancel_in_progress = true }

[[workflow.trigger]]
event = "pull_request"
jobs_per_run = 1
runs_per_day = 30

[[workflow.trigger]]
event = "workflow_dispatch"
jobs_per_run = 1
runs_per_day = 0.1

[[workflow]]
file = "integration-probe.yml"
job_timeout_minutes = 5
concurrency = { group = "integration-probe", cancel_in_progress = false }

[[workflow.trigger]]
event = "workflow_dispatch"
jobs_per_run = 2
runs_per_day = 3

