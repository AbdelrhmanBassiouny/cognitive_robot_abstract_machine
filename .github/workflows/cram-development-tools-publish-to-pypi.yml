name: Publish cram-development-tools to PyPI

on:
  push:
    tags:
      - 'cram-development-tools-v*'

defaults:
  run:
    working-directory: cram_development_tools

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#cram-development-tools-v}"
          echo "Package version: $PACKAGE_VERSION, tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match version ${PACKAGE_VERSION} in cram_development_tools/pyproject.toml"
            exit 1
          fi

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cram_development_tools/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: .
    environment:
      name: pypi
      url: https://pypi.org/p/cram-development-tools
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: 'true'
