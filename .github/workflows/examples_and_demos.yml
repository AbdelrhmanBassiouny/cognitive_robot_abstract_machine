name: Examples and Demos  (matrix over libs)
defaults:
  run:
    shell: bash -euo pipefail {0}

on:
  push:
    branches:
    - main
  # A draft runs CI alone. The demos run once a pull request is ready for review, or on
  # demand through the full-ci label or a dispatch.
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  to-lowercase:
    if: ${{ (github.event_name != 'push' || !github.event.repository.fork) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  test_each_lib:
    needs: [to-lowercase]
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: coraplex/scripts/test_notebook_examples.sh
          - script: semantic_digital_twin/scripts/test_notebook_examples.sh
          - script: semantic_digital_twin/scripts/test_exercises.sh
          - script: semantic_digital_twin/scripts/test_quizzes.sh
          - script: coraplex/demos/coraplex_bullet_world_demo/test_demo.py
          - script: coraplex/demos/coraplex_real_tracy/test_demo.py
          - script: experiments/src/experiments/real_stretch_apartment_demo/test_demo.py
    uses: ./.github/workflows/example_demo_reusable.yml
    with:
      script: ${{ matrix.script }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}
