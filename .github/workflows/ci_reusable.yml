name: CI reusable
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  workflow_call:
    inputs:
      lib:
        description: "Library folder name (relative to repo root)"
        required: true
        type: string
      repo_lowercase:
        description: "Lowercase repository name with tag"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.repo_lowercase }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cognitive_robot_abstract_machine
          submodules: recursive

      - name: Install dependencies
        env:
          # Keep uv's cache on the same filesystem as the target venv (/opt/ros/cram-env) so uv can
          # hardlink packages into site-packages instead of full-copying them. The default cache
          # (~/.cache/uv under the mounted /github/home volume) is a different filesystem, which
          # forces a full copy of every wheel and stores each package twice -- exhausting the runner
          # disk ("No space left on device") during install.
          UV_CACHE_DIR: /opt/ros/.uv_cache
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/cram-env/bin/activate
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1
          uv sync --extra dev --active
          uv tree --depth 1
          python -c "import sys; print(sys.executable)"

      - name: Install drake
        if: ${{ inputs.lib == 'semantic_digital_twin' }}
        env:
          UV_CACHE_DIR: /opt/ros/.uv_cache
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/cram-env/bin/activate
          uv pip install drake

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}
            ${{ runner.os }}-cache-${{ inputs.lib }}
            ${{ runner.os }}-cache-

      - name: Run CPP tests
        if: ${{inputs.lib == 'random_events'}}
        run: |
          cd cognitive_robot_abstract_machine/${{ inputs.lib }}/src/random_events_lib
          sudo apt-get install -y g++ unzip zip
          BAZEL_VERSION=7.0.0
          curl -L -o bazel.sh \
            https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-installer-linux-x86_64.sh
          chmod +x bazel.sh
          ./bazel.sh --user
          export PATH="$HOME/bin:$PATH"
          
          bazel build //test:test_all
          bazel test //test:test_all

      - name: Debug ORM double-import investigation
        # Temporary: pin down why experiments.orm.ormatic_interface's classes end up
        # "already defined" during collection. Remove once diagnosed.
        if: ${{ inputs.lib == 'experiments' }}
        continue-on-error: true
        run: |
          source /opt/ros/cram-env/bin/activate
          source /opt/ros/overlay_ws/install/setup.bash
          cd cognitive_robot_abstract_machine
          echo "=== building the ORM interfaces up front (conftest normally does this) ==="
          python -c "from cognitive_robot_abstract_machine.orm_interfaces import WORKSPACE_ORM_INTERFACES; WORKSPACE_ORM_INTERFACES.regenerate(show_generator_output=True)"
          cd ..
          echo "=== sys.path probe (mimicking pytest's rootdir insertion) ==="
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "cognitive_robot_abstract_machine")
          import experiments
          print("experiments.__path__ =", list(experiments.__path__))
          print("experiments.__file__ =", getattr(experiments, "__file__", None))
          import experiments.orm.ormatic_interface as m1
          print("m1 id:", id(m1), m1.__file__)
          import experiments.orm.ormatic_interface as m2
          print("m2 id:", id(m2), "same object as m1:", m1 is m2)
          print("'experiments.orm.ormatic_interface' in sys.modules:", 'experiments.orm.ormatic_interface' in sys.modules)
          PYEOF
          echo "=== serial (no xdist) collect-only ==="
          python -m pytest --collect-only -q cognitive_robot_abstract_machine/test/experiments_test > /tmp/serial_collect.log 2>&1 || true
          tail -n 150 /tmp/serial_collect.log

      - name: Run tests
        run: |
          source /opt/ros/cram-env/bin/activate
          source /opt/ros/overlay_ws/install/setup.bash
          echo "PYTHONPATH: $PYTHONPATH"
          if [[ "${{ inputs.lib }}" == "probabilistic_model" ]]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          # The MuJoCo video-recorder tests render offscreen; xvfb provides a display, so MuJoCo
          # would otherwise pick its windowed GLFW backend and fail to create a context on the
          # runner. EGL renders headlessly. Must be set before Python imports mujoco, which locks
          # the GL backend at import, so it cannot be done from inside the test process.
          if [[ "${{ inputs.lib }}" == "semantic_digital_twin" ]]; then
            export MUJOCO_GL=egl
          fi
          python -m pytest -n auto cognitive_robot_abstract_machine/test/${{ inputs.lib }}_test

      - name: Upload generated ORM interface (debug)
        # Temporary: capture the generated experiments interface to diagnose the
        # "Table already defined" collection failure. Remove once diagnosed.
        if: ${{ always() && inputs.lib == 'experiments' }}
        uses: actions/upload-artifact@v4
        with:
          name: experiments-ormatic-interface
          path: |
            cognitive_robot_abstract_machine/experiments/src/experiments/orm/ormatic_interface.py
            /tmp/serial_collect.log
          if-no-files-found: warn

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}-${{ github.run_id }}
