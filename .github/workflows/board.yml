name: board

# Publishes the stacked-PR board to GitHub Pages. Purely mechanical: it fetches the fork's open PRs
# and renders the board with dev/stack.py -- no restacking, promoting, or fixing (the restack Routine
# owns that). Safe to fire on every PR / CI / label event because it only reads and republishes.

on:
  schedule:
    - cron: '17 * * * *'            # hourly safety net so the board never goes stale
  pull_request:
    types: [opened, reopened, closed, edited, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]
  check_suite:
    types: [requested, completed]   # CI starting / finishing
  workflow_dispatch: {}

# Read the repo, publish Pages. No write access to the repo contents is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# Only ever one board build; a newer event supersedes an in-flight one.
concurrency:
  group: board
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Never run on the upstream after a merge -- the board is a fork-only artifact.
    if: github.repository == 'AbdelrhmanBassiouny/cognitive_robot_abstract_machine'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the stack tooling
        uses: actions/checkout@v4
        with:
          ref: claude/stack-workflow-tooling
          fetch-depth: 0

      - name: Add the upstream remote (for merged-detection)
        run: |
          git remote add cram2 https://github.com/cram2/cognitive_robot_abstract_machine.git \
            || git remote set-url cram2 https://github.com/cram2/cognitive_robot_abstract_machine.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh board.json from the fork's open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dev/stack.py export

      - name: Render board.html
        run: python dev/stack.py board

      - name: Package the board as the Pages site
        run: |
          mkdir -p _site
          cp dev/board.html _site/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
