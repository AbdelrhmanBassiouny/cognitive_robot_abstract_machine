name: CI (matrix over libs)
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  to-lowercase:
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  test_each_lib:
    needs: [to-lowercase]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: giskardpy
          - lib: krrood
          - lib: semantic_digital_twin
          - lib: coraplex
          - lib: random_events
          - lib: probabilistic_model
          - lib: physics_simulators
          - lib: robokudo
          - lib: segmind
          - lib: experiments
          - lib: version
    uses: ./.github/workflows/ci_reusable.yml
    with:
      lib: ${{ matrix.lib }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}

  check_generated_orm_interfaces_are_empty:
    # ormatic_interface.py files are generated by ORMatic and never reviewed, so the repo
    # only tracks them as empty placeholders (see scripts/empty_generated_orm_interfaces.py,
    # wired up as a pre-commit hook). This is the CI backstop for that invariant in case a
    # commit slipped through without pre-commit installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          non_empty=$(git ls-files -z -- '*/ormatic_interface.py' | xargs -0 -r -I{} find {} -size +0c)
          if [ -n "$non_empty" ]; then
            echo "These generated ORM interface files must be committed empty:"
            echo "$non_empty"
            echo "Regenerate them locally with scripts/regenerate_all_orm.py, but let the empty-ormatic-interface pre-commit hook truncate them back to empty before committing."
            exit 1
          fi

  test_bastler:
    # The bastler package - the agent tooling the .claude/ hooks and skills run
    # - is plain, dependency-light Python. It doesn't need the heavy
    # docker-based matrix above, which is scoped to the robotics packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          pip install pytest -r "${BASTLER_REQUIREMENTS_FILE}"
      # --confcutdir stops pytest walking up to the repository-root
      # test/conftest.py, which imports the robotics stack this job
      # deliberately does not install.
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          python -m pytest "${BASTLER_TESTS_DIRECTORY}" --confcutdir="${BASTLER_TESTS_DIRECTORY}"
