name: CI (matrix over libs)
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  # A draft runs the libraries it changes and every library depending on them. Leaving
  # draft, the full-ci label and a dispatch run everything.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

# a new push to a pull request cancels the run still going for its previous commit, so
# the runners only ever test the commit that can still be merged. A label other than
# full-ci starts a run of its own group, which skips at once instead of cancelling one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changed-libraries:
    if: ${{ (github.event_name != 'push' || !github.event.repository.fork) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
      excluded: ${{ steps.select.outputs.excluded }}
      tests-libraries: ${{ steps.select.outputs.tests-libraries }}
      tests-tooling: ${{ steps.select.outputs.tests-tooling }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          pip install --editable "./${BASSTLER_SOURCE_TREE}"
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          TESTS_CHANGES_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          selection=(python -m basstler.changed_libraries --workflow ci.yml --job test_each_lib --axis lib)
          if [[ "${TESTS_CHANGES_ONLY}" == "true" ]]; then
            gh pr diff "${PULL_REQUEST}" --name-only | "${selection[@]}" >> "$GITHUB_OUTPUT"
          else
            "${selection[@]}" --everything < /dev/null >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  test_each_lib:
    needs: [changed-libraries]
    if: ${{ needs.changed-libraries.outputs.tests-libraries == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        lib:
          - giskardpy
          - krrood
          - semantic_digital_twin
          - coraplex
          - random_events
          - probabilistic_model
          - physics_simulators
          - robokudo
          - segmind
          - experiments
          - cramera
          - version
          - cognitive_robot_abstract_machine
        exclude: ${{ fromJSON(needs.changed-libraries.outputs.excluded) }}
    uses: ./.github/workflows/ci_reusable.yml
    with:
      lib: ${{ matrix.lib }}
      repo_lowercase: ${{ needs.changed-libraries.outputs.repo_lowercase }}

  check_generated_orm_interfaces_are_untracked:
    # ormatic_interface.py files are generated by ORMatic and never reviewed, so the repo
    # ignores them (see the rule in .gitignore) and builds them when a checkout needs them.
    # Tracking one brings back the branch switches that fail on a locally generated copy.
    needs: [changed-libraries]
    if: ${{ needs.changed-libraries.outputs.tests-libraries == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          tracked=$(git ls-files -- '*/ormatic_interface.py')
          if [ -n "$tracked" ]; then
            echo "These generated ORM interface files must not be tracked:"
            echo "$tracked"
            echo "Untrack them with 'git rm --cached', and build them locally with scripts/regenerate_all_orm.py."
            exit 1
          fi

  test_basstler:
    # The basstler package - the agent tooling the .claude/ hooks and skills run
    # - is plain, dependency-light Python. It doesn't need the heavy
    # docker-based matrix above, which is scoped to the robotics packages.
    needs: [changed-libraries]
    if: ${{ needs.changed-libraries.outputs.tests-tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          pip install pytest --editable "./${BASSTLER_SOURCE_TREE}"
      # --confcutdir stops pytest walking up to the repository-root
      # test/conftest.py, which imports the robotics stack this job
      # deliberately does not install.
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          python -m pytest "${BASSTLER_TESTS_DIRECTORY}" --confcutdir="${BASSTLER_TESTS_DIRECTORY}"
