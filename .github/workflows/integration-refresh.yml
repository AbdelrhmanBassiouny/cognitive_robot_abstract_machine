name: Integration refresh

# Rebuilds the integration branch: bring every stale tip forward, assemble the upstream
# base plus every reviewed, unblocked branch in flight, and move the branch onto the
# result once this repository's own checks have passed over it.
#
# What the rebuild is, step by step, is `integration.py refresh` - not this file. Every
# decision it makes is a decision about an exit status, and a status branched on in a
# `run:` block is one nothing can run outside a runner and so one nothing checks. Here
# that procedure is Python with tests over it, and this file is left with what only a
# runner can do: check a tree out, put an interpreter on the path, install, and call it.
#
# Why a candidate pull request rather than judging the pushed branch directly: ci.yml
# triggers on `push` to main and on `pull_request`, and on nothing else - so a build
# that is only pushed collects no checks at all. The candidate exists to be judged and
# is closed unmerged either way; a build is regenerated from scratch, so it shares no
# history with the branch it replaces and there is nothing to merge.
#
# Why a stored token rather than GITHUB_TOKEN: GitHub starts no workflow run from an
# event that GITHUB_TOKEN caused, so a candidate opened with it would sit with no checks
# forever. INTEGRATION_REFRESH_TOKEN is a fine-grained token with Contents and Pull
# requests write; both halves were probed on 2026-08-23 - it pushed a commit touching
# .github/workflows/, and a run appeared for the branch it pushed.
#
# Runs unchanged in any fork: the repositories come from .claude/stack/stack.toml and
# the runner's own context, so none is named here.

on:
  schedule:
    # Four times a day. A rebuild is only useful once something it would carry has
    # moved, and the branches move on a working day's rhythm rather than an hourly one.
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      plans:
        # A rebuild carrying one plan answers whether that plan's branches hold together
        # on their own, which is what you reach for when the full build is red. It
        # settles nothing and publishes nothing: the branch a developer works from is
        # only ever moved onto a build carrying everything in flight.
        description: "Plans to carry, comma separated; empty carries everything"
        required: false
        type: string
        default: ""
  pull_request:
    # Leaving draft is what makes a branch integrable at all, so it is the moment the
    # build is worth redoing rather than one to wait out: until the next scheduled run
    # the branch serves work that is ready and not in it.
    #
    # No recursion: a candidate is opened ready rather than as a draft, and this event
    # fires only when an existing draft is converted.
    types: [ready_for_review]

concurrency:
  # Two rebuilds at once would race for the same branch and open two candidates for it.
  # A burst of branches leaving draft together collapses instead: GitHub holds one run
  # and one pending, and each new arrival replaces the pending one, so the work is done
  # once over all of them rather than once each.
  group: integration-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild the integration branch and publish it if it is green
    # A fork's pull request is handed no secret, so the run could only fail on a token
    # it has not got - and fail on somebody else's pull request, where it reads as their
    # failure. Not running says the same thing without the noise.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # A `pull_request` run checks out that pull request's merge reference, so
          # taking the reference the run was started on would run whatever
          # integration.py the triggering branch carries, against a token that can
          # write. The rebuild is never about the branch that triggered it.
          #
          # Every other trigger keeps that reference, and it is what makes a change to
          # this pipeline testable: publishing to the default branch is what the
          # pipeline does, so pinning there too would leave a change that broke
          # publishing unable to be fixed by running the fix. A schedule starts on the
          # default branch anyway; a dispatch starts wherever it was asked to.
          ref: >-
            ${{ github.event_name == 'pull_request'
            && github.event.repository.default_branch
            || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.INTEGRATION_REFRESH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tooling dependencies
        run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          pip install pytest -r "${PLAN_DASHBOARD_REQUIREMENTS_FILE}"

      # A pull request's run is pinned to the default branch, and that branch is the one
      # this pipeline publishes: it only moves when a build goes green, so it lags every
      # change in flight and can predate the command this job invokes. Asking argparse
      # whether it knows the command turns that into an answer instead of a usage error
      # - and a usage error here would attach a red check to whichever branch's
      # ready-flip asked for the rebuild, which is the branch the rebuild exists to
      # carry.
      - name: Ask whether the published pipeline can rebuild
        id: published_pipeline
        continue-on-error: true
        run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          python "${STACK_DIRECTORY}/integration.py" refresh --help > /dev/null

      - name: Say that the published pipeline is too old to rebuild
        if: steps.published_pipeline.outcome != 'success'
        run: |
          echo "The pipeline on this repository's default branch does not know the" \
            "rebuild this run asked for, so nothing was rebuilt. It will once a build" \
            "carrying the rebuild has published." >> "${GITHUB_STEP_SUMMARY}"

      - name: Rebuild the integration branch
        if: steps.published_pipeline.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_REFRESH_TOKEN }}
          # A probe is dispatched on a reference carrying this pipeline rather than on
          # the tree under test, which carries no workflow of its own - so it is the
          # same reference this job checked the tooling out at, as a branch name because
          # that is what a dispatch takes.
          PIPELINE_REFERENCE: >-
            ${{ github.event_name == 'pull_request'
            && github.event.repository.default_branch
            || github.ref_name }}
          # Empty on every trigger but a dispatch, and an empty --plan is dropped by the
          # shell rather than read as a plan of no name.
          PLANS: ${{ inputs.plans }}
        run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          python "${STACK_DIRECTORY}/integration.py" refresh \
            --dispatch-on "${PIPELINE_REFERENCE}" \
            ${PLANS:+--plan "${PLANS}"}
