name: Upstream reviews

on:
  push:
    branches: [basstler/upstream-reviews]
    paths: [request.json]

permissions:
  contents: write

concurrency:
  group: basstler-upstream-reviews
  cancel-in-progress: false

jobs:
  read:
    uses: KAOS-repositories/basstler/.github/workflows/upstream-reviews-action.yml@v3.10.6
    with:
      basstler_branch_or_tag: v3.10.6
