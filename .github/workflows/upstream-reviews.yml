name: Upstream reviews

# Reports the checks and review threads a fork branch's upstream pull request has
# collected, and on request the log behind each check that failed.
#
# Thread resolved-state is only exposed by GitHub's GraphQL API, and a Claude session
# reaches neither that nor the upstream's REST API at all, so both reads happen here
# and the session reads this job's log. Dispatch-only on purpose: nothing about this
# should run on a timer.
#
# Runs unchanged in any fork - the upstream comes from .claude/stack/stack.toml
# and the fork owner from the runner's own context, so no repository is named here.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Upstream pull request number (takes precedence over branch)"
        required: false
        type: string
      branch:
        description: "Fork branch whose upstream pull request to read"
        required: false
        type: string
      include_resolved:
        description: "Include threads already marked resolved"
        required: false
        default: false
        type: boolean
      failure_logs:
        description: "Quote the log behind each check that failed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  report:
    name: Report the upstream pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the upstream pull request
        env:
          # gh is preinstalled on the runner; this is the only credential it needs,
          # and read-only is all the job is granted.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ARGUMENTS=()
          if [ -n "${{ inputs.pull_request }}" ]; then
            ARGUMENTS+=(--pull-request "${{ inputs.pull_request }}")
          elif [ -n "${{ inputs.branch }}" ]; then
            ARGUMENTS+=(--branch "${{ inputs.branch }}")
          else
            echo "Provide either pull_request or branch." >&2
            exit 2
          fi
          if [ "${{ inputs.include_resolved }}" = "true" ]; then
            ARGUMENTS+=(--include-resolved)
          fi
          if [ "${{ inputs.failure_logs }}" = "true" ]; then
            ARGUMENTS+=(--failure-logs)
          fi
          source .claude/hooks/resolve-personal-notes-config.sh
          python3 "${UPSTREAM_REVIEWS_SCRIPT}" "${ARGUMENTS[@]}"
