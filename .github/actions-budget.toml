# The Actions budget basstler holds every workflow in .github/workflows to. The limits
# below apply to every workflow; a [workflow."<file>"] table changes them for
# that workflow alone. Edit this file by hand from here on.

job_timeout_minutes = 60
jobs_per_push_run = 4
skips_push_on_fork = true

# The whole library matrix on every pull-request push, until the changed-library
# matrix narrows it to what a change touches.
[workflow."ci.yml"]
jobs_per_push_run = 16

# A fork builds the image its own CI runs in, so a push to a fork has to build it.
[workflow."update_docker.yml"]
job_timeout_minutes = 120
skips_push_on_fork = false
