# Stacked-PR config — the fork-staging / cram2-review workflow.
#
# This file is now CONFIG ONLY. The stack itself (which branches exist, how they depend on each
# other, and their review state) is read live from GitHub, not declared here:
#
#   * the dependency TREE  = each fork PR's BASE branch (base = parent). Set it on GitHub.
#   * draft <-> ready      = the fork PR's draft toggle. Un-draft to approve for review.
#   * in-review            = the `in_review_label` on the fork PR (set at promote time; cram2 itself
#                            is not readable from the cloud, so the label carries that fact).
#   * merged               = branch is an ancestor of `<upstream_remote>/<upstream_base>` (pure git).
#   * WIP-exempt (bugs)    = any `wip_exempt_labels` label on the PR.
#
# `stack.py` reads a `board.json` export of the fork PRs (refreshed by the routine via the GitHub
# MCP, or by `stack.py export` where `gh` is available) plus git — so you never hand-edit a ledger.

wip_cap = 3                    # max INDEPENDENT stacks simultaneously in review on cram2 (bugs exempt)
wip_exempt_labels = ["bug"]    # PRs with any of these labels do NOT count against wip_cap
in_review_label = "in-review"  # fork-PR label marking "promoted to cram2, under review"
rebase_label = "rebase"        # fork-PR label opting a branch into rebase instead of the default merge
short_threshold_loc = 400      # a branch changing more lines than this is flagged not-"short" (advisory)
fork_remote = "origin"
upstream_remote = "cram2"
upstream_base = "main"
