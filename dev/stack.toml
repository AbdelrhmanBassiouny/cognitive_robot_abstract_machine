# Stacked-PR ledger — the single source of truth for the fork-staging / cram2-review workflow.
#
# Model: this fork ("origin") holds the FULL set of in-flight branches. cram2 is the slow REVIEW
# queue. You promote the *bottom* of each stack to cram2 one at a time, never exceeding `wip_cap`
# PRs in review at once. `stack.py` reads this file to answer: is a branch clean, and what's next.
#
# Edit this by hand as branches / PRs change. Nothing writes to it.
# NOTE: some parent links are logical (from the PR "depends on" notes) and differ from the current
# git ancestry — those are the branches that still need a restack. Tune parents to your intent.

wip_cap = 3            # max branches simultaneously in review on cram2
wip_exempt_labels = ["bug"]  # PRs carrying any of these labels do NOT count against wip_cap
fork_remote = "origin"
upstream_remote = "cram2"
upstream_base = "main"

# Fields:
#   parent   : bare name => a fork branch (origin/<name>); "<remote>/<x>" => that exact ref.
#   strategy : "merge" (DEFAULT — resolves conflicts once, no force-push, cheap; the merge commits
#              get flattened anyway if cram2 squash/rebase-merges) | "rebase" (linear history, but
#              re-resolves conflicts per commit and force-pushes — only worth it for a small,
#              not-yet-reviewed branch you want pristine).
#   pr       : the tracking PR number (on cram2 if in-review, else the fork PR).
#   status   : the lifecycle + YOUR approval gate:
#              "draft"     -> on the fork (or a cram2 draft PR); NOT yet approved for review.
#              "ready"     -> you reviewed its fork PR and approve it for cram2 (the gate; hand-set).
#              "in-review" -> open, non-draft PR on cram2, awaiting their review.
#              "merged"    -> landed in cram2/main.

# ── Stack 1: EQL core (bottom is ready — #377 it depends on is already merged) ───────────────
[[branch]]
name = "query-interface-refactor"
parent = "cram2/main"
strategy = "merge"
pr = 380
pr_repo = "upstream"
status = "in-review"

[[branch]]
name = "match-where-without-resolve"
parent = "query-interface-refactor"
strategy = "merge"
pr = 381
pr_repo = "upstream"
status = "in-review"

# ── Stack 1b: the broader query-class refactor (lands on top of Stack 1) ──────────────────────
# A separate, larger take on the EQL Query (spec/product lifecycle, subquery scoping). It goes in
# AFTER match-where-without-resolve, so its logical parent is that branch. Its current tip branched
# off cram2/main independently and does NOT yet contain #380/#381 — it needs restacking onto
# match-where-without-resolve before promotion. #9 (eql-subquery-scoping-spike) was the identical-SHA
# spike and is now closed as a duplicate of this.
[[branch]]
name = "query-class-refactor"
parent = "match-where-without-resolve"
strategy = "merge"
pr = 5
status = "draft"

