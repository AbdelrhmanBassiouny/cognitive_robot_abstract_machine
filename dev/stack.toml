# Stacked-PR ledger — the single source of truth for the fork-staging / cram2-review workflow.
#
# Model: this fork ("origin") holds the FULL stack of branches. cram2 is the slow REVIEW queue.
# You promote the *bottom* of the stack to cram2 one at a time, never exceeding `wip_cap` PRs
# in review at once. `stack.py` reads this file to answer: is the stack clean, and what's next.
#
# Edit this by hand as you add branches or as PRs change state. Nothing writes to it.

wip_cap = 3            # max branches simultaneously in review on cram2
fork_remote = "origin" # where the full stack lives
upstream_remote = "cram2"
upstream_base = "main"

# Each branch: name, its intended parent (the ref it rebases/merges onto), the integration
# strategy, the tracking PR number, and its lifecycle status.
#   parent    : a bare name => a fork branch (origin/<name>); "<remote>/<x>" => that exact ref.
#   strategy  : "rebase" (default, clean linear history) or "merge" (preserve, for far-diverged branches).
#   status    : the lifecycle state machine, and YOUR approval gate:
#               "draft"     -> on the fork, still WIP / not self-reviewed. NOT eligible for cram2.
#               "ready"     -> you reviewed its fork PR and approve it for cram2. THIS is your gate:
#                              flip a branch to "ready" by hand, and only then can `next` promote it.
#               "in-review" -> open PR on cram2, awaiting their review.
#               "merged"    -> landed in cram2/main.

[[branch]]
name = "eql_verbalization"
parent = "cram2/main"
strategy = "rebase"
pr = 346
status = "in-review"

[[branch]]
name = "eql-symbolic-arithmetic"
parent = "eql_verbalization"
strategy = "rebase"
pr = 11
status = "draft"

[[branch]]
name = "eql-verbalization-extensions"
parent = "eql_verbalization"
strategy = "rebase"
pr = 10
status = "draft"

[[branch]]
name = "claude/performatives-clean"
parent = "eql-symbolic-arithmetic"
strategy = "rebase"
pr = 14
status = "draft"

[[branch]]
name = "claude/eql-performatives-unify"
parent = "claude/performatives-clean"
