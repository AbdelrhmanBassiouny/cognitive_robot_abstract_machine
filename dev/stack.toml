# ── Stack 3: RDR refactor (cram2 PR #404 is a DRAFT, "depends on #346") ───────────────────────
# Its own fork sub-stack (branches built on rdr_refactor) is not yet pushed to origin — add the
# children here once you push them.
[[branch]]
name = "rdr_refactor"
