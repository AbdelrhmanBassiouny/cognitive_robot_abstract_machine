# Optional installation only. The package is designed to be imported straight from
# the repository root with no install (cloud sessions run on fresh clones with no pip
# step); this file exists for the workflows that run it outside such a checkout, e.g.
# the stack-board Pages Action. Built with an explicit package-dir mapping because the
# package *is* this directory rather than living under it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "development-tooling"
version = "0.1.0"
description = "Development-workflow tooling (stacked-PR helper data layer, plan-dashboard data layer) for cognitive_robot_abstract_machine. Not published; repository tooling only."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["development_tooling"]

[tool.setuptools.package-dir]
development_tooling = "."
