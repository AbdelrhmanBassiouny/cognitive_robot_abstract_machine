[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krrood_image"
authors = [
    { name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de" },
]
description = "Images and the positions, boxes and colours on them, free of any robot or world model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["robotics", "image"]
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "krrood>=26.10.0",
    "krrood_spatial_math>=26.10.0",
    "numpy",
    "opencv-python>=4.11.0.86",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
]

[project.urls]
"Source" = 'https://github.com/cram2/cognitive_robot_abstract_machine'
"Bug Tracker" = "https://github.com/cram2/cognitive_robot_abstract_machine/issues"
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["krrood_image*"]

[tool.setuptools.dynamic]
version = { attr = "krrood_image._version.__version__" }
