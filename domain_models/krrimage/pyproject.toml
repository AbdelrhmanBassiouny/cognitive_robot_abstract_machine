[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krrimage"
authors = [
    { name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de" },
]
description = "Images and the positions, boxes and colours on them, free of any robot or world model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["robotics", "image"]
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "krrood",
    "krrspatial",
    "numpy",
    "opencv-python>=4.11.0.86",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
]

[project.urls]
"Source" = 'https://github.com/cram2/cognitive_robot_abstract_machine'

[tool.setuptools.packages.find]
where = ["src"]
include = ["krrimage*"]

[tool.setuptools.dynamic]
version = { attr = "krrimage._version.__version__" }
