# The questions the perception showcase offers about what the camera saw.
#
# Every look at the Montessori scene is committed into a digital twin -- the table, the
# board's lid, each hole and each piece found -- and asked about with the twin's own
# predicates, through the same query language as everything the robot knows.
# The pieces are annotated with their kind (CubeShape, CylinderShape, ...), all of them a
# MontessoriShape.

- scope: current_state
  text: What does the camera see?
  code: |
    an(entity(variable(MontessoriShape, world.semantic_annotations).root))

- scope: current_state
  text: Which pieces did it find on the table?
  code: |
    an(
        entity((piece := variable(MontessoriShape, world.semantic_annotations)).root)
        .where(SupportedBy(piece.root, variable(Table, world.semantic_annotations).root))
    )

- scope: current_state
  text: Which pieces did it find on the board?
  code: |
    an(
        entity((piece := variable(MontessoriShape, world.semantic_annotations)).root)
        .where(
            (board := variable(Body, world.bodies)).name.name == 'board',
            SupportedBy(piece.root, board),
        )
    )

- scope: current_state
  text: Which holes did it find in the board?
  code: |
    an(entity(variable(Region, world.regions)))

- scope: current_state
  text: Is any piece standing in a hole?
  code: |
    an(
        entity((piece := variable(MontessoriShape, world.semantic_annotations)).root)
        .where(InsideRegion(piece.root, variable(Region, world.regions)))
    )

- scope: current_state
  text: Which cubes did it see?
  code: |
    an(entity(variable(CubeShape, world.semantic_annotations).root))
