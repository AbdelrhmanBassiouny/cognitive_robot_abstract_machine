[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
description = "Experiment scripts and actions for CRAM."
requires-python = ">=3.10"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "line_profiler",
    "coraplex",
    "giskardpy",
    "imageio-ffmpeg",  # experiments.video encodes with the ffmpeg binary it ships
    "krrood",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "probabilistic_model",
    "pymysql",
    "random_events",
    "semantic_digital_twin",
]

[project.optional-dependencies]
video = [
    "kokoro-onnx>=0.6",  # experiments.video's narrator, the Kokoro speech model run locally
]
animation = [
    "manim>=0.18",  # experiments.video's animated scenes; needs cairo and pango on the machine
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "experiments._version.__version__"}

[dependency-groups]
workspace = [
    "coraplex",
    "giskardpy",
    "krrood",
    "random_events",
    "semantic_digital_twin",
]
