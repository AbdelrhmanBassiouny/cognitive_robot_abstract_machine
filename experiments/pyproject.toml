[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
description = "Experiment scripts and actions for CRAM."
requires-python = ">=3.10"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "line_profiler",
    "opencv-python>=4.11.0.86",  # The Montessori perception package decodes and rectifies camera frames with it
    "flask",  # The Montessori event dashboard serves its live event page with it
    "coraplex",
    "giskardpy",
    "krrood",
    "physics_simulators",
    "probabilistic_model",
    "pymysql",
    "random_events",
    "segmind",
    "semantic_digital_twin",
    "typst>=0.13",
]

[project.optional-dependencies]
video = [
    "kokoro-onnx>=0.6",  # The supplementary video's narration is spoken by the Kokoro model
    "soundfile",  # and kept as wave files between renders
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "experiments._version.__version__"}

[dependency-groups]
workspace = [
    "coraplex",
    "giskardpy",
    "krrood",
    "physics_simulators",
    "random_events",
    "segmind",
    "semantic_digital_twin",
]
