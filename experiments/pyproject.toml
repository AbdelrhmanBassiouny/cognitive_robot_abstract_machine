[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
description = "Experiment scripts and actions for CRAM."
requires-python = ">=3.10"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "line_profiler",
    "opencv-python>=4.11.0.86",  # The Montessori perception package decodes and rectifies camera frames with it
    "flask",  # The Montessori event dashboard serves its live event page with it
    "coraplex",
    "giskardpy",
    "krrood",
    "random_events",
    "segmind",
    "semantic_digital_twin",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "experiments._version.__version__"}
